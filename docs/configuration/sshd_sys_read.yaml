apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "sys-read-sshd-stdin"
spec:
  kprobes:
  - call: "__x64_sys_read"
    syscall: true
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "char_buf"
      returnCopy: true
    - index: 2
      type: "size_t"
    selectors:
    # match to /sbin/sshd
    - matchBinaries:
      - operator: "In"
        values:
        - "/usr/sbin/sshd"
    # match to stdin/stdout/stderr
      matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "0"