name: tetragon
synopsis: |
    Tetragon Enterprise - eBPF-based Security Observability and Runtime Enforcement
usage: tetragon [flags]
options:
    - name: additional-node-label
      default_value: '[]'
      usage: |
        Additional node label to add to the local node metadata, specified as key=value. Can be specified multiple times
    - name: alerts-export-dir
      usage: |
        Directory for alert JSON export (filenames will be retrieved from alert rule names). Disabled by default.
    - name: alerts-export-filename
      usage: |
        Specify a global filename (unless overridden with alert specific export.filename), relative to alerts-export-dir, for alert JSON export. Disabled by default.
    - name: app-model-track-exec-ids
      default_value: "true"
      usage: Track execution IDs in the application model
    - name: application-model-cache-size
      default_value: "65536"
      usage: |
        Set the size of the BPF data structure to store application model and statistics. Higher values enable Tetragon to keep track of more processes before evicting old ones
    - name: application-model-export-file-compress
      default_value: "false"
      usage: Compress rotated flow JSON export files
    - name: application-model-export-file-max-backups
      default_value: "1"
      usage: Number of rotated flow JSON export files to retain
    - name: application-model-export-file-max-size-mb
      default_value: "25"
      usage: Size in MB for rotating flow JSON export files
    - name: application-model-export-filename
      usage: |
        Filename for application model JSON export. Set to "" to disable.
    - name: application-model-export-fragments
      default_value: "false"
      usage: |
        When exporting application model to JSON, export as fragments. This circumvents message ingest size limits when the application model is large.
    - name: application-model-export-interval
      default_value: 0s
      usage: Interval at which to export application model as JSON.
    - name: application-model-retention-duration
      default_value: 24h0m0s
      usage: |
        Retention period for exited processes in the application model.
    - name: application-model-split-max-host-processes
      default_value: "100"
      usage: |
        Maximum number of host processes per application model telemetry event
    - name: bpf-debug-area
      usage: |
        Enable BPF tracing messages for specified areas (all, dns, generic, http, process, tcp)
    - name: bpf-debug-log
      default_value: "false"
      usage: |
        Enable forwarding BPF trace messages to tetragon log as info messages
    - name: bpf-dir
      default_value: tetragon
      usage: Set tetragon bpf directory (default 'tetragon')
    - name: bpf-dns-parser-max-pending-requests
      default_value: "1024"
      usage: Size of the BPF DNS parser pending requests ID map.
    - name: bpf-dns-parser-per-pod-prealloc
      default_value: "15"
      usage: |
        Number of maps to preallocate at startup for BPF DNS parser maps per Pod partitioning.
    - name: bpf-dns-parser-per-pod-threshold
      default_value: "5"
      usage: |
        Threshold of free maps to keep at runtime for the BPF DNS parser maps per Pod partitioning.
    - name: bpf-endpoint-cache-size
      default_value: "65536"
      usage: |
        Set the size of the internal BPF endpoint cache. Higher values enable Tetragon to keep track of more network endpoints before evicting old ones
    - name: bpf-http-context-cache-size
      default_value: "1000"
      usage: |
        Set the number of HTTP requests to track in BPF. Higher values enable Tetragon to keep track of more HTTP requests before evicting old ones
    - name: bpf-icmp-socket-cache-size
      default_value: "32768"
      usage: |
        Set the number of ICMP sockets to track in BPF. Higher values enable Tetragon to keep track of more ICMP sockets before evicting old ones
    - name: bpf-layer3-socket-cache-size
      default_value: "32768"
      usage: |
        Set the number of network sockets to track in BPF. Higher values enable Tetragon to keep track of more sockets before evicting old ones
    - name: bpf-lib
      default_value: /var/lib/tetragon/
      usage: Location of Tetragon libs (btf and bpf files)
    - name: bpf-network-watermarks-cache-size
      default_value: "32768"
      usage: |
        Set the number of processes for which to track network watermarks in BPF. Higher values enable Tetragon to keep track of more processes before evicting old ones
    - name: bpf-tcp-socket-cache-size
      default_value: "32768"
      usage: |
        Set the number of TCP sockets to track in BPF. Higher values enable Tetragon to keep track of more TCP sockets before evicting old ones
    - name: bpf-tls-context-cache-size
      default_value: "32000"
      usage: |
        Set the number of TLS sessions to track in BPF. Higher values enable Tetragon to keep track of more TLS sessions before evicting old ones
    - name: bpf-udp-socket-cache-size
      default_value: "32768"
      usage: |
        Set the number of UDP sockets to track in BPF. Higher values enable Tetragon to keep track of more UDP sockets before evicting old ones
    - name: btf
      usage: Location of btf
    - name: cgroup-rate
      usage: |
        Base sensor events cgroup rate <events,interval> disabled by default ('1000,1s' means rate 1000 events per second)
    - name: cluster-name
      usage: Name of the cluster where Tetragon is installed
    - name: config-dir
      usage: Configuration directory that contains a file for each option
    - name: connection-log-filename
      usage: Filename for connection log. Set to "" to disable.
    - name: cpuprofile
      usage: Store CPU profile into provided file
    - name: cri-endpoint
      usage: CRI endpoint
    - name: data-cache-size
      default_value: "1024"
      usage: Size of the data events cache
    - name: debug
      shorthand: d
      default_value: "false"
      usage: Enable debug messages. Equivalent to '--log-level=debug'
    - name: debugx
      default_value: '[]'
      usage: |
        Extended debug to enable (e.g. "tcp,udp+"). Choose from: tcp, udp, icmp, rawsock. Tetragon defaults to maintaining metrics for program errors. Specifying the protocol/sub-system here causes events to be dispatched as well; adding a '+' will also get console messages
    - name: deleted-pod-cache-size
      default_value: "1024"
      usage: Size of the deleted pod cache
    - name: detach-old-bpf
      default_value: "false"
      usage: |
        Detach old cgroup programs from their interfaces when loading Tetragon. Disabled by default.
    - name: disable-kprobe-multi
      default_value: "false"
      usage: Allow to disable kprobe multi interface
    - name: disable-layer3
      default_value: "false"
      usage: |
        Disable layer3 entirely; equivalent to setting all the layer3 BPF caches to 1
    - name: disable-process-cache
      default_value: "false"
      usage: Disable process cache
    - name: dns-cache-size
      default_value: "1024"
      usage: |
        Set the size of the internal DNS cache. Higher values enable Tetragon to keep track of more destination names before evicting old ones
    - name: dns-metrics-label-filter
      default_value: '[]'
      usage: |
        DNS metrics label filter (requires --enable-dns and --enable-dns-metrics)
    - name: dns-ports
      default_value: '[53]'
      usage: Ports on which to parse DNS packets.
    - name: dns-report-questions
      default_value: "false"
      usage: |
        Report DNS questions as well as answers (requires --enable-dns)
    - name: dns-stats-per-socket
      default_value: "false"
      usage: |
        If UDP statistics are enabled, record DNS server statistics for each connection. Default is to group DNS server statistics per DNS server reducing the memory and CPU used and the stats reported
    - name: enable-alerts
      default_value: "true"
      usage: Enable alerts.
    - name: enable-alerts-profiling
      default_value: "false"
      usage: Enable profiling for alerts
    - name: enable-ancestors
      usage: |
        Comma-separated list of process event types to enable ancestors for (base, kprobe, tracepoint, loader, uprobe, lsm, usdt). Unknown event types will be ignored. Type 'base' enables ancestors for process_exec and process_exit events and is required by all other supported event types for correct reference counting.
    - name: enable-application-model
      default_value: "false"
      usage: Enable application model in memory
    - name: enable-bpf-dns-parser
      default_value: "false"
      usage: |
        Enable in-kernel BPF DNS parser. A 5.15.0+ kernel is required.
    - name: enable-bpf-dns-parser-per-pod
      default_value: "false"
      usage: Enable in-kernel BPF DNS parser maps per Pod partitioning.
    - name: enable-cgidmap
      default_value: "false"
      usage: enable pod resolution via cgroup ids
    - name: enable-cgidmap-debug
      default_value: "false"
      usage: enable cgidmap debugging info
    - name: enable-cgtrackerid
      default_value: "true"
      usage: |
        enable cgroup tracker id (only used if 'enable-cgidmap' is set)
    - name: enable-cilium-api
      default_value: "false"
      usage: |
        Associate IP addresses in Tetragon's networking events with Kubernetes pods using Cilium's IP cache
    - name: enable-cri
      default_value: "false"
      usage: enable CRI client for tetragon
    - name: enable-deprecated-tracingpolicy-grpc
      default_value: "false"
      usage: Enable deprecated gRPC TracingPolicy APIs
    - name: enable-dns
      default_value: "false"
      usage: |
        Enable DNS observability (deprecated flag, use --enable-user-dns instead)
    - name: enable-dns-debug
      default_value: "false"
      usage: |
        Enable DNS debug messages (deprecated flag, use --enable-user-dns-debug instead)
    - name: enable-dns-metrics
      default_value: "true"
      usage: Enable DNS metrics (requires --enable-dns)
    - name: enable-event-metrics
      default_value: "true"
      usage: |
        Enable per-event metrics. Enabled by default. Health and resource metrics are always available when --metrics-server is set.
    - name: enable-export-aggregation
      default_value: "false"
      usage: Enable JSON export aggregation
    - name: enable-http-sensor
      default_value: "false"
      usage: Enable HTTP observability (requires --enable-tcp)
    - name: enable-http-sensor-metrics
      default_value: "true"
      usage: Enable HTTP metrics (requires --enable-http-sensor)
    - name: enable-http2-handling
      default_value: "true"
      usage: Enable HTTP2 handling (requires --enable-http-sensor)
    - name: enable-icmp
      default_value: "false"
      usage: Enable ICMP observability
    - name: enable-icmp-tracking
      default_value: "false"
      usage: Enable additional socket tracking for ICMP
    - name: enable-igmp
      default_value: "false"
      usage: Enable IGMP observability
    - name: enable-k8s-api
      default_value: "false"
      usage: |
        Access Kubernetes API to associate Tetragon events with Kubernetes pods
    - name: enable-msg-handling-latency
      default_value: "false"
      usage: Enable metrics for message handling latency
    - name: enable-multicast-seq-check
      default_value: "false"
      usage: |
        Enable sequence checking for the multicast app specified with --multicast-app and --multicast-ports.
    - name: enable-network-events
      default_value: "true"
      usage: Enable Network Events from BPF to userspace
    - name: enable-network-interface-stats
      default_value: "false"
      usage: Enable network interface statistics
    - name: enable-network-watermarks-exit-gen
      default_value: "true"
      usage: |
        Enable generation of network watermarks exit events from user space when required (requires --network-watermarks-exit-gen-interval)
    - name: enable-nop-sensor
      default_value: "false"
      usage: Enable the NOP sensor
    - name: enable-pid-set-filter
      default_value: "false"
      usage: |
        Enable pidSet export filters. Not recommended for production use
    - name: enable-pod-annotations
      default_value: "false"
      usage: Add pod annotations field to events.
    - name: enable-pod-info
      default_value: "false"
      usage: Enable PodInfo custom resource
    - name: enable-policy-filter
      default_value: "false"
      usage: Enable policy filter code
    - name: enable-policy-filter-cgroup-map
      default_value: "false"
      usage: Enable cgroup mappings for policy filter maps
    - name: enable-policy-filter-debug
      default_value: "false"
      usage: Enable policy filter debug messages
    - name: enable-policy-k8swatcher
      default_value: "true"
      usage: |
        Enable watching Kubernetes API server for all supported policy resources, unless some of the features are disabled by other options, or Kubernetes API server is disabled entirely by `--enable-k8s-api=false`.
    - name: enable-process-cred
      default_value: "false"
      usage: Enable process_cred events
    - name: enable-process-environment-variables
      default_value: "false"
      usage: |
        Include environment variables in process_exec events. Disabled by default. Note that this option can significantly increase the size of the events and may impact performance, as well as capture sensitive information such as passwords in the events (you can use --redaction-filters to redact the data).
    - name: enable-process-ns
      default_value: "false"
      usage: |
        Enable namespace information in process_exec and process_kprobe events
    - name: enable-rawsock
      default_value: "false"
      usage: Enable raw socket observability
    - name: enable-rawsock-metrics
      default_value: "true"
      usage: Enable raw socket metrics (requires --enable-rawsock)
    - name: enable-sandboxpolicies
      default_value: "true"
      usage: Enable sandboxpolicies
    - name: enable-splunk-hec-debug
      default_value: "false"
      usage: |
        Enable verbose debug logging for Splunk HEC sends and batches.
    - name: enable-syscall-tracking
      default_value: "false"
      usage: |
        Track system calls in the application model. Application model must be enabled for this to work
    - name: enable-tcp
      default_value: "false"
      usage: Enable TCP observability
    - name: enable-tcp-metrics
      default_value: "true"
      usage: Enable TCP metrics (requires --enable-tcp)
    - name: enable-tcp-rtt
      default_value: "false"
      usage: Enable TCP RTT observability
    - name: enable-tcp-watermarks
      default_value: "false"
      usage: Enable TCP watermarks detection (requires --enable-tcp)
    - name: enable-tls-sensor
      default_value: "false"
      usage: Enable TLS observability (requires --enable-tcp)
    - name: enable-tls-sensor-metrics
      default_value: "true"
      usage: Enable TLS metrics (requires --enable-tls-sensor)
    - name: enable-tracing-policy-crd
      default_value: "true"
      usage: |
        Enable TracingPolicy and TracingPolicyNamespaced custom resources
    - name: enable-udp
      default_value: "false"
      usage: Enable UDP observability
    - name: enable-udp-cgroup
      default_value: "true"
      usage: Use Cgroups for UDP (requires --enable-udp)
    - name: enable-udp-metrics
      default_value: "true"
      usage: Enable UDP metrics (requires --enable-udp)
    - name: enable-udp-watermarks
      default_value: "false"
      usage: Enable UDP watermarks detection (requires --enable-udp)
    - name: enable-user-dns
      default_value: "false"
      usage: Enable DNS observability via the userspace DNS parser.
    - name: enable-user-dns-debug
      default_value: "false"
      usage: Enable userspace parser DNS debug messages.
    - name: endpoint-cache-size
      default_value: "65536"
      usage: |
        Set the size of the internal endpoint cache. Higher values enable Tetragon to keep track of more network endpoints before evicting old ones
    - name: environment
      usage: |
        Specify the environment in which Tetragon is running. Valid values are: [aws azure gcloud kubernetes]
    - name: event-cache-retries
      default_value: "15"
      usage: Number of retries for event cache
    - name: event-cache-retry-delay
      default_value: "2"
      usage: Delay in seconds between event cache retries
    - name: event-queue-size
      default_value: "10000"
      usage: Set the size of the internal event queue.
    - name: execve-map-entries
      default_value: "0"
      usage: Set entries for execve_map table (default 32768)
    - name: execve-map-size
      usage: Set size for execve_map table (allows K/M/G suffix)
    - name: export-aggregation-buffer-size
      default_value: "10000"
      usage: Aggregator channel buffer size
    - name: export-aggregation-window-size
      default_value: 15s
      usage: JSON export aggregation time window
    - name: export-allowlist
      usage: JSON export allowlist
    - name: export-denylist
      usage: JSON export denylist
    - name: export-file-compress
      default_value: "false"
      usage: Compress rotated JSON export files
    - name: export-file-max-backups
      default_value: "5"
      usage: Number of rotated JSON export files to retain
    - name: export-file-max-size-mb
      default_value: "10"
      usage: Size in MB for rotating JSON export files
    - name: export-file-perm
      default_value: "600"
      usage: Access permissions on JSON export files
    - name: export-file-rotation-interval
      default_value: 0s
      usage: |
        Interval at which to rotate JSON export files in addition to rotating them by size
    - name: export-filename
      usage: Filename for JSON export. Disabled by default
    - name: export-rate-limit
      default_value: "-1"
      usage: |
        Rate limit (per minute) for event export. Set to -1 to disable rate limiting, 0 to disable JSON export, or a positive integer to rate limit event export
    - name: expose-stack-addresses
      default_value: "false"
      usage: Expose real linear addresses in events stack traces
    - name: field-filters
      usage: Field filters for event exports
    - name: filter-environment-variables
      default_value: '[]'
      usage: Filter for specific environment variables
    - name: fim-enable-dispatcher
      default_value: "false"
      usage: Enable FIM dispatcher when supported
    - name: fim-fifo-local-path
      default_value: /var/run
      usage: |
        Path for the FIFO used for fs-scanner and tetragon communication (for standalone deployments)
    - name: fim-fifo-path
      default_value: /var/run/tetragon/
      usage: |
        Path for the FIFO used for fs-scanner and tetragon communication (for k8s deployments)
    - name: fim-max-file-size-digest
      default_value: "1073741824"
      usage: |
        Set the maximum file size in FIM that we will compute a digest (in bytes)
    - name: fim-runtime-endpoint
      usage: |
        Custom container runtime endpoint for FIM (can be used only for containerd or cri-o)
    - name: fim-timeout-digest
      default_value: "30"
      usage: |
        Set the timeout when computing a file digest in FIM (in seconds)
    - name: flow-export-file-compress
      default_value: "false"
      usage: Compress rotated flow JSON export files
    - name: flow-export-file-max-backups
      default_value: "5"
      usage: Number of rotated flow JSON export files to retain
    - name: flow-export-file-max-size-mb
      default_value: "10"
      usage: Size in MB for rotating flow JSON export files
    - name: flow-export-filename
      usage: Filename for flow JSON export. Disabled by default
    - name: force-large-progs
      default_value: "false"
      usage: |
        Force loading large programs, even in kernels with < 5.3 versions
    - name: force-small-progs
      default_value: "false"
      usage: |
        Force loading small programs, even in kernels with >= 5.3 versions
    - name: generate-docs
      default_value: "false"
      usage: Generate documentation in YAML format to stdout
    - name: gops-address
      usage: |
        gops server address (e.g. 'localhost:8118'). Disabled by default
    - name: health-server-address
      default_value: :6789
      usage: Health server address (e.g. ':6789')(use '' to disabled it)
    - name: health-server-interval
      default_value: "10"
      usage: Health server interval in seconds
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for tetragon
    - name: http-sensor-metrics-label-filter
      default_value: '[]'
      usage: |
        HTTP metrics label filter (requires --enable-http-sensor and --enable-http-sensor-metrics)
    - name: http-sensor-ports
      default_value: '[]'
      usage: |
        Specify the ports to observe HTTP over (requires --enable-http-sensor)
    - name: icmpv6-info
      default_value: "false"
      usage: Enable ICMPV6 information (requires --enable-icmp)
    - name: k8s-controlplane-retry
      default_value: "1"
      usage: |
        Number of attempts for Kubernetes control plane connection (negative for infinite, zero is invalid, positive for max attempts)
    - name: k8s-kubeconfig-path
      usage: Absolute path of the kubernetes kubeconfig file
    - name: k8s-service-account-auth
      usage: |
        Base64 encoded of <API_SERVER>|<TOKEN>|<CA_CERT> to access the k8s API server
    - name: keep-sensors-on-exit
      default_value: "false"
      usage: Do not unload sensors on exit
    - name: kernel
      usage: Kernel version
    - name: log-file
      usage: |
        Set log file where tetragon agent logs will be written (in addition to stdout or stderr)
    - name: log-format
      default_value: text
      usage: Set log format
    - name: log-level
      default_value: info
      usage: Set log level
    - name: mandate-refresh-period
      default_value: 1m0s
      usage: Refresh period for the Mandate file
    - name: mandate-url
      usage: Set a URL for a Tetragon Mandate file
    - name: memprofile
      usage: Store MEM profile into provided file
    - name: metrics-label-filter
      default_value: namespace,workload,pod,binary
      usage: |
        Comma-separated list of enabled metrics labels. Unknown labels will be ignored.
    - name: metrics-server
      usage: Metrics server address (e.g. ':2112'). Disabled by default
    - name: multicast-app
      usage: |
        Specify the multicast app to observe on the ports specified with --multicast-ports.
    - name: multicast-ports
      default_value: '[]'
      usage: |
        UDP ports on which to observe the multicast app specified with --multicast-app.
    - name: multicast-sample-percent
      default_value: "0"
      usage: |
        Specify percentage of multicast app packets to report timestamps for the multicast app specified with --multicast-app and --multicast-ports.
    - name: net-ns-cache-size
      default_value: "256"
      usage: |
        Set the size of the internal network namespace cache. This should be aligned with the maximum number of network namespaces (approximately, the maxumum number of pods) we expect to see in the system
    - name: netns-dir
      default_value: /var/run/docker/netns/
      usage: Network namespace dir
    - name: network-interface-stats-interval
      default_value: 10s
      usage: |
        Network interface statistics interval (requires --enable-network-interface-stats)
    - name: network-policy
      default_value: '[]'
      usage: Network policy file to load at startup
    - name: network-policy-dir
      usage: Directory for network policies to load at startup
    - name: network-watermarks-exit-gen-interval
      default_value: 1s
      usage: |
        Specify the network watermarks exit event generation interval (requires --enable-network-watermarks-exit-gen)
    - name: node-namespace
      usage: The namespace to register tetragon node if required
    - name: nop-sensor-ports
      default_value: '[]'
      usage: Ports to configure Nop sensor (requires --enable-nop-sensor)
    - name: ocsf-export-file-compress
      default_value: "false"
      usage: Compress rotated OCSF JSON export files
    - name: ocsf-export-file-max-backups
      default_value: "5"
      usage: Number of rotated OCSF JSON export files to retain
    - name: ocsf-export-file-max-size-mb
      default_value: "10"
      usage: Size in MB for rotating OCSF JSON export files
    - name: ocsf-export-filename
      usage: Filename for OCSF JSON export. Disabled by default
    - name: ocsf-export-server
      usage: Server for OCSF JSON export. Disabled by default
    - name: parents-map-enabled
      default_value: "false"
      usage: Enable parents_map for matchParentBinaries selector
    - name: parents-map-entries
      default_value: "0"
      usage: Set entries for parents_map table (default 32768)
    - name: parents-map-size
      usage: Set size for parents_map table (allows K/M/G suffix)
    - name: persist-grpc-policies
      default_value: "false"
      usage: |
        Persist tracing policies installed over gRPC across agent restarts
    - name: persist-grpc-policies-dir
      default_value: /var/run/tetragon/grpc-policies
      usage: |
        Directory in which to persist tracing policies installed over gRPC
    - name: policy-dir
      default_value: /etc/tetragon/tetragon.policies.d
      usage: |
        Directory for all kind of policies to load at startup. Only single depth level files are supported
    - name: pprof-address
      usage: |
        Serves runtime profile data via HTTP (e.g. 'localhost:6060'). Disabled by default
    - name: process-cache-gc-interval
      default_value: 30s
      usage: Time between checking the process cache for old entries
    - name: process-cache-size
      default_value: "65536"
      usage: Size of the process cache
    - name: process-cache-stale-interval
      default_value: 1h0m0s
      usage: Interval between stale process cache checks
    - name: procfs
      default_value: /proc/
      usage: Location of procfs to consume existing PIDs
    - name: rawsock-metrics-label-filter
      default_value: '[]'
      usage: |
        Raw socket metrics label filter (requires --enable-rawsock and --enable-rawsock-metrics)
    - name: rawsock-report-close
      default_value: "false"
      usage: Report raw sockets closing (requires --enable-rawsock)
    - name: rb-queue-size
      default_value: "65535"
      usage: |
        Set size of channel between ring buffer and sensor go routines (default 65k, allows K/M/G suffix)
    - name: rb-size
      default_value: "0"
      usage: |
        Set ring buffer size for single cpu (default 65k, allows K/M/G suffix)
    - name: rb-size-total
      default_value: "0"
      usage: |
        Set ring buffer size in total for all cpus (default 65k per cpu, allows K/M/G suffix)
    - name: redaction-filters
      usage: Redaction filters for events
    - name: release-pinned-bpf
      default_value: "true"
      usage: |
        Release all pinned BPF programs and maps in Tetragon BPF directory. Enabled by default. Set to false to disable
    - name: retprobes-cache-size
      default_value: "4096"
      usage: Set {k,u}retprobes events cache maximum size
    - name: sandbox-policy
      default_value: '[]'
      usage: Sandbox policy file to load at startup
    - name: server-address
      default_value: localhost:54321
      usage: |
        gRPC server address (e.g. 'localhost:54321' or 'unix:///var/run/tetragon/tetragon.sock'). An empty address disables the gRPC server. WARNING: Exposing gRPC on a TCP socket without TLS client verification exposes Tetragon to unprivileged users on the host or with network access.
    - name: server-tls-cert-file
      usage: |
        Path to a PEM-encoded server certificate. When set, TLS is enabled on the TCP gRPC listener.
    - name: server-tls-client-ca-files
      default_value: '[]'
      usage: |
        Paths to PEM-encoded CA bundles used to verify client certificates. Required when --server-tls-require-client-cert is true.
    - name: server-tls-key-file
      usage: |
        Path to the PEM-encoded private key matching --server-tls-cert-file. Required when --server-tls-cert-file is set.
    - name: server-tls-require-client-cert
      default_value: "false"
      usage: |
        Require and verify client certificates (mTLS). Requires --server-tls-client-ca-files.
    - name: sleepable-offload-size
      default_value: "32768"
      usage: |
        Set the maximum number of entries in the sleepable offload map
    - name: sleepable-preload-size
      default_value: "32768"
      usage: |
        Set the maximum number of entries in the sleepable preload map
    - name: splunk-hec-endpoint
      usage: |
        URL of the Splunk HTTP Event Collector endpoint to send telemetry to. Set to "" to disable.
    - name: splunk-hec-flush-interval
      default_value: 3s
      usage: |
        Maximum time a record waits to be batched before it is sent to the Splunk HTTP Event Collector. Must be at least 1s.
    - name: splunk-hec-max-content-length
      default_value: "1048576"
      usage: |
        Maximum size in bytes of a single request body sent to the Splunk HTTP Event Collector. Must not exceed the max_content_length configured on the Splunk server.
    - name: splunk-hec-sourcetypes
      default_value: |
        [tetragon:application_model,tetragon:telemetry,tetragon:events,tetragon:alerts]
      usage: |
        Comma-separated list of JSON export sourcetypes to send to the Splunk HTTP Event Collector.
    - name: splunk-hec-timeout
      default_value: 30s
      usage: |
        Timeout for a single request to the Splunk HTTP Event Collector. Must be at least 10s.
    - name: splunk-hec-token
      usage: |
        Authentication token for the Splunk HTTP Event Collector endpoint specified by --splunk-hec-endpoint flag.
    - name: tcp-cache-size
      default_value: "32768"
      usage: |
        Set the size of the internal TCP cache. Higher values enable Tetragon to keep track of more concurrent TCP sessions before evicting old ones
    - name: tcp-disable-events
      default_value: '[]'
      usage: |
        specify TCP events to disable, from listen, connect, stats, and close (requires --enable-tcp)
    - name: tcp-metrics-label-filter
      default_value: '[]'
      usage: |
        TCP metrics label filter (requires --enable-tcp and --enable-tcp-metrics)
    - name: tcp-rtt-max
      default_value: "0"
      usage: |
        Set the maximum value for the RTT histograms (requires --enable-tcp and --enable-tcp-rtt)
    - name: tcp-rtt-min
      default_value: "0"
      usage: |
        Set the minimum value for the RTT histograms (requires --enable-tcp and --enable-tcp-rtt)
    - name: tcp-stats-interval
      default_value: 0s
      usage: |
        Enable and specify interval for TCP statistics (requires --enable-tcp)
    - name: tcp-watermarks-burst-trigger-percent
      default_value: "0"
      usage: |
        TCP watermarks burst trigger percent (requires --enable-tcp and --enable-tcp-watermarks)
    - name: tcp-watermarks-dip-trigger-percent
      default_value: "0"
      usage: |
        TCP watermarks dip trigger percent (requires --enable-tcp and --enable-tcp-watermarks)
    - name: tcp-watermarks-window-size-ms
      default_value: "0"
      usage: |
        TCP watermarks window size in milliseconds (requires --enable-tcp and --enable-tcp-watermarks)
    - name: telemetry-export-filename
      usage: |
        Filename for telemetry JSON export. Set to "" to disable. To enable telemetry export, --enable-application-model flag must be set to true. Telemetry export uses the export interval specified by --application-model-export-interval flag.
    - name: tls-cache-size
      default_value: "1024"
      usage: |
        Set the size of the internal TLS cache. Higher values enable Tetragon to keep track of more in progress handshakes before evicting old ones
    - name: tls-sensor-metrics-label-filter
      default_value: '[]'
      usage: |
        TLS metrics label filter (requires --enable-tls-sensor and --enable-tls-sensor-metrics)
    - name: tls-sensor-mode
      default_value: cgroup
      usage: |
        Specify the TLS sensor mode (cgroup or socket, requires --enable-tls-sensor)
    - name: tls-sensor-ports
      default_value: '[]'
      usage: |
        Specify the ports to observe TLS over (requires --enable-tls-sensor)
    - name: tracing-policy
      usage: Tracing policy file to load at startup
    - name: tracing-policy-dir
      default_value: /etc/tetragon/tetragon.tp.d
      usage: Directory from where to load Tracing Policies
    - name: udp-disable-events
      default_value: '[]'
      usage: |
        specify UDP events to disable, from listen, connect, stats, and close (requires --enable-udp)
    - name: udp-idle-socket-timeout
      default_value: 2m0s
      usage: How long a UDP socket should be idle to be considered closed
    - name: udp-in-kernel-managed
      default_value: "false"
      usage: |
        Enable in-kernel management for UDP maps. A 5.8.0+ kernel is required.
    - name: udp-metrics-label-filter
      default_value: '[]'
      usage: |
        UDP metrics label filter (requires --enable-udp and --enable-udp-metrics)
    - name: udp-stats-interval
      default_value: 0s
      usage: |
        Enable and specify interval for UDP statistics (requires --enable-udp)
    - name: udp-watermarks-burst-trigger-percent
      default_value: "0"
      usage: |
        UDP watermarks burst trigger percent (requires --enable-udp and --enable-udp-watermarks)
    - name: udp-watermarks-dip-trigger-percent
      default_value: "0"
      usage: |
        UDP watermarks dip trigger percent (requires --enable-udp and --enable-udp-watermarks)
    - name: udp-watermarks-window-size-ms
      default_value: "0"
      usage: |
        UDP watermarks window size in milliseconds (requires --enable-udp and --enable-udp-watermarks)
    - name: uprobe-heap-size
      default_value: "32768"
      usage: |
        Set the maximum number of entries in the process call heap map used by uprobe/usdt sensors
    - name: use-perf-ring-buffer
      default_value: "false"
      usage: Use the perf ring buffer instead of the bpf ring buffer
    - name: username-metadata
      default_value: disabled
      usage: |
        Resolve UIDs to user names for processes running in host namespace
    - name: verbose
      default_value: "0"
      usage: deprecated alias for --verifier-log-level
    - name: verifier-log-level
      default_value: "0"
      usage: |
        set eBPF verifier log level. Pass 0 for silent, 1 for truncated logs, 2 for a full dump
