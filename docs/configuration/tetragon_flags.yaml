name: tetragon
synopsis: |
    Tetragon Enterprise - eBPF-based Security Observability and Runtime Enforcement
usage: tetragon [flags]
options:
    - name: alerts-export-dir
      usage: |
        Directory for alert JSON export (filenames will be retrieved from alert rule names). Disabled by default.
    - name: application-model-cache-size
      default_value: "65536"
      usage: |
        Set the size of the BPF data structure to store application model and statistics. Higher values enable Tetragon to keep track of more processes before evicting old ones
    - name: application-model-export-filename
      usage: |
        Filename for application model JSON export. Set to "" to disable.
    - name: application-model-export-interval
      default_value: 0s
      usage: Interval at which to export application model as JSON.
    - name: bpf-dir
      default_value: tetragon
      usage: Set tetragon bpf directory (default 'tetragon')
    - name: bpf-endpoint-cache-size
      default_value: "65536"
      usage: |
        Set the size of the internal BPF endpoint cache. Higher values enable Tetragon to keep track of more network endpoints before evicting old ones
    - name: bpf-lib
      default_value: /var/lib/tetragon/
      usage: Location of Tetragon libs (btf and bpf files)
    - name: btf
      usage: Location of btf
    - name: cgroup-rate
      usage: |
        Base sensor events cgroup rate <events,interval> disabled by default ('1000,1s' means rate 1000 events per second)
    - name: cluster-name
      usage: Name of the cluster where Tetragon is installed
    - name: config-dir
      usage: Configuration directory that contains a file for each option
    - name: cpuprofile
      usage: Store CPU profile into provided file
    - name: cri-endpoint
      usage: CRI endpoint
    - name: data-cache-size
      default_value: "1024"
      usage: Size of the data events cache
    - name: debug
      shorthand: d
      default_value: "false"
      usage: Enable debug messages. Equivalent to '--log-level=debug'
    - name: debugx
      default_value: '[]'
      usage: |
        Extended debug to enable (e.g. "tcp,udp+"). Choose from: tcp, udp, icmp, rawsock. Tetragon defaults to maintaining metrics for program errors. Specifying the protocol/sub-system here causes events to be dispatched as well; adding a '+' will also get console messages
    - name: detach-old-bpf
      default_value: "false"
      usage: |
        Detach old cgroup programs from their interfaces when loading Tetragon. Disabled by default.
    - name: disable-kprobe-multi
      default_value: "false"
      usage: Allow to disable kprobe multi interface
    - name: dns-cache-size
      default_value: "1024"
      usage: |
        Set the size of the internal DNS cache. Higher values enable Tetragon to keep track of more destination names before evicting old ones
    - name: dns-stats-per-socket
      default_value: "false"
      usage: |
        If UDP statistics are enabled, record DNS server statistics for each connection. Default is to group DNS server statistics per DNS server reducing the memory and CPU used and the stats reported
    - name: enable-alerts
      default_value: "false"
      usage: Enable alerts.
    - name: enable-application-model
      default_value: "false"
      usage: Enable application model in memory
    - name: enable-bpf-dns-parser
      default_value: "false"
      usage: |
        Enable in-kernel BPF DNS parser. A 5.15.0+ kernel is required.
    - name: enable-cgidmap
      default_value: "false"
      usage: enable pod resolution via cgroup ids
    - name: enable-cgidmap-debug
      default_value: "false"
      usage: enable cgidmap debugging info
    - name: enable-cgtrackerid
      default_value: "true"
      usage: |
        enable cgroup tracker id (only used if 'enable-cgidmap' is set)
    - name: enable-cilium-api
      default_value: "false"
      usage: |
        Associate IP addresses in Tetragon's networking events with Kubernetes pods using Cilium's IP cache
    - name: enable-compatibility-syscall64-size-type
      default_value: "false"
      usage: |
        syscall64 type will produce output of type size (compatibility flag, will be removed in v1.16)
    - name: enable-cri
      default_value: "false"
      usage: enable CRI client for tetragon
    - name: enable-dns
      default_value: "false"
      usage: Enable DNS observability
    - name: enable-dns-debug
      default_value: "false"
      usage: Enable DNS debug messages
    - name: enable-export-aggregation
      default_value: "false"
      usage: Enable JSON export aggregation
    - name: enable-icmp
      default_value: "false"
      usage: Enable ICMP observability
    - name: enable-icmp-tracking
      default_value: "true"
      usage: Enable additional socket tracking for ICMP
    - name: enable-k8s-api
      default_value: "false"
      usage: |
        Access Kubernetes API to associate Tetragon events with Kubernetes pods
    - name: enable-latency
      default_value: "false"
      usage: |
        Enable TCP and/or UDP latency observability (requires enable-tcp and/or enable-udp)
    - name: enable-msg-handling-latency
      default_value: "false"
      usage: Enable metrics for message handling latency
    - name: enable-pid-set-filter
      default_value: "false"
      usage: |
        Enable pidSet export filters. Not recommended for production use
    - name: enable-pod-annotations
      default_value: "false"
      usage: Add pod annotations field to events.
    - name: enable-pod-info
      default_value: "false"
      usage: Enable PodInfo custom resource
    - name: enable-policy-filter
      default_value: "false"
      usage: Enable policy filter code
    - name: enable-policy-filter-cgroup-map
      default_value: "false"
      usage: Enable cgroup mappings for policy filter maps
    - name: enable-policy-filter-debug
      default_value: "false"
      usage: Enable policy filter debug messages
    - name: enable-policy-k8swatcher
      default_value: "true"
      usage: |
        Enable watching Kubernetes API server for all supported policy resources, unless some of the features are disabled by other options, or Kubernetes API server is disabled entirely by `--enable-k8s-api=false`.
    - name: enable-process-ancestors
      default_value: "true"
      usage: Include ancestors in process exec events
    - name: enable-process-cred
      default_value: "false"
      usage: Enable process_cred events
    - name: enable-process-kprobe-ancestors
      default_value: "false"
      usage: |
        Include ancestors in process_kprobe events. Only used if 'enable-process-ancestors' is set to 'true'
    - name: enable-process-lsm-ancestors
      default_value: "false"
      usage: |
        Include ancestors in process_lsm events. Only used if 'enable-process-ancestors' is set to 'true'
    - name: enable-process-ns
      default_value: "false"
      usage: |
        Enable namespace information in process_exec and process_kprobe events
    - name: enable-process-tracepoint-ancestors
      default_value: "false"
      usage: |
        Include ancestors in process_tracepoint events. Only used if 'enable-process-ancestors' is set to 'true'
    - name: enable-process-uprobe-ancestors
      default_value: "false"
      usage: |
        Include ancestors in process_uprobe events. Only used if 'enable-process-ancestors' is set to 'true'
    - name: enable-rawsock
      default_value: "false"
      usage: Enable raw socket observability
    - name: enable-sandboxpolicies
      default_value: "true"
      usage: Enable sandboxpolicies
    - name: enable-syscall-tracking
      default_value: "false"
      usage: |
        Track system calls in the application model. Application model must be enabled for this to work
    - name: enable-tcp
      default_value: "false"
      usage: Enable TCP observability
    - name: enable-tcp-rtt
      default_value: "false"
      usage: Enable TCP RTT observability
    - name: enable-tracing-policy-crd
      default_value: "true"
      usage: |
        Enable TracingPolicy and TracingPolicyNamespaced custom resources
    - name: enable-udp
      default_value: "false"
      usage: Enable UDP observability
    - name: endpoint-cache-size
      default_value: "65536"
      usage: |
        Set the size of the internal endpoint cache. Higher values enable Tetragon to keep track of more network endpoints before evicting old ones
    - name: event-cache-retries
      default_value: "15"
      usage: Number of retries for event cache
    - name: event-cache-retry-delay
      default_value: "2"
      usage: Delay in seconds between event cache retries
    - name: event-queue-size
      default_value: "10000"
      usage: Set the size of the internal event queue.
    - name: execve-map-entries
      default_value: "0"
      usage: Set entries for execve_map table (default 32768)
    - name: execve-map-size
      usage: Set size for execve_map table (allows K/M/G suffix)
    - name: export-aggregation-buffer-size
      default_value: "10000"
      usage: Aggregator channel buffer size
    - name: export-aggregation-window-size
      default_value: 15s
      usage: JSON export aggregation time window
    - name: export-allowlist
      usage: JSON export allowlist
    - name: export-denylist
      usage: JSON export denylist
    - name: export-file-compress
      default_value: "false"
      usage: Compress rotated JSON export files
    - name: export-file-max-backups
      default_value: "5"
      usage: Number of rotated JSON export files to retain
    - name: export-file-max-size-mb
      default_value: "10"
      usage: Size in MB for rotating JSON export files
    - name: export-file-perm
      default_value: "600"
      usage: Access permissions on JSON export files
    - name: export-file-rotation-interval
      default_value: 0s
      usage: |
        Interval at which to rotate JSON export files in addition to rotating them by size
    - name: export-filename
      usage: Filename for JSON export. Disabled by default
    - name: export-rate-limit
      default_value: "-1"
      usage: |
        Rate limit (per minute) for event export. Set to -1 to disable
    - name: expose-stack-addresses
      default_value: "false"
      usage: Expose real linear addresses in events stack traces
    - name: field-filters
      usage: Field filters for event exports
    - name: fim-enable-dispatcher
      default_value: "false"
      usage: Enable FIM dispatcher when supported
    - name: fim-fifo-path
      default_value: /var/run/tetragon/
      usage: |
        Path for the FIFO used for fs-scanner and tetragon communication
    - name: fim-max-file-size-digest
      default_value: "1073741824"
      usage: |
        Set the maximum file size in FIM that we will compute a digest (in bytes)
    - name: fim-runtime-endpoint
      usage: |
        Custom container runtime endpoint for FIM (can be used only for containerd or cri-o)
    - name: fim-timeout-digest
      default_value: "30"
      usage: |
        Set the timeout when computing a file digest in FIM (in seconds)
    - name: flow-export-file-compress
      default_value: "false"
      usage: Compress rotated flow JSON export files
    - name: flow-export-file-max-backups
      default_value: "5"
      usage: Number of rotated flow JSON export files to retain
    - name: flow-export-file-max-size-mb
      default_value: "10"
      usage: Size in MB for rotating flow JSON export files
    - name: flow-export-filename
      usage: Filename for flow JSON export. Disabled by default
    - name: force-large-progs
      default_value: "false"
      usage: |
        Force loading large programs, even in kernels with < 5.3 versions
    - name: force-small-progs
      default_value: "false"
      usage: |
        Force loading small programs, even in kernels with >= 5.3 versions
    - name: generate-docs
      default_value: "false"
      usage: Generate documentation in YAML format to stdout
    - name: gops-address
      usage: |
        gops server address (e.g. 'localhost:8118'). Disabled by default
    - name: health-server-address
      default_value: :6789
      usage: Health server address (e.g. ':6789')(use '' to disabled it)
    - name: health-server-interval
      default_value: "10"
      usage: Health server interval in seconds
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for tetragon
    - name: hubble-lib
      default_value: /var/lib/tetragon/
      usage: Location of hubble libs (btf and bpf files)
    - name: k8s-kubeconfig-path
      usage: Absolute path of the kubernetes kubeconfig file
    - name: keep-sensors-on-exit
      default_value: "false"
      usage: Do not unload sensors on exit
    - name: kernel
      usage: Kernel version
    - name: log-format
      default_value: text
      usage: Set log format
    - name: log-level
      default_value: info
      usage: Set log level
    - name: mandate-refresh-period
      default_value: 1m0s
      usage: Refresh period for the Mandate file
    - name: mandate-url
      usage: Set a URL for a Tetragon Mandate file
    - name: memprofile
      usage: Store MEM profile into provided file
    - name: metrics-label-filter
      default_value: namespace,workload,pod,binary
      usage: |
        Comma-separated list of enabled metrics labels. Unknown labels will be ignored.
    - name: metrics-server
      usage: Metrics server address (e.g. ':2112'). Disabled by default
    - name: net-ns-cache-size
      default_value: "256"
      usage: |
        Set the size of the internal network namespace cache. This should be aligned with the maximum number of network namespaces (approximately, the maxumum number of pods) we expect to see in the system
    - name: netns-dir
      default_value: /var/run/docker/netns/
      usage: Network namespace dir
    - name: network-policy
      default_value: '[]'
      usage: Network policy file to load at startup
    - name: network-policy-dir
      usage: Directory for network policies to load at startup
    - name: pprof-address
      usage: |
        Serves runtime profile data via HTTP (e.g. 'localhost:6060'). Disabled by default
    - name: process-cache-gc-interval
      default_value: 30s
      usage: Time between checking the process cache for old entries
    - name: process-cache-size
      default_value: "65536"
      usage: Size of the process cache
    - name: process-cache-stale-interval
      default_value: 1h0m0s
      usage: Interval between stale process cache checks
    - name: procfs
      default_value: /proc/
      usage: Location of procfs to consume existing PIDs
    - name: rb-queue-size
      default_value: "65535"
      usage: |
        Set size of channel between ring buffer and sensor go routines (default 65k, allows K/M/G suffix)
    - name: rb-size
      default_value: "0"
      usage: |
        Set perf ring buffer size for single cpu (default 65k, allows K/M/G suffix)
    - name: rb-size-total
      default_value: "0"
      usage: |
        Set perf ring buffer size in total for all cpus (default 65k per cpu, allows K/M/G suffix)
    - name: redaction-filters
      usage: Redaction filters for events
    - name: release-pinned-bpf
      default_value: "true"
      usage: |
        Release all pinned BPF programs and maps in Tetragon BPF directory. Enabled by default. Set to false to disable
    - name: sandbox-policy
      default_value: '[]'
      usage: Sandbox policy file to load at startup
    - name: server-address
      default_value: localhost:54321
      usage: |
        gRPC server address (e.g. 'localhost:54321' or 'unix:///var/run/tetragon/tetragon.sock'). An empty address disables the gRPC server
    - name: tcp-cache-size
      default_value: "32768"
      usage: |
        Set the size of the internal TCP cache. Higher values enable Tetragon to keep track of more concurrent TCP sessions before evicting old ones
    - name: tls-cache-size
      default_value: "1024"
      usage: |
        Set the size of the internal TLS cache. Higher values enable Tetragon to keep track of more in progress handshakes before evicting old ones
    - name: tracing-policy
      usage: Tracing policy file to load at startup
    - name: tracing-policy-dir
      default_value: /etc/tetragon/tetragon.tp.d
      usage: Directory from where to load Tracing Policies
    - name: username-metadata
      default_value: disabled
      usage: |
        Resolve UIDs to user names for processes running in host namespace
    - name: verbose
      default_value: "0"
      usage: |
        set verbosity level for eBPF verifier dumps. Pass 0 for silent, 1 for truncated logs, 2 for a full dump
