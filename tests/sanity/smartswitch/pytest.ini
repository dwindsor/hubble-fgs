[pytest]
minversion = 8.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = dsc venv .git __pycache__ .pytest_cache allure-results
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    agw: tests for AGW functionality
    sim: tests for SIM dataplane functionality
    integration: integration tests between AGW and SIM (FWA + DPU)
    policy: policy management tests
    packet_flow: packet flow tests with policy enforcement verification
    metrics: AGW metrics command tests
    nxos: NX-OS mock mode tests (AGW_ENABLE_NXOS=false with pre-configured mock)
    ha: HA (High Availability) dual-AGW tests
    timeout: per-test timeout in seconds (enforced by conftest hook)
filterwarnings =
    ignore::urllib3.exceptions.NotOpenSSLWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
