# SmartSwitch Timescape Client ConfigMap
# This is the client-side configuration that AGW watches via its ConfigMap watcher.
# HOST and PORT placeholders are patched by the deploy-timescape Makefile target.
#
# The Timescape server itself is deployed via the real hubble-timescape Helm chart
# (see: make deploy-timescape and k8s/hubble-timescape-values.yaml).
---
apiVersion: v1
kind: Namespace
metadata:
  name: hypershield
  labels:
    app: agw-test-infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartswitch-timescape-config
  namespace: hypershield
  labels:
    component: timescape-client
data:
  timescape_config: |
    {
        "id": "timescape-config",
        "name": "SmartSwitch Timescape Client",
        "description": "Timescape client configuration for local test environment",
        "host": "PLACEHOLDER_HOST",
        "port": "PLACEHOLDER_PORT",
        "protocol": "tcp",
        "tls_enabled": true,
        "endpoint_api": "/push",
        "basic_auth": {
            "username": "timescape_push_api",
            "password": "PLACEHOLDER_PASSWORD"
        },
        "max_retries": 3,
        "connection_timeout_sec": 30,
        "request_timeout_sec": 60,
        "max_batch_size": 2,
        "batch_timeout_ms": 30000
    }
