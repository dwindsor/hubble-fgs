# Hubble Timescape Helm values for kind cluster (sanity tests)
# Based on isovalent-operator/hypershield/helm/hubble-timescape-values.yaml
# with reduced resource requests suitable for local kind clusters.

tls:
  enabled: true
  auto:
    enabled: true
    method: "cronJob"

lite:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  clickhouse:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

ingester:
  service:
    type: NodePort
  k8sImporter:
    enabled: true
    clusterName: "agw-test"
    ciliumIdentities: false
    tetragonNetworkPolicies: true
    smartSwitchNetworkPolicies: true
    smartSwitches: true
    tetragonNodes: true
  server:
    http:
      enabled: true
      basicAuth:
        enabled: true
        username: "timescape_push_api"
        secretName: hubble-timescape-push-api-password
  reportInterval: "30s"

# Disable UI components — not needed for sanity testing
ui:
  enabled: false
