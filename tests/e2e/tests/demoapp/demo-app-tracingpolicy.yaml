apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "demo-app"
spec:
  file:
    file_paths:
    - "/etc/passwd"
  parser:
    udp:
      enable: true
      cgroup: true
      statsInterval: 10
      deleteIdleSocketInterval: 60
    tcp:
      enable: true
      statsInterval: 10
    dns:
      enable: true

