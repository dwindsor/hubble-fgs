apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: "file-monitoring-namespaced"
spec:
  file:
    file_paths:
    - "/etc/"
    monitorHostFiles: false
    podSelector:
      matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: "In"
        values:
        - "file"
        - "default"
