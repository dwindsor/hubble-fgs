apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "fim-prefix"
spec:
  podSelector:
    matchLabels:
      prefix: "enabled"
  file:
    file_paths_patterns:
    - type: AllFileOps
    selectors:
    - matchFilename:
      - operator: "InPattern"
        values:
        - "*.pizza"