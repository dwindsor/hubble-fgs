apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "tcp"
spec:
  parser:
    udp:
      enable: true
      cgroup: true
      statsInterval: 10
      deleteIdleSocketInterval: 60
    tcp:
      enable: true
      statsInterval: 10
    dns:
      enable: true
    heartbeat:
      enable: true
      interval: 3
      udpPort: 6399
      tcpPort: 6399
    icmp:
      enable: true
