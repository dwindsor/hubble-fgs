apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "tcp-disable-events"
spec:
  parser:
    tcp:
      enable: true
      statsInterval: 10
      watermarks:
        enable: true
        windowSize: 1000
        burstTriggerPercent: 50
        dipTriggerPercent: 20
      histogram:
        enable: true
        min: 0
        max: 4000
      disableEvents:
        disableConnect: true
        disableClose: false
        disableAccept: true
        disableListen: false
    networkWatermarksExitGen:
      enable: true
      interval: 1000
    dns:
      enable: true
    heartbeat:
      enable: true
      interval: 3
      udpPort: 6399
      tcpPort: 6399
