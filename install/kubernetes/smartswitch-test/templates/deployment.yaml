apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartswitch-test.fullname" . }}
  {{- if .Values.namespace.create }}
  namespace: {{ .Values.namespace.name }}
  {{- end }}
  labels:
    {{- include "smartswitch-test.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "smartswitch-test.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "smartswitch-test.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smartswitch-test.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # AGW Test Container - provides the gRPC server that FWA connects to
        - name: agw-test
          {{- with .Values.agw.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.agw.image.repository }}:{{ .Values.agw.image.tag }}"
          imagePullPolicy: {{ .Values.agw.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 8880
              protocol: TCP
          env:
            - name: AGW_CONFIG
              value: {{ .Values.agw.config | quote }}
            - name: AGW_NETWORK_POLICY
              value: {{ .Values.agw.networkPolicy | quote }}
            - name: AGW_ENABLE_K8S
              value: {{ .Values.agw.enableK8s | quote }}
            - name: AGW_ENABLE_NXOS
              value: {{ .Values.agw.enableNxos | quote }}
            - name: AGW_DPU_SERVER_ADDRESS
              value: {{ .Values.agw.dpuServerAddress | quote }}
            - name: AGW_VRF_MAP
              value: {{ .Values.agw.vrfMap | quote }}
            - name: AGW_DEBUG
              value: {{ .Values.agw.debug | quote }}
            - name: AGW_K8S_SERVICE_ACCOUNT_AUTH
              value: {{ .Values.agw.k8sServiceAccountAuth | quote }}
            - name: AGW_TIMESCAPE_CLIENT_ENABLE
              value: {{ .Values.agw.timescapeClientEnable | quote }}
            - name: AGW_TIMESCAPE_PASSWORD
              value: {{ .Values.agw.timescapePassword | quote }}
            - name: AGW_TIMESCAPE_ENDPOINT
              value: {{ .Values.agw.timescapeEndpoint | quote }}
          {{- with .Values.agw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # FWA Test Container - connects to AGW via localhost
        - name: fwa-test
          {{- with .Values.fwa.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.fwa.image.repository }}:{{ .Values.fwa.image.tag }}"
          imagePullPolicy: {{ .Values.fwa.image.pullPolicy }}
          env:
            - name: FWA_CONFIG
              value: {{ .Values.fwa.config | quote }}
            - name: FWA_NETWORK_POLICY
              value: {{ .Values.fwa.networkPolicy | quote }}
            - name: FWA_ENABLE_DATAPLANE
              value: {{ .Values.fwa.enableDataplane | quote }}
            - name: FWA_ENABLE_AGW
              value: {{ .Values.fwa.enableAgw | quote }}
            - name: FWA_ENABLE_LOGGER
              value: {{ .Values.fwa.enableLogger | quote }}
            - name: FWA_SERVER_ADDRESS
              value: {{ .Values.fwa.serverAddress | quote }}
            - name: FWA_DP_SOCKET_PATH
              value: {{ .Values.fwa.dpSocketPath | quote }}
            - name: FWA_DEBUG
              value: {{ .Values.fwa.debug | quote }}
          {{- with .Values.fwa.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
