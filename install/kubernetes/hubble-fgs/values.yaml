# image used for hubble-fgs
image:
  # repository of the docker image
  repository: quay.io/isovalent/hubble-fgs
  # tag is the container image tag to use
  tag: latest
  # pullPolicy is the container image pull policy
  pullPolicy: Always

resources: {}

# Define affinity for the FGS daemonset.
#
# For example, to deploy FGS only on nodes where Cilium is running:
#
#  affinity:
#    podAffinity:
#      requiredDuringSchedulingIgnoredDuringExecution:
#        - labelSelector:
#            matchExpressions:
#              - key: "k8s-app"
#                operator: In
#                values:
#                  - cilium
#          topologyKey: "kubernetes.io/hostname"
#          namespaces:
#            - cilium
#            - kube-system
affinity: {}

# FGS puts processes in an LRU cache. The cache is used to find ancestors for subsequently exec'ed
# processes.
processCacheSize: 32768

# Path to the JSON export file. Set it to an empty string to disable JSON export altogether.
exportFilename: /var/run/cilium/hubble-fgs.log

# Size in megabytes at which to rotate JSON export files.
exportFileMaxSizeMB: 10

# Number of rotated files to retain.
exportFileMaxBackups: 5

# Compress rotated JSON export files.
exportFileCompress: true

# Allowlist for JSON export. For example, to export only process_connect events from
# the default namespace:
#
# exportAllowList: |
#   {"namespace":["default"],"event_set":["PROCESS_CONNECT"]}
exportAllowList: ~

# Denylist for JSON export. For example, to exclude exec events that look similar to
# Kubernetes health checks and all the events from kube-system namespace and the host:
#
# exportDenyList: |
#   {"health_check":true}
#   {"namespace":["kube-system",""]}
#
exportDenyList: ~

# Access Kubernetes API to associate FGS events with Kubernetes pods.
enableK8sAPI: true

# Access Cilium API to associate FGS events with Cilium endpoints and DNS cache.
enableCiliumAPI: true

# Address to expose FGS prometheus metrics (e.g. ":2112"). Metrics server will be disabled if this
# field is not set.
metricsServer: ":2112"

# enableTLSEvents enables TLS visibility.
enableTLSEvents: true