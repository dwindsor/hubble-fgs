# image used for hubble-fgs
image:
  # repository of the docker image
  repository: quay.io/isovalent/hubble-fgs
  # tag is the container image tag to use
  tag: latest
  # pullPolicy is the container image pull policy
  pullPolicy: Always

resources: {}

affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: "k8s-app"
          operator: In
          values:
            - cilium
      topologyKey: "kubernetes.io/hostname"
      namespaces:
      - cilium
      - kube-system

# FGS puts processes in an LRU cache. The cache is used to find ancestors for subsequently exec'ed
# processes.
processCacheSize: 32768

# Path to the JSON export file. Set it to an empty string to disable JSON export altogether.
exportFilename: /var/log/hubble-fgs.log

# Size in megabytes at which to rotate JSON export files.
exportFileMaxSizeMB: 10

# Number of rotated files to retain.
exportFileMaxBackups: 5

# Compress rotated JSON export files.
exportFileCompress: true
