apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      k8s-app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        k8s-app: {{ .Chart.Name }}
    spec:
{{- if .Values.enableK8sAPI }}
      serviceAccountName: hubble-fgs
{{- end }}
{{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - /usr/bin/hubble-fgs
          args:
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /etc/hubble-fgs
              name: fgs-config
              readOnly: true
            - mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
              name: bpf-maps
            - mountPath: "/var/run/cilium"
              name: run
            - mountPath: "/procRoot"
              name: fgs-proc
{{- if .Values.resources }}
          resources:
{{- toYaml .Values.resources | trim | nindent 10 }}
{{- end }}
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: FGS_SOCKET_PATH
            value: "/var/run/cilium/hubble-fgs.sock"
{{- if .Values.exportAllowList }}
          - name: EXPORT_ALLOW_LIST
            value: |-
{{- .Values.exportAllowList | trim | nindent 14 }}
{{- end }}
{{- if .Values.exportDenyList }}
          - name: EXPORT_DENY_LIST
            value: |-
{{- .Values.exportDenyList | trim | nindent 14 }}
{{- end }}
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 1
      tolerations:
        - operator: Exists
      volumes:
        - configMap:
            name: fgs-config
            items:
            - key: config.yaml
              path: config.yaml
          name: fgs-config
        - hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
          name: bpf-maps
        - hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
          name: run
        - hostPath:
            path: /proc/
            type: Directory
          name: fgs-proc
