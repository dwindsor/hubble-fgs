apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      k8s-app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        k8s-app: {{ .Chart.Name }}
    spec:
{{- if .Values.enableK8sAPI }}
      serviceAccountName: hubble-fgs
{{- end }}
{{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - /usr/bin/hubble-fgs
          args:
            - --procfs=/procRoot
            - --set-pid-max
            - -e
            - --tlstc
            - --process-cache-size={{ .Values.processCacheSize }}
            - --export-filename={{ .Values.exportFilename }}
            - --export-file-max-size-mb={{ .Values.exportFileMaxSizeMB }}
            - --export-file-max-backups={{ .Values.exportFileMaxBackups }}
            - --export-file-compress={{ .Values.exportFileCompress }}
{{- if .Values.enableK8sAPI }}
            - --enable-k8s-api
{{- end }}
{{- if .Values.enableCiliumAPI }}
            - --enable-cilium-api
{{- end }}
{{- if .Values.metricsServer }}
            - --metrics-server={{ .Values.metricsServer }}
{{- end }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: "/var/run/cilium"
              name: run
            - mountPath: "/procRoot"
              name: fgs-proc
{{- if .Values.resources }}
          resources:
{{- toYaml .Values.resources | trim | nindent 10 }}
{{- end }}
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: FGS_SOCKET_PATH
            value: "/var/run/cilium/hubble-fgs.sock"
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 1
      tolerations:
        - operator: Exists
      volumes:
        - hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
          name: run
        - hostPath:
            path: /proc/
            type: Directory
          name: fgs-proc
