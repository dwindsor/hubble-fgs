kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: hubble-fgs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hubble-fgs
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: hubble-fgs
{{- end }}
