---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: smartswitchnetworkpolicies.isovalent.com
spec:
  group: isovalent.com
  names:
    kind: SmartSwitchNetworkPolicy
    listKind: SmartSwitchNetworkPolicyList
    plural: smartswitchnetworkpolicies
    singular: smartswitchnetworkpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SmartSwitchNetworkPolicy is the Schema for the smartswitches
          netops API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec specifies network policy rules for SmartSwitch.
            properties:
              rules:
                description: Rules defines the network policy rules for SmartSwitch
                items:
                  description: |-
                    SmartSwitchNetworkPolicyRule specifies the action for a source and
                    destination pair. The cross product of the source and destination is
                    used to calculate the rules created in the datapath. A description is
                    optional and informational only; it is exported with any statistics and
                    or events related to the rule, but is not actually used otherwise in
                    the datapath.
                  properties:
                    action:
                      enum:
                      - allow
                      - deny
                      type: string
                    description:
                      type: string
                    destination:
                      description: |-
                        SmartSwitchNetworkDestination matches a specific network with an
                        optional SmartSwitchNetworkProtocolPort object. If ProtoPort is
                        not specified, the policy applies against all supported protocols
                        and all ports.
                      properties:
                        ipBlock:
                          items:
                            description: |-
                              SmartSwitchNetwork consists of a CIDR and the logical Network
                              the CIDR is associated with. If the logical network is omitted
                              (no VRF or VLAN) then the policy applied against traffic that
                              does not belong to any logical network which may or may not
                              match any actual traffic depending on the switch configuration.
                            properties:
                              cidr:
                                format: cidr
                                type: string
                              vlan:
                                format: int32
                                maximum: 4094
                                minimum: 1
                                type: integer
                              vrf:
                                type: string
                            required:
                            - cidr
                            type: object
                            x-kubernetes-validations:
                            - message: at most one of the fields in [vrf vlan] may
                                be set
                              rule: '!(has(self.vrf) && has(self.vlan))'
                          minItems: 1
                          type: array
                        protoPorts:
                          description: |-
                            ProtoPorts is an optional field to specify protocols and ports for a
                            policy rule. The policy rule applies to the cross product of IPBlock
                            and ProtoPorts.
                          items:
                            description: |-
                              SmartSwitchProtocolPort provides the protocol to apply the policy
                              against with an optional port or a port range. When no ports are specified
                              the port is a wildcard and policy applies against any port.
                            properties:
                              endPort:
                                description: |-
                                  EndPort is an optional field to indicate that the policy rule applies to
                                  a port range from Port to EndPort inclusive instead of an individual
                                  port. This field must not be set if the Port field is not set. The
                                  EndPort value must be greater than the Port value.
                                format: int32
                                maximum: 65535
                                minimum: 0
                                type: integer
                              port:
                                format: int32
                                maximum: 65535
                                minimum: 0
                                type: integer
                              protocol:
                                enum:
                                - ICMP
                                - TCP
                                - UDP
                                type: string
                            required:
                            - protocol
                            type: object
                            x-kubernetes-validations:
                            - message: endPort requires port to be set also
                              rule: '!has(self.endPort) || has(self.port)'
                            - message: endPort must be greater than port
                              rule: '!has(self.endPort) || self.endPort > self.port'
                            - message: ICMP protocol does not support port numbers;
                                port field must be omitted
                              rule: self.protocol != 'ICMP' || !has(self.port)
                          minItems: 1
                          type: array
                      required:
                      - ipBlock
                      - protoPorts
                      type: object
                    source:
                      description: |-
                        SmartSwitchNetworkSource only supports IPBlocks. At the moment there
                        is no support to match source port so the policy applies against
                        all source ports.
                      properties:
                        ipBlock:
                          items:
                            description: |-
                              SmartSwitchNetwork consists of a CIDR and the logical Network
                              the CIDR is associated with. If the logical network is omitted
                              (no VRF or VLAN) then the policy applied against traffic that
                              does not belong to any logical network which may or may not
                              match any actual traffic depending on the switch configuration.
                            properties:
                              cidr:
                                format: cidr
                                type: string
                              vlan:
                                format: int32
                                maximum: 4094
                                minimum: 1
                                type: integer
                              vrf:
                                type: string
                            required:
                            - cidr
                            type: object
                            x-kubernetes-validations:
                            - message: at most one of the fields in [vrf vlan] may
                                be set
                              rule: '!(has(self.vrf) && has(self.vlan))'
                          minItems: 1
                          type: array
                      required:
                      - ipBlock
                      type: object
                  required:
                  - action
                  - destination
                  - source
                  type: object
                minItems: 1
                type: array
            required:
            - rules
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
