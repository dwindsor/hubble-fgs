# This 'ptrace' Tracing Policy monitors any ptrace attempts and
# posts and event.
#
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "ptrace"
  labels:
    app.kubernetes.io/version: 1.14.0-pre.0
spec:
  kprobes:
    - call: "sys_ptrace"
      syscall: true
      args:
        - index: 0
          type: "int64"
        - index: 1
          type: "int64"
        - index: 2
          type: "uint64"
