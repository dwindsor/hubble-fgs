apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "l3l4networking"
  labels:
    app.kubernetes.io/version: 1.15.0-pre.2
spec:
  parser:
    udp:
      enable: true
      cgroup: true
      statsInterval: 10
    tcp:
      enable: true
      statsInterval: 10
    dns:
      enable: true
