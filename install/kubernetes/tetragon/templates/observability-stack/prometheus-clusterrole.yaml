{{- if .Values.observabilityStack.enabled }}
# This has to be a ClusterRole, not just a Role, so that Prometheus can scrape
# kubelet (cadvisor) for memory & CPU metrics.
#
# Permissions come from an example in the Prometheus repo:
# https://github.com/prometheus/prometheus/blob/372b83d7b8601247355531a91487cd98ef2970fe/documentation/examples/rbac-setup.yml
#
# TODO: Not all of these are necessary for our use case. Let's try to reduce the scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "prometheus.name" . }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs:
  - get
{{- end }}
