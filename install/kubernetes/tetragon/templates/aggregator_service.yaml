{{- if .Values.tetragonAggregator.enabled -}}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-aggregator
  labels:
    {{- include "tetragon-aggregator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tetragon-aggregator.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
{{- end }}
