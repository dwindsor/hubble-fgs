kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: netpol
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - isovalent.com
    resources:
      - smartswitchnetworkpolicies
    verbs:
      # Allow patching annotations to report validation results
      - patch
      - get
      - list
      - watch
