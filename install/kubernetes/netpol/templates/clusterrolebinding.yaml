kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: netpol-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netpol
subjects:
  - kind: ServiceAccount
    namespace: {{ .Values.namespace }}
    name: {{ include "netpol.serviceAccountName" . }}
