apiVersion: v2
name: tetragon
description: Helm chart for Tetragon Enterprise
type: application

# IMPORTANT about below versions
#
# Currently we override version and appVersion during Helm chart release process in:
# https://github.com/isovalent/helm-repo/blob/master/generate.sh
#
# This script sets version and appVersion based on git tag / branch names. Don't bother updating
# version and appVersion fields below unless we have made a conscious decision to maintain these
# fields using some other convention.

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
dependencies:
  # EXPERIMENTAL: kube-prometheus-stack is required by an experimental feature
  # and might be removed at any time.
  # TODO: Renovate it, but we need to be a bit more careful with updates,
  # because we rely on some specific templates details and we want to avoid
  # installing unnecessary resources. Ideally all should be covered by CI.
  # Also on every update we need to persist the Chart.lock file e.g. by
  # copying it back to the enterprise directory.
  - name: kube-prometheus-stack
    version: "62.7.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: observabilityStack.enabled
