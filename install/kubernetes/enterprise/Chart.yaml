apiVersion: v2
name: tetragon
description: Helm chart for Tetragon Enterprise
type: application

# IMPORTANT about below versions
#
# Currently we override version and appVersion during Helm chart release process in:
# https://github.com/isovalent/helm-repo/blob/master/generate.sh
#
# This script sets version and appVersion based on git tag / branch names. Don't bother updating
# version and appVersion fields below unless we have made a conscious decision to maintain these
# fields using some other convention.

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
dependencies:
  - name: grafana
    version: "10.5.15"
    repository: https://grafana.github.io/helm-charts
    condition: integratedGrafana.enabled
  - name: kube-state-metrics
    version: "8.6.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: integratedGrafana.enabled
