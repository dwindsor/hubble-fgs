{{- if or .Values.dashboards.network.enabled .Values.integratedGrafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-udp-throughput-socket
  namespace: {{ .Values.dashboards.namespace | default .Release.Namespace }}
  labels:
    {{- with .Values.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.dashboards.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
{{ (.Files.Glob "dashboards/network/udp-throughput-socket.json").AsConfig | indent 2 }}
{{- end }}
