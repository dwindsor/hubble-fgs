{{- if .Values.observabilityStack.enabled }}
# Prometheus Operator creates also a headless service, but since we install
# only one Prometheus instance, we don't need it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  ports:
  - name: http-web
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    {{- include "prometheus.selectorLabels" . | nindent 4 }}
{{- end }}
