# We define cAdvisor ServiceMonitor independently, because even though
# kube-prometheus-stack allows to override relabelings, it doesn't allow to
# disable scraping the main kubelet endpoint and we don't need it.
{{- if .Values.observabilityStack.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tetragon-observability-cadvisor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tetragon-observability-cadvisor
    app.kubernetes.io/part-of: tetragon-observability
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.Version | quote }}
    helm.sh/chart: {{ include "tetragon.chart" . }}
    release: {{ .Release.Name }} # used by servicemonitor selector
spec:
  endpoints:
  - port: https-metrics
    scheme: https
    path: /metrics/cadvisor
    honorLabels: true
    honorTimestamps: true
    tlsConfig:
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecureSkipVerify: true
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabelings:
    - action: replace
      sourceLabels:
      - __metrics_path__
      targetLabel: metrics_path
    metricRelabelings:
    - action: keep
      # keep only metrics used in dashboards
      regex: container_(memory_working_set_bytes|cpu_usage_seconds_total)
      sourceLabels:
      - __name__
    - action: keep
      regex: tetragon.* # keep only metrics about Tetragon
      sourceLabels:
      - pod # added by Prometheus Operator
    - action: keep
      regex: "" # keep only totals for all containers
      sourceLabels:
      - container
    - action: keep
      regex: (|total) # keep only totals for all CPUs
      sourceLabels:
      - cpu
  jobLabel: k8s-app
  namespaceSelector:
    matchNames:
    - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet
      k8s-app: kubelet
{{- end }}
