apiVersion: isovalent.com/v1alpha1
kind: SmartSwitchNetworkPolicy
metadata:
  name: management
  namespace: default
spec:
  rules:
  - action: allow
    description: Allow SSH
    destination:
      ipBlock:
      - cidr: 192.168.0.0/16
        vrf: management
      protoPorts:
      - protocol: tcp
        port: 22
    source:
      ipBlock:
      - cidr: 0.0.0.0/0
        vrf: management
  - action: allow
    description: Allow SNMP
    destination:
      ipBlock:
      - cidr: 192.168.0.0/16
        vrf: management
      protoPorts:
      - protocol: udp
        port: 161
        endPort: 162
    source:
      ipBlock:
      - cidr: 0.0.0.0/0
        vrf: management
