syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

package fgs;

message Image {
    string id = 1;
    string name = 2;
}

message Container {
    string id = 1;
    string name = 2;
    Image image = 3;
    // Start time of the container.
    google.protobuf.Timestamp start_time = 4;
    // PID in the container namespace.
    google.protobuf.UInt32Value pid = 5;

    // Fields below are used internally for filtering and then discarded. They will not be
    // included in JSON export for example.
    repeated string liveness_exec_probe = 1000;
    repeated string readiness_exec_probe = 1001;
}

message Pod {
    string namespace = 1;
    string name = 2;
    repeated string labels = 3;
    Container container = 4;
}

message Process {
    // Exec ID uniquely identifies the process over time across all the nodes in the cluster.
    string exec_id = 1;
    google.protobuf.UInt32Value pid = 2;
    google.protobuf.UInt32Value uid = 3;
    string cwd = 4;
    string binary = 5;
    string arguments = 6;
    string flags = 7;
    google.protobuf.Timestamp start_time = 8;
    google.protobuf.UInt32Value auid = 9;
    Pod pod = 10;
    string parent_exec_id = 11;
}

message ProcessConnect {
    Process process = 1;
    Process parent = 2;
    string source_ip = 3;
    google.protobuf.UInt32Value source_port = 4;
    string destination_ip = 5;
    google.protobuf.UInt32Value destination_port = 6;
    repeated string destination_names = 7;
}

message ProcessListen {
    Process process = 1;
    Process parent = 2;
    string ip = 3;
    google.protobuf.UInt32Value port = 4;
}

message ProcessExec {
    Process process = 1;
    Process parent = 2;
    // Ancestors of the process beyond the immediate parent.
    repeated Process ancestors = 3;
}

message Tls {
    Process process = 1;
    string source_ip = 2;
    google.protobuf.UInt32Value source_port = 3;
    string destination_ip = 4;
    google.protobuf.UInt32Value destination_port = 5;
    string negotiated_version = 6;
    string supported_versions = 7;
    string sni_type = 8;
    string sni_name = 9;
    string cipher = 10;
    string client_flags = 11;
    string server_flags = 12;
    string client_version = 13;
    string server_version = 14;
    string client_alert = 15;
    string server_alert = 16;
    string client_session = 17;
    string server_session = 18;
}

service FineGuidanceSensors {
    rpc GetEvents(GetEventsRequest) returns (stream GetEventsResponse) {}
}

message GetEventsRequest {
    // allow_list specifies a list of filters to apply to only return certain
    // events. If multiple filters are specified, at least one of them has to
    // match for an event to be included in the results.
    repeated Filter allow_list = 1;
    // deny_list specifies a list of filters to apply to exclude certain events
    // from the results. If multiple filters are specified, at least one of
    // them has to match for an event to be excluded.
    //
    // If both allow_list and deny_list are specified, the results contain the
    // set difference allow_list - deny_list.
    repeated Filter deny_list = 2;
}

message GetEventsResponse {
    oneof event {
        ProcessExec process_exec = 1;
        ProcessConnect process_connect = 2;
        ProcessListen process_listen = 3;
	Tls tls = 4;
    }
    // Name of the node where this event was observed.
    string node_name = 1000;
    // Timestamp at which this event was observed.
    google.protobuf.Timestamp time = 1001;
}

message Filter {
    repeated string binary_regex = 1;
    repeated string namespace = 2;
    google.protobuf.BoolValue health_check = 3;
}
