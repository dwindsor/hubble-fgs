syntax = "proto3";

import "google/protobuf/timestamp.proto";

package fgs;

message Image {
    string id = 1;
    string name = 2;
}

message Container {
    string id = 1;
    string name = 2;
    Image image = 3;
    // Start time of the container.
    google.protobuf.Timestamp start_time = 4;
    // PID in the container namespace.
    string pid = 5;
}

message Pod {
    string namespace = 1;
    string name = 2;
    repeated string labels = 3;
    Container container = 4;
}

message Process {
    // Exec ID uniquely identifies the process over time across all the nodes in the cluster.
    string exec_id = 1;
    string pid = 2;
    string uid = 3;
    string cwd = 4;
    string binary = 5;
    string arguments = 6;
    string flags = 7;
    google.protobuf.Timestamp start_time = 8;
    string auid = 9;
    Pod pod = 10;
    string parent_exec_id = 11;
}

message ProcessConnect {
    Process process = 1;
    Process parent = 2;
    string source_ip = 3;
    uint32 source_port = 4;
    string destination_ip = 5;
    uint32 destination_port = 6;
    repeated string destination_names = 7;
}

message ProcessListen {
    Process process = 1;
    Process parent = 2;
    string ip = 3;
    string port = 4;
}

message ProcessExec {
    Process process = 1;
    Process parent = 2;
    // Ancestors of the process beyond the immediate parent.
    repeated Process ancestors = 3;
}

service FineGuidanceSensors {
    rpc GetEvents(GetEventsRequest) returns (stream GetEventsResponse) {}
}

message GetEventsRequest {}

message GetEventsResponse {
    oneof event {
        ProcessExec process_exec = 1;
        ProcessConnect process_connect = 2;
        ProcessListen process_listen = 3;
    }
    // Name of the node where this event was observed.
    string node_name = 1000;
    // Timestamp at which this event was observed.
    google.protobuf.Timestamp time = 1001;
}
