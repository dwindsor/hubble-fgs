syntax = "proto3";

package tetragon;

import "google/protobuf/timestamp.proto";
import "tetragon/dns.proto";
import "tetragon/events.proto";
import "tetragon/fgs.proto";
import "tetragon/sandbox.proto";
import "tetragon/tetragon.proto";

option go_package = "github.com/cilium/tetragon/api/v1/tetragon";

enum RuleType {
  RULE_TYPE_UNSPEC = 0;
  // rule is monitoring only
  RULE_TYPE_MONITORING = 1;
  // rule is a shield: supports both monitoring and enforcement
  RULE_TYPE_SHIELD = 2;
}

enum RuleMode {
  RULE_MODE_UNSPEC = 0;
  // rule is in monitoring mode
  RULE_MODE_MONITORING = 1;
  // rule is in enforcement mode
  RULE_MODE_ENFORCEMENT = 2;
}

message RuleStatus {
  RuleMode mode = 1;
  bool loaded = 2;
  // set only if Loaded is false
  string load_err = 3;
}

// active rule
message Rule {
  string version = 1; // version of the ruleset that includes this rule
  // rule path, e.g., ["path", "release-agent"] or ["exec", "all", "execBinary", "bulk-data-removal"]
  // NB(kkourt): there is some redundancy here because many rules will have a path prefix, but we
  // want to keep things simple
  repeated string path = 2;
  // rule type
  RuleType type = 3;
  RuleStatus status = 4;
}

// active ruleset
message RuleSet {
  string node = 1; // identifies node (tetragon agent instance)
  repeated Rule rules = 2;
}
