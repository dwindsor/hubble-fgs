syntax = "proto3";

package tetragon;

import "tetragon/tetragon.proto";

message ProcessSandboxSyscall {
        tetragon.Process process = 1;
        tetragon.Process parent = 2;
        // syscall name
        string name = 3;
	// policy name
	string policy = 4;
}

