syntax = "proto3";

package tetragon;

option go_package = "github.com/cilium/tetragon/api/v1/tetragon";

service NetworkPolicyService {
  rpc AddNetworkPolicyFromYAML(AddNetworkPolicyFromYAMLRequest) returns (AddNetworkPolicyResponse) {}
  rpc DeleteNetworkPolicy(DeleteNetworkPolicyRequest) returns (DeleteNetworkPolicyResponse) {}
  rpc ListNetworkPolicy(ListNetworkPolicyRequest) returns (ListNetworkPolicyResponse) {}
  rpc GetNetworkPolicy(GetNetworkPolicyRequest) returns (GetNetworkPolicyResponse) {}
}

message NetworkPolicyInfo {
  string name = 1;
}

message AddNetworkPolicyFromYAMLRequest {
  string yaml = 1;
}

message AddNetworkPolicyResponse {}

message DeleteNetworkPolicyRequest {
  string name = 1;
}

message DeleteNetworkPolicyResponse {}

message ListNetworkPolicyRequest {}

message ListNetworkPolicyResponse {
  repeated NetworkPolicyInfo info = 1;
}

message GetNetworkPolicyRequest {
  string name = 1;
}

message GetNetworkPolicyResponse {
  string name = 1;
  string yaml = 2;
}
