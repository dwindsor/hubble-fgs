# Root configuration of the operator ConfigMap.
# The content specified here will be copied into it.
# Refer to Tetragon documentation for the options.
# Skip CRD creation.
# DEPRECATED. This value will be removed in Tetragon v1.2 release. Use crds.installMethod instead.
skip-crd-creation: "false"
# Enables the PodInfo CRD and the controller that reconciles PodInfo
# custom resources.
skip-pod-info-crd: "false"
# Enables the TracingPolicy and TracingPolicyNamespaced CRD creation.
skip-tracing-policy-crd: "false"
# Enables sandboxpolicies.
skip-policysandbox-crd: "false"
force-update-crds: "false"
# Whether to create a 'ServiceMonitor' resource targeting the Tetragon operator.
serviceMonitorEnabled: false
# The set of labels to place on the operator 'ServiceMonitor' resource.
#serviceMonitorLabelsOverride: |
#  key1: value1
# Interval at which the operator metrics should be scraped. If not specified, Prometheus' global scrape interval is used.
serviceMonitorScrapeInterval: 10s
# The port at which the operator exposes metrics.
serviceMonitorPrometheusPort: "2113"
# The set of labels to place on the operator service resource.
#serviceLabelsOverride: |
#  key1: value1
