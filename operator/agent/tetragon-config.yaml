# Configuration of the agent ConfigMap.
# The content specified here will be copied into it.
# Refer to Tetragon documentation for the options.
enable-k8s-api: "true"
enable-pod-info: "true"
enable-process-cred: "false"
enable-process-ns: "false"
export-allowlist: '{"event_set":["PROCESS_CONNECT", "PROCESS_EXEC", "PROCESS_HTTP", "PROCESS_KPROBE", "PROCESS_LISTEN", "PROCESS_TLS"]}'
export-denylist: |-
  {"health_check":true}
  {"namespace":["", "cilium", "kube-system"]}
export-file-compress: "false"
export-file-max-backups: "5"
export-file-max-size-mb: "10"
export-file-perm: "644"
export-filename: /var/run/cilium/tetragon/tetragon.log
export-rate-limit: "-1"
field-filters: '{}'
fim-fifo-path: /var/run/cilium/tetragon
fim-runtime-endpoint: ""
gops-address: localhost:8118
metrics-server: :2112
process-cache-size: "65536"
procfs: /procRoot
server-address: localhost:54321