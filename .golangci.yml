# See https://golangci-lint.run/usage/configuration/ for available options.
# Also https://github.com/cilium/cilium/blob/master/.golangci.yaml as a reference.
version: "2"
output:
  formats:
    tab:
      path: stdout
      colors: false
linters:
  default: none
  enable:
    - err113
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - linters:
          - err113
        text: "do not define dynamic errors, use wrapped static errors instead"
      - linters:
          - revive
        text: "exported:"
      - linters:
          - revive
        text: "package-comments:"
      - linters:
          - revive
        text: "var-naming:"
      - linters:
          - staticcheck
        text: "SA1019: tetragon.ProcessFileExec is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: e.ProcessFileExec is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: response.GetProcessFileExec is deprecated"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
      - github.com/isovalent/hubble-fgs
run:
  build-tags:
    - e2e_tests
    - sudo_tests
