descriptor-schema-version: "2.15"
info:
  name: hsa
  description: Cisco Hypershield Agent
  version: 1.1.0.rc.14
  author-link: http://www.cisco.com
  author-name: Cisco Systems, Inc.
app:
  cpuarch: x86_64
  env:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  monitor:
    initial_delay_seconds: 30
    period_seconds: 60
    script: /usr/src/app/health.sh
  post_upgrade:
    initial_wait_time: 30
    post_script: /usr/src/app/post.sh
  resources:
    container-size: 32
    cpu: 14000
    cpu-topology:
      cores: 2
      sockets-per-core: 2
    datastore: true
    disk: 2048
    extended-resources: false
    memory: 16384
    network:
      - interface-name: eth0
        ports: {}
    profile: custom
    platform-env:
      - /usr/local/bin
      - /usr/sbin
    privileged: false
    recommendations:
      - description: Recommended profile
        label: PROFILE_CUSTOM
        profile: custom
    rootfs_expanded_size: 2048
    rootfs_size: 1024
    seed-controller-certificate: false
    vcpu: 4
    visualization: false
  startup:
    restricted_disk_options: --mount type=tmpfs,destination=/data/volatile,tmpfs-size=1024m
    rootfs: agw.tar
    target: /usr/src/app/init.sh
  type: docker
