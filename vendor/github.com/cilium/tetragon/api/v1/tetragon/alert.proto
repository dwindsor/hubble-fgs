syntax = "proto3";

package tetragon;

import "google/protobuf/timestamp.proto";
import "tetragon/dns.proto";
import "tetragon/events.proto";
import "tetragon/fgs.proto";
import "tetragon/sandbox.proto";
import "tetragon/tetragon.proto";

option go_package = "github.com/cilium/tetragon/api/v1/tetragon";

message AlertRule {
  enum Severity {
    UNSPECIFIED = 0;
    INFO = 1;
    WARNING = 2;
    CRITICAL = 3;
  }
  string name = 1;
  Severity severity = 2;
  string message = 3;
  repeated string tags = 4;
}

message Alert {
  optional GetEventsResponse event = 1;
  AlertRule rule = 2;
}
