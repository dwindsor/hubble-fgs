syntax = "proto3";

package tetragon;

import "google/protobuf/wrappers.proto";
import "tetragon/fgs.proto";
import "tetragon/tetragon.proto";

option go_package = "github.com/cilium/tetragon/api/v1/tetragon";

message GetProcessModelRequest {
  // Namespaces to list processes from. Specify "<host-namespace>" to list
  // host processes. Leave it empty to list all processes.
  repeated string namespaces = 1;
  bool debug = 2;
}

message Workload {
  string name = 1;
  string kind = 2;
}

message DestinationStats {
  reserved 4, 5, 6, 7;
  reserved "TxLimit", "TxQuota", "KtimeLastReset", "KtimeTxReset";

  uint64 TxBytes = 1;
  uint64 RxBytes = 2;
  // Deprecated: holds a byte count, not a packet count. Superseded by
  // TxDropBytes (bytes) and TxDropPackets (packets).
  uint64 TxDrops = 3 [deprecated = true];
  uint64 DefaultAllowBytes = 8;
  uint64 DefaultDenyBytes = 9;
  // Number of transmit bytes dropped.
  uint64 TxDropBytes = 10;
  // Number of transmit packets dropped.
  uint64 TxDropPackets = 11;
  // Number of packets allowed by the default policy rule.
  uint64 DefaultAllowPackets = 12;
  // Number of packets denied by the default policy rule.
  uint64 DefaultDenyPackets = 13;
}

message Destination {
  repeated string destination_names = 1;
  tetragon.Pod destination_pod = 2;
  uint64 Port = 3;
  DestinationStats stats = 4;
  tetragon.Service destination_service = 5;
}

message ProcessModel {
  string binary = 1;
  string binary_args = 2;
  string parent = 3;
  string parent_args = 4;
  string namespace = 5;
  Workload workload = 6;
  repeated Destination dest = 7;
  // If set to true, this process is containerized and is a member of the
  // process tree rooted at pid=1 in its PID namespace. This is useful if,
  // for example, you wish to discern whether a process was spawned using a
  // tool like nsenter or kubectl exec.
  google.protobuf.BoolValue in_init_tree = 8;
  repeated uint32 syscalls = 9;
  string abi = 10;
  string container_id = 11;
}

service ProcessModelService {
  rpc GetEndpointMap(GetEndpointMapRequest) returns (GetEndpointMapResponse) {}
  rpc GetDestinationMap(GetDestinationMapRequest) returns (GetDestinationMapResponse) {}
  rpc GetProcesses(GetProcessModelRequest) returns (stream ProcessModel) {}
  rpc GetProcessMap(GetProcessMapRequest) returns (GetProcessMapResponse) {}
}

enum EndpointType {
  ENDPOINT_TYPE_UNKNOWN = 0;
  ENDPOINT_TYPE_DNS = 1;
  ENDPOINT_TYPE_POD = 2;
  ENDPOINT_TYPE_IP = 3;
  ENDPOINT_TYPE_SERVICE = 4;
  ENDPOINT_TYPE_LISTEN = 5;
  ENDPOINT_TYPE_BPF_DNS = 6;
  ENDPOINT_TYPE_NODE = 7;
  ENDPOINT_TYPE_CIDR = 8;
}

message Endpoint {
  string srcIP = 1;
  uint64 key = 2;
  EndpointType type = 3;
  string dns = 4;
  string kind = 5;
  string namespace = 6;
  string name = 7;
  string ip = 8;
  string port = 9;
}

message EndpointMap {
  repeated Endpoint endpoints = 1;
}

message GetEndpointMapResponse {
  EndpointMap map = 1;
}

message GetEndpointMapRequest {}

message ProcessUUID {
  string Binary = 1;
  string Args = 2;
  uint64 id = 3;
  uint32 Depth = 4;
  repeated ProcessUUID children = 5;
}

message ProcessMap {
  repeated ProcessUUID process = 1;
}

message GetProcessMapResponse {
  ProcessMap map = 1;
}

message GetProcessMapRequest {}

message DestinationEndpointDebug {
  reserved 6, 7;
  reserved "tx_quota", "tx_limit";

  uint64 local_id = 1;
  uint64 local_ns_id = 2;
  uint64 destination_id = 3;
  uint64 destination_source = 4;
  uint64 destination_port = 5;
  // Deprecated: holds a byte count, not a packet count. Superseded by
  // tx_drop_bytes (bytes) and tx_drop_packets (packets).
  uint64 tx_drops = 8 [deprecated = true];
  uint64 default_allow_bytes = 9;
  uint64 default_deny_bytes = 10;
  string policy = 11;
  // Number of transmit bytes dropped.
  uint64 tx_drop_bytes = 12;
  // Number of transmit packets dropped.
  uint64 tx_drop_packets = 13;
  // Number of packets allowed by the default policy rule.
  uint64 default_allow_packets = 14;
  // Number of packets denied by the default policy rule.
  uint64 default_deny_packets = 15;
}

message GetDestinationMapResponse {
  repeated DestinationEndpointDebug destinations = 1;
}

message GetDestinationMapRequest {}

service EndpointMapService {
  rpc GetEndpointMap(GetEndpointMapRequest) returns (GetEndpointMapResponse) {}
}
