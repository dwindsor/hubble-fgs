syntax = "proto3";

package tetragon;

import "google/protobuf/timestamp.proto";

message ApplicationModelEvent {
	string cluster_name = 1;
	string node_name = 2;
	google.protobuf.Timestamp time = 3;
	ApplicationModel application_model = 4;
}

message ApplicationModel {
	repeated ApplicationNamespace namespaces = 1;
	ApplicationHost host = 2;
}

message ApplicationHost {
	repeated ApplicationProcess processes = 1;
}

message ApplicationNamespace {
	string name = 1;
	repeated ApplicationWorkload workloads = 2;
}

message ApplicationWorkload {
	string name = 1;
	string kind = 2;
	repeated ApplicationProcess processes = 3;
}

message ApplicationProcess {
	string name = 1;
	repeated ApplicationConnection connections = 2;
        // Arguments passed to this process.
        string arguments = 3;
        // Hash to identify this process in the process tree.
        string hash = 4;
        // Hash to identify the parent of this process in the process tree.
        string parent_hash = 5;
}

message ApplicationConnection {
	string destination_name = 1;
	uint64 destination_port = 2;
	uint64 bytes_sent = 3;
	uint64 bytes_received = 4;
}
