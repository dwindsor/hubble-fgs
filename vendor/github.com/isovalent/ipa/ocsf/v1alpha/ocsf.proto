//
message MITREATTCKSubTechnique {
  //
  // Description:
  //   The name of the attack sub technique, as defined by ATT&CK® Matrix. For
  //   example: Scanning IP Blocks.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 1;

  //
  // Description:
  //   The versioned permalink of the attack sub technique, as defined by
  //   ATT&CK® Matrix. For example:
  //   https://attack.mitre.org/versions/v14/techniques/T1595/001/.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
