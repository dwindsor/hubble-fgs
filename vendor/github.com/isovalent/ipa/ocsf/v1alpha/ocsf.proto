}

//
// The Process object describes a running instance of a launched program.
//
message Process {
  //
  // Description:
  //   An array of Process Entities describing the extended parentage of this
  //   process object. Direct parent information sould be expressed through the
  //   parent_process attribute. The first array element is the direct parent of
  //   this process object. Subsequent list elements go up the process parentage
  //   hierarchy. That is, the array is sorted from newest to oldest process. It
  //   is recommended to only populate this field for the top-level process
  //   object.
  //
  // Data Type:
  //   A message field of type ProcessEntity.
  //
  // Requirement:
  //   optional
  //
  repeated ProcessEntity ancestry = 1;

  //
  // Description:
  //   The audit user assigned at login by the audit subsystem.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 auid = 2;

  //
  // Description:
  //   The full command line used to launch an application, service, process, or
  //   job. For example: ssh user@10.0.0.10. If the command line is unavailable
  //   or missing, the empty string '' is to be used.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string cmd_line = 3;

  //
  // Description:
  //   The time when the process was created/started.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 4;

  //
  // Description:
  //   The time when the process was created/started.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 5;

  //
  // Description:
  //   The effective group under which this process is running.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 egid = 6;

  //
  // Description:
  //   Environment variables associated with the process.
  //
  // Data Type:
  //   A message field of type EnvironmentVariable.
  //
  // Requirement:
  //   optional
  //
  repeated EnvironmentVariable environment_variables = 7;

  //
  // Description:
  //   The effective user under which this process is running.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 euid = 8;

  //
  // Description:
  //   The process file object.
  //
  // Data Type:
  //   A message field of type File.
  //
  // Requirement:
  //   recommended
  //
  optional File file = 9;

  //
  // Description:
  //   The group under which this process is running.
  //
  // Data Type:
  //   A message field of type Group.
  //
  // Requirement:
  //   recommended
  //
  optional Group group = 10;

  //
  // Description:
  //   The process integrity level, normalized to the caption of the
  //   integrity_id value. In the case of 'Other', it is defined by the event
  //   source (Windows only).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string integrity = 11;

  //
  // Description:
  //   The normalized identifier of the process integrity level (Windows only).
  //
  // Data Type:
  //   An enum field of type ProcessIntegrityLevel.
  //
  // Requirement:
  //   optional
  //
  optional ProcessIntegrityLevel integrity_id = 12;

  //
  // Description:
  //   The lineage of the process, represented by a list of paths for each
  //   ancestor process. For example: ['/usr/sbin/sshd', '/usr/bin/bash',
  //   '/usr/bin/whoami'].
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string lineage = 13;

  //
  // Description:
  //   The list of loaded module names.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string loaded_modules = 14;

  //
  // Description:
  //   The friendly name of the process, for example: Notepad++.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 15;

  //
  // Description:
  //   The parent process of this process object. It is recommended to only
  //   populate this field for the top-level process object, to prevent deep
  //   nesting. Additional ancestry information can be supplied in the ancestry
  //   attribute.
  //
  // Data Type:
  //   A message field of type Process.
  //
  // Requirement:
  //   recommended
  //
  optional Process parent_process = 16;

  //
  // Description:
  //   The process file path.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string path = 17;

  //
  // Description:
  //   The process identifier, as reported by the operating system. Process ID
  //   (PID) is a number used by the operating system to uniquely identify an
  //   active process.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   recommended
  //
  optional int32 pid = 18;

  //
  // Description:
  //   The name of the containment jail (i.e., sandbox). For example,
  //   hardened_ps, high_security_ps, oracle_ps, netsvcs_ps, or default_ps.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string sandbox = 19;

  //
  // Description:
  //   The user session under which this process is running.
  //
  // Data Type:
  //   A message field of type Session.
  //
  // Requirement:
  //   optional
  //
  optional Session session = 20;

  //
  // Description:
  //   The time when the process was terminated.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 terminated_time = 21;

  //
  // Description:
  //   The time when the process was terminated.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string terminated_time_dt = 22;

  //
  // Description:
  //   The Identifier of the thread associated with the event, as returned by
  //   the operating system.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 tid = 23;

  //
  // Description:
  //   A unique identifier for this process assigned by the producer (tool).
  //   Facilitates correlation of a process event with other events for that
  //   process.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 24;

  //
  // Description:
  //   The user under which this process is running.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   recommended
  //
  optional User user = 25;

  //
  // Description:
  //   The working directory of a process.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string working_directory = 26;

  //
  // Description:
  //   An unordered collection of zero or more name/value pairs that represent a
  //   process extended attribute.
  //
  // Data Type:
  //   A message field of type Object.
  //
  // Requirement:
  //   optional
  //
  optional Object xattributes = 27;
}

//
// The Process Entity object provides critical fields for referencing a process.
//
message ProcessEntity {
  //
  // Description:
  //   The full command line used to launch an application, service, process, or
  //   job. For example: ssh user@10.0.0.10. If the command line is unavailable
  //   or missing, the empty string '' is to be used.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string cmd_line = 1;

  //
  // Description:
  //   The time when the process was created/started.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 2;

  //
  // Description:
  //   The time when the process was created/started.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 3;

  //
  // Description:
  //   The friendly name of the process, for example: Notepad++.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 4;

  //
  // Description:
  //   The process file path.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string path = 5;

  //
  // Description:
  //   The process identifier, as reported by the operating system. Process ID
  //   (PID) is a number used by the operating system to uniquely identify an
  //   active process.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   recommended
  //
  optional int32 pid = 6;

  //
  // Description:
  //   A unique identifier for this process assigned by the producer (tool).
  //   Facilitates correlation of a process event with other events for that
  //   process.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 7;
}

//
// The Product object describes characteristics of a software product.
//
message Product {
  //
  // Description:
  //   The Common Platform Enumeration (CPE) name as described by (NIST) For
  //   example: cpe:/a:apple:safari:16.2.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string cpe_name = 1;

  //
  // Description:
  //   The feature that reported the event.
  //
  // Data Type:
  //   A message field of type Feature.
  //
  // Requirement:
  //   optional
  //
  optional Feature feature = 2;

  //
  // Description:
  //   The two letter lower case language codes, as defined by ISO 639-1. For
  //   example: en (English), de (German), or fr (French).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string lang = 3;

  //
  // Description:
  //   The name of the product.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 4;

  //
  // Description:
  //   The installation path of the product.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string path = 5;

  //
  // Description:
  //   The unique identifier of the product.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 6;

  //
  // Description:
  //   The URL pointing towards the product.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string url_string = 7;

  //
  // Description:
  //   The name of the vendor of the product.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string vendor_name = 8;

  //
  // Description:
  //   The version of the product, as defined by the event source. For example:
  //   2013.1.3-beta.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string version = 9;
}

//
// The Reputation object describes the reputation/risk score of an entity (e.g.
// device, user, domain).
//
message Reputation {
  //
  // Description:
  //   The reputation score as reported by the event source.
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   required
  //
  float base_score = 1;

  //
  // Description:
  //   The provider of the reputation information.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string provider = 2;

  //
  // Description:
  //   The reputation score, normalized to the caption of the score_id value. In
  //   the case of 'Other', it is defined by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string score = 3;

  //
  // Description:
