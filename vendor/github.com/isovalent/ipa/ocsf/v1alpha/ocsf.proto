  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 5;

  //
  // Description:
  //   An alternative or contextual identifier for the agent or sensor, such as
  //   a configuration, organization, or license UID.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid_alt = 6;

  //
  // Description:
  //   The company or author who created the agent or sensor. For example:
  //   Crowdstrike.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vendor_name = 7;

  //
  // Description:
  //   The semantic version of the agent or sensor, e.g., 7.101.50.0.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string version = 8;
}

//
// The MITRE ATT&CK® object describes the tactic, technique & sub-technique
// associated to an attack as defined in ATT&CK® Matrix.
//
message MITREATTCK {
  //
  // Description:
  //   The Sub Technique object describes the sub technique ID and/or name
  //   associated to an attack, as defined by ATT&CK® Matrix.
  //
  // Data Type:
  //   A message field of type MITREATTCKSubTechnique.
  //
  // Requirement:
  //   optional
  //
  optional MITREATTCKSubTechnique sub_technique = 1;

  //
  // Description:
  //   The Tactic object describes the tactic ID and/or name that is associated
  //   to an attack, as defined by ATT&CK® Matrix.
  //
  // Data Type:
  //   A message field of type MITREATTCKTactic.
  //
  // Requirement:
  //   optional
  //
  optional MITREATTCKTactic tactic = 2;

  //
  // Description:
  //   The Tactic object describes the tactic ID and/or tactic name that are
  //   associated with the attack technique, as defined by ATT&CK® Matrix.
  //
  // Data Type:
  //   A message field of type MITREATTCKTactic.
  //
  // Requirement:
  //   optional
  //
  repeated MITREATTCKTactic tactics = 3;

  //
  // Description:
  //   The Technique object describes the technique ID and/or name associated to
  //   an attack, as defined by ATT&CK® Matrix.
  //
  // Data Type:
  //   A message field of type MITREATTCKTechnique.
  //
  // Requirement:
  //   optional
  //
  optional MITREATTCKTechnique technique = 4;

  //
  // Description:
  //   The ATT&CK® Matrix version.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string version = 5;
}

//
// An Authentication Factor object describes a category of methods used for
// identity verification in an authentication attempt.
//
message AuthenticationFactor {
  //
  // Description:
  //   Device used to complete an authentication request.
  //
  // Data Type:
  //   A message field of type Device.
  //
  // Requirement:
  //   recommended
  //
  optional Device device = 1;

  //
  // Description:
  //   The email address used in an email-based authentication factor.
  //
  // Data Type:
  //   Email address. For example:john_doe@example.com.
  //
  // Requirement:
  //   optional
  //
  optional string email_addr = 2;

  //
  // Description:
  //   The type of authentication factor used in an authentication attempt.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string factor_type = 3;

  //
  // Description:
  //   The normalized identifier for the authentication factor.
  //
  // Data Type:
  //   An enum field of type AuthenticationFactorFactorTypeID.
  //
  // Requirement:
  //   required
  //
  AuthenticationFactorFactorTypeID factor_type_id = 4;

  //
  // Description:
  //   Whether the authentication factor is an HMAC-based One-time Password
  //   (HOTP).
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   recommended
  //
  optional bool is_hotp = 5;

  //
  // Description:
  //   Whether the authentication factor is a Time-based One-time Password
  //   (TOTP).
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   recommended
  //
  optional bool is_totp = 6;

  //
  // Description:
  //   The phone number used for a telephony-based authentication request.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string phone_number = 7;

  //
  // Description:
  //   The name of provider for an authentication factor.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string provider = 8;

  //
  // Description:
  //   The question(s) provided to user for a question-based authentication
  //   factor.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string security_questions = 9;
}

//
// The Authorization Result object provides details about the authorization
// outcome and associated policies related to activity.
//
message AuthorizationResult {
  //
  // Description:
  //   Authorization Result/outcome, e.g. allowed, denied.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string decision = 1;

  //
  // Description:
  //   Details about the Identity/Access management policies that are
  //   applicable.
  //
  // Data Type:
  //   A message field of type Policy.
  //
  // Requirement:
  //   optional
  //
  optional Policy policy = 2;
}

//
// An autonomous system (AS) is a collection of connected Internet Protocol (IP)
// routing prefixes under the control of one or more network operators on behalf
// of a single administrative entity or domain that presents a common, clearly
// defined routing policy to the internet.
//
message AutonomousSystem {
  //
  // Description:
  //   Organization name for the Autonomous System.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 1;

  //
  // Description:
  //   Unique number that the AS is identified by.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   recommended
  //
  optional int32 number = 2;
}

//
// The Digital Certificate, also known as a Public Key Certificate, object
// contains information about the ownership and usage of a public key. It serves
// as a means to establish trust in the authenticity and integrity of the public
// key and the associated entity.
//
message DigitalCertificate {
  //
  // Description:
  //   The time when the certificate was created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 1;

  //
  // Description:
  //   The time when the certificate was created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 2;

  //
  // Description:
  //   The expiration time of the certificate.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 expiration_time = 3;

  //
  // Description:
  //   The expiration time of the certificate.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string expiration_time_dt = 4;

  //
  // Description:
  //   The fingerprint list of the certificate.
  //
  // Data Type:
  //   A message field of type Fingerprint.
  //
  // Requirement:
  //   recommended
  //
  repeated Fingerprint fingerprints = 5;

  //
  // Description:
  //   Denotes whether a digital certificate is self-signed or signed by a known
  //   certificate authority (CA).
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   recommended
  //
  optional bool is_self_signed = 6;

  //
  // Description:
  //   The certificate issuer distinguished name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string issuer = 7;

  //
  // Description:
  //   The list of subject alternative names that are secured by a specific
  //   certificate.
  //
  // Data Type:
  //   A message field of type SubjectAlternativeName.
  //
  // Requirement:
  //   optional
  //
  repeated SubjectAlternativeName sans = 8;

  //
  // Description:
  //   The serial number of the certificate used to create the digital
  //   signature.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string serial_number = 9;

  //
  // Description:
  //   The certificate subject distinguished name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string subject = 10;

  //
  // Description:
  //   The unique identifier of the certificate.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 11;

  //
  // Description:
  //   The certificate version.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string version = 12;
}

//
// The Common Vulnerabilities and Exposures (CVE) object represents publicly
// disclosed cybersecurity vulnerabilities defined in CVE Program catalog (CVE).
// There is one CVE Record for each vulnerability in the catalog.
//
message CVE {
  //
  // Description:
  //   The Record Creation Date identifies when the CVE ID was issued to a CVE
  //   Numbering Authority (CNA) or the CVE Record was published on the CVE
  //   List. Note that the Record Creation Date does not necessarily indicate
  //   when this vulnerability was discovered, shared with the affected vendor,
  //   publicly disclosed, or updated in CVE.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 1;

  //
  // Description:
  //   The Record Creation Date identifies when the CVE ID was issued to a CVE
  //   Numbering Authority (CNA) or the CVE Record was published on the CVE
  //   List. Note that the Record Creation Date does not necessarily indicate
  //   when this vulnerability was discovered, shared with the affected vendor,
  //   publicly disclosed, or updated in CVE.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 2;

  //
  // Description:
  //   The CVSS object details Common Vulnerability Scoring System (CVSS) scores
  //   from the advisory that are related to the vulnerability.
  //
  // Data Type:
  //   A message field of type CVSSScore.
  //
  // Requirement:
  //   recommended
  //
  repeated CVSSScore cvss = 3;

  //
  // Description:
  //   The CWE object represents a weakness in a software system that can be
  //   exploited by a threat actor to perform an attack. The CWE object is based
  //   on the Common Weakness Enumeration (CWE) catalog.
  //
  // Data Type:
  //   A message field of type CWE.
  //
  // Requirement:
  //   optional
  //
  optional CWE cwe = 4;

  //
  // Description:
  //   The Common Weakness Enumeration (CWE) unique identifier. For example:
  //   CWE-787.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string cwe_uid = 5;

  //
  // Description:
  //   Common Weakness Enumeration (CWE) definition URL. For example:
  //   https://cwe.mitre.org/data/definitions/787.html.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string cwe_url = 6;

  //
  // Description:
  //   A brief description of the CVE Record.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 7;

  //
  // Description:
  //   The Exploit Prediction Scoring System (EPSS) object describes the
  //   estimated probability a vulnerability will be exploited. EPSS is a
  //   community-driven effort to combine descriptive information about
  //   vulnerabilities (CVEs) with evidence of actual exploitation in-the-wild.
  //   (EPSS).
  //
  // Data Type:
  //   A message field of type EPSS.
  //
  // Requirement:
  //   optional
  //
  optional EPSS epss = 8;

  //
  // Description:
  //   The Record Modified Date identifies when the CVE record was last updated.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 9;

  //
  // Description:
  //   The Record Modified Date identifies when the CVE record was last updated.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 10;

  //
  // Description:
  //   The product where the vulnerability was discovered.
  //
  // Data Type:
  //   A message field of type Product.
  //
  // Requirement:
  //   optional
  //
  optional Product product = 11;

  //
  // Description:
  //   A list of reference URLs with additional information about the CVE
  //   Record.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  repeated string references = 12;

  //
  // Description:
  //   Describes the Common Weakness Enumeration (CWE) details related to the
  //   CVE Record.
  //
  // Data Type:
  //   A message field of type CWE.
  //
  // Requirement:
  //   optional
  //
  repeated CWE related_cwes = 13;

  //
  // Description:
  //   A title or a brief phrase summarizing the CVE record.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string title = 14;

  //
  // Description:
  //   The vulnerability type as selected from a large dropdown menu during CVE
  //   refinement.Most frequently used vulnerability types are: DoS, Code
  //   Execution, Overflow, Memory Corruption, Sql Injection, XSS, Directory
  //   Traversal, Http Response Splitting, Bypass something, Gain Information,
  //   Gain Privileges, CSRF, File Inclusion. For more information see
  //   Vulnerabilities By Type distributions.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string type = 15;

  //
  // Description:
  //   The Common Vulnerabilities and Exposures unique number assigned to a
  //   specific computer vulnerability. A CVE Identifier begins with 4 digits
  //   representing the year followed by a sequence of digits that acts as a
  //   unique identifier. For example: CVE-2021-12345.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string uid = 16;
}

//
// The Common Vulnerability Scoring System (CVSS) object provides a way to
// capture the principal characteristics of a vulnerability and produce a
// numerical score reflecting its severity.
//
message CVSSScore {
  //
  // Description:
  //   The CVSS base score. For example: 9.1.
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   required
  //
  float base_score = 1;

  //
  // Description:
  //   The CVSS depth represents a depth of the equation used to calculate CVSS
  //   score.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string depth = 2;

  //
  // Description:
  //   The Common Vulnerability Scoring System metrics. This attribute contains
  //   information on the CVE's impact. If the CVE has been analyzed, this
  //   attribute will contain any CVSSv2 or CVSSv3 information associated with
  //   the vulnerability. For example: { {"Access Vector", "Network"}, {"Access
  //   Complexity", "Low"}, ...}.
  //
  // Data Type:
  //   A message field of type Metric.
  //
  // Requirement:
  //   optional
  //
  repeated Metric metrics = 3;

  //
  // Description:
  //   The CVSS overall score, impacted by base, temporal, and environmental
  //   metrics. For example: 9.1.
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   recommended
  //
  optional float overall_score = 4;

  //
  // Description:
  //   The Common Vulnerability Scoring System (CVSS) Qualitative Severity
  //   Rating. A textual representation of the numeric score.CVSS v2.0Low (0.0 
  //   3.9)Medium (4.0  6.9)High (7.0  10.0)CVSS v3.0None (0.0)Low (0.1 -
  //   3.9)Medium (4.0 - 6.9)High (7.0 - 8.9)Critical (9.0 - 10.0)
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string severity = 5;

  //
  // Description:
  //   The source URL for the CVSS score. For example:
  //   https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string src_url = 6;

  //
  // Description:
  //   The CVSS vector string is a text representation of a set of CVSS metrics.
  //   It is commonly used to record or transfer CVSS metric information in a
  //   concise form. For example: 3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:H.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vector_string = 7;

  //
  // Description:
  //   The vendor that provided the CVSS score. For example: NVD, REDHAT etc.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string vendor_name = 8;

  //
  // Description:
  //   The CVSS version. For example: 3.1.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string version = 9;
}

//
// The CWE object represents a weakness in a software system that can be
// exploited by a threat actor to perform an attack. The CWE object is based on
// the Common Weakness Enumeration (CWE) catalog.
//
message CWE {
  //
  // Description:
  //   The caption assigned to the Common Weakness Enumeration unique
  //   identifier.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string caption = 1;

  //
  // Description:
  //   URL pointing to the CWE Specification. For more information see CWE.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string src_url = 2;

  //
  // Description:
  //   The Common Weakness Enumeration unique number assigned to a specific
  //   weakness. A CWE Identifier begins "CWE" followed by a sequence of digits
  //   that acts as a unique identifier. For example: CWE-123.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string uid = 3;
}

//
// The Device object represents an addressable computer system or host, which is
// typically connected to a computer network and participates in the
// transmission or processing of data within the computer network.
//
message Device {
  //
  // Description:
  //   A list of agent objects associated with a device, endpoint, or resource.
  //
  // Data Type:
  //   A message field of type Agent.
  //
  // Requirement:
  //   optional
  //
  repeated Agent agent_list = 1;

  //
  // Description:
  //   The unique identifier of the cloud autoscale configuration.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string autoscale_uid = 2;

  //
  // Description:
  //   The time the system was booted.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 boot_time = 3;

  //
  // Description:
  //   The time the system was booted.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string boot_time_dt = 4;

  //
  // Description:
  //   The time when the device was known to have been created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 created_time = 5;

  //
  // Description:
  //   The time when the device was known to have been created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 6;

  //
  // Description:
  //   The description of the device, ordinarily as reported by the operating
  //   system.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 7;

  //
  // Description:
  //   The network domain where the device resides. For example:
  //   work.example.com.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string domain = 8;

  //
  // Description:
  //   The initial discovery time of the device.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 first_seen_time = 9;

  //
  // Description:
  //   The initial discovery time of the device.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string first_seen_time_dt = 10;

  //
  // Description:
  //   The group names to which the device belongs. For example: ["Windows
  //   Laptops", "Engineering"].
  //
  // Data Type:
  //   A message field of type Group.
  //
  // Requirement:
  //   optional
  //
  repeated Group groups = 11;

  //
  // Description:
  //   The device hostname.
  //
  // Data Type:
  //   Unique name assigned to a device connected to a computer network. It may
  //   be a fully qualified domain name (FQDN). For
  //   example:r2-d2.example.com.,mx.example.com
  //
  // Requirement:
  //   recommended
  //
  optional string hostname = 12;

  //
  // Description:
  //   The endpoint hardware information.
  //
  // Data Type:
  //   A message field of type DeviceHardwareInfo.
  //
  // Requirement:
  //   optional
  //
  optional DeviceHardwareInfo hw_info = 13;

  //
  // Description:
  //   The name of the hypervisor running on the device. For example, Xen,
  //   VMware, Hyper-V, VirtualBox, etc.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string hypervisor = 14;

  //
  // Description:
  //   The image used as a template to run the virtual machine.
  //
  // Data Type:
  //   A message field of type Image.
  //
  // Requirement:
  //   optional
  //
  optional Image image = 15;

  //
  // Description:
  //   The International Mobile Equipment Identity that is associated with the
  //   device.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string imei = 16;

  //
  // Description:
  //   The International Mobile Equipment Identity values that are associated
  //   with the device.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string imei_list = 17;

  //
  // Description:
  //   The unique identifier of a VM instance.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string instance_uid = 18;

  //
  // Description:
  //   The name of the network interface (e.g. eth2).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string interface_name = 19;

  //
  // Description:
  //   The unique identifier of the network interface.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string interface_uid = 20;

  //
  // Description:
  //   The device IP address, in either IPv4 or IPv6 format.
  //
  // Data Type:
  //   Internet Protocol address (IP address), in either IPv4 or IPv6 format.
  //   For example:192.168.200.24,  2001:0db8:85a3:0000:0000:8a2e:0370:7334.
  //
  // Requirement:
  //   optional
  //
  optional string ip = 21;

  //
  // Description:
  //   The event occurred on a compliant device.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_compliant = 22;

  //
  // Description:
  //   The event occurred on a managed device.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_managed = 23;

  //
  // Description:
  //   The event occurred on a personal device.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_personal = 24;

  //
  // Description:
  //   The event occurred on a trusted device.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_trusted = 25;

  //
  // Description:
  //   The most recent discovery time of the device.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 last_seen_time = 26;

  //
  // Description:
  //   The most recent discovery time of the device.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string last_seen_time_dt = 27;

  //
  // Description:
  //   The geographical location of the device.
  //
  // Data Type:
  //   A message field of type GeoLocation.
  //
  // Requirement:
  //   optional
  //
  optional GeoLocation location = 28;

  //
  // Description:
  //   The Media Access Control (MAC) address of the endpoint.
  //
  // Data Type:
  //   Media Access Control (MAC) address. For example:18:36:F3:98:4F:9A.
  //
  // Requirement:
  //   optional
  //
  optional string mac = 29;

  //
  // Description:
  //   The model of the device. For example ThinkPad X1 Carbon.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string model = 30;

  //
  // Description:
  //   The time when the device was last known to have been modified.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 31;

  //
  // Description:
  //   The time when the device was last known to have been modified.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 32;

  //
  // Description:
  //   The alternate device name, ordinarily as assigned by an administrator.
  //   Note: The Name could be any other string that helps to identify the
  //   device, such as a phone number; for example 310-555-1234.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 33;

  //
  // Description:
  //   The network interfaces that are associated with the device, one for each
  //   unique MAC address/IP address/hostname/name combination.Note: The first
  //   element of the array is the network information that pertains to the
  //   event.
  //
  // Data Type:
  //   A message field of type NetworkInterface.
  //
  // Requirement:
  //   optional
  //
  repeated NetworkInterface network_interfaces = 34;

  //
  // Description:
  //   Organization and org unit related to the device.
  //
  // Data Type:
  //   A message field of type Organization.
  //
  // Requirement:
  //   optional
  //
  optional Organization org = 35;

  //
  // Description:
  //   The endpoint operating system.
  //
  // Data Type:
  //   A message field of type OperatingSystemOS.
  //
  // Requirement:
  //   optional
  //
  optional OperatingSystemOS os = 36;

  //
  // Description:
  //   The operating system assigned Machine ID. In Windows, this is the value
  //   stored at the registry path:
  //   HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\MachineGuid. In Linux,
  //   this is stored in the file: /etc/machine-id.
  //
  // Data Type:
  //   128-bit universal unique identifier. For
  //   example:123e4567-e89b-12d3-a456-42661417400.
  //
  // Requirement:
  //   optional
  //
  optional string os_machine_uuid = 37;

  //
  // Description:
  //   The identity of the service or user account that owns the endpoint or was
  //   last logged into it.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   recommended
  //
  optional User owner = 38;

  //
  // Description:
  //   The region where the virtual machine is located. For example, an AWS
  //   Region.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string region = 39;

  //
  // Description:
  //   The risk level, normalized to the caption of the risk_level_id value.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string risk_level = 40;

  //
  // Description:
  //   The normalized risk level id.
  //
  // Data Type:
  //   An enum field of type DeviceRiskLevelID.
  //
  // Requirement:
  //   optional
  //
  optional DeviceRiskLevelID risk_level_id = 41;

  //
  // Description:
  //   The risk score as reported by the event source.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 risk_score = 42;

  //
  // Description:
  //   The subnet mask.
  //
  // Data Type:
  //   The subnet represented in a CIDR notation, using the format
  //   network_address/prefix_length. The network_address can be in either IPv4
  //   or IPv6 format. The prefix length indicates the number of bits used for
  //   the network portion, and the remaining bits are available for host
  //   addresses within that subnet. For
  //   example:192.168.1.0/24,2001:0db8:85a3:0000::/64
  //
  // Requirement:
  //   optional
  //
  optional string subnet = 43;

  //
  // Description:
  //   The unique identifier of a virtual subnet.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string subnet_uid = 44;

  //
  // Description:
  //   The device type. For example: unknown, server, desktop, laptop, tablet,
  //   mobile, virtual, browser, or other.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string type = 45;

  //
  // Description:
  //   The device type ID.
  //
  // Data Type:
  //   An enum field of type DeviceTypeID.
  //
  // Requirement:
  //   required
  //
  DeviceTypeID type_id = 46;

  //
  // Description:
  //   The unique identifier of the device. For example the Windows TargetSID or
  //   AWS EC2 ARN.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 47;

  //
  // Description:
  //   An alternate unique identifier of the device if any. For example the
  //   ActiveDirectory DN.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid_alt = 48;

  //
  // Description:
  //   The vendor for the device. For example Dell or Lenovo.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string vendor_name = 49;

  //
  // Description:
  //   The Virtual LAN identifier.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vlan_uid = 50;

  //
  // Description:
  //   The unique identifier of the Virtual Private Cloud (VPC).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vpc_uid = 51;

  //
  // Description:
  //   The network zone or LAN segment.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string zone = 52;
}

//
// The Device Hardware Information object contains details and specifications of
// the physical components that make up a device. This information provides an
// overview of the hardware capabilities, configuration, and characteristics of
// the device.
//
message DeviceHardwareInfo {
  //
  // Description:
  //   The BIOS date. For example: 03/31/16.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string bios_date = 1;

  //
  // Description:
  //   The BIOS manufacturer. For example: LENOVO.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string bios_manufacturer = 2;

  //
  // Description:
  //   The BIOS version. For example: LENOVO G5ETA2WW (2.62).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string bios_ver = 3;

  //
  // Description:
  //   The chassis type describes the system enclosure or physical form factor.
  //   Such as the following examples for Windows Windows Chassis Types
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string chassis = 4;

  //
  // Description:
  //   The CPU architecture, normalized to the caption of the
  //   cpu_architecture_id value. In the case of Other, it is defined by the
  //   source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string cpu_architecture = 5;

  //
  // Description:
  //   The normalized identifier of the CPU architecture.
  //
  // Data Type:
  //   An enum field of type DeviceHardwareInfoCPUArchitectureID.
  //
  // Requirement:
  //   optional
  //
  optional DeviceHardwareInfoCPUArchitectureID cpu_architecture_id = 6;

  //
  // Description:
  //   The cpu architecture, the number of bits used for addressing in memory.
  //   For example: 32 or 64.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 cpu_bits = 7;

  //
  // Description:
  //   The number of processor cores in all installed processors. For Example:
  //   42.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 cpu_cores = 8;

  //
  // Description:
  //   The number of physical processors on a system. For example: 1.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 cpu_count = 9;

  //
  // Description:
  //   The speed of the processor in Mhz. For Example: 4200.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 cpu_speed = 10;

  //
  // Description:
  //   The processor type. For example: x86 Family 6 Model 37 Stepping 5.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string cpu_type = 11;

  //
  // Description:
  //   The desktop display affiliated with the event
  //
  // Data Type:
  //   A message field of type Display.
  //
  // Requirement:
  //   optional
  //
  optional Display desktop_display = 12;

  //
  // Description:
  //   The keyboard detailed information.
  //
  // Data Type:
  //   A message field of type KeyboardInformation.
  //
  // Requirement:
  //   optional
  //
  optional KeyboardInformation keyboard_info = 13;

  //
  // Description:
  //   The total amount of installed RAM, in Megabytes. For example: 2048.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 ram_size = 14;

  //
  // Description:
  //   The device manufacturer serial number.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string serial_number = 15;

  //
  // Description:
  //   The device manufacturer assigned universally unique hardware identifier.
  //   For example: The BIOS System UUID or the Apple IOPlatformUUID.
  //
  // Data Type:
  //   128-bit universal unique identifier. For
  //   example:123e4567-e89b-12d3-a456-42661417400.
  //
  // Requirement:
  //   optional
  //
  optional string uuid = 16;

  //
  // Description:
  //   The device manufacturer.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vendor_name = 17;
}

//
// The Digital Signature object contains information about the cryptographic
// mechanism used to verify the authenticity, integrity, and origin of the file
// or application.
//
message DigitalSignature {
  //
  // Description:
  //   The digital signature algorithm used to create the signature, normalized
  //   to the caption of 'algorithm_id'. In the case of 'Other', it is defined
  //   by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string algorithm = 1;

  //
  // Description:
  //   The identifier of the normalized digital signature algorithm.
  //
  // Data Type:
  //   An enum field of type DigitalSignatureAlgorithmID.
  //
  // Requirement:
  //   required
  //
  DigitalSignatureAlgorithmID algorithm_id = 2;

  //
  // Description:
  //   The certificate object containing information about the digital
  //   certificate.
  //
  // Data Type:
  //   A message field of type DigitalCertificate.
  //
  // Requirement:
  //   recommended
  //
  optional DigitalCertificate certificate = 3;

  //
  // Description:
  //   The time when the digital signature was created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 created_time = 4;

  //
  // Description:
  //   The time when the digital signature was created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 5;

  //
  // Description:
  //   The developer ID on the certificate that signed the file.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string developer_uid = 6;

  //
  // Description:
  //   The message digest attribute contains the fixed length message hash
  //   representation and the corresponding hashing algorithm information.
  //
  // Data Type:
  //   A message field of type Fingerprint.
  //
  // Requirement:
  //   optional
  //
  optional Fingerprint digest = 7;

  //
  // Description:
  //   The digital signature state defines the signature state, normalized to
  //   the caption of 'state_id'. In the case of 'Other', it is defined by the
  //   event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string state = 8;

  //
  // Description:
  //   The normalized identifier of the signature state.
  //
  // Data Type:
  //   An enum field of type DigitalSignatureStateID.
  //
  // Requirement:
  //   optional
  //
  optional DigitalSignatureStateID state_id = 9;
}

//
// The Display object contains information about the physical or virtual display
// connected to a computer system.
//
message Display {
  //
  // Description:
  //   The numeric color depth.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 color_depth = 1;

  //
  // Description:
  //   The numeric physical height of display.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 physical_height = 2;

  //
  // Description:
  //   The numeric physical orientation of display.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 physical_orientation = 3;

  //
  // Description:
  //   The numeric physical width of display.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 physical_width = 4;

  //
  // Description:
  //   The numeric scale factor of display.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 scale_factor = 5;
}

//
// Details about the encrytpion methodology utilized.
//
message EncryptionDetails {
  //
  // Description:
  //   The encryption algorithm used, normalized to the caption of 'algorithm_id
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string algorithm = 1;

  //
  // Description:
  //   The encryption algorithm used.
  //
  // Data Type:
  //   An enum field of type EncryptionDetailsAlgorithmID.
  //
  // Requirement:
  //   recommended
  //
  optional EncryptionDetailsAlgorithmID algorithm_id = 2;

  //
  // Description:
  //   The length of the encryption key used.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 key_length = 3;

  //
  // Description:
  //   The unique identifier of the key used for encrpytion. For example, AWS
  //   KMS Key ARN.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string key_uid = 4;

  //
  // Description:
  //   The type of the encryption used.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string type = 5;
}

//
// The Enrichment object provides inline enrichment data for specific attributes
// of interest within an event. It serves as a mechanism to enhance or
// supplement the information associated with the event by adding additional
// relevant details or context.
//
message Enrichment {
  //
  // Description:
  //   The time when the enrichment data was generated.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 1;

  //
  // Description:
  //   The time when the enrichment data was generated.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 2;

  //
  // Description:
  //   The enrichment data associated with the attribute and value. The meaning
  //   of this data depends on the type the enrichment record.
  //
  // Data Type:
  //   Embedded JSON value. A value can be a string, or a number, or true or
  //   false or null, or an object or an array. These structures can be nested.
  //   See www.json.org.
  //
  // Requirement:
  //   required
  //
  string data = 3;

  //
  // Description:
  //   A long description of the enrichment data.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 4;

  //
  // Description:
  //   The name of the attribute to which the enriched data pertains.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string name = 5;

  //
  // Description:
  //   The enrichment data provider name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string provider = 6;

  //
  // Description:
  //   The reputation of the enrichment data.
  //
  // Data Type:
  //   A message field of type Reputation.
  //
  // Requirement:
  //   optional
  //
  optional Reputation reputation = 7;

  //
  // Description:
  //   A short description of the enrichment data.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string short_desc = 8;

  //
  // Description:
  //   The URL of the source of the enrichment data.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   recommended
  //
  optional string src_url = 9;

  //
  // Description:
  //   The enrichment type. For example: location.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string type = 10;

  //
  // Description:
  //   The value of the attribute to which the enriched data pertains.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string value = 11;
}

//
// An environment variable.
//
message EnvironmentVariable {
  //
  // Description:
  //   The name of the environment variable.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string name = 1;

  //
  // Description:
  //   The value of the environment variable.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string value = 2;
}

//
// The Exploit Prediction Scoring System (EPSS) object describes the estimated
// probability a vulnerability will be exploited. EPSS is a community-driven
// effort to combine descriptive information about vulnerabilities (CVEs) with
// evidence of actual exploitation in-the-wild. (EPSS).
//
message EPSS {
  //
  // Description:
  //   The timestamp indicating when the EPSS score was calculated.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 1;

  //
  // Description:
  //   The timestamp indicating when the EPSS score was calculated.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 2;

  //
  // Description:
  //   The EPSS score's percentile representing relative importance and ranking
  //   of the score in the larger EPSS dataset.
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   optional
  //
  optional float percentile = 3;

  //
  // Description:
  //   The EPSS score representing the probability [0-1] of exploitation in the
  //   wild in the next 30 days (following score publication).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string score = 4;

  //
  // Description:
  //   The version of the EPSS model used to calculate the score.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string version = 5;
}

//
// The OCSF Schema Extension object provides detailed information about the
// schema extension used to construct the event. The schema extensions are
// registered in the extensions.md file.
//
message SchemaExtension {
  //
  // Description:
  //   The schema extension name. For example: dev.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string name = 1;

  //
  // Description:
  //   The schema extension unique identifier. For example: 999.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string uid = 2;

  //
  // Description:
  //   The schema extension version. For example: 1.0.0-alpha.2.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string version = 3;
}

//
// The Feature object provides information about the software product feature
// that generated a specific event. It encompasses details related to the
// capabilities, components, user interface (UI) design, and performance
// upgrades associated with the feature.
//
message Feature {
  //
  // Description:
  //   The name of the feature.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 1;

  //
  // Description:
  //   The unique identifier of the feature.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 2;

  //
  // Description:
  //   The version of the feature.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string version = 3;
}

//
// The File object represents the metadata associated with a file stored in a
// computer system. It encompasses information about the file itself, including
// its attributes, properties, and organizational details.
//
message File {
  //
  // Description:
  //   The time when the file was last accessed.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 accessed_time = 1;

  //
  // Description:
  //   The time when the file was last accessed.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string accessed_time_dt = 2;

  //
  // Description:
  //   The name of the user who last accessed the object.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   optional
  //
  optional User accessor = 3;

  //
  // Description:
  //   The bitmask value that represents the file attributes.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 attributes = 4;

  //
  // Description:
  //   The name of the company that published the file. For example: Microsoft
  //   Corporation.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string company_name = 5;

  //
  // Description:
  //   The file content confidentiality, normalized to the confidentiality_id
  //   value. In the case of 'Other', it is defined by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string confidentiality = 6;

  //
  // Description:
  //   The normalized identifier of the file content confidentiality indicator.
  //
  // Data Type:
  //   An enum field of type FileConfidentialityID.
  //
  // Requirement:
  //   optional
  //
  optional FileConfidentialityID confidentiality_id = 7;

  //
  // Description:
  //   The time when the file was created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 created_time = 8;

  //
  // Description:
  //   The time when the file was created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 9;

  //
  // Description:
  //   The user that created the file.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   optional
  //
  optional User creator = 10;

  //
  // Description:
  //   The description of the file, as returned by file system. For example: the
  //   description as returned by the Unix file command or the Windows file
  //   type.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 11;

  //
  // Description:
  //   The drive type, normalized to the caption of the drive_type_id value. In
  //   the case of Other, it is defined by the source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string drive_type = 12;

  //
  // Description:
  //   Identifies the type of a disk drive, i.e. fixed, removable, etc.
  //
  // Data Type:
  //   An enum field of type FileDriveTypeID.
  //
  // Requirement:
  //   optional
  //
  optional FileDriveTypeID drive_type_id = 13;

  //
  // Description:
  //   The encryption details of the file. Should be populated if the file is
  //   encrypted.
  //
  // Data Type:
  //   A message field of type EncryptionDetails.
  //
  // Requirement:
  //   optional
  //
  optional EncryptionDetails encryption_details = 14;

  //
  // Description:
  //   The extension of the file, excluding the leading dot. For example: exe
  //   from svchost.exe, or gz from export.tar.gz.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string ext = 15;

  //
  // Description:
  //   An array of hash attributes.
  //
  // Data Type:
  //   A message field of type Fingerprint.
  //
  // Requirement:
  //   recommended
  //
  repeated Fingerprint hashes = 16;

  //
  // Description:
  //   The name of the file as identified within the file itself. This contrasts
  //   with the name by which the file is known on disk. Where available, the
  //   internal name is widely used by security practitioners and detection
  //   content because the on-disk file name is not reliable. On the Windows OS,
  //   most PE files contain a VERSIONINFO resource from which the internal name
  //   can be obtained. On macOS, binaries can optionally embed a copy of the
  //   application's Info.plist file which in turn contains the name of the
  //   executable.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string internal_name = 17;

  //
  // Description:
  //   Indicates if the file was deleted from the filesystem.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_deleted = 18;

  //
  // Description:
  //   Indicates if the file is encrypted.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_encrypted = 19;

  //
  // Description:
  //   Indicates if the file is publicly accessible. For example in an object's
  //   public access in AWS S3
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_public = 20;

  //
  // Description:
  //   The indication of whether the object is part of the operating system.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_system = 21;

  //
  // Description:
  //   The Multipurpose Internet Mail Extensions (MIME) type of the file, if
  //   applicable.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string mime_type = 22;

  //
  // Description:
  //   The time when the file was last modified.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 23;

  //
  // Description:
  //   The time when the file was last modified.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 24;

  //
  // Description:
  //   The user that last modified the file.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   optional
  //
  optional User modifier = 25;

  //
  // Description:
  //   The name of the file. For example: svchost.exe
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string name = 26;

  //
  // Description:
  //   The user that owns the file/object.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   optional
  //
  optional User owner = 27;

  //
  // Description:
  //   The parent folder in which the file resides. For example:
  //   c:\windows\system32
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string parent_folder = 28;

  //
  // Description:
  //   The full path to the file. For example: c:\windows\system32\svchost.exe.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string path = 29;

  //
  // Description:
  //   The product that created or installed the file.
  //
  // Data Type:
  //   A message field of type Product.
  //
  // Requirement:
  //   optional
  //
  optional Product product = 30;

  //
  // Description:
  //   The object security descriptor.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string security_descriptor = 31;

  //
  // Description:
  //   The digital signature of the file.
  //
  // Data Type:
  //   A message field of type DigitalSignature.
  //
  // Requirement:
  //   optional
  //
  optional DigitalSignature signature = 32;

  //
  // Description:
  //   The size of data, in bytes.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 size = 33;

  //
  // Description:
  //   The storage class of the file. For example in AWS S3: STANDARD,
  //   STANDARD_IA, GLACIER.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string storage_class = 34;

  //
  // Description:
  //   The list of tags; {key:value} pairs associated to the file.
  //
  // Data Type:
  //   A message field of type KeyValueobject.
  //
  // Requirement:
  //   optional
  //
  repeated KeyValueobject tags = 35;

  //
  // Description:
  //   The file type.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 36;

  //
  // Description:
  //   The file type ID.
  //
  // Data Type:
  //   An enum field of type FileTypeID.
  //
  // Requirement:
  //   required
  //
  FileTypeID type_id = 37;

  //
  // Description:
  //   The unique identifier of the file as defined by the storage system, such
  //   the file system file ID.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 38;

  //
  // Description:
  //   The URL of the file, when applicable.
  //
  // Data Type:
  //   A message field of type UniformResourceLocator.
  //
  // Requirement:
  //   optional
  //
  optional UniformResourceLocator url = 39;

  //
  // Description:
  //   The file version. For example: 8.0.7601.17514.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string version = 40;

  //
  // Description:
  //   An unordered collection of zero or more name/value pairs where each pair
  //   represents a file or folder extended attribute.For example: Windows
  //   alternate data stream attributes (ADS stream name, ADS size, etc.), user-
  //   defined or application-defined attributes, ACL, owner, primary group,
  //   etc. Examples from DCS: ads_nameads_sizedaclownerprimary_grouplink_name -
  //   name of the link associated to the file.hard_link_count - the number of
  //   links that are associated to the file.
  //
  // Data Type:
  //   A message field of type Object.
  //
  // Requirement:
  //   optional
  //
  optional Object xattributes = 41;
}

//
// The Fingerprint object provides detailed information about a digital
// fingerprint, which is a compact representation of data used to identify a
// longer piece of information, such as a public key or file content. It
// contains the algorithm and value of the fingerprint, enabling efficient and
// reliable identification of the associated data.
//
message Fingerprint {
  //
  // Description:
  //   The hash algorithm used to create the digital fingerprint, normalized to
  //   the caption of algorithm_id. In the case of Other, it is defined by the
  //   event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string algorithm = 1;

  //
  // Description:
  //   The identifier of the normalized hash algorithm, which was used to create
  //   the digital fingerprint.
  //
  // Data Type:
  //   An enum field of type FingerprintAlgorithmID.
  //
  // Requirement:
  //   required
  //
  FingerprintAlgorithmID algorithm_id = 2;

  //
  // Description:
  //   The digital fingerprint value.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string value = 3;
}

//
// The Firewall Rule object represents a specific rule within a firewall policy
// or event. It contains information about a rule's configuration, properties,
// and associated actions that define how network traffic is handled by the
// firewall.
//
message FirewallRule {
  //
  // Description:
  //   The rule category.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string category = 1;

  //
  // Description:
  //   The rule trigger condition for the rule. For example: SQL_INJECTION.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string condition = 2;

  //
  // Description:
  //   The description of the rule that generated the event.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 3;

  //
  // Description:
  //   The rule response time duration, usually used for challenge completion
  //   time.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 duration = 4;

  //
  // Description:
  //   The data in a request that rule matched. For example: '["10","and","1"]'.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string match_details = 5;

  //
  // Description:
  //   The location of the matched data in the source which resulted in the
  //   triggered firewall rule. For example: HEADER.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string match_location = 6;

  //
  // Description:
  //   The name of the rule that generated the event.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 7;

  //
  // Description:
  //   The rate limit for a rate-based rule.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 rate_limit = 8;

  //
  // Description:
  //   The sensitivity of the firewall rule in the matched event. For example:
  //   HIGH.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string sensitivity = 9;

  //
  // Description:
  //   The rule type.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 10;

  //
  // Description:
  //   The unique identifier of the rule that generated the event.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 11;

  //
  // Description:
  //   The rule version. For example: 1.1.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string version = 12;
}

//
// The Group object represents a collection or association of entities, such as
// users, policies, or devices. It serves as a logical grouping mechanism to
// organize and manage entities with similar characteristics or permissions
// within a system or organization, including but not limited to purposes of
// access control.
//
message Group {
  //
  // Description:
  //   The group description.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 1;

  //
  // Description:
  //   The domain where the group is defined. For example: the LDAP or Active
  //   Directory domain.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string domain = 2;

  //
  // Description:
  //   The group name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 3;

  //
  // Description:
  //   The group privileges.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string privileges = 4;

  //
  // Description:
  //   The type of the group or account.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 5;

  //
  // Description:
  //   The unique identifier of the group. For example, for Windows events this
  //   is the security identifier (SID) of the group.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 6;
}

//
// The Identity Provider object contains detailed information about a provider
// responsible for creating, maintaining, and managing identity information
// while offering authentication services to applications. An Identity Provider
// (IdP) serves as a trusted authority that verifies the identity of users and
// issues authentication tokens or assertions to enable secure access to
// applications or services.
//
message IdentityProvider {
  //
  // Description:
  //   The Authentication Factors object describes the different types of Multi-
  //   Factor Authentication (MFA) methods and/or devices supported by the
  //   Identity Provider.
  //
  // Data Type:
  //   A message field of type AuthenticationFactor.
  //
  // Requirement:
  //   optional
  //
  repeated AuthenticationFactor auth_factors = 1;

  //
  // Description:
  //   The primary domain associated with the Identity Provider.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string domain = 2;

  //
  // Description:
  //   The fingerprint of the X.509 certificate used by the Identity Provider.
  //
  // Data Type:
  //   A message field of type Fingerprint.
  //
  // Requirement:
  //   optional
  //
  optional Fingerprint fingerprint = 3;

  //
  // Description:
  //   The Identity Provider enforces Multi Factor Authentication (MFA).
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool has_mfa = 4;

  //
  // Description:
  //   The unique identifier (often a URL) used by the Identity Provider as its
  //   issuer.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string issuer = 5;

  //
  // Description:
  //   The name of the Identity Provider.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 6;

  //
  // Description:
  //   The supported protocol of the Identity Provider. E.g., SAML, OIDC, or
  //   OAuth2.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string protocol_name = 7;

  //
  // Description:
  //   The System for Cross-domain Identity Management (SCIM) resource object
  //   provides a structured set of attributes related to SCIM protocols used
  //   for identity provisioning and management across cloud-based platforms. It
  //   standardizes user and group provisioning details, enabling identity
  //   synchronization and lifecycle management with compatible Identity
  //   Providers (IdPs) and applications. SCIM is defined in RFC-7634
  //
  // Data Type:
  //   A message field of type SCIM.
  //
  // Requirement:
  //   optional
  //
  optional SCIM scim = 8;

  //
  // Description:
  //   The Single Sign-On (SSO) object provides a structure for normalizing SSO
  //   attributes, configuration, and/or settings from Identity Providers.
  //
  // Data Type:
  //   A message field of type SSO.
  //
  // Requirement:
  //   optional
  //
  optional SSO sso = 9;

  //
  // Description:
  //   The configuration state of the Identity Provider, normalized to the
  //   caption of the state_id value. In the case of Other, it is defined by the
  //   event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string state = 10;

  //
  // Description:
  //   The normalized state ID of the Identity Provider to reflect its
  //   configuration or activation status.
  //
  // Data Type:
  //   An enum field of type IdentityProviderStateID.
  //
  // Requirement:
  //   optional
  //
  optional IdentityProviderStateID state_id = 11;

  //
  // Description:
  //   The tenant ID associated with the Identity Provider.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string tenant_uid = 12;

  //
  // Description:
  //   The unique identifier of the Identity Provider.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 13;

  //
  // Description:
  //   The URL for accessing the configuration or metadata of the Identity
  //   Provider.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string url_string = 14;
}

//
