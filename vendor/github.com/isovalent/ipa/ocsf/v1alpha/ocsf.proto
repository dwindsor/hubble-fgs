  //   optional
  //
  optional string src_url = 2;

  //
  // Description:
  //   The unique identifier of the attack technique, as defined by ATT&CK®
  //   Matrix. For example: T1595.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 3;
