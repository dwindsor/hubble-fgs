//
// The Transport Layer Security (TLS) object describes the negotiated TLS
// protocol used for secure communications over an establish network connection.
//
message TransportLayerSecurityTLS {
  //
  // Description:
  //   The integer value of TLS alert if present. The alerts are defined in the
  //   TLS specification in RFC-2246.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 alert = 1;

  //
  // Description:
  //   The certificate object containing information about the digital
  //   certificate.
  //
  // Data Type:
  //   A message field of type DigitalCertificate.
  //
  // Requirement:
  //   recommended
  //
  optional DigitalCertificate certificate = 2;

  //
  // Description:
  //   The Chain of Certificate Serial Numbers field provides a chain of
  //   Certificate Issuer Serial Numbers leading to the Root Certificate Issuer.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  repeated string certificate_chain = 3;

  //
  // Description:
  //   The negotiated cipher suite.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string cipher = 4;

  //
  // Description:
  //   The client cipher suites that were exchanged during the TLS handshake
  //   negotiation.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  repeated string client_ciphers = 5;

  //
  // Description:
  //   The list of TLS extensions.
  //
  // Data Type:
  //   A message field of type TLSExtension.
  //
  // Requirement:
  //   optional
  //
  repeated TLSExtension extension_list = 6;

  //
  // Description:
  //   The amount of total time for the TLS handshake to complete after the TCP
  //   connection is established, including client-side delays, in milliseconds.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 handshake_dur = 7;

  //
  // Description:
  //   The MD5 hash of a JA3 string.
  //
  // Data Type:
  //   A message field of type Fingerprint.
  //
  // Requirement:
  //   recommended
  //
  optional Fingerprint ja3_hash = 8;

  //
  // Description:
  //   The MD5 hash of a JA3S string.
  //
  // Data Type:
  //   A message field of type Fingerprint.
  //
  // Requirement:
  //   recommended
  //
  optional Fingerprint ja3s_hash = 9;

  //
  // Description:
  //   The length of the encryption key.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 key_length = 10;

  //
  // Description:
  //   The list of subject alternative names that are secured by a specific
  //   certificate.
  //
  // Data Type:
  //   A message field of type SubjectAlternativeName.
  //
  // Requirement:
  //   optional
  //
  repeated SubjectAlternativeName sans = 11;

  //
  // Description:
  //   The server cipher suites that were exchanged during the TLS handshake
  //   negotiation.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string server_ciphers = 12;

  //
  // Description:
  //    The Server Name Indication (SNI) extension sent by the client.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string sni = 13;

  //
  // Description:
  //   The list of TLS extensions.
  //
  // Data Type:
  //   A message field of type TLSExtension.
  //
  // Requirement:
  //   optional
  //
  repeated TLSExtension tls_extension_list = 14;

  //
  // Description:
  //   The TLS protocol version.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string version = 15;
}

//
// The TLS Extension object describes additional attributes that extend the base
// Transport Layer Security (TLS) object.
//
message TLSExtension {
  //
  // Description:
  //   The data contains information specific to the particular extension type.
  //
  // Data Type:
  //   Embedded JSON value. A value can be a string, or a number, or true or
  //   false or null, or an object or an array. These structures can be nested.
  //   See www.json.org.
  //
  // Requirement:
  //   recommended
  //
  optional string data = 1;

  //
  // Description:
  //   The TLS extension type. For example: Server Name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 2;

  //
  // Description:
  //   The TLS extension type identifier. See The Transport Layer Security (TLS)
  //   extension page.
  //
  // Data Type:
  //   An enum field of type TLSExtensionTypeID.
  //
  // Requirement:
  //   required
  //
  TLSExtensionTypeID type_id = 3;
}

//
// The Uniform Resource Locator (URL) object describes the characteristics of a
// URL.
//
message UniformResourceLocator {
  //
  // Description:
  //   The Website categorization names, as defined by category_ids enum values.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string categories = 1;

  //
  // Description:
  //   The Website categorization identifiers.
  //
  // Data Type:
  //   An enum field of type UniformResourceLocatorWebsiteCategorizationIDs.
  //
  // Requirement:
  //   recommended
  //
  repeated UniformResourceLocatorWebsiteCategorizationIDs category_ids = 2;

  //
  // Description:
  //   The domain portion of the URL. For example: example.com in
  //   https://sub.example.com.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string domain = 3;

  //
  // Description:
  //   The URL host as extracted from the URL. For example: www.example.com from
  //   www.example.com/download/trouble.
  //
  // Data Type:
  //   Unique name assigned to a device connected to a computer network. It may
  //   be a fully qualified domain name (FQDN). For
  //   example:r2-d2.example.com.,mx.example.com
  //
  // Requirement:
  //   recommended
  //
  optional string hostname = 4;

  //
  // Description:
  //   The URL path as extracted from the URL. For example: /download/trouble
  //   from www.example.com/download/trouble.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string path = 5;

  //
  // Description:
  //   The URL port. For example: 80.
  //
  // Data Type:
  //   The TCP/UDP port number. For example:80,22.
  //
  // Requirement:
  //   recommended
  //
  optional int32 port = 6;

  //
  // Description:
  //   The query portion of the URL. For example: the query portion of the URL
  //   http://www.example.com/search?q=bad&sort=date is q=bad&sort=date.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string query_string = 7;

  //
  // Description:
  //   The context in which a resource was retrieved in a web request.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string resource_type = 8;

  //
  // Description:
  //   The scheme portion of the URL. For example: http, https, ftp, or sftp.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string scheme = 9;

  //
  // Description:
  //   The subdomain portion of the URL. For example: sub in
  //   https://sub.example.com or sub2.sub1 in https://sub2.sub1.example.com.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string subdomain = 10;

  //
  // Description:
  //   The URL string. See RFC 1738. For example:
  //   http://www.example.com/download/trouble.exe. Note: The URL path should
  //   not populate the URL string.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   recommended
  //
  optional string url_string = 11;
}

//
// The User object describes the characteristics of a user/person or a security
// principal.
//
message User {
  //
  // Description:
  //   The user's account or the account associated with the user.
  //
  // Data Type:
  //   A message field of type Account.
  //
  // Requirement:
  //   optional
  //
  optional Account account = 1;

  //
  // Description:
  //   The unique identifier of the user's credential. For example, AWS Access
  //   Key ID.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string credential_uid = 2;

  //
  // Description:
  //   The domain where the user is defined. For example: the LDAP or Active
  //   Directory domain.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string domain = 3;

  //
  // Description:
  //   The user's primary email address.
  //
  // Data Type:
  //   Email address. For example:john_doe@example.com.
  //
  // Requirement:
  //   optional
  //
  optional string email_addr = 4;

  //
  // Description:
  //   The user's forwarding email address.
  //
  // Data Type:
  //   Email address. For example:john_doe@example.com.
  //
  // Requirement:
  //   optional
  //
  optional string forward_addr = 5;

  //
  // Description:
  //   The full name of the person, as per the LDAP Common Name attribute (cn).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string full_name = 6;

  //
  // Description:
  //   The administrative groups to which the user belongs.
  //
  // Data Type:
  //   A message field of type Group.
  //
  // Requirement:
  //   optional
  //
  repeated Group groups = 7;

  //
  // Description:
  //   The user has a multi-factor or secondary-factor device assigned.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   recommended
  //
  optional bool has_mfa = 8;

  //
  // Description:
  //   The additional LDAP attributes that describe a person.
  //
  // Data Type:
  //   A message field of type LDAPPerson.
  //
  // Requirement:
  //   optional
  //
  optional LDAPPerson ldap_person = 9;

  //
  // Description:
  //   The username. For example, janedoe1.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 10;

  //
  // Description:
  //   Organization and org unit related to the user.
  //
  // Data Type:
  //   A message field of type Organization.
  //
  // Requirement:
  //   optional
  //
  optional Organization org = 11;

  //
  // Description:
  //   The telephone number of the user.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string phone_number = 12;

  //
  // Description:
  //   The risk level, normalized to the caption of the risk_level_id value.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string risk_level = 13;

  //
  // Description:
  //   The normalized risk level id.
  //
  // Data Type:
  //   An enum field of type UserRiskLevelID.
  //
  // Requirement:
  //   optional
  //
  optional UserRiskLevelID risk_level_id = 14;

  //
  // Description:
  //   The risk score as reported by the event source.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 risk_score = 15;

  //
  // Description:
  //   The type of the user. For example, System, AWS IAM User, etc.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 16;

  //
  // Description:
  //   The account type identifier.
  //
  // Data Type:
  //   An enum field of type UserTypeID.
  //
  // Requirement:
  //   recommended
  //
  optional UserTypeID type_id = 17;

  //
  // Description:
  //   The unique user identifier. For example, the Windows user SID,
  //   ActiveDirectory DN or AWS user ARN.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 18;

  //
  // Description:
  //   The alternate user identifier. For example, the Active Directory user
  //   GUID or AWS user Principal ID.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid_alt = 19;
}

