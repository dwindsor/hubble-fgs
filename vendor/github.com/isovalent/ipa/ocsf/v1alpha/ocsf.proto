//
// The Network Traffic object describes characteristics of network traffic.
// Network traffic refers to data moving across a network at a given point of
// time.
//
message NetworkTraffic {
  //
  // Description:
  //   The total number of bytes (in and out).
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   recommended
  //
  optional int64 bytes = 1;

  //
  // Description:
  //   The number of bytes sent from the destination to the source.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 bytes_in = 2;

  //
  // Description:
  //   Indicates the number of bytes missed, which is representative of packet
  //   loss.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 bytes_missed = 3;

  //
  // Description:
  //   The number of bytes sent from the source to the destination.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 bytes_out = 4;

  //
  // Description:
  //   The total number of chunks (in and out).
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 chunks = 5;

  //
  // Description:
  //   The number of chunks sent from the destination to the source.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 chunks_in = 6;

  //
  // Description:
  //   The number of chunks sent from the source to the destination.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 chunks_out = 7;

  //
  // Description:
  //   The total number of packets (in and out).
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   recommended
  //
  optional int64 packets = 8;

  //
  // Description:
  //   The number of packets sent from the destination to the source.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 packets_in = 9;

  //
  // Description:
  //   The number of packets sent from the source to the destination.
  //
  // Data Type:
  //   8-byte long, signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int64 packets_out = 10;
}

//
// An unordered collection of attributes. It defines a set of attributes
// available in all objects. It can be also used as a generic object to log
// objects that are not otherwise defined by the schema.
//
message Object {}

//
// The observable object is a pivot element that contains related information
// found in many places in the event.
//
message Observable {
  //
  // Description:
  //   The full name of the observable attribute. The name is a
  //   pointer/reference to an attribute within the OCSF event data. For
  //   example: file.name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 1;

  //
  // Description:
  //   Contains the original and normalized reputation scores.
  //
  // Data Type:
  //   A message field of type Reputation.
  //
  // Requirement:
  //   optional
  //
  optional Reputation reputation = 2;

  //
  // Description:
  //   The observable value type name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 3;

  //
  // Description:
  //   The observable value type identifier.
  //
  // Data Type:
  //   An enum field of type ObservableTypeID.
  //
  // Requirement:
  //   required
  //
  ObservableTypeID type_id = 4;

  //
  // Description:
  //   The value associated with the observable attribute. The meaning of the
  //   value depends on the observable type.If the name refers to a scalar
  //   attribute, then the value is the value of the attribute.If the name
  //   refers to an object attribute, then the value is not populated.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string value = 5;
}

//
// The Organization object describes characteristics of an organization or
// company and its division if any. Additionally, it also describes cloud and
// Software-as-a-Service (SaaS) logical hierarchies such as AWS Organizations,
// Google Cloud Organizations, Oracle Cloud Tenancies, and similar constructs.
//
message Organization {
  //
  // Description:
  //   The name of the organization, Oracle Cloud Tenancy, Google Cloud
  //   Organization, or AWS Organization. For example,  Widget, Inc.  or the
  //   AWS Organization name .
