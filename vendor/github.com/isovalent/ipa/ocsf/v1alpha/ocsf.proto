//
//                              ENUM DECLARATIONS
//

//
// The normalized account type identifier.
//
enum AccountTypeID {
  ACCOUNT_TYPE_ID_UNKNOWN = 0;
  ACCOUNT_TYPE_ID_LDAP_ACCOUNT = 1;
  ACCOUNT_TYPE_ID_WINDOWS_ACCOUNT = 2;
