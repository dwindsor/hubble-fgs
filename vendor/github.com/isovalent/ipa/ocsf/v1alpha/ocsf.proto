  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string labels = 1;

  //
  // Description:
  //   The image name. For example: elixir.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 2;

  //
  // Description:
  //   The full path to the image file.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
