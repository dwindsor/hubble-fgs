  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 1;

  //
  // Description:
  //   The name of an organizational unit, Google Cloud Folder, or AWS Org Unit.
  //   For example, the  GCP Project Name , or  Dev_Prod_OU .
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string ou_name = 2;

  //
  // Description:
  //   The unique identifier of an organizational unit, Google Cloud Folder, or
  //   AWS Org Unit. For example, an   Oracle Cloud Tenancy ID ,  AWS OU ID , or
  //   GCP Folder ID .
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string ou_uid = 3;

  //
  // Description:
  //   The unique identifier of the organization, Oracle Cloud Tenancy, Google
  //   Cloud Organization, or AWS Organization. For example, an  AWS Org ID  or
  //   Oracle Cloud Domain ID .
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 4;
}

//
// The Operating System (OS) object describes characteristics of an OS, such as
// Linux or Windows.
//
message OperatingSystemOS {
  //
  // Description:
  //   The operating system build number.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string build = 1;

  //
  // Description:
  //   The operating system country code, as defined by the ISO 3166-1 standard
  //   (Alpha-2 code).Note: The two letter country code should be capitalized.
  //   For example: US or CA.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string country = 2;

  //
  // Description:
  //   The Common Platform Enumeration (CPE) name as described by (NIST) For
  //   example: cpe:/a:apple:safari:16.2.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string cpe_name = 3;

  //
  // Description:
  //   The cpu architecture, the number of bits used for addressing in memory.
  //   For example: 32 or 64.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 cpu_bits = 4;

  //
  // Description:
  //   The operating system edition. For example: Professional.
