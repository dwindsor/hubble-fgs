//
// The Network Interface object describes the type and associated attributes of
// a network interface.
//
message NetworkInterface {
  //
  // Description:
  //   The hostname associated with the network interface.
  //
  // Data Type:
  //   Unique name assigned to a device connected to a computer network. It may
  //   be a fully qualified domain name (FQDN). For
  //   example:r2-d2.example.com.,mx.example.com
  //
  // Requirement:
  //   recommended
  //
  optional string hostname = 1;

  //
  // Description:
  //   The IP address associated with the network interface.
  //
  // Data Type:
  //   Internet Protocol address (IP address), in either IPv4 or IPv6 format.
  //   For example:192.168.200.24,  2001:0db8:85a3:0000:0000:8a2e:0370:7334.
  //
  // Requirement:
  //   recommended
  //
  optional string ip = 2;

  //
  // Description:
  //   The MAC address of the network interface.
  //
  // Data Type:
  //   Media Access Control (MAC) address. For example:18:36:F3:98:4F:9A.
  //
  // Requirement:
  //   recommended
  //
  optional string mac = 3;

  //
  // Description:
  //   The name of the network interface.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 4;

  //
  // Description:
  //   The namespace is useful in merger or acquisition situations. For example,
  //   when similar entities exist that you need to keep separate.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string namespace = 5;

  //
  // Description:
  //   The subnet prefix length determines the number of bits used to represent
  //   the network part of the IP address. The remaining bits are reserved for
  //   identifying individual hosts within that subnet.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 subnet_prefix = 6;

  //
  // Description:
  //   The type of network interface.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 7;

  //
  // Description:
  //   The network interface type identifier.
  //
  // Data Type:
  //   An enum field of type NetworkInterfaceTypeID.
  //
  // Requirement:
  //   required
  //
  NetworkInterfaceTypeID type_id = 8;

  //
  // Description:
  //   The unique identifier for the network interface.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 9;
}

