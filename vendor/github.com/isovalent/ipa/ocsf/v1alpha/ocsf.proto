//
// The additional LDAP attributes that describe a person.
//
message LDAPPerson {
  //
  // Description:
  //   The cost center associated with the user.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string cost_center = 1;

  //
  // Description:
  //   The timestamp when the user was created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 created_time = 2;

  //
  // Description:
  //   The timestamp when the user was created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 3;

  //
  // Description:
  //   The timestamp when the user was deleted. In Active Directory (AD), when a
  //   user is deleted they are moved to a temporary container and then removed
  //   after 30 days. So, this field can be populated even after a user is
  //   deleted for the next 30 days.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 deleted_time = 4;

  //
  // Description:
  //   The timestamp when the user was deleted. In Active Directory (AD), when a
  //   user is deleted they are moved to a temporary container and then removed
  //   after 30 days. So, this field can be populated even after a user is
  //   deleted for the next 30 days.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string deleted_time_dt = 5;

  //
  // Description:
  //   A list of additional email addresses for the user.
  //
  // Data Type:
  //   Email address. For example:john_doe@example.com.
  //
  // Requirement:
  //   optional
  //
  repeated string email_addrs = 6;

  //
  // Description:
  //   The employee identifier assigned to the user by the organization.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string employee_uid = 7;

  //
  // Description:
  //   The given or first name of the user.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string given_name = 8;

  //
  // Description:
  //   The timestamp when the user was or will be hired by the organization.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 hire_time = 9;

  //
  // Description:
  //   The timestamp when the user was or will be hired by the organization.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string hire_time_dt = 10;

  //
  // Description:
  //   The user's job title.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string job_title = 11;

  //
  // Description:
  //   The labels associated with the user. For example in AD this could be the
  //   userType, employeeType. For example: Member, Employee.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string labels = 12;

  //
  // Description:
  //   The last time when the user logged in.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 last_login_time = 13;

  //
  // Description:
  //   The last time when the user logged in.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string last_login_time_dt = 14;

  //
  // Description:
  //   The LDAP and X.500 commonName attribute, typically the full name of the
  //   person. For example, John Doe.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string ldap_cn = 15;

  //
  // Description:
  //   The X.500 Distinguished Name (DN) is a structured string that uniquely
  //   identifies an entry, such as a user, in an X.500 directory service For
  //   example, cn=John Doe,ou=People,dc=example,dc=com.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string ldap_dn = 16;

  //
  // Description:
  //   The timestamp when the user left or will be leaving the organization.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 leave_time = 17;

  //
  // Description:
  //   The timestamp when the user left or will be leaving the organization.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string leave_time_dt = 18;

  //
  // Description:
  //   The geographical location associated with a user. This is typically the
  //   user's usual work location.
  //
  // Data Type:
  //   A message field of type GeoLocation.
  //
  // Requirement:
  //   optional
  //
  optional GeoLocation location = 19;

  //
  // Description:
  //   The user's manager. This helps in understanding an org hierarchy. This
  //   should only ever be populated once in an event. I.e. there should not be
  //   a manager's manager in an event.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   optional
  //
  optional User manager = 20;

  //
  // Description:
  //   The timestamp when the user entry was last modified.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 21;

  //
  // Description:
  //   The timestamp when the user entry was last modified.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 22;

  //
  // Description:
  //   The primary office location associated with the user. This could be any
  //   string and isn't a specific address. For example, South East Virtual.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string office_location = 23;

  //
  // Description:
  //   The telephone number of the user. Corresponds to the LDAP Telephone-
  //   Number CN.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string phone_number = 24;

  //
  // Description:
  //   The last or family name for the user.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string surname = 25;

  //
  // Description:
  //   The list of tags; {key:value} pairs associated to the user.
  //
  // Data Type:
  //   A message field of type KeyValueobject.
  //
  // Requirement:
  //   optional
  //
  repeated KeyValueobject tags = 26;
}

//
// The Geo Location object describes a geographical location, usually associated
// with an IP address.
//
message GeoLocation {
  //
  // Description:
  //   Expressed as either height above takeoff location or height above ground
  //   level (AGL) for a UAS current location. This value is provided in meters
  //   and must have a minimum resolution of 1 m. Special Values: Invalid, No
  //   Value, or Unknown: -1000 m.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string aerial_height = 1;

  //
  // Description:
  //   The name of the city.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string city = 2;

  //
  // Description:
  //   The name of the continent.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string continent = 3;

  //
  // Description:
  //   A two-element array, containing a longitude/latitude pair. The format
  //   conforms with GeoJSON. For example: [-73.983, 40.719].
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   optional
  //
  repeated float coordinates = 4;

  //
  // Description:
  //   The ISO 3166-1 Alpha-2 country code.Note: The two letter country code
  //   should be capitalized. For example: US or CA.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string country = 5;

  //
  // Description:
  //   The description of the geographical location.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 6;

  //
  // Description:
  //   The aircraft distance above or below the ellipsoid as measured along a
  //   line that passes through the aircraft and is normal to the surface of the
  //   WGS-84 ellipsoid. This value is provided in meters and must have a
  //   minimum resolution of 1 m. Special Values: Invalid, No Value, or Unknown:
  //   -1000 m.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string geodetic_altitude = 7;

  //
  // Description:
  //   Provides quality/containment on geodetic altitude. This is based on ADS-B
  //   Geodetic Vertical Accuracy (GVA). Measured in meters.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string geodetic_vertical_accuracy = 8;

  //
  // Description:
  //   Geohash of the geo-coordinates (latitude and longitude).Geohashing is a
  //   geocoding system used to encode geographic coordinates in decimal
  //   degrees, to a single string.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string geohash = 9;

  //
  // Description:
  //   Provides quality/containment on horizontal position. This is based on
  //   ADS-B NACp. Measured in meters.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string horizontal_accuracy = 10;

  //
  // Description:
  //   The indication of whether the location is on premises.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_on_premises = 11;

  //
  // Description:
  //   The name of the Internet Service Provider (ISP).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string isp = 12;

  //
  // Description:
  //   The geographical Latitude coordinate represented in Decimal Degrees (DD).
  //   For example: 42.361145.
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   optional
  //
  optional float lat = 13;

  //
  // Description:
  //   The geographical Longitude coordinate represented in Decimal Degrees
  //   (DD). For example: -71.057083.
  //
  // Data Type:
  //   Real floating-point value. For example:3.14.
  //
  // Requirement:
  //   optional
  //
  optional float long = 14;

  //
  // Description:
  //   The postal code of the location.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string postal_code = 15;

  //
  // Description:
  //   The uncorrected barometric pressure altitude (based on reference standard
  //   29.92 inHg, 1013.25 mb) provides a reference for algorithms that utilize
  //   'altitude deltas' between aircraft. This value is provided in meters and
  //   must have a minimum resolution of 1 m.. Special Values: Invalid, No
  //   Value, or Unknown: -1000 m.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string pressure_altitude = 16;

  //
  // Description:
  //   The provider of the geographical location data.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string provider = 17;

  //
  // Description:
  //   The alphanumeric code that identifies the principal subdivision (e.g.
  //   province or state) of the country. For example, 'CH-VD' for the Canton of
  //   Vaud, Switzerland
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string region = 18;
}

//
// The Logger object represents the device and product where events are stored
// with times for receipt and transmission.  This may be at the source device
// where the event occurred, a remote scanning device, intermediate hops, or the
// ultimate destination.
//
message Logger {
  //
  // Description:
  //   The device where the events are logged.
  //
  // Data Type:
  //   A message field of type Device.
  //
  // Requirement:
  //   recommended
  //
  optional Device device = 1;

  //
  // Description:
  //   The unique identifier of the event assigned by the logger.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string event_uid = 2;

  //
  // Description:
  //   The audit level at which an event was generated.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string log_level = 3;

  //
  // Description:
  //   The event log name. For example, syslog file name or Windows logging
  //   subsystem: Security.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string log_name = 4;

  //
  // Description:
  //   The logging provider or logging service that logged the event. For
  //   example, Microsoft-Windows-Security-Auditing.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string log_provider = 5;

  //
  // Description:
  //   The event log schema version that specifies the format of the original
  //   event. For example syslog version or Cisco Log Schema Version.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string log_version = 6;

  //
  // Description:
  //   The time when the logging system collected and logged the event.This
  //   attribute is distinct from the event time in that event time typically
  //   contain the time extracted from the original event. Most of the time,
  //   these two times will be different.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 logged_time = 7;

  //
  // Description:
  //   The time when the logging system collected and logged the event.This
  //   attribute is distinct from the event time in that event time typically
  //   contain the time extracted from the original event. Most of the time,
  //   these two times will be different.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string logged_time_dt = 8;

  //
  // Description:
  //   The name of the logging product instance.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 9;

  //
  // Description:
  //   The product logging the event.  This may be the event source product, a
  //   management server product, a scanning product, a SIEM, etc.
  //
  // Data Type:
  //   A message field of type Product.
  //
  // Requirement:
  //   recommended
  //
  optional Product product = 10;

  //
  // Description:
  //   The time when the event was transmitted from the logging device to it's
  //   next destination.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 transmit_time = 11;

  //
  // Description:
  //   The time when the event was transmitted from the logging device to it's
  //   next destination.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string transmit_time_dt = 12;

  //
  // Description:
  //   The unique identifier of the logging product instance.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 13;

  //
  // Description:
  //   The version of the logging product.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string version = 14;
}

//
// The Malware object describes the classification of known malicious software,
// which is intentionally designed to cause damage to a computer, server,
// client, or computer network.
//
message Malware {
  //
  // Description:
  //   The list of normalized identifiers of the malware classifications.
  //   Reference: STIX Malware Types
  //
  // Data Type:
  //   An enum field of type MalwareClassificationIDs.
  //
  // Requirement:
  //   required
  //
  repeated MalwareClassificationIDs classification_ids = 1;

  //
  // Description:
  //   The list of malware classifications, normalized to the captions of the
  //   classification_ids values. In the case of 'Other', they are defined by
  //   the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string classifications = 2;

  //
  // Description:
  //   List of Common Vulnerabilities and Exposures (CVE).
  //
  // Data Type:
  //   A message field of type CVE.
  //
  // Requirement:
  //   optional
  //
  repeated CVE cves = 3;

  //
  // Description:
  //   The malware name, as reported by the detection engine.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 4;

  //
  // Description:
  //   The filesystem path of the malware that was observed.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string path = 5;

  //
  // Description:
  //   The provider of the malware information.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string provider = 6;

  //
  // Description:
  //   The malware unique identifier, as reported by the detection engine. For
  //   example a virus id or an IPS signature id.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 7;
}

//
// The Metadata object describes the metadata associated with the event.
//
message Metadata {
  //
  // Description:
  //   The unique identifier used to correlate events.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string correlation_uid = 1;

  //
  // Description:
  //   Debug information about non-fatal issues with this OCSF event. Each issue
  //   is a line in this string array.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string debug = 2;

  //
  // Description:
  //   The Event ID, Code, or Name that the product uses to primarily identify
  //   the event.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string event_code = 3;

  //
  // Description:
  //   The schema extension used to create the event.
  //
  // Data Type:
  //   A message field of type SchemaExtension.
  //
  // Requirement:
  //   optional
  //
  optional SchemaExtension extension = 4;

  //
  // Description:
  //   The schema extensions used to create the event.
  //
  // Data Type:
  //   A message field of type SchemaExtension.
  //
  // Requirement:
  //   optional
  //
  repeated SchemaExtension extensions = 5;

  //
  // Description:
  //   The list of labels attached to the event. For example: ["sample", "dev"]
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string labels = 6;

  //
  // Description:
  //   The audit level at which an event was generated.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string log_level = 7;

  //
  // Description:
  //   The event log name. For example, syslog file name or Windows logging
  //   subsystem: Security.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string log_name = 8;

  //
  // Description:
  //   The logging provider or logging service that logged the event. For
  //   example, Microsoft-Windows-Security-Auditing.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string log_provider = 9;

  //
  // Description:
  //   The event log schema version that specifies the format of the original
  //   event. For example syslog version or Cisco Log Schema Version.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string log_version = 10;

  //
  // Description:
  //   The time when the logging system collected and logged the event.This
  //   attribute is distinct from the event time in that event time typically
  //   contain the time extracted from the original event. Most of the time,
  //   these two times will be different.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 logged_time = 11;

  //
  // Description:
  //   The time when the logging system collected and logged the event.This
  //   attribute is distinct from the event time in that event time typically
  //   contain the time extracted from the original event. Most of the time,
  //   these two times will be different.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string logged_time_dt = 12;

  //
  // Description:
  //   An array of Logger objects that describe the devices and logging products
  //   between the event source and its eventual destination. Note, this
  //   attribute can be used when there is a complex end-to-end path of event
  //   flow.
  //
  // Data Type:
  //   A message field of type Logger.
  //
  // Requirement:
  //   optional
  //
  repeated Logger loggers = 13;

  //
  // Description:
  //   The time when the event was last modified or enriched.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 14;

  //
  // Description:
  //   The time when the event was last modified or enriched.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 15;

  //
  // Description:
  //   The original event time as reported by the event source. For example, the
  //   time in the original format from system event log such as Syslog on
  //   Unix/Linux and the System event file on Windows. Omit if event is
  //   generated instead of collected via logs.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string original_time = 16;

  //
  // Description:
  //   The event processed time, such as an ETL operation.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 processed_time = 17;

  //
  // Description:
  //   The event processed time, such as an ETL operation.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string processed_time_dt = 18;

  //
  // Description:
  //   The product that reported the event.
  //
  // Data Type:
  //   A message field of type Product.
  //
  // Requirement:
  //   required
  //
  Product product = 19;

  //
  // Description:
  //   The list of profiles used to create the event.  Profiles should be
  //   referenced by their name attribute for core profiles, or extension/name
  //   for profiles from extensions.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string profiles = 20;

  //
  // Description:
  //   Sequence number of the event. The sequence number is a value available in
  //   some events, to make the exact ordering of events unambiguous, regardless
  //   of the event time precision.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 sequence = 21;

  //
  // Description:
  //   The list of tags; {key:value} pairs associated to the event.
  //
  // Data Type:
  //   A message field of type KeyValueobject.
  //
  // Requirement:
  //   optional
  //
  repeated KeyValueobject tags = 22;

  //
  // Description:
  //   The unique tenant identifier.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string tenant_uid = 23;

  //
  // Description:
  //   The logging system-assigned unique identifier of an event instance.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid = 24;

  //
  // Description:
  //   The version of the OCSF schema, using Semantic Versioning Specification
  //   (SemVer). For example: 1.0.0. Event consumers use the version to
  //   determine the available event attributes.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string version = 25;
}

//
// The Metric object defines a simple name/value pair entity for a metric.
//
message Metric {
  //
  // Description:
  //   The name of the metric.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string name = 1;

  //
  // Description:
  //   The value of the metric.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string value = 2;
}

//
// The Network Connection Information object describes characteristics of an OSI
// Transport Layer communication, including TCP and UDP.
//
message NetworkConnectionInformation {
  //
  // Description:
  //   The boundary of the connection, normalized to the caption of
  //   'boundary_id'. In the case of 'Other', it is defined by the event source.
  //   For cloud connections, this translates to the traffic-boundary(same VPC,
  //   through IGW, etc.). For traditional networks, this is described as Local,
  //   Internal, or External.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string boundary = 1;

  //
  // Description:
  //   The normalized identifier of the boundary of the connection.  For cloud
  //   connections, this translates to the traffic-boundary (same VPC, through
  //   IGW, etc.). For traditional networks, this is described as Local,
  //   Internal, or External.
  //
  // Data Type:
  //   An enum field of type NetworkConnectionInformationBoundaryID.
  //
  // Requirement:
  //   recommended
  //
  optional NetworkConnectionInformationBoundaryID boundary_id = 2;

  //
  // Description:
  //   The Community ID of the network connection.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string community_uid = 3;

  //
  // Description:
  //   The direction of the initiated connection, traffic, or email, normalized
  //   to the caption of the direction_id value. In the case of 'Other', it is
  //   defined by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string direction = 4;

  //
  // Description:
  //   The normalized identifier of the direction of the initiated connection,
  //   traffic, or email.
  //
  // Data Type:
  //   An enum field of type NetworkConnectionInformationDirectionID.
  //
  // Requirement:
  //   required
  //
  NetworkConnectionInformationDirectionID direction_id = 5;

  //
  // Description:
  //   The Connection Flag History summarizes events in a network connection.
  //   For example flags  ShAD  representing SYN, SYN/ACK, ACK and Data
  //   exchange.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string flag_history = 6;

  //
  // Description:
  //   The IP protocol name in lowercase, as defined by the Internet Assigned
  //   Numbers Authority (IANA). For example: tcp or udp.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string protocol_name = 7;

  //
  // Description:
  //   The IP protocol number, as defined by the Internet Assigned Numbers
  //   Authority (IANA). For example: 6 for TCP and 17 for UDP.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   recommended
  //
  optional int32 protocol_num = 8;

  //
  // Description:
  //   The Internet Protocol version.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string protocol_ver = 9;

  //
  // Description:
  //   The Internet Protocol version identifier.
  //
  // Data Type:
  //   An enum field of type NetworkConnectionInformationProtocolVersionID.
  //
  // Requirement:
  //   recommended
  //
  optional NetworkConnectionInformationProtocolVersionID protocol_ver_id = 10;

  //
  // Description:
  //   The authenticated user or service session.
  //
  // Data Type:
  //   A message field of type Session.
  //
  // Requirement:
  //   optional
  //
  optional Session session = 11;

  //
  // Description:
  //   The network connection TCP header flags (i.e., control bits).
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 tcp_flags = 12;

  //
  // Description:
  //   The unique identifier of the connection.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 13;
}

//
// The Network Endpoint object describes characteristics of a network endpoint.
// These can be a source or destination of a network connection.
//
message NetworkEndpoint {
  //
  // Description:
  //   A list of agent objects associated with a device, endpoint, or resource.
  //
  // Data Type:
  //   A message field of type Agent.
  //
  // Requirement:
  //   optional
  //
  repeated Agent agent_list = 1;

  //
  // Description:
  //   The Autonomous System details associated with an IP address.
  //
  // Data Type:
  //   A message field of type AutonomousSystem.
  //
  // Requirement:
  //   optional
  //
  optional AutonomousSystem autonomous_system = 2;

  //
  // Description:
  //   The name of the domain that the endpoint belongs to or that corresponds
  //   to the endpoint.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string domain = 3;

  //
  // Description:
  //   The fully qualified name of the endpoint.
  //
  // Data Type:
  //   Unique name assigned to a device connected to a computer network. It may
  //   be a fully qualified domain name (FQDN). For
  //   example:r2-d2.example.com.,mx.example.com
  //
  // Requirement:
  //   recommended
  //
  optional string hostname = 4;

  //
  // Description:
  //   The endpoint hardware information.
  //
  // Data Type:
  //   A message field of type DeviceHardwareInfo.
  //
  // Requirement:
  //   optional
  //
  optional DeviceHardwareInfo hw_info = 5;

  //
  // Description:
  //   The unique identifier of a VM instance.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string instance_uid = 6;

  //
  // Description:
  //   The name of the network interface (e.g. eth2).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string interface_name = 7;

  //
  // Description:
  //   The unique identifier of the network interface.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string interface_uid = 8;

  //
  // Description:
  //   The intermediate IP Addresses. For example, the IP addresses in the HTTP
  //   X-Forwarded-For header.
  //
  // Data Type:
  //   Internet Protocol address (IP address), in either IPv4 or IPv6 format.
  //   For example:192.168.200.24,  2001:0db8:85a3:0000:0000:8a2e:0370:7334.
  //
  // Requirement:
  //   optional
  //
  repeated string intermediate_ips = 9;

  //
  // Description:
  //   The IP address of the endpoint, in either IPv4 or IPv6 format.
  //
  // Data Type:
  //   Internet Protocol address (IP address), in either IPv4 or IPv6 format.
  //   For example:192.168.200.24,  2001:0db8:85a3:0000:0000:8a2e:0370:7334.
  //
  // Requirement:
  //   recommended
  //
  optional string ip = 10;

  //
  // Description:
  //   The geographical location of the endpoint.
  //
  // Data Type:
  //   A message field of type GeoLocation.
  //
  // Requirement:
  //   optional
  //
  optional GeoLocation location = 11;

  //
  // Description:
  //   The Media Access Control (MAC) address of the endpoint.
  //
  // Data Type:
  //   Media Access Control (MAC) address. For example:18:36:F3:98:4F:9A.
  //
  // Requirement:
  //   optional
  //
  optional string mac = 12;

  //
  // Description:
  //   The short name of the endpoint.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 13;

  //
  // Description:
  //   The endpoint operating system.
  //
  // Data Type:
  //   A message field of type OperatingSystemOS.
  //
  // Requirement:
  //   optional
  //
  optional OperatingSystemOS os = 14;

  //
  // Description:
  //   The identity of the service or user account that owns the endpoint or was
  //   last logged into it.
  //
  // Data Type:
  //   A message field of type User.
  //
  // Requirement:
  //   recommended
  //
  optional User owner = 15;

  //
  // Description:
  //   The port used for communication within the network connection.
  //
  // Data Type:
  //   The TCP/UDP port number. For example:80,22.
  //
  // Requirement:
  //   recommended
  //
  optional int32 port = 16;

  //
  // Description:
  //   The network proxy information pertaining to a specific endpoint. This can
  //   be used to describe information pertaining to network address translation
  //   (NAT).
  //
  // Data Type:
  //   A message field of type NetworkProxyEndpoint.
  //
  // Requirement:
  //   optional
  //
  optional NetworkProxyEndpoint proxy_endpoint = 17;

  //
  // Description:
  //   The unique identifier of a virtual subnet.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string subnet_uid = 18;

  //
  // Description:
  //   The service name in service-to-service connections. For example, AWS VPC
  //   logs the pkt-src-aws-service and pkt-dst-aws-service fields identify the
  //   connection is coming from or going to an AWS service.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string svc_name = 19;

  //
  // Description:
  //   The network endpoint type. For example: unknown, server, desktop, laptop,
  //   tablet, mobile, virtual, browser, or other.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 20;

  //
  // Description:
