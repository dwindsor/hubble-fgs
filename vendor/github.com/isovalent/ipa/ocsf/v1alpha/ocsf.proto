//
// The JA4+ fingerprint object provides detailed fingerprint information about
// various aspects of network traffic which is both machine and human readable.
//
message JA4Fingerprint {
  //
  // Description:
  //   The 'a' section of the JA4 fingerprint.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string section_a = 1;

  //
  // Description:
  //   The 'b' section of the JA4 fingerprint.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string section_b = 2;

  //
  // Description:
  //   The 'c' section of the JA4 fingerprint.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string section_c = 3;

  //
  // Description:
  //   The 'd' section of the JA4 fingerprint.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string section_d = 4;

  //
  // Description:
  //   The JA4+ fingerprint type as defined by FoxIO, normalized to the caption
  //   of 'type_id'. In the case of 'Other', it is defined by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 5;

  //
  // Description:
  //   The identifier of the JA4+ fingerprint type.
  //
  // Data Type:
  //   An enum field of type JA4FingerprintTypeID.
  //
  // Requirement:
  //   required
  //
  JA4FingerprintTypeID type_id = 6;

  //
  // Description:
  //   The JA4+ fingerprint value.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string value = 7;
}

//
// A generic object allowing to define a {key:value} pair.
//
message KeyValueobject {
