  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string edition = 5;

  //
  // Description:
  //   The kernel release of the operating system. On Unix-based systems, this
  //   is determined from the uname -r command output, for example
  //   "5.15.0-122-generic".
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string kernel_release = 6;

  //
  // Description:
  //   The two letter lower case language codes, as defined by ISO 639-1. For
  //   example: en (English), de (German), or fr (French).
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string lang = 7;

  //
  // Description:
  //   The operating system name.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string name = 8;

  //
  // Description:
  //   The name of the latest Service Pack.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string sp_name = 9;

  //
  // Description:
  //   The version number of the latest Service Pack.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 sp_ver = 10;

  //
  // Description:
  //   The type of the operating system.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string type = 11;

  //
  // Description:
  //   The type identifier of the operating system.
  //
  // Data Type:
  //   An enum field of type OperatingSystemOSTypeID.
  //
  // Requirement:
  //   required
  //
  OperatingSystemOSTypeID type_id = 12;

  //
  // Description:
  //   The version of the OS running on the device that originated the event.
  //   For example: "Windows 10", "OS X 10.7", or "iOS 9".
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string version = 13;
}

//
// The Policy object describes the policies that are applicable. Policy
// attributes provide traceability to the operational state of the security
// product at the time that the event was captured, facilitating forensics,
// troubleshooting, and policy tuning/adjustments.
//
message Policy {
  //
  // Description:
  //   The description of the policy.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string desc = 1;

  //
  // Description:
  //   The policy group.
  //
  // Data Type:
  //   A message field of type Group.
  //
  // Requirement:
  //   optional
  //
  optional Group group = 2;

  //
  // Description:
  //   A determination if the content of a policy was applied to a target or
  //   request, or not.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   recommended
  //
  optional bool is_applied = 3;

  //
  // Description:
  //   The policy name. For example: IAM Policy.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string name = 4;

  //
  // Description:
  //   A unique identifier of the policy instance.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
