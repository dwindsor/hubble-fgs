  string name = 1;

  //
  // Description:
  //   The value associated to the key.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string value = 2;

  //
  // Description:
  //   Optional, the values associated to the key. You can populate this
  //   attribute, when you have multiple values for the same key.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string values = 3;
}

