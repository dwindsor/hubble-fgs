  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   required
  //
  string type = 2;
}

//
// The System for Cross-domain Identity Management (SCIM) Configuration object
// provides a structured set of attributes related to SCIM protocols used for
// identity provisioning and management across cloud-based platforms. It
// standardizes user and group provisioning details, enabling identity
// synchronization and lifecycle management with compatible Identity Providers
// (IdPs) and applications. SCIM is defined in RFC-7634
//
message SCIM {
  //
  // Description:
  //   The authorization protocol as defined by the caption of auth_protocol_id.
  //   In the case of Other, it is defined by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string auth_protocol = 1;

  //
  // Description:
  //   The normalized identifier of the authorization protocol used by the SCIM
  //   resource.
  //
  // Data Type:
  //   An enum field of type SCIMAuthProtocolID.
  //
  // Requirement:
  //   optional
  //
  optional SCIMAuthProtocolID auth_protocol_id = 2;

  //
  // Description:
  //   When the SCIM resource was added to the service provider.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 created_time = 3;

  //
  // Description:
  //   When the SCIM resource was added to the service provider.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 4;

  //
  // Description:
  //   Message or code associated with the last encountered error.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string error_message = 5;

  //
  // Description:
  //   Indicates whether the SCIM resource is configured to provision groups,
  //   automatically or otherwise.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_group_provisioning_enabled = 6;

  //
  // Description:
  //   Indicates whether the SCIM resource is configured to provision users,
  //   automatically or otherwise.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_user_provisioning_enabled = 7;

  //
  // Description:
  //   Timestamp of the most recent successful synchronization.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 last_run_time = 8;

  //
  // Description:
  //   Timestamp of the most recent successful synchronization.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string last_run_time_dt = 9;

  //
  // Description:
  //   The most recent time when the SCIM resource was updated at the service
  //   provider.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 10;

  //
  // Description:
  //   The most recent time when the SCIM resource was updated at the service
  //   provider.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 11;

  //
  // Description:
  //   The name of the SCIM resource.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 12;

  //
  // Description:
  //   The supported protocol for the SCIM resource. E.g., SAML, OIDC, or
  //   OAuth2.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string protocol_name = 13;

  //
  // Description:
  //   Maximum number of requests allowed by the SCIM resource within a
  //   specified time frame to avoid throttling.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 rate_limit = 14;

  //
  // Description:
  //   SCIM provides a schema for representing groups, identified using the
  //   following schema URI: urn:ietf:params:scim:schemas:core:2.0:Group as
  //   defined in RFC-7634. This attribute will capture key-value pairs for the
  //   scheme implemented in a SCIM resource.
  //
  // Data Type:
  //   Embedded JSON value. A value can be a string, or a number, or true or
  //   false or null, or an object or an array. These structures can be nested.
  //   See www.json.org.
  //
  // Requirement:
  //   recommended
  //
  optional string scim_group_schema = 15;

  //
  // Description:
  //   SCIM provides a resource type for user resources. The core schema for
  //   user is identified using the following schema URI:
  //   urn:ietf:params:scim:schemas:core:2.0:User as defined in RFC-7634. his
  //   attribute will capture key-value pairs for the scheme implemented in a
  //   SCIM resource. This object is inclusive of both the basic and Enterprise
  //   User Schema Extension.
  //
  // Data Type:
  //   Embedded JSON value. A value can be a string, or a number, or true or
  //   false or null, or an object or an array. These structures can be nested.
  //   See www.json.org.
  //
  // Requirement:
  //   recommended
  //
  optional string scim_user_schema = 16;

  //
  // Description:
  //   The provisioning state of the SCIM resource, normalized to the caption of
  //   the state_id value. In the case of Other, it is defined by the event
  //   source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string state = 17;

  //
  // Description:
  //   The normalized state ID of the SCIM resource to reflect its activation
  //   status.
  //
  // Data Type:
  //   An enum field of type SCIMStateID.
  //
  // Requirement:
  //   optional
  //
  optional SCIMStateID state_id = 18;

  //
  // Description:
  //   A unique identifier for a SCIM resource as defined by the service
  //   provider.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 19;

  //
  // Description:
  //   A String that is an identifier for the resource as defined by the
  //   provisioning client. The externalId may simplify identification of a
  //   resource between the provisioning client and the service provider by
  //   allowing the client to use a filter to locate the resource with an
  //   identifier from the provisioning domain, obviating the need to store a
  //   local mapping between the provisioning domain's identifier of the
  //   resource and the identifier used by the service provider.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid_alt = 20;

  //
  // Description:
  //   The primary URL for SCIM API requests.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string url_string = 21;

  //
  // Description:
  //   Name of the vendor or service provider implementing SCIM. E.g., Okta,
  //   Auth0, Microsoft.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vendor_name = 22;

  //
  // Description:
  //   SCIM protocol version supported e.g., SCIM 2.0.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string version = 23;
}

//
// The Session object describes details about an authenticated session. e.g.
// Session Creation Time, Session Issuer.
//
message Session {
  //
  // Description:
  //   The number of identical sessions spawned from the same source IP,
  //   destination IP, application, and content/threat type seen over a period
  //   of time.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 count = 1;

  //
  // Description:
  //   The time when the session was created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   recommended
  //
  optional int64 created_time = 2;

  //
  // Description:
  //   The time when the session was created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 3;

  //
  // Description:
  //   The unique identifier of the user's credential. For example, AWS Access
  //   Key ID.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string credential_uid = 4;

  //
  // Description:
  //   The reason which triggered the session expiration.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string expiration_reason = 5;

  //
  // Description:
  //   The session expiration time.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 expiration_time = 6;

  //
  // Description:
  //   The session expiration time.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string expiration_time_dt = 7;

  //
  // Description:
  //   Indicates whether Multi Factor Authentication was used during
  //   authentication.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_mfa = 8;

  //
  // Description:
  //   The indication of whether the session is remote.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   recommended
  //
  optional bool is_remote = 9;

  //
  // Description:
  //   The indication of whether the session is a VPN session.
  //
  // Data Type:
  //   Boolean value. One of true or false.
  //
  // Requirement:
  //   optional
  //
  optional bool is_vpn = 10;

  //
  // Description:
  //   The identifier of the session issuer.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string issuer = 11;

  //
  // Description:
  //   The Pseudo Terminal associated with the session. Ex: the tty or pts
  //   value.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string terminal = 12;

  //
  // Description:
  //   The unique identifier of the session.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 13;

  //
  // Description:
  //   The alternate unique identifier of the session. e.g. AWS ARN -
  //   arn:aws:sts::123344444444:assumed-role/Admin/example-session.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string uid_alt = 14;

  //
  // Description:
  //   The universally unique identifier of the session.
  //
  // Data Type:
  //   128-bit universal unique identifier. For
  //   example:123e4567-e89b-12d3-a456-42661417400.
  //
  // Requirement:
  //   optional
  //
  optional string uuid = 15;
}

//
// The Single Sign-On (SSO) object provides a structure for normalizing SSO
// attributes, configuration, and/or settings from Identity Providers.
//
message SSO {
  //
  // Description:
  //   The authorization protocol as defined by the caption of auth_protocol_id.
  //   In the case of Other, it is defined by the event source.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string auth_protocol = 1;

  //
  // Description:
  //   The normalized identifier of the authentication protocol used by the SSO
  //   resource.
  //
  // Data Type:
  //   An enum field of type SSOAuthProtocolID.
  //
  // Requirement:
  //   optional
  //
  optional SSOAuthProtocolID auth_protocol_id = 2;

  //
  // Description:
  //   Digital Signature associated with the SSO resource, e.g., SAML X.509
  //   certificate details.
  //
  // Data Type:
  //   A message field of type DigitalCertificate.
  //
  // Requirement:
  //   recommended
  //
  optional DigitalCertificate certificate = 3;

  //
  // Description:
  //   When the SSO resource was created.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 created_time = 4;

  //
  // Description:
  //   When the SSO resource was created.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string created_time_dt = 5;

  //
  // Description:
  //   The duration (in minutes) for an SSO session, after which re-
  //   authentication is required.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 duration_mins = 6;

  //
  // Description:
  //   Duration (in minutes) of allowed inactivity before Single Sign-On (SSO)
  //   session expiration.
  //
  // Data Type:
  //   Signed integer value.
  //
  // Requirement:
  //   optional
  //
  optional int32 idle_timeout = 7;

  //
  // Description:
  //   URL for initiating an SSO login request.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string login_endpoint = 8;

  //
  // Description:
  //   URL for initiating an SSO logout request, allowing sessions to be
  //   terminated across applications.
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string logout_endpoint = 9;

  //
  // Description:
  //   URL where metadata about the SSO configuration is available (e.g., for
  //   SAML configurations).
  //
  // Data Type:
  //   Uniform Resource Locator (URL) string. For
  //   example:http://www.example.com/download/trouble.exe.
  //
  // Requirement:
  //   optional
  //
  optional string metadata_endpoint = 10;

  //
  // Description:
  //   The most recent time when the SSO resource was updated.
  //
  // Data Type:
  //   The timestamp format is the number of milliseconds since the Epoch
  //   01/01/1970 00:00:00 UTC. For example:1618524549901.
  //
  // Requirement:
  //   optional
  //
  optional int64 modified_time = 11;

  //
  // Description:
  //   The most recent time when the SSO resource was updated.
  //
  // Data Type:
  //   The Internet Date/Time format as defined in RFC-3339. For
  //   example:2024-09-10T23:20:50.520Z,2024-09-10 23:20:50.520789Z.
  //
  // Requirement:
  //   optional
  //
  optional string modified_time_dt = 12;

  //
  // Description:
  //   The name of the SSO resource.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string name = 13;

  //
  // Description:
  //   The supported protocol for the SSO resource. E.g., SAML or OIDC.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string protocol_name = 14;

  //
  // Description:
  //   Scopes define the specific permissions or actions that the client is
  //   allowed to perform on behalf of the user. Each scope represents a
  //   different set of permissions, and the user can selectively grant or deny
  //   access to specific scopes during the authorization process.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  repeated string scopes = 15;

  //
  // Description:
  //   A unique identifier for a SSO resource.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 16;

  //
  // Description:
  //   Name of the vendor or service provider implementing SSO. E.g., Okta,
  //   Auth0, Microsoft.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   optional
  //
  optional string vendor_name = 17;
}

//
// The MITRE ATT&CK® Sub Technique object describes the sub technique ID and/or
