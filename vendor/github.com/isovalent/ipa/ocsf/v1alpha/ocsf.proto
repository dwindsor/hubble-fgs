  optional string src_url = 2;

  //
  // Description:
  //   The unique identifier of the attack sub technique, as defined by ATT&CK®
  //   Matrix. For example: T1595.001.
  //
  // Data Type:
  //   UTF-8 encoded byte sequence.
  //
  // Requirement:
  //   recommended
  //
  optional string uid = 3;
}

//
