syntax = "proto3";
package ocsf.v1alpha;

option go_package = "github.com/isovalent/ipa/ocsf/v1alpha";

message OcsfEvent {
  string json = 1;
}

message ProcessEventsRequest {
  oneof detail {
    OcsfEvent ocsf_event = 1;
  }
}

message ProcessEventsResponse {
  string message = 1;
}

service EventService {
  rpc ProcessEvents(stream ProcessEventsRequest) returns (ProcessEventsResponse) {}
}
