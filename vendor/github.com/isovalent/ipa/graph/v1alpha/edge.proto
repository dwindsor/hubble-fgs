syntax = "proto3";

package graph.v1alpha;

option go_package = "github.com/isovalent/ipa/graph/v1alpha";

// An edge represents aggregatable properties of a given connection.
message Edge {
  // Type defines the type of the edge. An edge is at most one of these types
  // but can also be undefined, in which case an edge is just a link without
  // any property.
  //
  // Edge types MAY be associated with a ConnectionLog emitter. However, there
  // is no imposed limitation of 1:1 mapping between edge types and emitters.
  // If an emitter collects more relevant data, it MAY emit more than one
  // ConnectionLog with different edge types.
  oneof type {
    EdgeTypeNetworkTelemetry network_telemetry = 1;
    EdgeTypeRoutingTelemetry routing_telemetry = 2;
  }
}

// EdgeTypeNetworkTelemetry provides telemetry information regarding a network
// connection.
message EdgeTypeNetworkTelemetry {
  // tx_packets is the number of packets transferred.
  uint64 tx_packets = 1;
  // tx_bytes is the number of bytes transferred.
  uint64 tx_bytes = 2;
  // tx_drops is the number of packets dropped during transmission.
  uint64 tx_drops = 3;
  // rx_packets is the number of packets received.
  uint64 rx_packets = 4;
  // rx_bytes is the number of bytes received.
  uint64 rx_bytes = 5;
  // rx_drops is the number of packets that are received but discarded.
  uint64 rx_drops = 6;
}

// EdgeTypeRoutingTelemetry provides telemetry information regarding routing
// decisions.
message EdgeTypeRoutingTelemetry {
  // forwarded_count is the number of network flows that have been forwarded to
  // the next processing entity.
  uint64 forwarded_count = 1;
  // dropped_count is the number of network flows that have been dropped.
  // Reasons for dropping data may be due to a malformed packet, rejection by a
  // network policy, etc.
  uint64 dropped_count = 2;
  // error_count is the number of flows where an error occurred during
  // processing.
  uint64 error_count = 3;
  // audit_count is the number of times a flow would have been dropped if a
  // network policy that applies to it was enforced.
  uint64 audit_count = 4;
  // redirected_count is the number of flows which have been redirected, for
  // instance to a local proxy.
  uint64 redirected_count = 5;
  // traced_count is the number of flows that have been observed at a trace
  // point.
  uint64 traced_count = 6;
  // translated_count is the number of flows where are address has been
  // translated.
  uint64 translated_count = 7;
}
