syntax = "proto3";

package graph.v1alpha;

import "buf/validate/validate.proto";
import "common/v1alpha/emitter.proto";
import "google/protobuf/timestamp.proto";
import "graph/v1alpha/edge.proto";
import "graph/v1alpha/vertex.proto";

option go_package = "github.com/isovalent/ipa/graph/v1alpha";

// A connection log is a message that a source emits periodically and which
// provides information about connections.
//
// Emitters SHOULD NOT re-emit ConnectionLog events.
// ConnectionLog events SHOULD NOT have overlapping time windows.
message ConnectionLog {
  option (buf.validate.message).cel = {
    id: "window_end_after_start"
    message: "window_end must be after or equal to window_start"
    expression: "this.window_end >= this.window_start"
  };
  // Uuid is a universally unique identifier for this event.
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  // An emitter is the entity that observes connection information. An emitter
  // commonly runs at the source of the connection (for example, on the node
  // that hosts the connection initiator), but this is not required: an emitter
  // MAY observe a connection from any vantage point. Regardless of where it
  // observes, the emitter MUST label each connection's source and destination
  // by the direction in which the connection was initiated (see Connection).
  common.v1alpha.Emitter emitter = 2 [(buf.validate.field).required = true];

  // Window start is the time at which the emitter started collecting
  // information regarding the observed connections.
  google.protobuf.Timestamp window_start = 3 [(buf.validate.field).required = true];
  // Window end is the time at which the emitter stopped collecting information
  // regarding the observed connections.
  google.protobuf.Timestamp window_end = 4 [(buf.validate.field).required = true];

  // Connections is a list of all connections that were tracked during the
  // given time window.
  repeated Connection connections = 5;
}

// A connection is a simple directed graph where an edge links two vertices in
// one direction.
message Connection {
  option (buf.validate.message).cel = {
    id: "unique_edge_types"
    message: "links must have unique edge types"
    expression: "size(this.links.filter(e, has(e.basic))) <= 1 && size(this.links.filter(e, has(e.network_telemetry))) <= 1 && size(this.links.filter(e, has(e.routing_telemetry))) <= 1 && size(this.links.filter(e, has(e.l4_telemetry))) <= 1 && size(this.links.filter(e, has(e.l7_telemetry))) <= 1 && size(this.links.filter(e, has(e.multicast_telemetry))) <= 1"
  };
  // Source defines properties of the vertex that initiated the connection,
  // i.e. the side that opened the connection (for example, the sender of the
  // TCP SYN or the process that owns the originating socket).
  //
  // Source and destination are defined by the direction in which the
  // connection was initiated, independent of which emitter observed it. Two
  // emitters observing the same connection from different vantage points (for
  // example, the nodes hosting the source and the destination) MUST label the
  // source and destination identically, so that consumers can deduplicate
  // using the emitter's source_identifier.
  Vertex source = 1 [(buf.validate.field).required = true];
  // Destination defines properties of the vertex that received the connection,
  // i.e. the side that the source initiated the connection towards.
  //
  // Return traffic from the destination back to the source is NOT a separate
  // connection: it is reported as the receive-side counters of the edge types
  // on this same Connection (for example,
  // EdgeTypeNetworkTelemetry.network_receive_bytes_total).
  Vertex destination = 2 [(buf.validate.field).required = true];
  // Links define properties of the edges that link the two vertices.
  //
  // There MUST be at least one link between the source and destination vertices.
  //
  // If more than one link is provided, their type MUST be different.
  // In other words, links MUST be a set of at least one element where every
  // element in the set is of a different edge type.
  repeated Edge links = 3 [(buf.validate.field).repeated.min_items = 1];
}
