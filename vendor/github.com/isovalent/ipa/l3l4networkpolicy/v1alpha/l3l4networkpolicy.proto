syntax = "proto3";

package l3l4networkpolicy.v1alpha;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/isovalent/ipa/l3l4networkpolicy/v1alpha";

// Protocol number constants
enum PolicyProtocol {
  // Unspecified or any protocol
  POLICY_PROTOCOL_UNSPECIFIED = 0;
  // ICMP protocol number
  POLICY_PROTOCOL_ICMP = 1;
  // TCP protocol number
  POLICY_PROTOCOL_TCP = 6;
  // UDP protocol number
  POLICY_PROTOCOL_UDP = 17;
}

// Policy action to apply when the rule is matched.
enum PolicyAction {
  // Unspecificied or unknown verdict.
  POLICY_ACTION_UNSPECIFIED = 0;
  // Allow the packet or connection
  POLICY_ACTION_ALLOW = 1;
  // Deny the packet or connection by blocking the connection or dropping the packet.
  POLICY_ACTION_DENY = 2;
}

message PolicyPorts {
  // Protocol of the network subject, e.g. "TCP", "UDP"
  PolicyProtocol protocol = 1;
  // Minimum port of the subject
  uint32 min_port = 2;
  // Maximum port of the subject
  uint32 max_port = 3;
}

// L3Network subjects are endpoints (destination or source) that specify a L3 endpoint.
message L3L4NetworkSubject {
  // CIDR of the subject, e.g. "1.2.3.4/24"
  string cidr = 1;
  // Ports
  repeated PolicyPorts ports = 2;
  // VLAN of the subject may be empty when unused
  uint32 vlan = 3;
  // VRF name of the subject may be empty when unused
  string vrf = 4;
  // unique ID associated with the VRF Name. This is used by datapaths to encode
  // the vrf name into packet headers.
  uint32 vrf_id = 5;
}

// Policy Subjects are used for selectors, source, or destinations.
message PolicySubject {
  // L3 Network specifier.
  L3L4NetworkSubject network = 1;
}

// Policy rule is the definition used to populate the datapath table either
// Tetragon or smartswitch at the moment. Note a single policy may map to many
// rules. These are intended to be easily mapped 1:1 by the specific backend
// into a table based datastructures. For L3/L4 most obvious implementation is
// an LPM.
message PolicyRule {
  // Kubernetes resource version of the corresponding Tetragon Network Policy resource
  string k8s_resource_version = 1;
  // Kubernetes resource UID of the corresponding Tetragon Network Policy resource
  string k8s_uid = 2;
  // Name of the policy that create the rule
  string policy_name = 3;
  // The specific rule that created the rule
  string rule_name = 4;
  // The verdict (action) to apply to any match
  PolicyAction action = 5;
  // The source to apply the rule against.
  PolicySubject source = 6;
  // The destination to apply the rule against.
  PolicySubject destination = 7;
  // The specific rule index that created the rule
  uint32 rule_index = 8;
}

// Policy operation is the instruction telling the backeend what to do with a
// PolicyRule.
enum PolicyOperation {
  // Unspecified or unknown operation
  POLICY_OPERATION_UNSPECIFIED = 0;
  // Add the associated policy rule. If the policy exists it should be updated with any changes.
  POLICY_OPERATION_UPSERT = 1;
  // Delete the associated policy rule.
  POLICY_OPERATION_DELETE = 2;
}

enum AgentType {
  // Agent type unspecified
  AGENT_TYPE_UNSPECIFIED = 0;
  // Agent is AGW managing a DPU
  AGENT_TYPE_DPU_AGW = 1;
  // Agent is Tetragon
  AGENT_TYPE_TETRAGON = 2;
}

message Streaml3l4NetworkPolicyRequest {
  string agent_uid = 1;
}

message Streaml3l4NetworkPolicyResponse {
  PolicyOperation oper = 1;
  PolicyRule policy = 2;
}

// Report status request.
message ReportStatusRequest {
  ReportStatus status = 1;
}

// Report status response.
message ReportStatusResponse {}

// Status event to report basic information about the agent and current policy
// checksum.
message ReportStatus {
  // Node local UID of the agent, useful when multiple agents are colocated
  string agent_uid = 1;
  // Datapath version
  string dp_version = 2;
  // Agent version
  string agent_version = 3;
  // Checksum of the currently running policy
  string policy_checksum = 4;
  // Hostname of the system the agent running
  string hostname = 5;
  // Architecture the agent is running on
  string architecture = 6;
  // Operating system the agent is running on
  string os = 7;
  // Agent type
  AgentType type = 8;
  // The Serial number of the hardware, useful for physical assets
  string serial_number = 9;
  // ManagementIP is the management IP address of this DPU
  string mgmt_ip = 10;
  // PortLow is the low end of the port range assigned to this DPU
  uint32 port_low = 11;
  // PortHigh is the high end of the port range assigned to this DPU
  uint32 port_high = 12;
  // HardwareModel is the DPU hardware model
  string hardware_model = 13;
  // DpuRestarts is the number of times the DPU has been restarted
  uint32 dpu_restarts = 14;
  // LastDpuRestart is the timestamp of the last time the DPU has been restarted
  google.protobuf.Timestamp last_dpu_restart = 15;
  // DataplaneRestarts is the number of times the Dataplane process has been restarted
  uint32 dataplane_restarts = 16;
  // LastDataplaneRestart is the timestamp of the last time the Dataplane process has been restarted
  google.protobuf.Timestamp last_dataplane_restart = 17;
  // LastFwaCrashTime is the timestamp of the last time the FWA has crashed
  google.protobuf.Timestamp last_fwa_crash_time = 19;

  // Deprecated fields and tags
  reserved 20;
  reserved "ha_error";
}

enum ConfigType {
  // Unspecified or unknown config type
  CONFIG_TYPE_UNSPECIFIED = 0;
  // DPU configuration
  CONFIG_TYPE_DPU = 1;
  // Log export syslog configuration
  CONFIG_TYPE_LOG_SYSLOG = 2;
  // Log export IPFIX configuration
  CONFIG_TYPE_LOG_IPFIX = 3;
  // Log export timescape configuration
  CONFIG_TYPE_LOG_TIMESCAPE = 4;
  // Log export splunk configuration
  CONFIG_TYPE_LOG_SPLUNK = 5;
  // HA configuration
  CONFIG_TYPE_HA = 6;
  // Network configuration
  CONFIG_TYPE_NETWORK = 7;
  // Timescape ingestor configuration
  CONFIG_TYPE_TIMESCAPE = 8;
}

enum ConfigSource {
  // Unspecified or unknown config source
  CONFIG_SOURCE_UNSPECIFIED = 0;
  // Config from the local machine
  CONFIG_SOURCE_LOCAL = 1;
  // Config from the connected configmap
  CONFIG_SOURCE_CONFIGMAP = 2;
}

// Object to store NX configuration
// CONFIG_TYPE_DPU
message DpuConfig {
  // Service IP address of the switch
  string service_ip = 1;
  // Service MAC address of the switch
  string service_mac = 2;
  // Low end of the port range assigned to this DPU
  uint32 port_low = 3;
  // High end of the port range assigned to this DPU
  uint32 port_high = 4;
  // Unique identifier for the DPU, the same as the DPU number (DPU1, etc.)
  uint32 dpu_id = 5;
  // DEPRECATED
  string ha_ip = 6 [deprecated = true];
  // Serial number of the switch
  string serial_number = 7;
  // Name of the switch
  string switch_name = 8;
}

// Object to store log export configuration
message LogConfig {
  string id = 1;
  string name = 2;
  string description = 3;

  // IPv4 only
  string host = 4;
  // Collector target port
  string port = 5;
  // Protocol, only TCP or UDP
  string mode = 6;
  // Turns TLS on or off
  bool tls = 7;

  // Secret/Auth fields are only relevant if TLS is true
  // Token for Splunk or Timescape
  string token = 8;
  // Username for Splunk or Timescape
  string username = 9;
  // Password for Splunk or Timescape
  string password = 10;
  // CA cert as a string
  string ca = 11;
  // Client cert as a string
  string cert = 12;
  // Client private key as a string
  string key = 13;
  // Key password to apply to the persisted client private key
  string key_password = 14;
}

// Object to store a list of syslog configuration
// CONFIG_TYPE_LOG_SYSLOG
message LogConfigSyslog {
  map<string, LogConfig> configs = 1;
}

// Object to store a list of ipfix configuration
// CONFIG_TYPE_LOG_IPFIX
message LogConfigIpfix {
  map<string, LogConfig> configs = 1;
}

// Object to store a list of timescape configuration
// CONFIG_TYPE_LOG_TIMESCAPE
message LogConfigTimescape {
  map<string, LogConfig> configs = 1;
}

// Object to store a list of splunk configuration
// CONFIG_TYPE_LOG_SPLUNK
message LogConfigSplunk {
  map<string, LogConfig> configs = 1;
}

message HaPeer {
  // IP address for the peer
  string ip = 1;
  // Minimum destination port of the peer
  uint32 min_port = 2;
  // Maximum destination port of the peer
  uint32 max_port = 3;
}

// Object to store HA configuration
// CONFIG_TYPE_HA
message HaConfig {
  // List of HA peers
  repeated HaPeer peers = 1;
  // Enables HA, starts health checks with peers
  bool enabled = 2;
  // Starts synchronization of flows between peers
  bool flow_sync = 3;
  // Local HA IP address of the switch
  string ha_ip = 4;
}

message Vlan {
  // VLAN id
  uint32 id = 1;
  // Optional VLAN name
  string name = 2;
}

message Vrf {
  // VRF id, unique per switch
  uint32 id = 1;
  // VRF name
  string name = 2;
}

// Object to store network configuration
// CONFIG_TYPE_NETWORK
message NetworkConfig {
  // List of VLANs
  repeated Vlan vlans = 1;
  // List of VRFs
  repeated Vrf vrfs = 2;
}

// BasicAuth configuration for Timescape
message TimescapeBasicAuth {
  // Username for BasicAuth
  string username = 1;
  // Password for BasicAuth
  string password = 2;
}

// Kubernetes CA (Certificate Authority) information
// to get the ca.crt from Kubernetes Secret resource
message MTLSClientCA {
  // CA Secret name
  string secret_name = 1;
  // CA Secret namespace
  string secret_namespace = 2;
}

// IssuerRef structure matching cert-manager format
message IssuerRef {
  // IssuerRef group (cert-manager.io)
  string group = 1;
  // Kubernetes kind (ClusterIssuer, Issuer)
  string kind = 2;
  // Issuer name
  string name = 3;
}

// Kubernetes CertManager can support different issuers
//   kind: ClusterIssuer
//   kind: Issuer
// The complete Signer string format is:
//   <plural-issuerRef.kind>.<issuerRef.group>/<issuerRef.name>
// Examples:
//   - "clusterissuers.cert-manager.io/cluster-root-ca-issuer"
//   - "issuers.cert-manager.io/my-namespace-issuer"
message MTLSCertManager {
  // Issuer reference
  IssuerRef issuer_ref = 1;
}

// mTLS configuration
message MTLSConfig {
  // Enable mTLS
  bool enabled = 1;
  // Certificate manager configuration
  MTLSCertManager certmanager = 2;

  // CA configuration (choose one CA approach per configuration)
  oneof ca_config {
    // Use cert-manager managed CA (reference to existing CA secret)
    MTLSClientCA managed_ca = 3;
    // Future: Custom CA (provide your own CA cert/key)
  }
}

// Object to store Timescape client configuration
// CONFIG_TYPE_TIMESCAPE
message TimescapeConfig {
  // Configuration ID
  string id = 1;
  // Configuration name
  string name = 2;
  // Configuration description
  string description = 3;
  // Timescape server host
  string host = 4;
  // Timescape server port
  string port = 5;
  // Protocol (TCP/UDP)
  string protocol = 6;
  // Enable TLS/HTTPS
  bool tls_enabled = 7;
  // Push API endpoint
  string endpoint_api = 8;

  // Transport configuration for production deployments
  // Maximum number of retry attempts for failed requests
  uint32 max_retries = 9;
  // Connection establishment timeout in seconds
  uint32 connection_timeout_sec = 10;
  // Request timeout in seconds
  uint32 request_timeout_sec = 11;

  // Batching configuration for message processing
  // Maximum number of messages to batch together (default: 1, max: 3, recommended: 2)
  uint32 max_batch_size = 12;
  // Batch timeout in milliseconds (force send batch after timeout, default: 30000ms)
  uint32 batch_timeout_ms = 13;

  // Services: PolicyStatusUpdate and SystemStatusUpdate are enabled by default
  // Authentication configuration (exactly one should be configured)
  oneof auth {
    // BasicAuth configuration
    TimescapeBasicAuth basic_auth = 14;
    // mTLS configuration
    MTLSConfig mtls = 15;
  }
}

// ConfigObject is a generic config object, which can be extended by adding additional configuration types
message ConfigObject {
  // Type of the json encoded config, used to unmarshal the json object.
  ConfigType type = 1;
  // Source of the config, helpful when managing local and remote configurations.
  ConfigSource source = 2;

  // The configuration object encoded in json.
  oneof config {
    DpuConfig config_dpu = 20;
    LogConfigSyslog config_log_syslog = 21;
    LogConfigIpfix config_log_ipfix = 22;
    LogConfigTimescape config_log_timescape = 23;
    LogConfigSplunk config_log_splunk = 24;
    HaConfig config_ha = 25;
    NetworkConfig network_config = 26;
    TimescapeConfig config_timescape = 27;
  }
}

// Config operation is the instruction telling the backend what to do with a
// ConfigObject.
enum ConfigOperation {
  // Unspecified or unknown operation
  CONFIG_OPERATION_UNSPECIFIED = 0;
  // Add the associated config object. If the config object exists it should be replaced with the new object.
  CONFIG_OPERATION_UPSERT = 1;
  // Delete the associated config object.
  CONFIG_OPERATION_DELETE = 2;
}

message StreamDatapathConfigRequest {
  string agent_uid = 1;
}

message StreamDatapathConfigResponse {
  ConfigOperation oper = 1;
  ConfigObject config = 2;
}

// PolicyRuleError enumerates error types that can occur during policy rule processing.
enum PolicyRuleError {
  // No specific error, general catch all error
  POLICY_RULE_ERROR_UNSPECIFIED = 0;
  // Policy operation timed out when sending to dataplane
  POLICY_RULE_ERROR_TIMEOUT = 1;
  // Policy operation failed due to out-of-memory
  POLICY_RULE_ERROR_OOM = 2;
  // Policy operation failed due to unsupported value, like an unsupported protocol in the rule
  POLICY_RULE_ERROR_UNSUPPORTED = 3;
  // Policy operation failed due to invalid policy rule format
  POLICY_RULE_ERROR_FORMAT = 4;
}

// PolicyRuleEvent represents an event related to a specific policy rule.
message PolicyRuleEvent {
  // Name of the specific rule
  string rule_name = 1;
  // Name of the parent policy containing this rule
  string policy_name = 2;
  // Kubernetes unique identifier (UID) of the policy
  string k8s_uid = 3;
  // Kubernetes resource version of the policy
  string k8s_resource_version = 4;
  // True when policy is applied in dataplane successfully, false otherwise
  bool is_success = 5;
  // Error type that occurred during policy rule processing
  // Only relevant when is_success is false
  PolicyRuleError error = 6;
  // Optional string description of the error
  string error_message = 7;
}

enum HAStatus {
  // Unspecified or unknown HA status
  HA_STATUS_UNSPECIFIED = 0;
  // HA peer connectivity up, keepalives working
  HA_STATUS_KEEPALIVE_UP = 1;
  // HA peer connectivity down, keepalives failing
  HA_STATUS_KEEPALIVE_DOWN = 2;
  // HA bulk sync is finished sending to peer
  HA_STATUS_BULK_SYNC_DONE = 3;
  // HA bulk sync is finished receiving from peer
  HA_STATUS_BULK_SYNC_PEER_DONE = 4;
}

message HAStatusEvent {
  // IP address for the peer
  string peer = 1;
  // HA event status
  HAStatus status = 2;
  // Optional string description of status
  string status_message = 3;
}

// StreamEvent wraps different event types that can be streamed from the datapath.
message StreamEvent {
  // Agent UID
  string agent_uid = 1;
  // The time when the event occurred
  google.protobuf.Timestamp timestamp = 2;

  // Generic event object
  oneof event {
    // Policy rule event
    PolicyRuleEvent rule = 3;
    // HA status event
    HAStatusEvent ha_status = 4;
  }
}

// StreamEventsRequest is a client-to-server streaming message containing events to report.
message StreamEventsRequest {
  // events is the list of stream events to report in this request.
  repeated StreamEvent events = 1;
}

message StreamEventsResponse {}

service L3L4NetworkPolicyService {
  rpc Streaml3l4NetworkPolicy(Streaml3l4NetworkPolicyRequest) returns (stream Streaml3l4NetworkPolicyResponse) {}
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse) {}
  rpc StreamDatapathConfig(StreamDatapathConfigRequest) returns (stream StreamDatapathConfigResponse) {}
  rpc StreamEvents(stream StreamEventsRequest) returns (StreamEventsResponse) {}
}
