syntax = "proto3";

package application_model.v1alpha;

import "application_model/v1alpha/syscalls.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/isovalent/ipa/application_model/v1alpha";

message ProcessTelemetry {
  string cluster_name = 1;
  string node_name = 2;
  TelemetryType event_type = 3;
  google.protobuf.Timestamp time = 4;
  string kubernetes_namespace = 5;
  string kubernetes_workload_name = 6;
  WorkloadKind kubernetes_workload_kind = 7;
  string process_hash = 8;
  string process_name = 9;
  string process_arguments = 10;
  uint64 execution_count = 11;
  string parent_hash = 12;
  // An opaque identifier that is unique to this telemetry data across all the
  // telemetry types.
  string id = 13;
}

message NetworkTelemetry {
  string cluster_name = 1;
  string node_name = 2;
  TelemetryType event_type = 3;
  google.protobuf.Timestamp time = 4;
  string kubernetes_namespace = 5;
  string kubernetes_workload_name = 6;
  WorkloadKind kubernetes_workload_kind = 7;
  string process_hash = 8;
  string process_name = 9;
  string process_arguments = 10;
  string destination_name = 11;
  DestinationType destination_type = 12;
  uint32 destination_port = 13;
  string destination_kubernetes_namespace = 14;
  WorkloadKind destination_kubernetes_workload_kind = 15;
  string destination_kubernetes_workload_name = 16;
  uint64 tx_bytes = 17;
  uint64 rx_bytes = 18;
  uint64 tx_drops = 19;
  uint64 default_drop_bytes = 20;
  uint64 default_allow_bytes = 21;
  uint64 default_drop_sessions = 22;
  uint64 default_allowed_sessions = 23;
  // An opaque identifier that is unique to this telemetry data across all the
  // telemetry types.
  string id = 24;
  NetworkProtocolType protocol = 25;
}

enum NetworkProtocolType {
  NETWORK_PROTOCOL_TYPE_UNSPECIFIED = 0;
  NETWORK_PROTOCOL_TYPE_TCP = 1;
  NETWORK_PROTOCOL_TYPE_UDP = 2;
}

enum DestinationType {
  DESTINATION_TYPE_UNSPECIFIED = 0;
  DESTINATION_TYPE_DNS = 1;
  DESTINATION_TYPE_CIDR = 2;
  DESTINATION_TYPE_KUBERNETES = 3;
}

enum TelemetryType {
  TELEMETRY_TYPE_UNSPECIFIED = 0;
  TELEMETRY_TYPE_PROCESS = 1;
  TELEMETRY_TYPE_NETWORK_CONNECT = 2;
}

message ApplicationModelEvent {
  string cluster_name = 1;
  string node_name = 2;
  google.protobuf.Timestamp time = 3;
  ApplicationModel application_model = 4;
}

message ApplicationModel {
  repeated ApplicationNamespace namespaces = 1;
  ApplicationHost host = 2;
}

message ApplicationHost {
  // A list of process groups in the host namespace. See ApplicationProcessGroup
  // for the definition of a process group.
  repeated ApplicationProcessGroup processes = 1;
}

message ApplicationNamespace {
  string name = 1;
  repeated ApplicationWorkload workloads = 2;
}

enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  WORKLOAD_KIND_POD = 1;
  WORKLOAD_KIND_DEPLOYMENT = 2;
  WORKLOAD_KIND_DAEMONSET = 3;
  WORKLOAD_KIND_STATEFULSET = 4;
  WORKLOAD_KIND_JOB = 5;
  WORKLOAD_KIND_CRONJOB = 6;
  WORKLOAD_KIND_REPLICASET = 7;
  WORKLOAD_KIND_SERVICE = 8;
}

message ApplicationWorkload {
  string name = 1;
  WorkloadKind kind = 2;
  // A list of process groups in the workload. See ApplicationProcessGroup for
  // the definition of a process group.
  repeated ApplicationProcessGroup processes = 3;
}

// ApplicationProcessGroup represents a set of processes that are grouped by
// the following criteria:
//
// - They got spawned by processes that belong to a same process group.
// - They have the same command name.
// - They have the same command line arguments.
// - For processes running in a Kubernetes workload, they belong to the same
//   Kubernetes workload.
message ApplicationProcessGroup {
  // Hash to identify this process group in the process group tree.
  string hash = 1;
  string name = 2;
  // Arguments passed to this process.
  string arguments = 3;
  // Child process groups of this process.
  repeated ApplicationProcessGroup children = 4;
  repeated ApplicationConnection connections = 5;
  // Indicates if this process is containerized and is a member of the process
  // tree rooted at pid=1 in its PID namespace.
  google.protobuf.BoolValue in_init_tree = 6;
  // System calls used by this process and their ABI.
  ApplicationSyscalls syscall_info = 7;
  // Number of processes that are currently running in this process group.
  // Implementations of this API may remove the process group from the
  // application model if this count and the counts of all the descendant
  // process groups are zero.
  uint64 process_count = 8;
  // The latest time at which a process in this process group was observed to
  // start.
  google.protobuf.Timestamp latest_start_time = 9;
  // The latest time at which a process in this process group was observed to
  // exit.
  google.protobuf.Timestamp latest_exit_time = 10;
}

message ApplicationConnection {
  Destination destination = 1;
  ConnectionStats stats = 2;
}

message ConnectionStats {
  uint64 tx_bytes = 1;
  uint64 rx_bytes = 2;
  uint64 tx_drops = 3;
  uint64 tx_quota = 4;
  uint64 tx_quota_usage = 5;
  google.protobuf.Timestamp last_quota_reset = 6;
  google.protobuf.Timestamp next_quota_reset = 7;
  uint64 default_drop_bytes = 8;
  uint64 default_allow_bytes = 9;
}

message Destination {
  oneof type {
    DestinationDns dns = 1;
    DestinationWorkload workload = 2;
    DestinationIP ip = 3;
  }
  uint64 port = 1001;
}

message DestinationDns {
  repeated string destination_names = 1;
}

message DestinationWorkload {
  string name = 1;
  string namespace = 2;
  WorkloadKind kind = 3;
}

message DestinationIP {
  string ip = 1;
}

message ApplicationSyscalls {
  repeated Sys syscalls = 1;
  Abi abi = 2;
}

message GetModelRequest {
  // Namespaces to collect model for.
  repeated string namespaces = 1;
  // Include model request information for the host
  bool host = 2;
}

message GetModelResponse {
  ApplicationModelEvent model = 1;
}

message StreamTelemetryRequest {
  // Namespaces to collect model for.
  repeated string namespaces = 1;
  // Include model request information for the host
  bool host = 2;
}

message StreamTelemetryResponse {
  // The type-speicifc fields of flat events.
  oneof event {
    // Application Model Network Flat Entry event has the
    NetworkTelemetry network = 1;
  }
}

service ApplicationModelService {
  rpc GetModel(GetModelRequest) returns (GetModelResponse) {}
  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream StreamTelemetryResponse) {}
}
