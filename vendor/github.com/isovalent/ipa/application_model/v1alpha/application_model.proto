syntax = "proto3";

package application_model.v1alpha;

import "application_model/v1alpha/syscalls.proto";
import "common/k8s/type/v1alpha/resource.proto";
import "common/k8s/type/v1alpha/service.proto";
import "common/k8s/type/v1alpha/workload.proto";
import "common/net/v1alpha/protocol.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/isovalent/ipa/application_model/v1alpha";

message ProcessTelemetry {
  string cluster_name = 1;
  string node_name = 2;
  TelemetryType event_type = 3;
  google.protobuf.Timestamp time = 4;
  string kubernetes_namespace = 5;
  string kubernetes_workload_name = 6;
  common.k8s.type.v1alpha.WorkloadKind kubernetes_workload_kind = 7;
  string process_hash = 8;
  string process_name = 9;
  string process_arguments = 10;
  uint64 execution_count = 11;
  string parent_hash = 12;
  // An opaque identifier that is unique to this telemetry data across all the
  // telemetry types.
  string id = 13;
  // Labels of the node that transmitted this telemetry event. For nodes that
  // belong to a Kubernetes cluster, this field contains Kubernetes node labels.
  // For cloud provider VMs (e.g. AWS, GCP, Azure) that do not belong to any
  // Kubernetes cluster, this field may contain VM tags / labels.
  map<string, string> node_labels = 14;
  // The ID of the application model from which this telemetry data got derived.
  string application_model_id = 15;
  // The first time the process has been observed to run.
  google.protobuf.Timestamp first_start_time = 16;
  // The most recent time the process has been observed to run.
  google.protobuf.Timestamp latest_start_time = 17;
  // Names of all processes that have been parents of this name/argument tuple.
  repeated string parent_names = 18;
  // The container in which this process is running
  ApplicationContainer container = 19;
  // The total number of times processes in this process group have exited.
  uint64 exit_count = 20;
  // UID of the Kubernetes workload in which the process is running.
  string kubernetes_workload_uid = 21;
}

message NetworkConnectTelemetry {
  // An opaque identifier that is unique to this telemetry event across all the
  // telemetry types.
  string id = 1;
  // Timestamp at which this telemetry event got transmitted.
  google.protobuf.Timestamp time = 2;
  // Telemetry event type. This field is set to `TELEMETRY_TYPE_NETWORK_CONNECT`.
  TelemetryType event_type = 3;
  // Name of the cluster that transmitted this telemetry event.
  string cluster_name = 4;
  // Name of the node that transmitted this telemetry event.
  string node_name = 5;
  // Labels of the node that transmitted this telemetry event. For nodes that
  // belong to a Kubernetes cluster, this field contains Kubernetes node labels.
  // For cloud provider VMs (e.g. AWS, GCP, Azure) that do not belong to any
  // Kubernetes cluster, this field may contain VM tags / labels.
  map<string, string> node_labels = 6;
  // Kubernetes namespace in which the process that received this policy verdict
  // is running. This field is set if and only if the process belongs to a
  // Kubernetes workload.
  string kubernetes_namespace = 7;
  // Kubernetes workload kind of the process that received this policy verdict.
  // This field is set if and only if the process belongs to a Kubernetes workload.
  common.k8s.type.v1alpha.WorkloadKind kubernetes_workload_kind = 8;
  // Kubernetes workload name of the process that received this policy verdict.
  // This field is set if and only if the process belongs to a Kubernetes workload.
  string kubernetes_workload_name = 9;
  // Hash of the process that received this policy verdict.
  // TODO: Document how the hash is calculated.
  string process_hash = 10;
  // Name of the process that received this policy verdict.
  string process_name = 11;
  // Arguments of the process that received this policy verdict.
  string process_arguments = 12;
  // Destination name of the connection (e.g. "tetragon.io") that received this
  // network connect policy verdict.
  string destination_name = 13;
  // Destination type of the connection that received this network connect
  // policy verdict.
  DestinationType destination_type = 14;
  // Destination port of the connection that received this network connect
  // policy verdict.
  uint32 destination_port = 15;
  // Kubernetes namespace of the destination workload. This field is set if
  // and only if destination_type is `DESTINATION_TYPE_KUBERNETES`.
  string destination_kubernetes_namespace = 16;
  // Kubernetes resource kind of the process that received the policy verdict.
  common.k8s.type.v1alpha.ResourceKind destination_kubernetes_resource_kind = 17;
  // Kubernetes workload name of the destination. This field is set if and only
  // if destination_type is `DESTINATION_TYPE_KUBERNETES`.
  string destination_kubernetes_resource_name = 18;
  // Kubernetes service kind of the process that received this policy verdict.
  // This field is set if and only if the process resource kind is service.
  common.k8s.type.v1alpha.ServiceKind destination_kubernetes_service_kind = 19;
  // Kubernetes workload kind of the destination. This field is set if and only
  // if destination_type is `DESTINATION_TYPE_KUBERNETES`.
  common.k8s.type.v1alpha.WorkloadKind destination_kubernetes_workload_kind = 20;
  // Network protocol of the connection that received this network connect
  // policy verdict.
  common.net.v1alpha.IPProtocol protocol = 21;
  // Policy verdict. If the connections don't have corresponding policy rules,
  // this field is set to POLICY_VERDICT_UNSPECIFIED.
  PolicyVerdict verdict = 22;
  // Name of the Tetragon network connect policy that made this verdict.
  // If the connections don't have corresponding policy rules, this field is not set.
  string policy_name = 23;
  // Name of the Tetragon network connect policy rule that made this verdict.
  // If the connections don't have corresponding policy rules, this field is not set.
  // If the connections were allowed by the default allow rule, this field is set to
  // "tetragon:default-allow".
  // If the connections were dropped by the default drop rule, this field is set to
  // "tetragon:default-drop".
  string rule_name = 24;
  // tx_bytes allowed or dropped.
  // For `POLICY_VERDICT_ALLOW` verdict events, this field specifies the number of
  // transmit bytes from connections allowed by the policy rule.
  // For `POLICY_VERDICT_DROP` verdict events, this field is set to zero.
  uint64 tx_bytes = 25;
  // The number of receive bytes from connections allowed by the policy rule. This
  // field is not set for `POLICY_VERDICT_DROP` verdict events.
  uint64 rx_bytes = 26;
  // The number of TCP connections / UDP sessions.
  // For `POLICY_VERDICT_UNSPECIFIED` verdict events, this field specifies the
  // number of TCP connections / UDP sessions created.
  // For `POLICY_VERDICT_ALLOW` verdict events, this field specifies the number of
  // TCP connections / UDP sessions allowed by this policy rule.
  // For `POLICY_VERDICT_DROP` verdict events, this field specifies the number of
  // dropped TCP connections / UDP sessions dropped by this policy rule.
  uint64 sessions = 27;
  // The ID of the application model from which this telemetry data got derived.
  string application_model_id = 28;
  // Deprecated: use tx_drop_bytes instead. Despite its name, this field holds a
  // count of dropped transmit bytes, not packets.
  uint64 tx_drops = 29 [deprecated = true];
  // The container in which this connection has an endpoint
  ApplicationContainer container = 30;
  // The number of transmit packets dropped over the interval since the previous
  // telemetry event. Feeds EdgeTypeNetworkTelemetry.network_transmit_drop_total,
  // and also network_transmit_drop_policy_total when every drop the producer
  // counts here was a policy decision.
  uint64 tx_drop_packets = 31;
  // The number of transmit bytes dropped over the interval since the previous
  // telemetry event. Replaces the deprecated tx_drops.
  uint64 tx_drop_bytes = 32;
  // The number of transmit bytes dropped by the default policy rule over the
  // interval since the previous telemetry event.
  uint64 default_drop_bytes = 33;
  // The number of transmit bytes allowed by the default policy rule over the
  // interval since the previous telemetry event.
  uint64 default_allow_bytes = 34;
  // The number of transmit packets dropped by the default policy rule over the
  // interval since the previous telemetry event. A subset of tx_drop_packets,
  // which also counts drops an explicit deny rule decided.
  uint64 default_drop_packets = 35;
  // The number of transmit packets allowed by the default policy rule over the
  // interval since the previous telemetry event.
  uint64 default_allow_packets = 36;
  // The number of receive bytes dropped over the interval since the previous
  // telemetry event.
  uint64 rx_drop_bytes = 37;
  // The number of receive packets dropped over the interval since the previous
  // telemetry event. Feeds EdgeTypeNetworkTelemetry.network_receive_drop_total,
  // and also network_receive_drop_policy_total when every drop the producer
  // counts here was a policy decision.
  uint64 rx_drop_packets = 38;
  // The number of receive bytes dropped by the default policy rule over the
  // interval since the previous telemetry event.
  uint64 rx_default_drop_bytes = 39;
  // The number of receive packets dropped by the default policy rule over the
  // interval since the previous telemetry event. A subset of rx_drop_packets,
  // which also counts drops an explicit deny rule decided.
  uint64 rx_default_drop_packets = 40;
  // The number of receive bytes allowed by the default policy rule over the
  // interval since the previous telemetry event.
  uint64 rx_default_allow_bytes = 41;
  // The number of receive packets allowed by the default policy rule over the
  // interval since the previous telemetry event.
  uint64 rx_default_allow_packets = 42;
  // UID of the Kubernetes workload from which the connection originated.
  string kubernetes_workload_uid = 43;
  // UID of the destination Kubernetes resource.
  string destination_kubernetes_resource_uid = 44;
  // Side of the connection from which the observer saw this network connect
  // policy verdict.
  ObservationPoint observation_point = 45;
}

enum PolicyVerdict {
  POLICY_VERDICT_UNSPECIFIED = 0;
  POLICY_VERDICT_ALLOW = 1;
  POLICY_VERDICT_DROP = 2;
}

enum DestinationType {
  DESTINATION_TYPE_UNSPECIFIED = 0;
  DESTINATION_TYPE_DNS = 1;
  DESTINATION_TYPE_CIDR = 2;
  DESTINATION_TYPE_KUBERNETES = 3;
}

enum TelemetryType {
  TELEMETRY_TYPE_UNSPECIFIED = 0;
  TELEMETRY_TYPE_PROCESS = 1;
  TELEMETRY_TYPE_NETWORK_CONNECT = 2;
}

// ObservationPoint identifies, relative to a connection's direction, the side
// from which the observer saw the connection. An ApplicationConnection always
// hangs off the observing process's own process group, so unlike
// graph.v1alpha.ObservationPoint this has no intermediate value.
enum ObservationPoint {
  OBSERVATION_POINT_UNSPECIFIED = 0;
  OBSERVATION_POINT_SOURCE = 1;
  OBSERVATION_POINT_DESTINATION = 2;
}

message ApplicationModelEvent {
  string cluster_name = 1;
  string node_name = 2;
  google.protobuf.Timestamp time = 3;
  ApplicationModel application_model = 4;
  // Labels of the node that transmitted this application model message. For
  // nodes that belong to a Kubernetes cluster, this field contains Kubernetes
  // node labels. For cloud provider VMs (e.g. AWS, GCP, Azure) that do not
  // belong to any Kubernetes cluster, this field may contain VM tags / labels.
  map<string, string> node_labels = 5;
}

message ApplicationModelFragment {
  string cluster_name = 1;
  string node_name = 2;
  google.protobuf.Timestamp time = 3;
  ApplicationModel application_model_fragment = 4;
  // The number of fragments that that comprise the application model.
  // All fragments will have the same application_model.id value.
  uint64 fragment_total = 5;
  // The index into the the total number of fragments. The
  // first value has fragment_index = 1.
  uint64 fragment_index = 6;
  // Labels of the node that transmitted this application model message. For
  // nodes that belong to a Kubernetes cluster, this field contains Kubernetes
  // node labels. For cloud provider VMs (e.g. AWS, GCP, Azure) that do not
  // belong to any Kubernetes cluster, this field may contain VM tags / labels.
  map<string, string> node_labels = 7;
}

message ApplicationModel {
  repeated ApplicationNamespace namespaces = 1;
  ApplicationHost host = 2;
  // An opaque ID that uniquely identifies this application model.
  string id = 3;
}

message ApplicationHost {
  // A list of process groups in the host namespace. See ApplicationProcessGroup
  // for the definition of a process group.
  repeated ApplicationProcessGroup processes = 1;
}

message ApplicationNamespace {
  string name = 1;
  repeated ApplicationWorkload workloads = 2;
}

message ApplicationWorkload {
  string name = 1;
  common.k8s.type.v1alpha.WorkloadKind kind = 2;
  // A list of containers below the workload. See ApplicationContainer.
  repeated ApplicationContainer containers = 3;
  // UID of the Kubernetes workload.
  string uid = 4;
}

message ApplicationContainer {
  // Identifier of the container.
  string id = 1;
  // Name of the container.
  string name = 2;
  // Image of the container.
  string image = 3;
  // A list of process groups in this container. See ApplicationProcessGroup for
  // the definition of a process group.
  repeated ApplicationProcessGroup processes = 4;
}

// ApplicationProcessGroup represents a set of processes that are grouped by
// the following criteria:
//
// - They got spawned by processes that belong to a same process group.
// - They have the same command name.
// - They have the same command line arguments.
// - For processes running in a Kubernetes workload, they belong to the same
//   Kubernetes workload.
message ApplicationProcessGroup {
  // Hash to identify this process group in the process group tree.
  string hash = 1;
  string name = 2;
  // Arguments passed to this process.
  string arguments = 3;
  // Child process groups of this process.
  repeated ApplicationProcessGroup children = 4;
  repeated ApplicationConnection connections = 5;
  // Indicates if this process is containerized and is a member of the process
  // tree rooted at pid=1 in its PID namespace.
  google.protobuf.BoolValue in_init_tree = 6;
  // System calls used by this process and their ABI.
  ApplicationSyscalls syscall_info = 7;
  // Number of processes that are currently running in this process group.
  // Implementations of this API may remove the process group from the
  // application model if this count and the counts of all the descendant
  // process groups are zero.
  uint64 process_count = 8;
  // The latest time at which a process in this process group was observed to
  // start.
  google.protobuf.Timestamp latest_start_time = 9;
  // The latest time at which a process in this process group was observed to
  // exit.
  google.protobuf.Timestamp latest_exit_time = 10;
  // The first time a process in this process group was observed to start.
  google.protobuf.Timestamp first_start_time = 11;
  // The total number of times processes in this process group have been
  // executed.
  uint64 execution_count = 12;
  // The total number of times processes in this process group have exited.
  uint64 exit_count = 13;
  // The most recent exec ids seen for this process group. Although the protobuf
  // format allows for any number of exec ids, only a fixed number of exec ids
  // (currently 8) are saved for a given process group in order to cap memory
  // usage in tetragon ebpf maps. Older exec ids are removed to make room for
  // more recent exec ids. For this reason, this is not guaranteed to have the
  // exec id for every process that has executed with the same process name and
  // arguments.
  repeated string exec_ids = 14;
}

message NetworkPolicy {
  // Policy verdict. If the connections don't have corresponding policy rules,
  // this field is set to POLICY_VERDICT_UNSPECIFIED.
  PolicyVerdict verdict = 20;
  // Name of the Tetragon network connect policy that made this verdict.
  // If the connections don't have corresponding policy rules, this field is not set.
  string policy_name = 21;
  // Name of the Tetragon network connect policy rule that made this verdict.
  // If the connections don't have corresponding policy rules, this field is not set.
  // If the connections were allowed by the default allow rule, this field is set to
  // "tetragon:default-allow".
  // If the connections were dropped by the default drop rule, this field is set to
  // "tetragon:default-drop".
  string rule_name = 22;
}

message ApplicationConnection {
  // Destination information associated with the connection
  Destination destination = 1;
  // Statistics associated with the connection
  ConnectionStats stats = 2;
  // Policy information associated with the connection
  NetworkPolicy policy = 3;
  // Network protocol of the connection at the L3/L4 layer.
  common.net.v1alpha.IPProtocol protocol = 4;
  // Side of the connection from which the observer saw the connection.
  ObservationPoint observation_point = 5;
}

message ConnectionStats {
  uint64 tx_bytes = 1;
  uint64 rx_bytes = 2;
  // Deprecated: use tx_drop_bytes instead. Despite its name, this field holds a
  // count of dropped transmit bytes, not packets.
  uint64 tx_drops = 3 [deprecated = true];
  uint64 tx_quota = 4;
  uint64 tx_quota_usage = 5;
  google.protobuf.Timestamp last_quota_reset = 6;
  google.protobuf.Timestamp next_quota_reset = 7;
  uint64 default_drop_bytes = 8;
  uint64 default_allow_bytes = 9;
  // The cumulative number of TCP connections or UDP sessions observed for this
  // connection over its entire lifespan. This value only increases; consumers
  // can compute deltas by subtracting two consecutive values.
  uint64 sessions = 10;
  // Number of transmit bytes dropped. Replaces the deprecated tx_drops.
  uint64 tx_drop_bytes = 11;
  // Number of transmit packets dropped.
  uint64 tx_drop_packets = 12;
  // Number of packets dropped by the default policy rule. A subset of
  // tx_drop_packets, which also counts drops an explicit deny rule decided.
  uint64 default_drop_packets = 13;
  // Number of packets allowed by the default policy rule.
  uint64 default_allow_packets = 14;
  // Number of receive bytes dropped.
  uint64 rx_drop_bytes = 15;
  // Number of receive packets dropped.
  uint64 rx_drop_packets = 16;
  // Number of receive bytes dropped by the default policy rule. A subset of
  // rx_drop_bytes, which also counts drops an explicit deny rule decided.
  uint64 rx_default_drop_bytes = 17;
  // Number of receive packets dropped by the default policy rule. A subset of
  // rx_drop_packets, which also counts drops an explicit deny rule decided.
  uint64 rx_default_drop_packets = 18;
  // Number of receive bytes allowed by the default policy rule.
  uint64 rx_default_allow_bytes = 19;
  // Number of receive packets allowed by the default policy rule.
  uint64 rx_default_allow_packets = 20;
}

message Destination {
  oneof type {
    DestinationDns dns = 1;
    DestinationWorkload workload = 2;
    DestinationIP ip = 3;
  }
  uint64 port = 1001;
}

message DestinationDns {
  repeated string destination_names = 1;
}

message DestinationWorkload {
  string name = 1;
  string namespace = 2;
  common.k8s.type.v1alpha.WorkloadKind kind = 3;
  common.k8s.type.v1alpha.ResourceKind resource_kind = 4;
  // UID of the Kubernetes resource.
  string uid = 5;
}

message DestinationIP {
  string ip = 1;
}

message ApplicationSyscalls {
  repeated Sys syscalls = 1;
  Abi abi = 2;
}

message GetModelRequest {
  // Namespaces to collect model for.
  repeated string namespaces = 1;
  // Include model request information for the host
  bool host = 2;
}

message GetModelResponse {
  ApplicationModelEvent model = 1;
}

message StreamModelRequest {
  // Namespaces to collect model for.
  repeated string namespaces = 1;
  // Include model request information for the host
  bool host = 2;
}

message StreamModelResponse {
  ApplicationModelEvent model = 1;
}

message StreamModelFragmentsRequest {
  // Namespaces to collect model for.
  repeated string namespaces = 1;
  // Include model request information for the host
  bool host = 2;
}

message StreamModelFragmentsResponse {
  ApplicationModelFragment model_fragment = 1;
}

message StreamTelemetryRequest {
  // Namespaces to collect model for.
  repeated string namespaces = 1;
  // Include model request information for the host
  bool host = 2;
}

message StreamTelemetryResponse {
  // Each StreamTelemetryResponse contains one of the telemetry events listed below.
  oneof event {
    ProcessTelemetry process = 1;
    NetworkConnectTelemetry network_connect = 2;
  }
}

service ApplicationModelService {
  rpc GetModel(GetModelRequest) returns (GetModelResponse) {}

  // This returns the same information as GetModel, but split into
  // smaller partial messages. Each partial message will contain a
  // sub-tree from the root, but only for a selected application
  // host, namespace, and/or workload. The client should combine
  // the partial messages, merging as needed, to obtain the entire
  // Application Model.
  rpc StreamModel(StreamModelRequest) returns (stream StreamModelResponse) {}
  // This will replace StreamModel once the corresponding hubble-fgs PR is merged.
  rpc StreamModelFragments(StreamModelFragmentsRequest) returns (stream StreamModelFragmentsResponse) {}
  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream StreamTelemetryResponse) {}
}
