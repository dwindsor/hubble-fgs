apiVersion: hubble-enterprise.io/v1
metadata:
  name: "tls"
spec:
  description: "tls parser spec"
  parser:
    tls:
      enable: true
      mode: "socket"
      selectors:
      - matchports:
        - 993
        - 1012
    http:
      enable: true
      selectors:
      - matchports:
        - 8080
        - 80
    https:
      enable: true
      selectors:
      - matchports:
        - 443
    udp:
      enable: true
    dns:
      enable: true
