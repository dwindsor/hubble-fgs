apiVersion: isovalent.com/v1alpha1
kind: TracingPolicy
metadata:
  name: "tls"
spec:
  parser:
    tls:
      enable: true
      mode: "socket"
      selectors:
      - matchPorts:
        - 443
        - 993
        - 1012
    http:
      enable: true
      selectors:
      - matchPorts:
        - 8080
        - 80
    udp:
      enable: true
      cgroup: true
    dns:
      enable: true
