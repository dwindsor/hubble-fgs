apiVersion: hubble-enterprise.io/v1
metadata:
  name: "tls"
spec:
  description: "tls parser spec"
  parser:
    tls:
      enable: true
      mode: "socket"
      selectors:
      - matchports:
        - 443
        - 993
    http:
      enable: true
      selectors:
      - matchports:
        - 80
