# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # master branch
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
    - enhancement
    - release-blocker

  - package-ecosystem: "docker"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
    - enhancement
    - release-blocker

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
    - enhancement
    - release-blocker

  # v1.9 branch
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    target-branch: "v1.9"
    labels:
    - enhancement
    - release-blocker

  - package-ecosystem: "docker"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "saturday"
    target-branch: "v1.9"
    labels:
    - enhancement
    - release-blocker

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    target-branch: "v1.9"
    labels:
    - enhancement
    - release-blocker

  # v1.8 branch
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    target-branch: "v1.8"
    labels:
    - enhancement
    - release-blocker

  - package-ecosystem: "docker"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "saturday"
    target-branch: "v1.8"
    labels:
    - enhancement
    - release-blocker

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    target-branch: "v1.8"
    labels:
    - enhancement
    - release-blocker
