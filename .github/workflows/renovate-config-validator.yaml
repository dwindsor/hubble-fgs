name: Validate renovate configuration

on:
  pull_request:
    paths:
      - '.github/*renovate.json5'

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 43.256.2

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # this step uses latest renovate slim release
      - name: Validate configuration
        run: >
          docker run --rm --entrypoint "renovate-config-validator"
          -v "${{ github.workspace }}/.github/renovate.json5":"/renovate.json5"
          -v "${{ github.workspace }}/.github/self-hosted-renovate.json5":"/self-hosted-renovate.json5"
          ghcr.io/renovatebot/renovate:${RENOVATE_VERSION} "/renovate.json5" "/self-hosted-renovate.json5"
