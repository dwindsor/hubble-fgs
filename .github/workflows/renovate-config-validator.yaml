name: Validate renovate configuration

on:
  pull_request:
    paths:
      - '.github/*renovate.json5'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # this step uses latest renovate slim release
      - name: Validate configuration
        run: >
          docker run --rm --entrypoint "renovate-config-validator"
          -v "${{ github.workspace }}/.github/renovate.json5":"/renovate.json5"
          -v "${{ github.workspace }}/.github/self-hosted-renovate.json5":"/self-hosted-renovate.json5"
          renovate/renovate:slim "/renovate.json5" "/self-hosted-renovate.json5"
