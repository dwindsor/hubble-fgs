name: KVM e2e Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-e2e
  cancel-in-progress: true

jobs:
  ensure-image-available:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: hubble-fgs
          submodules: true

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "agentImage=quay.io/isovalent-dev/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "operatorImage=quay.io/isovalent-dev/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "olmIndexImage=quay.io/isovalent-dev/tetragon-operator-index-ci:${SHA}" >> $GITHUB_OUTPUT

      - name: Attempt To Pull Docker Images
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 60
          retry_wait_seconds: 60
          command: |
            set -e
            docker pull ${{ steps.vars.outputs.agentImage }}
            docker pull ${{ steps.vars.outputs.operatorImage }}
            docker pull ${{ steps.vars.outputs.olmIndexImage }}

  run-tests:
    needs: ensure-image-available
    runs-on:
      - majestic-ketchup-light
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "rhel8.10-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "bpf-next-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.18-20260504.013701'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.12-20260504.013701'
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.6-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.1-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.15-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.10-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.4-20260504.013701"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "4.19-20260504.013701"
        testDir:
          # Tests run after Tetragon has been deployed with helm
          - "helm"
          # Tests run after Tetragon has been deployed with OLM
          - "olm"
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: hubble-fgs
          submodules: true

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "agentImage=quay.io/isovalent-dev/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "operatorImage=quay.io/isovalent-dev/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "olmIndexImage=quay.io/isovalent-dev/tetragon-operator-index-ci:${SHA}" >> $GITHUB_OUTPUT

      - name: Update OLM catalog index
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          yq_version: 4.53.2
        run: |
          set -eux
          # Point to the newly built CI catalog index tests/e2e/olm/catalogsource.yaml
          docker run -i --rm -v "${PWD}"/hubble-fgs:/workdir -u "$(id -u)" mikefarah/yq:${yq_version} e -i ".spec.image = \"${{ steps.vars.outputs.olmIndexImage }}\"" /workdir/tests/e2e/olm/catalogsource.yaml

      - name: Provision LVH VM
        uses: cilium/little-vm-helper@ad43ff511dd5365a0011ae9f864ec959c36daebf # v0.0.28
        with:
          install-dependencies: true
          test-name: tetragon-e2e
          image: kind
          image-version: "${{ matrix.kernel }}"
          host-mount: ./
          ssh-port: 2222
          mem: 8G
          cpu: 2
          cpu-kind: host
          cmd: |
            set -eux

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            # FIXME: remove this line when we have updated kind version upstream in LVH
            go install sigs.k8s.io/kind@v0.27.0

            cd /host/hubble-fgs

            # wait for network to be available
            while true;
            do
              wget --spider -q -T 10  http://google.com && break
              sleep 10
            done

            for i in {1..5}; do
              curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash && break || sleep 60
              if [ \$i -eq 5 ]; then
                echo "Failed to install Helm after 5 tries"
                exit 1 
              fi
            done

      - name: Pull Docker Images
        run: |
          set -e
          docker pull ${{ steps.vars.outputs.agentImage }}
          docker pull ${{ steps.vars.outputs.operatorImage }}

      - name: Fetch Helm subcharts
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            cd hubble-fgs
            make -C install/kubernetes tetragon/charts

      - name: Load Docker Images Into LVH
        run: |
          docker save ${{ steps.vars.outputs.agentImage }} ${{ steps.vars.outputs.operatorImage }} | ssh -p 2222 root@localhost -o "StrictHostKeyChecking=no" "docker load"

      - name: Run Tests
        uses: cilium/little-vm-helper@ad43ff511dd5365a0011ae9f864ec959c36daebf # v0.0.28
        with:
          provision: "false"
          cmd: |
            set -eux
            cd /host/hubble-fgs

            mkdir /build
            export GOTMPDIR=/build

            export HOST_PROC=/procRoot
            if [[ ${{ matrix.kernel }} == 4.19-* ]]; then
              export E2E_BTF=/boot/btf-\$(uname -r)
            fi
            # FIXME: TestHTTP e2e test fails bpf-next kernels
            if [[ "${{ matrix.kernel }}" == bpf-next-* ]]; then
              export FLAKY_HTTP=1
            fi
            if [[ "${{ matrix.kernel }}" == bpf-next-* ]]; then
              export RUN_FIM_DISPATCHER=1
            fi
            if [[ "${{ matrix.kernel }}" == 6.6-*  ]]; then
              export RUN_FIM_DISPATCHER=1
            fi
            if [[ "${{ matrix.kernel }}" == 6.1-* ]]; then
              export RUN_FIM_DISPATCHER=1
            fi
            make e2e-test                                          \
              E2E_BUILD_IMAGES=0                                   \
              E2E_EXTRA_GOTEST_FLAGS="-failfast"                   \
              E2E_AGENT=${{ steps.vars.outputs.agentImage }}       \
              E2E_OPERATOR=${{ steps.vars.outputs.operatorImage }} \
              E2E_TESTS="./tests/e2e/tests/${{ matrix.testDir }}/..."  \
              E2E_EXTRA_TEST_FLAGS="-tetragon.helm.set tetragon.extraArgs.fim-fifo-path=/tetragonExport -v"

      - name: Copy out e2e test logs
        if: ${{ failure() || cancelled() }}
        run: |
          rm -rf logs/e2e
          mkdir -p logs/e2e
          scp -r -P 2222 'root@localhost:/tmp/tetragon.e2e.*' logs/e2e/

      - name: Upload end-to-end test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tetragon-e2e-${{ matrix.kernel }}-${{ matrix.testDir }}
          path: logs/e2e
          retention-days: 5
