name: KVM e2e Tests

on:
  pull_request:
    paths-ignore:
    - "**.md"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-e2e
  cancel-in-progress: true

env:
  clusterName: fgs-cli-ci

jobs:
  run-tests:
    runs-on:
    - majestic-ketchup-light
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - '5.15'
          - '5.10'
          - '5.4'
          - '4.19'
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y cpu-checker qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virtinst virt-manager

      - name: Dump KVM Info
        run: |
          cat /sys/module/kvm_intel/parameters/nested
          egrep -c '(vmx|svm)' /proc/cpuinfo
          echo "${{ matrix.kernel }}"
          kvm-ok
          sudo systemctl is-active libvirtd

      - name: Checkout Git Repo
        uses: actions/checkout@v3
        with:
          path: hubble-fgs
          submodules: true

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo ::set-output name=sha::${SHA}
          echo ::set-output name=agentImage::quay.io/isovalent-dev/hubble-enterprise-ci:${SHA}
          echo ::set-output name=operatorImage::quay.io/isovalent-dev/hubble-enterprise-operator-ci:${SHA}

      - name: Install Cilium CLI
        run: |
          CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/master/stable.txt)
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          curl -L --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-${GOOS}-${GOARCH}.tar.gz{,.sha256sum}
          sha256sum --check cilium-${GOOS}-${GOARCH}.tar.gz.sha256sum
          sudo tar -xzvf cilium-${GOOS}-${GOARCH}.tar.gz
          rm cilium-${GOOS}-${GOARCH}.tar.gz{,.sha256sum}

      - name: Provision LVH VM
        uses: willfindlay/little-vm-helper-action@10a59636e89103bbec4f986d1965374876464aae
        with:
          test-name: tetragon-e2e
          image: kind
          image-version: '${{ matrix.kernel }}'
          lvh-version: 'v0.0.1'
          host-mount: ./
          ssh-port: 2222
          cmd: |
            set -eux

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            cd /host/hubble-fgs

            mv /host/cilium /bin/cilium
            echo 'nameserver 1.1.1.1' > /etc/resolv.conf

            kind create cluster --name ${{ env.clusterName }}
            cilium install
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Attempt To Pull Docker Images
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            set -e
            docker pull ${{ steps.vars.outputs.agentImage }}
            docker pull ${{ steps.vars.outputs.operatorImage }}

      - name: Load Docker Images Into LVH
        run: |
            docker save ${{ steps.vars.outputs.agentImage }} ${{ steps.vars.outputs.operatorImage }} | ssh -p 2222 root@localhost -o "StrictHostKeyChecking=no" "docker load"

      - name: Run Tests
        uses: willfindlay/little-vm-helper-action@10a59636e89103bbec4f986d1965374876464aae
        with:
          provision: 'false'
          cmd: |
            set -eux
            cd /host/hubble-fgs

            kind --name ${{ env.clusterName }} load docker-image ${{ steps.vars.outputs.agentImage }}
            kind --name ${{ env.clusterName }} load docker-image ${{ steps.vars.outputs.operatorImage }}

            # copy btf file
            docker cp /boot/btf-\$(uname -r) ${{ env.clusterName }}-control-plane:/btf

            go test -p 1 -parallel 1 -timeout 20m -failfast ./tests/e2e/tests/... \
              -tetragon.helm.set enterprise.image.override=${{ steps.vars.outputs.agentImage }} \
              -tetragon.helm.set hubbleEnterpriseOperator.image.override=${{ steps.vars.outputs.operatorImage }} \
              -tetragon.helm.set enterprise.btf="/btf" \
              -tetragon.helm.set 'extraHostPathMounts[0].name=btf' \
              -tetragon.helm.set 'extraHostPathMounts[0].mountPath=/btf' \
              -tetragon.helm.set 'extraHostPathMounts[0].readOnly=true' \
              -cluster-name ${{ env.clusterName }} \
              -kubeconfig ~/.kube/config \
              -v

      - name: Copy out e2e test logs
        if: ${{ failure() || cancelled() }}
        run: |
          rm -rf logs/e2e
          mkdir -p logs/e2e
          scp -r -P 2222 'root@localhost:/tmp/tetragon.e2e.*' logs/e2e/

      - name: Upload end-to-end test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@3cea5372237819ed00197afe530f5a7ea3e805c8
        with:
          name: tetragon-e2e-${{ matrix.kernel }}
          path: logs/e2e
          retention-days: 5
