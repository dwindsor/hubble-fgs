name: KVM e2e Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-e2e
  cancel-in-progress: true

jobs:
  ensure-image-available:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: hubble-fgs
          submodules: true

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "agentImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "operatorImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "olmIndexImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-index-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "olmBundleImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-bundle-ci:${SHA}" >> $GITHUB_OUTPUT

      - name: Login to Artifactory
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Attempt To Pull Docker Images
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 2
          max_attempts: 60
          retry_wait_seconds: 60
          command: |
            set -e
            docker pull ${{ steps.vars.outputs.agentImage }}
            docker pull ${{ steps.vars.outputs.operatorImage }}
            docker pull ${{ steps.vars.outputs.olmIndexImage }}
            docker pull ${{ steps.vars.outputs.olmBundleImage }}

  run-tests:
    needs: ensure-image-available
    runs-on:
      - majestic-ketchup-light
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "rhel8.10-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "bpf-next-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.18-20260617.105407'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.12-20260617.105407'
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.6-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.1-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.15-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.10-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.4-20260617.105407"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "4.19-20260617.105407"
        testDir:
          # Tests run after Tetragon has been deployed with helm
          - "helm"
          # Tests run after Tetragon has been deployed with OLM
          - "olm"
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: hubble-fgs
          submodules: true

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "agentImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "operatorImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "olmIndexImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-index-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "olmBundleImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-bundle-ci:${SHA}" >> $GITHUB_OUTPUT

      - name: Login to Artifactory
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Update OLM catalog index
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          yq_version: 4.53.3
        run: |
          set -eux
          # Point to the newly built CI catalog index tests/e2e/olm/catalogsource.yaml
          docker run -i --rm -v "${PWD}"/hubble-fgs:/workdir -u "$(id -u)" mikefarah/yq:${yq_version} e -i ".spec.image = \"${{ steps.vars.outputs.olmIndexImage }}\"" /workdir/tests/e2e/olm/catalogsource.yaml

      - name: Provision LVH VM
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          install-dependencies: true
          test-name: tetragon-e2e
          image: kind
          image-version: "${{ matrix.kernel }}"
          host-mount: ./
          ssh-port: 2222
          mem: 8G
          cpu: 2
          cpu-kind: host
          cmd: |
            set -eux

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            # FIXME: remove this line when we have updated kind version upstream in LVH
            go install sigs.k8s.io/kind@v0.27.0

            cd /host/hubble-fgs

            # wait for network to be available
            while true;
            do
              wget --spider -q -T 10  http://google.com && break
              sleep 10
            done

            for i in {1..5}; do
              curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash && break || sleep 60
              if [ \$i -eq 5 ]; then
                echo "Failed to install Helm after 5 tries"
                exit 1 
              fi
            done

      - name: Pull Docker Images
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            set -e
            docker pull ${{ steps.vars.outputs.agentImage }}
            docker pull ${{ steps.vars.outputs.operatorImage }}
            if [ "${{ matrix.testDir }}" = "olm" ]; then
              docker pull ${{ steps.vars.outputs.olmIndexImage }}
              docker pull ${{ steps.vars.outputs.olmBundleImage }}
            fi

      - name: Fetch Helm subcharts
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            cd hubble-fgs
            make -C install/kubernetes tetragon/charts

      - name: Load Docker Images Into LVH
        run: |
          if [ "${{ matrix.testDir }}" = "olm" ]; then
            docker save ${{ steps.vars.outputs.agentImage }} ${{ steps.vars.outputs.operatorImage }} ${{ steps.vars.outputs.olmIndexImage }} ${{ steps.vars.outputs.olmBundleImage }} | ssh -p 2222 root@localhost -o "StrictHostKeyChecking=no" "docker load"
          else
            docker save ${{ steps.vars.outputs.agentImage }} ${{ steps.vars.outputs.operatorImage }} | ssh -p 2222 root@localhost -o "StrictHostKeyChecking=no" "docker load"
          fi

      - name: Run Tests
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        env:
          OLM_INDEX_IMAGE: ${{ steps.vars.outputs.olmIndexImage }}
          OLM_BUNDLE_IMAGE: ${{ steps.vars.outputs.olmBundleImage }}
          ARTIFACTORY_HOST: ${{ vars.ARTIFACTORY_HOST }}
          ARTIFACTORY_USERNAME: ${{ vars.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          TEST_DIR: ${{ matrix.testDir }}
        with:
          provision: "false"
          cmd: |
            set -eux
            cd /host/hubble-fgs

            mkdir /build
            export GOTMPDIR=/build

            export HOST_PROC=/procRoot
            if [[ ${{ matrix.kernel }} == 4.19-* ]]; then
              export E2E_BTF=/boot/btf-\$(uname -r)
            fi
            # FIXME: TestHTTP e2e test fails bpf-next kernels
            if [[ "${{ matrix.kernel }}" == bpf-next-* ]]; then
              export FLAKY_HTTP=1
            fi
            if [[ "${{ matrix.kernel }}" == bpf-next-* ]]; then
              export RUN_FIM_DISPATCHER=1
            fi
            if [[ "${{ matrix.kernel }}" == 6.6-*  ]]; then
              export RUN_FIM_DISPATCHER=1
            fi
            if [[ "${{ matrix.kernel }}" == 6.1-* ]]; then
              export RUN_FIM_DISPATCHER=1
            fi

            # For OLM tests, pre-load the index image into kind cluster
            # The kind cluster is created by the e2e test framework
            if [[ "${TEST_DIR}" == "olm" ]]; then
              export E2E_OLM_INDEX_IMAGE="${OLM_INDEX_IMAGE}"
              export E2E_OLM_BUNDLE_IMAGE="${OLM_BUNDLE_IMAGE}"
              export E2E_ARTIFACTORY_HOST="${ARTIFACTORY_HOST}"
              export E2E_ARTIFACTORY_USERNAME="${ARTIFACTORY_USERNAME}"
              export E2E_ARTIFACTORY_PASSWORD="${ARTIFACTORY_PASSWORD}"
            fi

            make e2e-test                                          \
              E2E_BUILD_IMAGES=0                                   \
              E2E_EXTRA_GOTEST_FLAGS="-failfast"                   \
              E2E_AGENT=${{ steps.vars.outputs.agentImage }}       \
              E2E_OPERATOR=${{ steps.vars.outputs.operatorImage }} \
              E2E_TESTS="./tests/e2e/tests/${{ matrix.testDir }}/..."  \
              E2E_EXTRA_TEST_FLAGS="-tetragon.helm.set tetragon.extraArgs.fim-fifo-path=/tetragonExport -v"

      - name: Copy out e2e test logs
        if: ${{ failure() || cancelled() }}
        run: |
          rm -rf logs/e2e
          mkdir -p logs/e2e
          scp -r -P 2222 'root@localhost:/tmp/tetragon.e2e.*' logs/e2e/

      - name: Upload end-to-end test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tetragon-e2e-${{ matrix.kernel }}-${{ matrix.testDir }}
          path: logs/e2e
          retention-days: 5
