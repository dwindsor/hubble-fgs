name: OLM Image CI Build

on:
  push:
    branches:
      - master
      - v*
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-push-prs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to quay.io for CI
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ISOVALENT_DEV_USERNAME }}
          password: ${{ secrets.QUAY_ISOVALENT_DEV_PASSWORD }}

      - name: Getting image tag
        id: tag
        run: |
          if [ ${{ github.event.pull_request.head.sha }} != "" ]; then
            echo "tag=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Source Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Update CSV references
        run: |
          tetragon_img="quay.io/${{ github.repository_owner }}-dev/tetragon-ci:${{ steps.tag.outputs.tag }}"
          tetragon_operator_img="quay.io/${{ github.repository_owner }}-dev/tetragon-operator-ci:${{ steps.tag.outputs.tag }}"
          sed -i "s/quay.io\/isovalent\/tetragon[:@].*\"$/${tetragon_img//\//\\/}\"/g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s/quay.io\/isovalent\/tetragon[:@].*[^\"]$/${tetragon_img//\//\\/}/g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s/quay.io\/isovalent\/tetragon-operator[:@].*\"$/${tetragon_operator_img//\//\\/}\"/g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s/quay.io\/isovalent\/tetragon-operator[:@].*[^\"]$/${tetragon_operator_img//\//\\/}/g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s/^[ ]*name: tetragon-operator\.v.*$/  name: tetragon-operator.${{ steps.tag.outputs.tag }}/" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml

      - name: CI Bundle Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./install/olm
          file: ./install/olm/bundle.Dockerfile
          push: true
          tags: |
            quay.io/${{ github.repository_owner }}-dev/tetragon-operator-bundle-ci:${{ steps.tag.outputs.tag }}
          labels: quay.expires-after=2d

      - name: Update catalog index references
        run: |
          sed -i  "s/{{CI_VERSION}}/${{ steps.tag.outputs.tag }}/g" ./install/olm/catalog-ci/index.yaml

      - name: CI Catalog Index Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./install/olm
          file: ./install/olm/catalog-ci.Dockerfile
          push: true
          tags: |
            quay.io/${{ github.repository_owner }}-dev/tetragon-operator-index-ci:${{ steps.tag.outputs.tag }}
          labels: quay.expires-after=2d
