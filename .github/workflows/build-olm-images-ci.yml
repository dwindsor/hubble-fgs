name: OLM Image CI Build

on:
  push:
    branches:
      - master
      - v*
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-push-prs:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Artifactory
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      - name: Getting image tag
        id: tag
        run: |
          if [ ${{ github.event.pull_request.head.sha }} != "" ]; then
            echo "tag=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Update CSV references
        run: |
          tetragon_img="${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-ci:${{ steps.tag.outputs.tag }}"
          tetragon_operator_img="${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-ci:${{ steps.tag.outputs.tag }}"
          sed -i "s|quay.io/isovalent/tetragon[:@].*\"$|${tetragon_img}\"|g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s|quay.io/isovalent/tetragon[:@].*[^\"]$|${tetragon_img}|g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s|quay.io/isovalent/tetragon-operator[:@].*\"$|${tetragon_operator_img}\"|g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s|quay.io/isovalent/tetragon-operator[:@].*[^\"]$|${tetragon_operator_img}|g" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml
          sed -i "s/^[ ]*name: tetragon-operator\.v.*$/  name: tetragon-operator.${{ steps.tag.outputs.tag }}/" ./install/olm/bundle/manifests/tetragon-operator.clusterserviceversion.yaml

      - name: CI Bundle Build
        run: |
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --file ./install/olm/bundle.Dockerfile \
              --provenance false \
              --tag ${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-bundle-ci:${{ steps.tag.outputs.tag }} \
              --push ./install/olm; then
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          echo "Build failed after 5 attempts"
          exit 1

      - name: Update catalog index references
        run: |
          sed -i "s/{{CI_VERSION}}/${{ steps.tag.outputs.tag }}/g" ./install/olm/catalog-ci/index.yaml
          sed -i "s|quay.io/isovalent-dev/tetragon-operator-bundle-ci|${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-bundle-ci|g" ./install/olm/catalog-ci/index.yaml
          sed -i "s|quay.io/isovalent-dev/tetragon-operator-ci|${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-ci|g" ./install/olm/catalog-ci/index.yaml
          sed -i "s|quay.io/isovalent-dev/tetragon-ci|${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-ci|g" ./install/olm/catalog-ci/index.yaml

      - name: CI Catalog Index Build
        run: |
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --file ./install/olm/catalog-ci.Dockerfile \
              --provenance false \
              --tag ${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-index-ci:${{ steps.tag.outputs.tag }} \
              --push ./install/olm; then
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          echo "Build failed after 5 attempts"
          exit 1
