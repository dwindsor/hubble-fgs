name: CodeQL

on:
  workflow_dispatch:
  schedule:
    # Run at the end of every day from Monday to Friday
    - cron: '0 0 * * 1-5'

permissions: {}

jobs:
  analyze:
    name: Analyze
    uses: isovalent/reusable-workflows/.github/workflows/codeql.yaml@ab4888b9078f03883bf2e399959b9df377fcac1d # v0.13.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["go", "actions"]'
      timeout-minutes: 30
