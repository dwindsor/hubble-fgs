name: CodeQL

on:
  workflow_dispatch:
  schedule:
    # Run at the end of every day from Monday to Friday
    - cron: '0 0 * * 1-5'

permissions: {}

jobs:
  analyze:
    name: Analyze
    uses: isovalent/reusable-workflows/.github/workflows/codeql.yaml@ab64038003d9a501689655ed8d6eba7ba13d05c3 # v0.15.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["go", "actions"]'
      timeout-minutes: 30
