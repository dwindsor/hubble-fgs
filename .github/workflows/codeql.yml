name: CodeQL

on:
  workflow_dispatch:
  schedule:
    # Run at the end of every day from Monday to Friday
    - cron: '0 0 * * 1-5'

permissions: {}

jobs:
  analyze:
    name: Analyze
    uses: isovalent/reusable-workflows/.github/workflows/codeql.yaml@3cb4b5fb5982273b11c56b46247b4d789026b5c0 # v0.16.2
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["go", "actions"]'
      timeout-minutes: 30
