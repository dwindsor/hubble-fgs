name: CodeQL

on:
  workflow_dispatch:
  schedule:
    # Run at the end of every day from Monday to Friday
    - cron: '0 0 * * 1-5'

permissions: {}

jobs:
  analyze:
    name: Analyze
    uses: isovalent/reusable-workflows/.github/workflows/codeql.yaml@8908ee8076684f16997fc52223d4090dd2983693 # v1.17.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["go", "actions"]'
      timeout-minutes: 30
