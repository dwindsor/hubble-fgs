# This workflow runs various sanity checks across the codebase. Specific
# components, like APIs, are also validated by dedicated workflows.

name: Run static checks
on:
  push:
    branches:
      - master
      - v*
  pull_request:
    # Until https://github.com/orgs/community/discussions/44490
    # is not resolved, run on all paths, even "**.md".

permissions:
  # For golangci/golangci-lint to have read access to pull request for `only-new-issues` option.
  contents: read

jobs:
  build-every-commit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        submodules: true

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.27.1'

    - name: Check if build works for every commit
      run: |
        set -x
        PR_FIRST_COMMIT=$(git rev-list --reverse origin/${{ github.event.pull_request.base.ref }}..HEAD | head -1)
        git rebase --exec "make oss-init && make -j$(nproc) tetragon tetra tetragon-bpf tetragon-operator" $PR_FIRST_COMMIT^

    - name: Check if debug BPF program build works for every commit
      run: |
        set -x
        PR_FIRST_COMMIT=$(git rev-list --reverse origin/${{ github.event.pull_request.base.ref }}..HEAD | head -1)
        git rebase --exec "make oss-init && make -j$(nproc) tetragon-bpf DEBUG=1" $PR_FIRST_COMMIT^

    - name: Failed commit during the build
      if: ${{ failure() }}
      run: git --no-pager log --format=%B -n 1

  ensure-no-binary-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Ensure No Binary Files Checked In
        run: |
          echo "Checking for any checked in binary files not in allowlist..." 
          outfile="$(mktemp)"
          find . -type f -size +0 -not -wholename '**/vendor/**' -not -wholename '**/_vendor/**' -not -wholename '**/.git/**' -not -name '*.png' -not -name '*.bmp' -not -name '*.jpg' -not -name '*.ico' -not -name '*.svg' | xargs -n 100 grep -IL '' | tee "$outfile"
          test -z "$(cat $outfile)"

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.1'
          # using golangci-lint cache instead
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

        with:
          # renovate: datasource=docker depName=docker.io/golangci/golangci-lint
          version: v2.14.0
          args: --config=.golangci.yml --verbose

  format:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.1'

      - name: Check gofmt formatting
        run: |
          go fmt ./...
          git diff --exit-code || (echo "gofmt checks failed. Please run 'go -w fmt ./...', and submit your changes"; exit 1)

      - name: Login to Artifactory
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      - name: Build clang-format Docker image
        run: docker build -f Dockerfile.clang-format -t "isovalent/clang-format:latest" .

      - name: Verify clang-format on BPF code
        id: clang_format
        run: |
          set -o pipefail
          find bpf -name '*.c' -o -name '*.h' | xargs -n 1000 \
            docker run -v $(realpath .):/fgs "isovalent/clang-format:latest" --Werror -n -style=file
          if [ $? != 0 ]; then
            echo "clang-format checks failed. Please run 'make format' and submit your changes."; exit 1
          fi

  vendoring:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.1'

      - name: Check module vendoring
        run: |
          git config --global url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com".insteadOf "https://github.com"
          make vendor
          echo "git status --porcelain:" `git status --porcelain`
          test -z "$(git status --porcelain)" || (echo "Module vendoring checks failed. Please run 'make vendor', and submit your changes"; exit 1)

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Build CLI release binaries
        run: make cli-release
  
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build tetragon Windows binaries
        run: |
          GOOS=windows GOARCH=amd64 go build ./cmd/tetragon/
          GOOS=windows GOARCH=arm64 go build ./cmd/tetragon/

  build-nok8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build the slim tetrabox binary, which strips both Kubernetes (nok8s)
      # and cloud-provider/AWS SDK (nocloud) code.
      - name: Build tetrabox (nok8s,nocloud)
        run: |
          make tetrabox

      # Verify the nok8s and nocloud tags compile independently: this build
      # keeps cloud-provider code (nok8s without nocloud), exercising the code
      # paths the slim tetrabox build excludes.
      - name: Build nok8s (with cloud)
        run: |
          go build -tags nok8s ./cmd/tetragon ./cmd/tetra

  errmetrics-fileids-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Check errmetrics file IDs are in sync
      run: ./modules/tetragon-oss/contrib/fileids-check.sh
      env:
        FILEIDS_H: bpf/errmetrics/fileids.h
        FILES_GO: pkg/errmetrics/files.go
