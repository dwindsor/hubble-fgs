name: Run static checks
on:
  push:
    branches:
      - master
      - v*
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.17.8'
      - name: Run static checks
        uses: golangci/golangci-lint-action@5c56cd6c9dc07901af25baab6f2b0d9f3b7c3018
        with:
          version: v1.44.0
          args: --config=.golangci.yml --verbose
          only-new-issues: true
          skip-go-installation: true
          skip-pkg-cache: true
          skip-build-cache: true
      - name: Build clang format Docker image
        run: |
          docker build -f Dockerfile.clang-format -t "isovalent/clang-format:latest" .
      - name: Verify clang-format on BPF code
        id: clang_format
        run: |
          set -e -o pipefail
          find bpf -name '*.c' -o -name '*.h' -not -path 'bpf/include/vmlinux.h' \
            -not -path 'bpf/include/api.h' -not -path 'bpf/libbpf/*' | xargs -n 1000 \
            docker run -v $(realpath .):/fgs "isovalent/clang-format:latest" --Werror -n -style=file
          if [ $? != 0 ]; then
            echo "clang-format checks failed. Please run `make format` and try again."
          fi

