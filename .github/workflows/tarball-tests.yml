name: Tarball Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"

jobs:
  build-tarballs:
    uses: ./.github/workflows/build-tarballs.yml
    permissions:
      contents: read
    secrets: inherit

  packages-e2e-tests:
    needs: [build-tarballs]
    uses: ./.github/workflows/packages-e2e-tests.yml
    permissions:
      contents: read
