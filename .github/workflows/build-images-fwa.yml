name: Build Hubble FGS FWA Images

on:
  pull_request:
    paths-ignore:
      - "**.md"
    branches: [ master ]
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * *'  # 9 PM PST (5 AM UTC)

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.event_name == 'pull_request' && format('{0}-pr-{1}-{2}', github.workflow, github.event.pull_request.number, github.event.action) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0
      - name: Get version and set outputs
        id: get-version
        run: |
          VERSION=$(make version)
          if [[ -z "$VERSION" || "$VERSION" =~ ^[a-f0-9]{7,}$ ]]; then
            echo "WARNING: Version appears to be empty or a SHA. Using tag from git describe instead."
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi

          # Simplify version to match format like 1.18.0-pre.1-95 or 1.15.4-some-string
          # Keep semantic version and any first hyphenated suffix, but remove git commit info
          VERSION=$(echo "$VERSION" | sed -E 's/^(v?[0-9]+\.[0-9]+\.[0-9]+(-[^-]+)?).*/\1/')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      date: ${{ steps.get-version.outputs.date }}
      sha: ${{ steps.get-version.outputs.sha }}

  build-fwa-image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
          - arch: arm64
            runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_ARM64 }}
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    needs: [ init ]
    if: ${{ needs.init.result == 'success' }}
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Docker login to devhub-cloud
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: artifactory.devhub-cloud.cisco.com
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - name: Build fwa image
        run: |
          echo "Building for architecture: ${{ matrix.arch }}"
          TARGET_ARCH=${{ matrix.arch }} make package-fwa
      - name: Prepare artifact
        id: prepare-artifact
        run: |
          mkdir -p $(pwd)/build/${{ matrix.arch }}/fwa
          cp -r $(pwd)/install/fwa/dist/* $(pwd)/build/${{ matrix.arch }}/fwa/ || echo "Warning: No artifacts found in install/fwa/dist"
          echo "artifact_path=$(pwd)/build/${{ matrix.arch }}/fwa" >> $GITHUB_OUTPUT
      - name: Upload fwa image
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fwa-image-${{ matrix.arch }}-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}
          path: ${{ steps.prepare-artifact.outputs.artifact_path }}
          retention-days: 1
  
  combine-artifacts:
    needs: [ init, build-fwa-image ]
    if: ${{ always() && !cancelled() && needs.build-fwa-image.result == 'success' }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    outputs:
      artifact_dir: ${{ steps.prepare-artifacts.outputs.artifact_dir }}
    steps:
      - name: Download AMD fwa artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "fwa-image-amd64-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./combined-artifacts/amd64"
      - name: Download ARM fwa artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "fwa-image-arm64-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./combined-artifacts/arm64"
      - name: List downloaded artifacts
        run: |
          echo "AMD64 artifacts:"
          find ./combined-artifacts/amd64 -type f | sort
          echo "\nARM64 artifacts:"
          find ./combined-artifacts/arm64 -type f | sort
      - name: Prepare artifacts for GitHub release
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          tar -czf ./release-artifacts/fwa-elba-amd64-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/amd64 .
          tar -czf ./release-artifacts/fwa-elba-arm64-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/arm64 .
          cd ./release-artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt
          echo "artifact_dir=$(pwd)" >> $GITHUB_OUTPUT
      - name: Upload prepared artifacts for release job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}
          path: ./release-artifacts
          retention-days: 1
  
  create-github-release:
    needs: [init, combine-artifacts]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./release-artifacts"
      - name: List release artifacts
        run: |
          ls -la ./release-artifacts
      - name: Determine release type
        id: release-type
        run: |
          echo "is_draft=false" >> $GITHUB_OUTPUT
          echo "tag_name=${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}-codedrop" >> $GITHUB_OUTPUT
          echo "release_name=${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}-codedrop" >> $GITHUB_OUTPUT
      - name: Create GitHub Release 
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release-type.outputs.tag_name }}
          name: ${{ steps.release-type.outputs.release_name }}
          draft: ${{ steps.release-type.outputs.is_draft }}
          body: |
            ## Hubble FGS FWA Release ${{ needs.init.outputs.version }}
            
            This release contains Hubble FGS FWA images built for compatibility with DPUs in the smart switch.
            
            ### Build Information
            - Version: ${{ needs.init.outputs.version }}
            - Date: ${{ needs.init.outputs.date }}
            - Commit: ${{ needs.init.outputs.sha }}
            
            ### Instructions
            - Download the appropriate architecture archive (AMD64 or ARM64)
            - Extract the archive to access the built artifacts
            - See documentation for integration details
          files: |
            ./release-artifacts/*

  update-fwa-version-dpu-pensando:
    needs: [init, create-github-release]
    if: ${{ needs.init.result == 'success' && needs.create-github-release.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'schedule' && github.ref == 'refs/heads/master')) }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      TARGET_DPU_REPO: hs-dpu-pensando
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }},${{ env.TARGET_DPU_REPO }}
      - name: Update FWA version in hs-dpu-pensando
        uses: cisco-hypershield/hs-actions/.github/actions/create-pull-request@main # legit:ignore
        with:
          repository: 'cisco-hypershield/hs-dpu-pensando'
          target-branch: 'main'
          cross-repo-github-token: ${{ steps.workflow-token.outputs.token }}
          auto-merge: true
          auto-approve: true
          create-source-branch: true
          custom-commit-message: "feat: Update FWA_LATEST to ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}-codedrop"
          custom-branch-name: "feature/update-fwa-version-${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}-codedrop"
          makefile-update-data: |
            [
              {
                "path": "Makefile",
                "key": "FWA_LATEST",
                "value": "${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}-codedrop"
              }
            ]
          keeper-url: ${{ vars.VAULT_URL }}
          vault-namespace: ${{ vars.VAULT_HYPERSHIELD_NAMESPACE }}
          vault-secret-path: secret/data/gitops/gha-creds
          vault-approle-role-id: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          vault-approle-secret-id: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}