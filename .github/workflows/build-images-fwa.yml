name: Build Hubble FGS FWA Images

on:
  pull_request:
    paths-ignore:
      - "**.md"
    branches: [master]
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *" # 9 PM PST (5 AM UTC)

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.event_name == 'pull_request' && format('{0}-pr-{1}-{2}', github.workflow, github.event.pull_request.number, github.event.action) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            Makefile
            Makefile.defs
          sparse-checkout-cone-mode: false
          fetch-tags: true
          fetch-depth: 0
      - name: Get version and set outputs
        id: get-version
        run: make fwa-version
      - name: Validate release metadata
        run: make validate-release-metadata
        env:
          REL_VERSION: ${{ steps.get-version.outputs.version }}
          REL_DATE: ${{ steps.get-version.outputs.date }}
          REL_SHA: ${{ steps.get-version.outputs.sha }}
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      date: ${{ steps.get-version.outputs.date }}
      sha: ${{ steps.get-version.outputs.sha }}

  build-fwa-image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
          - arch: arm64
            runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_ARM64 }}
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    needs: [init]
    if: ${{ needs.init.result == 'success' }}
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Docker login to devhub-cloud
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: artifactory.devhub-cloud.cisco.com
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - name: Build fwa image
        run: |
          echo "Building for architecture: ${{ matrix.arch }}"
          TARGET_ARCH=${{ matrix.arch }} make package-fwa
      - name: Prepare artifact
        id: prepare-artifact
        run: |
          mkdir -p $(pwd)/build/${{ matrix.arch }}/fwa
          cp -r $(pwd)/install/fwa/dist/* $(pwd)/build/${{ matrix.arch }}/fwa/ || echo "Warning: No artifacts found in install/fwa/dist"
          echo "artifact_path=$(pwd)/build/${{ matrix.arch }}/fwa" >> $GITHUB_OUTPUT
      - name: Upload fwa image
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fwa-image-${{ matrix.arch }}-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}
          path: ${{ steps.prepare-artifact.outputs.artifact_path }}
          retention-days: 1

  combine-artifacts:
    needs: [init, build-fwa-image]
    if: ${{ always() && !cancelled() && needs.build-fwa-image.result == 'success' }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    outputs:
      artifact_dir: ${{ steps.prepare-artifacts.outputs.artifact_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            Makefile
            Makefile.defs
          sparse-checkout-cone-mode: false
      - name: Download AMD fwa artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "fwa-image-amd64-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./combined-artifacts/amd64"
      - name: Download ARM fwa artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "fwa-image-arm64-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./combined-artifacts/arm64"
      - name: List downloaded artifacts
        run: |
          echo "AMD64 artifacts:"
          find ./combined-artifacts/amd64 -type f | sort
          echo "\nARM64 artifacts:"
          find ./combined-artifacts/arm64 -type f | sort
      - name: Prepare artifacts for GitHub release
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          tar -czf ./release-artifacts/fwa-elba-amd64-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/amd64 .
          tar -czf ./release-artifacts/fwa-elba-arm64-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/arm64 .
          cd ./release-artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt
          echo "artifact_dir=$(pwd)" >> $GITHUB_OUTPUT
      - name: Create release metadata manifest
        run: |
          cat > ./release-artifacts/metadata.json << EOF
          {
            "version": "${{ needs.init.outputs.version }}",
            "date": "${{ needs.init.outputs.date }}",
            "sha": "${{ needs.init.outputs.sha }}",
            "full_sha": "${{ github.sha }}",
            "source_repository": "${{ github.repository }}",
            "source_ref": "${{ github.ref }}",
            "build_timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "release_tag": "${{ needs.init.outputs.version }}+${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}",
            "artifacts": [
              {
                "name": "fwa-elba-amd64-${{ needs.init.outputs.version }}.tar.gz",
                "architecture": "amd64",
                "platform": "elba"
              },
              {
                "name": "fwa-elba-arm64-${{ needs.init.outputs.version }}.tar.gz",
                "architecture": "arm64",
                "platform": "elba"
              }
            ]
          }
          EOF
          echo "Created metadata.json:"
          cat ./release-artifacts/metadata.json
      - name: Verify artifact checksums
        run: make release-artifacts-verify-checksums
        env:
          REL_DIR: ./release-artifacts
      - name: Upload prepared artifacts for release job
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}
          path: ./release-artifacts
          retention-days: 1

  upload-to-artifactory:
    needs: [init, combine-artifacts]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.init.outputs.version }}
      DATE: ${{ needs.init.outputs.date }}
      SHA: ${{ needs.init.outputs.sha }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./release-artifacts"
      - name: Generate fwa.yaml manifest
        run: |
          cat > ./fwa.yaml << EOF
          vendor_name: hypershield
          pkg_entity: fwa
          #sw contents - list of files in the fwa package
          pkg_files:
          - pkg_file_entity: fwa
            pkg_file: fwa.tar
            pkg_file_version: ${VERSION}
            pkg_git_label: ${DATE}-${SHA}
          EOF
          sed -i 's/^          //' ./fwa.yaml
          echo "Generated fwa.yaml:"
          cat ./fwa.yaml
      - name: Get Artifactory Credentials from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: ${{ vars.VAULT_URL }}
          method: ${{ vars.VAULT_METHOD }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            secret/data/devops/${{ github.repository_owner }} artifactory_username | JF_USER;
            secret/data/devops/${{ github.repository_owner }} artifactory_password | JF_PASSWORD;
      - name: Setup access to Artifactory
        uses: jfrog/setup-jfrog-cli@86dacb6974c66cc99e7651e1205f6581aaddba9a # v4.10.0
        env:
          JF_URL: ${{ vars.ARTIFACTORY_URL }}
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
      - name: Upload FWA artifacts to Artifactory
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_TAG="${RUN_NUMBER}-${DATE}-${SHA}"
          ARTIFACTORY_PATH="isovalent-images-generic/smartswitch/fwa/${VERSION}/${BUILD_TAG}"

          echo "Uploading FWA artifacts to: ${ARTIFACTORY_PATH}"

          # Upload AMD64 FWA image
          if [ -f "./release-artifacts/fwa-elba-amd64-${VERSION}.tar.gz" ]; then
            jf rt u --flat "./release-artifacts/fwa-elba-amd64-${VERSION}.tar.gz" "${ARTIFACTORY_PATH}/fwa-elba-amd64.tar.gz"
            echo "✓ Uploaded fwa-elba-amd64.tar.gz"
          fi

          # Upload ARM64 FWA image
          if [ -f "./release-artifacts/fwa-elba-arm64-${VERSION}.tar.gz" ]; then
            jf rt u --flat "./release-artifacts/fwa-elba-arm64-${VERSION}.tar.gz" "${ARTIFACTORY_PATH}/fwa-elba-arm64.tar.gz"
            echo "✓ Uploaded fwa-elba-arm64.tar.gz"
          fi

          # Upload fwa.yaml manifest
          if [ -f "./fwa.yaml" ]; then
            jf rt u --flat "./fwa.yaml" "${ARTIFACTORY_PATH}/fwa.yaml"
            echo "✓ Uploaded fwa.yaml"
          fi

          echo "✓ All FWA artifacts uploaded successfully"
      - name: Artifactory Upload Summary
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_TAG="${RUN_NUMBER}-${DATE}-${SHA}"
          echo "### Artifactory Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifactory Path | smartswitch/fwa/${VERSION}/${BUILD_TAG}/ |" >> $GITHUB_STEP_SUMMARY
          echo "| AMD64 Image | fwa-elba-amd64.tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| ARM64 Image | fwa-elba-arm64.tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | fwa.yaml |" >> $GITHUB_STEP_SUMMARY

  create-fwa-releases-repo-release:
    needs: [init, combine-artifacts]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      TARGET_ORG: isovalent
      TARGET_REPO: hubble-fwa-releases
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            Makefile
            Makefile.defs
          sparse-checkout-cone-mode: false
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }}
      - name: Checkout hubble-fwa-releases repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ env.TARGET_ORG }}/${{ env.TARGET_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: ./fwa-releases-repo
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./release-artifacts"
      - name: Validate release artifacts and metadata
        run: |
          echo "=== Release Artifacts Validation ==="
          echo "Release artifacts to be published:"
          ls -lah ./release-artifacts/
          echo ""
          echo "=== Checksums ==="
          cat ./release-artifacts/SHA256SUMS.txt
          echo ""
          echo "=== Metadata ==="
          if [[ -f ./release-artifacts/metadata.json ]]; then
            cat ./release-artifacts/metadata.json
          else
            echo "::warning::metadata.json not found in release artifacts"
          fi
          echo ""
          make release-artifacts-validate-files
          echo "==================================="
        env:
          REL_DIR: ./release-artifacts
          REL_REQUIRED_FILES: |
            fwa-elba-amd64-${{ needs.init.outputs.version }}.tar.gz
            fwa-elba-arm64-${{ needs.init.outputs.version }}.tar.gz
            SHA256SUMS.txt
            metadata.json
      - name: Verify artifact integrity
        run: make release-artifacts-verify-checksums
        env:
          REL_DIR: ./release-artifacts
          REL_SUMS_FILE: SHA256SUMS.txt
      - name: Create release notes
        run: |
          cd ./fwa-releases-repo
          mkdir -p docs/release-notes

          VERSION="${{ needs.init.outputs.version }}"
          DATE="${{ needs.init.outputs.date }}"
          SHA="${{ needs.init.outputs.sha }}"
          FULL_SHA="${{ github.sha }}"
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          CHECKSUMS=$(cat ../release-artifacts/SHA256SUMS.txt)

          RELEASE_NOTES_FILE="docs/release-notes/${VERSION}+${SHA}.md"

          cat > "$RELEASE_NOTES_FILE" << EOF
          # Release Notes: ${VERSION}+${SHA}

          **Release Date:** ${RELEASE_DATE}

          ## Build Information
          - **Version:** ${VERSION}
          - **Build Date:** ${DATE}
          - **Commit SHA:** ${SHA}
          - **Full Commit SHA:** ${FULL_SHA}
          - **Source Repository:** [hubble-fgs](https://github.com/isovalent/hubble-fgs)
          - **Source Commit:** https://github.com/isovalent/hubble-fgs/commit/${FULL_SHA}

          ## Artifacts

          ### AMD64
          - \`fwa-elba-amd64-${VERSION}.tar.gz\`

          ### ARM64
          - \`fwa-elba-arm64-${VERSION}.tar.gz\`

          ### Checksums
          \`\`\`
          ${CHECKSUMS}
          \`\`\`

          ## Metadata

          A \`metadata.json\` file is included with each release containing machine-readable
          build information for automated downstream processing.

          ## Installation

          1. Download the appropriate architecture archive from the [Releases](https://github.com/isovalent/hubble-fwa-releases/releases) page
          2. Verify checksum: \`sha256sum -c SHA256SUMS.txt\`
          3. Extract: \`tar -xzf fwa-elba-{arch}-${VERSION}.tar.gz\`
          4. Load images: \`docker load -i <image-file>.tar\`
          5. Deploy according to NXOS integration guide

          ## Compatibility
          - **NXOS Version:** Compatible with latest NXOS releases
          - **DPU Platform:** Elba (AMD64 and ARM64)

          ---

          For questions or issues, contact @cisco-hypershield/nxos
          EOF

          echo "Created release notes at: $RELEASE_NOTES_FILE"
          echo "Content:"
          cat "$RELEASE_NOTES_FILE"
      - name: Commit release notes
        run: |
          cd ./fwa-releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/release-notes/
          git commit -m "docs: Add release notes for ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}" || echo "No changes to commit"
          git push origin main
      - name: Create GitHub Release in hubble-fwa-releases
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ env.TARGET_ORG }}/${{ env.TARGET_REPO }}
          tag_name: ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}
          name: ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}
          draft: false
          prerelease: false
          body: |
            ## Hubble FGS FWA Release ${{ needs.init.outputs.version }}

            This release contains Hubble FGS FWA (Firewall Accelerator) images built for Elba DPU platform.

            ### Build Information
            - **Version:** ${{ needs.init.outputs.version }}
            - **Build Date:** ${{ needs.init.outputs.date }}
            - **Commit SHA:** ${{ needs.init.outputs.sha }}
            - **Source:** [hubble-fgs@${{ github.sha }}](https://github.com/isovalent/hubble-fgs/commit/${{ github.sha }})

            ### Artifacts
            - `fwa-elba-amd64-${{ needs.init.outputs.version }}.tar.gz` - AMD64 architecture
            - `fwa-elba-arm64-${{ needs.init.outputs.version }}.tar.gz` - ARM64 architecture
            - `SHA256SUMS.txt` - Checksums for verification

            ### Installation
            1. Download the appropriate architecture archive
            2. Extract: `tar -xzf fwa-elba-{arch}-${{ needs.init.outputs.version }}.tar.gz`
            3. Load images: `docker load -i <image-file>.tar`
            4. Deploy according to NXOS integration documentation

            ### Release Notes
            Full release notes: [docs/release-notes/${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}.md](https://github.com/isovalent/hubble-fwa-releases/blob/main/docs/release-notes/${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}.md)

            ---

            For questions or issues, contact @cisco-hypershield/nxos
          files: |
            ./release-artifacts/*
      - name: Verify release metadata published
        run: |
          echo "=== Release Publication Summary ==="
          echo "Target Repository: ${{ env.TARGET_ORG }}/${{ env.TARGET_REPO }}"
          echo "Release Tag: ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
          echo ""
          echo "Metadata Published:"
          echo "  - Version: ${{ needs.init.outputs.version }}"
          echo "  - Date: ${{ needs.init.outputs.date }}"
          echo "  - SHA: ${{ needs.init.outputs.sha }}"
          echo "  - Full SHA: ${{ github.sha }}"
          echo ""
          echo "Artifacts Published:"
          ls -la ./release-artifacts/
          echo ""
          echo "✓ Release created successfully with all metadata"
          echo "==================================="

  update-fwa-version-dpu-pensando:
    needs: [init, create-fwa-releases-repo-release]
    if: ${{ false &&
      needs.init.result == 'success' &&
      needs.create-fwa-releases-repo-release.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'schedule' &&
      github.ref == 'refs/heads/master')) }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      TARGET_DPU_REPO: hs-dpu-pensando
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }},${{ env.TARGET_DPU_REPO }}
      - name: Update FWA version in hs-dpu-pensando
        uses: cisco-hypershield/hs-actions/.github/actions/create-pull-request@main # legit:ignore
        with:
          repository: "cisco-hypershield/hs-dpu-pensando"
          target-branch: "main"
          cross-repo-github-token: ${{ steps.workflow-token.outputs.token }}
          auto-merge: true
          auto-approve: true
          create-source-branch: true
          custom-commit-message: "feat: Update FWA_LATEST to ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
          custom-branch-name: "feature/update-fwa-version-${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
          makefile-update-data: |
            [
              {
                "path": "build/version_pins.mk",
                "key": "FWA_LATEST",
                "value": "${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
              }
            ]
          keeper-url: ${{ vars.VAULT_URL }}
          vault-namespace: ${{ vars.VAULT_HYPERSHIELD_NAMESPACE }}
          vault-secret-path: secret/data/gitops/gha-creds
          vault-approle-role-id: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          vault-approle-secret-id: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
