name: AGW Sanity Tests

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string from caller workflow'
        required: false
        type: string
      date:
        description: 'Build date from caller workflow'
        required: false
        type: string
      sha:
        description: 'Git SHA from caller workflow'
        required: false
        type: string
      upload_to_artifactory:
        description: 'Whether to upload the agw-test image to Artifactory'
        required: false
        type: boolean
        default: false
    secrets:
      HYPERSHIELD_GH_APP_PEM:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true

jobs:
  agw-sanity-tests:
    runs-on: ${{ vars.UBUNTU_2404_4CPU_32GB_MEMORY_OPTIMIZED }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    timeout-minutes: 15 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Generate GitHub App Token for DPU Simulator
        id: dpu-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: cisco-hypershield
          repositories: hs-dpu-pensando

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Docker login to devhub-cloud
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: artifactory.devhub-cloud.cisco.com
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Build AGW Docker image
        run: |
          cd tests/sanity/smartswitch
          make build-agw-image

      - name: Upload AGW test image to Artifactory
        if: ${{ inputs.upload_to_artifactory }}
        id: upload-agw-test
        uses: ./.github/actions/upload-artifactory
        with:
          vault_url: ${{ vars.VAULT_URL }}
          vault_method: ${{ vars.VAULT_METHOD }}
          vault_namespace: ${{ vars.VAULT_NAMESPACE }}
          vault_secrets: |
            secret/data/devops/${{ github.repository_owner }} artifactory_username | JF_USER;
            secret/data/devops/${{ github.repository_owner }} artifactory_password | JF_PASSWORD;
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}
          repo_path_prefix: isovalent-images-generic/smartswitch/agw-test
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}
          run_number: ${{ github.run_number }}
          create_docker_tar: "true"
          docker_image_source: isovalent/agw-test:latest
          docker_image_repo: isovalent/agw-test
          docker_tar_basename: agw-test
          docker_tar_artifactory_name: agw-test.tar.gz
          write_step_summary: "true"

      - name: Pull DPU Simulator image
        id: pull-sim
        run: |
          cd tests/sanity/smartswitch
          make pull-sim-image
          # Extract the version from the downloaded tarball
          TARBALL=$(ls /tmp/naples-docker-*.tgz | head -1)
          VERSION=$(basename "$TARBALL" | sed 's/naples-docker-//;s/.tgz//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Downloaded DPU Simulator version: $VERSION"
        env:
          GH_TOKEN: ${{ steps.dpu-token.outputs.token }}
          GITHUB_REPO: cisco-hypershield/hs-dpu-pensando
          SIM_VERSION: latest

      - name: Launch DPU Simulator container
        run: |
          free -h
          docker system prune -f
          cd tests/sanity/smartswitch
          make launch-sim

      - name: Verify DPU container is running
        run: |
          echo "Waiting for DPU container to stabilize..."
          sleep 10
          echo "Checking DPU container status:"
          docker ps -a
          
          CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep naples || true)
          if [ -z "$CONTAINER_NAME" ]; then
            echo "❌ No DPU container found"
            exit 1
          fi
          
          CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME")
          echo "Container: $CONTAINER_NAME"
          echo "Status: $CONTAINER_STATUS"
          
          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "❌ DPU container is not running"
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi
          
          echo "✅ DPU container $CONTAINER_NAME is running"
          
          # Check DPU processes inside container
          echo ""
          echo "Checking DPU processes:"
          docker exec "$CONTAINER_NAME" ps aux || true
          
          # Check if critical services are running
          echo ""
          echo "Checking for critical DPU services:"
          docker exec "$CONTAINER_NAME" ps aux | grep -E "hal|pds|sysmgr|nicmgr" || echo "⚠️  No critical services found"
          
          # Wait for DPU gRPC services to be ready (dpctl needs these)
          echo ""
          echo "Waiting for DPU gRPC services to be ready..."
          MAX_WAIT=180
          WAIT_INTERVAL=5
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            echo "Attempt $((ELAPSED/WAIT_INTERVAL + 1)): Checking gRPC port 11357..."
            
            # Check if gRPC port is listening and responsive
            if docker exec "$CONTAINER_NAME" sh -c "curl -s --max-time 5 http://localhost:11357 >/dev/null 2>&1 || nc -z localhost 11357" 2>/dev/null; then
              echo "✅ gRPC port 11357 is responsive!"
              
              # Now test dpctl with a simple command
              echo "Testing dpctl responsiveness..."
              if timeout 15 docker exec "$CONTAINER_NAME" dpctl show version 2>&1 | grep -q "version\|Version\|error" || true; then
                echo "✅ DPU dataplane is ready!"
                break
              else
                echo "⚠️  dpctl still not responding, continuing to wait..."
              fi
            else
              echo "⚠️  gRPC services not ready yet, waiting ${WAIT_INTERVAL}s..."
            fi
            
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ DPU dataplane did not become ready within ${MAX_WAIT}s"
            echo ""
            echo "=== Checking stuck processes ==="
            docker exec "$CONTAINER_NAME" ps aux | grep dpctl || true
            echo ""
            echo "=== Container logs ==="
            docker logs --tail 100 "$CONTAINER_NAME"
            exit 1
          fi

      - name: Launch AGW container
        run: |
          cd tests/sanity/smartswitch
          make launch-agw

      - name: Configure network
        run: |
          cd tests/sanity/smartswitch
          make configure-network

      - name: Show container status
        run: |
          cd tests/sanity/smartswitch
          make show-containers-status

      - name: Install test dependencies
        run: |
          cd tests/sanity/smartswitch
          make install-test-dependencies

      - name: Run sanity tests
        run: |
          cd tests/sanity/smartswitch
          sudo make run-tests-with-allure
      
      - name: Debug DPU container on failure
        if: failure()
        run: |
          echo "=== DPU Container Status ==="
          CONTAINER_NAME=$(docker ps -a --format '{{.Names}}' | grep naples || echo "none")
          if [ "$CONTAINER_NAME" != "none" ]; then
            echo "Container: $CONTAINER_NAME"
            docker inspect "$CONTAINER_NAME" --format='{{json .State}}' | jq '.'
            
            echo ""
            echo "=== DPU Container Processes ==="
            docker exec "$CONTAINER_NAME" ps auxf || true
            
            echo ""
            echo "=== DPU Container Logs (last 100 lines) ==="
            docker logs --tail 100 "$CONTAINER_NAME" || true
            
            echo ""
            echo "=== DPU /var/log/pensando (if mounted) ==="
            cd tests/sanity/smartswitch
            if [ -d "dsc/$CONTAINER_NAME/var/log/pensando" ]; then
              find "dsc/$CONTAINER_NAME/var/log/pensando" -type f -name "*.log" -exec echo "--- {} ---" \; -exec tail -50 {} \;
            else
              echo "Log directory not found"
            fi
          else
            echo "No DPU container found"
          fi

      - name: Load Allure test report history
        id: load-allure-history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: always()
        continue-on-error: true
        with:
          repository: 'isovalent/hubble-fgs'
          ref: gh-pages
          path: gh-pages
          token: ${{ github.token }}

      - name: Build Allure Test report
        uses: simple-elf/allure-report-action@master # legit:ignore
        id: build-allure-report
        if: always()
        with:
          github_repo: 'isovalent/hubble-fgs'
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: tests/sanity/smartswitch/allure-results
          subfolder: agw-sanity
          allure_report: allure-report-agw-sanity
          keep_reports: 30
        
      - name: Create gh-pages branch if needed
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if gh-pages branch exists remotely
          if ! git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "Creating gh-pages branch..."
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initial gh-pages commit"
            git push origin gh-pages
          else
            echo "gh-pages branch already exists"
          fi

      # - name: Publish Allure report
      #   uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
      #   if: always()
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_branch: gh-pages
      #     publish_dir: allure-history
      #     keep_files: true
      #     commit_message: 'Deploy Allure report'
      #     user_name: 'github-actions[bot]'
      #     user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agw-sanity-test-results
          path: |
            tests/sanity/smartswitch/.pytest_cache
            tests/sanity/smartswitch/allure-results
          retention-days: 5

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agw-sanity-container-logs
          path: |
            /tmp/*.log
          retention-days: 5

      - name: Cleanup containers
        if: always()
        run: |
          cd tests/sanity/smartswitch
          make shutdown-containers
