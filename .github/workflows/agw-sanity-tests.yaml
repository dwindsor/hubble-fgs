name: AGW Sanity Tests

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string from caller workflow'
        required: false
        type: string
      date:
        description: 'Build date from caller workflow'
        required: false
        type: string
      sha:
        description: 'Git SHA from caller workflow'
        required: false
        type: string
      upload_to_artifactory:
        description: 'Whether to upload the agw-test image to Artifactory'
        required: false
        type: boolean
        default: false
    secrets:
      HYPERSHIELD_GH_APP_PEM:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      QUAY_CHARTS_DEV_USERNAME:
        required: true
      QUAY_CHARTS_DEV_PASSWORD:
        required: true
      TIMESCAPE_PASSWORD:
        required: true
      PROMETHEUS_PASSWORD:
        required: true

jobs:
  agw-sanity-tests:
    runs-on: ${{ vars.UBUNTU_2404_4CPU_32GB_MEMORY_OPTIMIZED }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    timeout-minutes: 35
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Generate GitHub App Token for DPU Simulator
        id: dpu-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: cisco-hypershield
          repositories: hs-dpu-pensando

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Docker login to devhub-cloud
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: artifactory.devhub-cloud.cisco.com
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Install kind
        run: |
          KIND_VERSION="v0.27.0"
          curl -Lo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -Lo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install htpasswd (for Prometheus bcrypt auth)
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Docker login to quay.io (Timescape Helm chart)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_CHARTS_DEV_USERNAME }}
          password: ${{ secrets.QUAY_CHARTS_DEV_PASSWORD }}

      - name: Build AGW Docker image
        run: |
          cd tests/sanity/smartswitch
          make build-agw-image

      - name: Upload AGW test image to Artifactory
        if: ${{ inputs.upload_to_artifactory }}
        id: upload-agw-test
        uses: ./.github/actions/upload-artifactory
        with:
          vault_url: ${{ vars.VAULT_URL }}
          vault_method: ${{ vars.VAULT_METHOD }}
          vault_namespace: ${{ vars.VAULT_NAMESPACE }}
          vault_secrets: |
            secret/data/devops/${{ github.repository_owner }} artifactory_username | JF_USER;
            secret/data/devops/${{ github.repository_owner }} artifactory_password | JF_PASSWORD;
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}
          repo_path_prefix: isovalent-images-generic/smartswitch/agw-test
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}
          run_number: ${{ github.run_number }}
          create_docker_tar: "true"
          docker_image_source: isovalent/agw-test:latest
          docker_image_repo: isovalent/agw-test
          docker_tar_basename: agw-test
          docker_tar_artifactory_name: agw-test.tar.gz
          write_step_summary: "true"

      - name: Pull DPU Simulator image
        id: pull-sim
        run: |
          cd tests/sanity/smartswitch
          make pull-sim-image
          # Extract the version from the downloaded tarball
          TARBALL=$(ls /tmp/naples-docker-*.tgz | head -1)
          VERSION=$(basename "$TARBALL" | sed 's/naples-docker-//;s/.tgz//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Downloaded DPU Simulator version: $VERSION"
        env:
          GH_TOKEN: ${{ steps.dpu-token.outputs.token }}
          GITHUB_REPO: cisco-hypershield/hs-dpu-pensando
          SIM_VERSION: latest

      - name: Launch DPU Simulator containers
        run: |
          free -h
          docker system prune -f
          cd tests/sanity/smartswitch
          make launch-sim-multi SIM_COUNT=2

      - name: Verify DPU containers are running
        run: |
          echo "Waiting for DPU containers to stabilize..."
          sleep 10
          echo "Checking DPU container status:"
          docker ps -a
          
          CONTAINERS=$(docker ps --format '{{.Names}}' | grep naples || true)
          if [ -z "$CONTAINERS" ]; then
            echo "❌ No DPU containers found"
            exit 1
          fi
          
          CONTAINER_COUNT=$(echo "$CONTAINERS" | wc -l | tr -d ' ')
          echo "Found $CONTAINER_COUNT DPU container(s)"
          
          if [ "$CONTAINER_COUNT" -lt 2 ]; then
            echo "❌ Expected at least 2 DPU containers, found $CONTAINER_COUNT"
            exit 1
          fi
          
          FAILED=0
          for CONTAINER_NAME in $CONTAINERS; do
            echo ""
            echo "========================================"
            echo "Verifying container: $CONTAINER_NAME"
            echo "========================================"
            
            CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME")
            echo "Status: $CONTAINER_STATUS"
            
            if [ "$CONTAINER_STATUS" != "running" ]; then
              echo "❌ DPU container $CONTAINER_NAME is not running"
              docker logs "$CONTAINER_NAME" || true
              FAILED=1
              continue
            fi
            
            echo "✅ DPU container $CONTAINER_NAME is running"
            
            # Check DPU processes inside container
            echo "Checking DPU processes:"
            docker exec "$CONTAINER_NAME" ps aux || true
            
            # Check if critical services are running
            echo "Checking for critical DPU services:"
            docker exec "$CONTAINER_NAME" ps aux | grep -E "hal|pds|sysmgr|nicmgr" || echo "⚠️  No critical services found"
            
            # Wait for DPU gRPC services to be ready (dpctl needs these)
            echo "Waiting for DPU gRPC services to be ready..."
            MAX_WAIT=180
            WAIT_INTERVAL=5
            ELAPSED=0
            
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              echo "Attempt $((ELAPSED/WAIT_INTERVAL + 1)): Checking gRPC port 11357 on $CONTAINER_NAME..."
              
              if docker exec "$CONTAINER_NAME" sh -c "curl -s --max-time 5 http://localhost:11357 >/dev/null 2>&1 || nc -z localhost 11357" 2>/dev/null; then
                echo "✅ gRPC port 11357 is responsive on $CONTAINER_NAME!"
                
                echo "Testing dpctl responsiveness..."
                if timeout 15 docker exec "$CONTAINER_NAME" dpctl show version 2>&1 | grep -q "version\|Version\|error" || true; then
                  echo "✅ DPU dataplane is ready on $CONTAINER_NAME!"
                  break
                else
                  echo "⚠️  dpctl still not responding on $CONTAINER_NAME, continuing to wait..."
                fi
              else
                echo "⚠️  gRPC services not ready on $CONTAINER_NAME yet, waiting ${WAIT_INTERVAL}s..."
              fi
              
              sleep $WAIT_INTERVAL
              ELAPSED=$((ELAPSED + WAIT_INTERVAL))
            done
            
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ DPU dataplane on $CONTAINER_NAME did not become ready within ${MAX_WAIT}s"
              echo "=== Checking stuck processes ==="
              docker exec "$CONTAINER_NAME" ps aux | grep dpctl || true
              echo "=== Container logs ==="
              docker logs --tail 100 "$CONTAINER_NAME"
              FAILED=1
            fi
          done
          
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ One or more DPU containers failed verification"
            exit 1
          fi
          echo ""
          echo "✅ All DPU containers verified successfully"

      - name: Launch AGW container
        run: |
          cd tests/sanity/smartswitch
          make launch-agw
        env:
          TIMESCAPE_PASSWORD: ${{ secrets.TIMESCAPE_PASSWORD }}
          PROMETHEUS_PASSWORD: ${{ secrets.PROMETHEUS_PASSWORD }}

      - name: Configure network
        run: |
          cd tests/sanity/smartswitch
          make configure-network-multi

      - name: Show container status
        run: |
          cd tests/sanity/smartswitch
          make status

      - name: Install test dependencies
        run: |
          cd tests/sanity/smartswitch
          make install-test-dependencies

      - name: Run sanity tests
        run: |
          cd tests/sanity/smartswitch
          sudo make run-tests-with-allure
      
      - name: Debug K8s infrastructure on failure
        if: failure()
        run: |
          KUBECONFIG=/tmp/agw-test-kubeconfig
          if [ -f "$KUBECONFIG" ]; then
            echo "=== Kind Cluster Nodes ==="
            kubectl --kubeconfig $KUBECONFIG get nodes -o wide || true
            echo ""
            echo "=== All Pods ==="
            kubectl --kubeconfig $KUBECONFIG get pods -A -o wide || true
            echo ""
            echo "=== Timescape Pods ==="
            kubectl --kubeconfig $KUBECONFIG -n hubble-timescape get pods -o wide || true
            kubectl --kubeconfig $KUBECONFIG -n hubble-timescape describe pods || true
            echo ""
            echo "=== Timescape Services ==="
            kubectl --kubeconfig $KUBECONFIG -n hubble-timescape get svc -o wide || true
            echo ""
            echo "=== Timescape Pod Logs ==="
            for POD in $(kubectl --kubeconfig $KUBECONFIG -n hubble-timescape get pods -o name 2>/dev/null); do
              echo "--- $POD ---"
              kubectl --kubeconfig $KUBECONFIG -n hubble-timescape logs $POD --all-containers --tail=50 || true
            done
            echo ""
            echo "=== Prometheus Pods ==="
            kubectl --kubeconfig $KUBECONFIG -n monitoring get pods -o wide || true
            echo ""
            echo "=== Helm Releases ==="
            KUBECONFIG=$KUBECONFIG helm list -A || true
            echo ""
            echo "=== ConfigMaps ==="
            kubectl --kubeconfig $KUBECONFIG -n hypershield get configmap smartswitch-timescape-config -o yaml || true
          else
            echo "No kubeconfig found at $KUBECONFIG — kind cluster may not have been created"
          fi

      - name: Debug DPU containers on failure
        if: failure()
        run: |
          echo "=== DPU Container Status ==="
          CONTAINERS=$(docker ps -a --format '{{.Names}}' | grep naples || echo "none")
          if [ "$CONTAINERS" = "none" ]; then
            echo "No DPU containers found"
            exit 0
          fi
          
          for CONTAINER_NAME in $CONTAINERS; do
            echo ""
            echo "========================================"
            echo "Debug: $CONTAINER_NAME"
            echo "========================================"
            docker inspect "$CONTAINER_NAME" --format='{{json .State}}' | jq '.'
            
            echo ""
            echo "=== Processes ==="
            docker exec "$CONTAINER_NAME" ps auxf || true
            
            echo ""
            echo "=== Container Logs (last 100 lines) ==="
            docker logs --tail 100 "$CONTAINER_NAME" || true
            
            echo ""
            echo "=== /var/log/pensando (if mounted) ==="
            cd tests/sanity/smartswitch
            if [ -d "dsc/$CONTAINER_NAME/var/log/pensando" ]; then
              find "dsc/$CONTAINER_NAME/var/log/pensando" -type f -name "*.log" -exec echo "--- {} ---" \; -exec tail -50 {} \;
            else
              echo "Log directory not found for $CONTAINER_NAME"
            fi
            cd -
          done

      - name: Load Allure test report history
        id: load-allure-history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: always()
        continue-on-error: true
        with:
          repository: 'isovalent/hubble-fgs'
          ref: gh-pages
          path: gh-pages
          token: ${{ github.token }}

      - name: Build Allure Test report
        uses: simple-elf/allure-report-action@master # legit:ignore
        id: build-allure-report
        if: always()
        with:
          github_repo: 'isovalent/hubble-fgs'
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: tests/sanity/smartswitch/allure-results
          subfolder: agw-sanity
          allure_report: allure-report-agw-sanity
          keep_reports: 30
        
      - name: Create gh-pages branch if needed
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if gh-pages branch exists remotely
          if ! git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "Creating gh-pages branch..."
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initial gh-pages commit"
            git push origin gh-pages
          else
            echo "gh-pages branch already exists"
          fi

      # - name: Publish Allure report
      #   uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
      #   if: always()
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_branch: gh-pages
      #     publish_dir: allure-history
      #     keep_files: true
      #     commit_message: 'Deploy Allure report'
      #     user_name: 'github-actions[bot]'
      #     user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agw-sanity-test-results
          path: |
            tests/sanity/smartswitch/.pytest_cache
            tests/sanity/smartswitch/allure-results
          retention-days: 5

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agw-sanity-container-logs
          path: |
            /tmp/*.log
          retention-days: 5

      - name: Cleanup containers
        if: always()
        run: |
          cd tests/sanity/smartswitch
          make shutdown
