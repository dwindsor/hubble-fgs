name: HubbleFGS Go Test
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        path: go/src/github.com/covalentio/hubble-fgs/
    - uses: actions/setup-go@v1
      with:
        go-version: '1.13'
    - name: Run go tests
      env:
        GOPATH: /home/runner/work/hubble-fgs/hubble-fgs/go
      run: |
        sudo apt install libelf-dev
        export PATH=/opt/hostedtoolcache/go/1.13.4/x64/bin:${GOPATH}/bin:${PATH}
        export LD_LIBRARY_PATH=/home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/covalentio/hubble-fgs/libs/
        sudo sed -i '/secure_path/d' /etc/sudoers
        sudo sed -i '/env_reset/d' /etc/sudoers
        sudo -E cp /home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/covalentio/hubble-fgs/libs/* /usr/lib/
        cd /home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/covalentio/hubble-fgs
        sudo -E echo "run go tests: " `uname -a`
        sudo -E go get -u github.com/golang/dep/cmd/dep
        sudo -E go get -u golang.org/x/lint/golint
        sudo -E dep check
        sudo -E make test
