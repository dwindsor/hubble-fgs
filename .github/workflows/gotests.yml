name: HubbleFGS Go Test
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ ubuntu-18.04, ubuntu-20.04 ]
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.17.8'
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        path: go/src/github.com/isovalent/hubble-fgs/
    - name: Check formatting
      working-directory: go/src/github.com/isovalent/hubble-fgs
      run: |
        go fmt ./...
        git diff --exit-code
    - name: Check module vendoring
      run: |
        cd /home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/isovalent/hubble-fgs
        go mod tidy
        go mod vendor
        go mod verify
        test -z "$(git status --porcelain)" || (echo "please run 'go mod tidy && go mod vendor', and submit your changes"; exit 1)
    - name: Increase open file descriptors limit
      run: echo fs.file-max=1048576 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p
    - name: Run go tests
      env:
        GOPATH: /home/runner/work/hubble-fgs/hubble-fgs/go
      run: |
        docker login quay.io -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }}
        sudo apt install libelf-dev netcat-traditional
        export PATH=${GOPATH}/bin:${PATH}
        sudo -E echo "copy build tools from images"
        cd /home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/isovalent/hubble-fgs
        sudo -E make tools-install LIBBPF_INSTALL_DIR=/usr/local/lib CLANG_INSTALL_DIR=/usr/bin
        sudo -E ldconfig /usr/local/
        sudo sed -i '/secure_path/d' /etc/sudoers
        sudo sed -i '/env_reset/d' /etc/sudoers
        sudo -E ./contrib/vmlinux-builder/apt-get-btf.sh
        echo `which clang`
        echo `which llc`
        echo `clang --version`
        sudo make hubble-bpf
        sudo -E echo "run go tests: " `uname -a`
        sudo -E go mod verify
        sudo -E GO111MODULE=off go get -u golang.org/x/lint/golint
        export FGS_LIB="/home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/isovalent/hubble-fgs/bpf/objs/"
        sudo -E make fetch-testdata
        sudo apt install gcc # needed for contrib-progs
        sudo -E make contrib-progs
        sudo -E make test

    - name: Upload FGS logs
      if: failure()
      uses: actions/upload-artifact@v2
      with:
        name: hubble-fgs-json
        path: /tmp/hubble-fgs.gotest*
        retention-days: 5

    - name: Upload bugtool dumps
      if: failure()
      uses: actions/upload-artifact@v2
      with:
        name: fgs-bugtool
        path: /tmp/fgs-bugtool-*
        retention-days: 5
