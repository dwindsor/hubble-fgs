name: HubbleFGS Go Test
on:
  pull_request:
    paths-ignore:
    - "**.md"
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ ubuntu-20.04 ]
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.18.3'
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: go/src/github.com/isovalent/hubble-fgs/
        submodules: true
    - name: Install liburing
      run: |
        git clone https://github.com/axboe/liburing.git
        cd liburing
        ./configure
        make
        sudo make install
        cd ..
    - name: Run go tests
      env:
        GOPATH: /home/runner/work/hubble-fgs/hubble-fgs/go
      run: |
        docker login quay.io -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }}
        sudo apt install libelf-dev netcat-openbsd netcat-traditional libcap-dev libaio-dev
        export PATH=${GOPATH}/bin:${PATH}
        sudo -E echo "copy build tools from images"
        cd /home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/isovalent/hubble-fgs
        sudo sed -i '/secure_path/d' /etc/sudoers
        sudo sed -i '/env_reset/d' /etc/sudoers
        echo `which clang`
        echo `which llc`
        echo `clang --version`
        make check-copyright
        sudo make hubble-bpf
        sudo -E echo "run go tests: " `uname -a`
        sudo -E go mod verify
        sudo -E GO111MODULE=off go get -u golang.org/x/lint/golint
        export FGS_LIB="/home/runner/work/hubble-fgs/hubble-fgs/go/src/github.com/isovalent/hubble-fgs/bpf/objs/"
        sudo -E make fetch-testdata
        sudo apt install gcc # needed for tester-progs
        sudo -E make hubble-fgs-fs-scanner
        sudo -E make tester-progs
        sudo -E make test

    - name: Upload FGS logs
      if: failure()
      uses: actions/upload-artifact@83fd05a356d7e2593de66fc9913b3002723633cb
      with:
        name: hubble-fgs-json
        path: /tmp/hubble-fgs.gotest*
        retention-days: 5

    - name: Upload bugtool dumps
      if: failure()
      uses: actions/upload-artifact@83fd05a356d7e2593de66fc9913b3002723633cb
      with:
        name: tetragon-bugtool
        path: /tmp/tetragon-bugtool-*
        retention-days: 5
