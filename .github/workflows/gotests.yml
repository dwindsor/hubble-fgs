name: HubbleFGS Go Test
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm64 ]
    steps:
    - name: Checkout code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        submodules: true

    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.25.0'

    - name: Install dependencies x86
      run: |
        if [ "$RUNNER_ARCH" == "X64" ]; then
          sudo apt-get update
          sudo apt-get -y install libc6-dev-i386
        fi

    - name: Install dependencies ARM
      run: |
        if [ "$RUNNER_ARCH" == "ARM64" ]; then
          sudo apt-get update
          sudo apt-get -y install gcc-arm-linux-gnueabihf
        fi

    - name: Run go tests
      env:
        GOPATH: ${{ env.GITHUB_WORKSPACE }}/go
      run: |
        docker login quay.io -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }}
        sudo apt update -y
        sudo apt install libelf-dev netcat-openbsd netcat-traditional socat libcap-dev libaio-dev liburing-dev iproute2 net-tools
        export PATH=${GOPATH}/bin:${PATH}
        sudo -E echo "copy build tools from images"
        sudo sed -i '/secure_path/d' /etc/sudoers
        sudo sed -i '/env_reset/d' /etc/sudoers
        echo `which clang`
        echo `which llc`
        echo `clang --version`
        make check-copyright
        sudo make tetragon-bpf
        sudo -E echo "run go tests: " `uname -a`
        export FGS_LIB="$(pwd)/bpf/objs/"
        sudo apt install gcc # needed for tester-progs
        sudo -E make tetragon-fs-scanner
        sudo -E make tester-progs
        export FLAKY_HTTP=1
        sudo -E make test GO_TEST_TIMEOUT=60m SUDO="sudo -E"

    - name: Upload FGS logs
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: hubble-fgs-json
        path: /tmp/tetragon.gotest*
        retention-days: 5

    - name: Upload bugtool dumps
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tetragon-bugtool
        path: /tmp/tetragon-bugtool*
        retention-days: 5

  # This job ensures that the plain vanilla "go test" command passes without any
  # external dependencies. It's a wonderful thing.
  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        submodules: true

    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.25.0'

    - name: Run unit tests
      run: |
        GOEXPERIMENT=synctest go test ./...
