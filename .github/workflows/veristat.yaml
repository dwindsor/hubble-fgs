name: Run veristat
on:
  push:
    branches:
      - main
      - v*
    paths:
      - 'bpf/**'
      - '.github/actions/veristat/**'
  pull_request:
    paths:
      - 'bpf/**'
      - '.github/actions/veristat/**'

jobs:
  veristat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Build BPF programs
        run: make tetragon-bpf

      - name: Run veristat
        uses: ./.github/actions/veristat
        with:
          programs: "bpf/objs/*.o"
