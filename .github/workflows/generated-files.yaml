name: Validate that generated files are up to date
on:
  push:
    branches:
      - master
      - v*
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: true
          fetch-depth: 0
      - name: Lint protobuf
        run: |
          # TODO: enable linting once we have a chance to fix the underlying issues
          # make -C api lint EXTRA_BUF_FLAGS="--error-format=github-actions"
          if ${{ github.event_name == 'push' }}; then
            make -C api check-breaking EXTRA_BUF_FLAGS="--error-format=github-actions" BUF_BREAKING_AGAINST_BRANCH="origin/${{ github.ref_name }}"
          else
            make -C api check-breaking EXTRA_BUF_FLAGS="--error-format=github-actions" BUF_BREAKING_AGAINST_BRANCH="origin/${{ github.base_ref }}"
          fi
          make -C api format EXTRA_BUF_FLAGS="--exit-code --error-format=github-actions"
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.24.1'
      - name: Validate that generated files are up to date.
        run: |
          git config --global url."https://isovalent-bot:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com".insteadOf "https://github.com"
          # The following make targets will checkout OSS code, and run make generate and make codegen
          if ${{ github.event_name == 'push' }}; then
            make oss-init oss-checkout BUF_BREAKING_AGAINST_BRANCH="origin/${{ github.ref_name }}"
          else
            make oss-init oss-checkout BUF_BREAKING_AGAINST_BRANCH="origin/${{ github.base_ref }}"
          fi
          test -z "$(git status --porcelain)" || (git status --porcelain; exit 1)
      - name: Check metrics docs
        run: |
          make lint-metrics-md || (git diff; exit 1)
      - name: Check Tetragon daemon flags
        run: |
          make generate-flags
          git status
          git diff
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status --porcelain
            echo "Please run 'make generate-flags' and submit your changes'"; exit 1
          fi
