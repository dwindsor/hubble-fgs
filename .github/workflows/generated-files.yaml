name: Validate that generated files are up to date
on:
  push:
    branches:
      - master
      - v*
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          submodules: true
      - name: Install Go
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.21.1'
      - name: Validate that generated files are up to date.
        run: |
          # The following make targets will checkout OSS code, and run make generate and make codegen
          make oss-init oss-checkout
          test -z "$(git status --porcelain)" || (git status --porcelain; exit 1)
