name: Validate that generated files are up to date
on:
  push:
    branches:
      - master
      - v*
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
        with:
          submodules: true
      - name: Install Go
        uses: actions/setup-go@fac708d6674e30b6ba41289acaab6d4b75aa0753 # v4.0.1
        with:
          go-version: '1.20.6'
      - name: Validate that generated files are up to date.
        run: |
          # The following make targets will checkout OSS code, and run make generate and make codegen
          make oss-init oss-checkout
          test -z "$(git status --porcelain)" || (git status --porcelain; exit 1)
