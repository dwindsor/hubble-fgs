name: Run static checks & validate that generated files are up to date
on:
  push:
    branches:
      - master
      - v*
  pull_request:
jobs:
  static-checks-and-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Go
        uses: actions/setup-go@v2.1.4
        with:
          go-version: '1.17.3'
      - name: Run static checks
        uses: golangci/golangci-lint-action@5c56cd6c9dc07901af25baab6f2b0d9f3b7c3018
        with:
          version: v1.43.0
          args: --config=.golangci.yml --verbose
          only-new-issues: true
          skip-go-installation: true
          skip-pkg-cache: true
          skip-build-cache: true
      - name: Validate that generated files are up to date.
        run: |
          make generate
          make -C api doc
          test -z "$(git status --porcelain)" || (git status --porcelain; exit 1)
