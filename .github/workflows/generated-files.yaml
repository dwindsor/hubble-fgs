name: Generated files
on:
  push:
    branches:
      - master
      - v*
  pull_request:
jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Validate that generated files are up to date.
        run: |
          make generate
          make -C api/v1 doc
          git diff --exit-code
