name: Validate that generated files are up to date
on:
  push:
    branches:
      - master
      - v*
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Install Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.24.1'
      - name: Validate that generated files are up to date.
        run: |
          git config --global url."https://isovalent-bot:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com".insteadOf "https://github.com"
          # The following make targets will checkout OSS code, and run make generate and make codegen
          make oss-init oss-checkout
          test -z "$(git status --porcelain)" || (git status --porcelain; exit 1)
      - name: Check metrics docs
        run: |
          make lint-metrics-md || (git diff; exit 1)
      - name: Check Tetragon daemon flags
        run: |
          make generate-flags
          git status
          git diff
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status --porcelain
            echo "Please run 'make generate-flags' and submit your changes'"; exit 1
          fi
