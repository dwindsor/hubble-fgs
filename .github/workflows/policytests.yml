name: VM Policytests

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      amd64_runner_label:
        type: string
        required: true
      arm64_runner_label:
        type: string
        required: true

jobs:
  vmpolicytests:
    name: Policytests (${{ matrix.arch }}, ${{ matrix.kernel }})
    runs-on: ${{ (matrix.arch == 'arm64' && inputs.arm64_runner_label) || inputs.amd64_runner_label }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - 'rhel8.10-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - 'bpf-next-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.18-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.12-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.6-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.1-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '5.15-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '5.10-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '5.4-20260831.012453'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '4.19-20260831.012453'
        exclude:
          - arch: arm64
            # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
            kernel: 'rhel8.10-20260831.012453'
          - arch: arm64
            # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
            kernel: '5.4-20260831.012453'
    steps:
      - name: Remove slow Azure apt mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install VM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libguestfs-tools qemu-utils zstd \
            ${{ (matrix.arch == 'arm64' && 'qemu-system-arm') || 'qemu-system-x86' }}

      - name: Make kernel accessible
        run: sudo chmod go+rX -R /boot/

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Download policytest assets (${{ matrix.arch }})
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policytest-assets-${{ matrix.arch }}
          path: ./policytest-assets

      - name: Extract policytest assets
        run: |
          tar -xzf ./policytest-assets/vmtests-bins.tar.gz \
            -C modules/tetragon-oss/tests/vmtests
          mv ./policytest-assets/tester-progs.tar.gz modules/tetragon-oss/
          ./modules/tetragon-oss/tests/vmtests/tetragon-vmtests-run --help > /dev/null

      - name: Download ${{ inputs.artifact }}-${{ matrix.arch }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}-${{ matrix.arch }}
          path: ./build/${{ matrix.arch }}/linux-tarball

      - name: Resolve and verify ${{ inputs.artifact }}-${{ matrix.arch }}
        id: tarball
        run: |
          tarballs=(*.tar.gz)
          sha256sum -c "${tarballs[0]}.sha256sum"
          echo "path=$PWD/${tarballs[0]}" >> "$GITHUB_OUTPUT"
        working-directory: ./build/${{ matrix.arch }}/linux-tarball

      - name: Fetch VM base image and kernel ${{ matrix.kernel }}
        run: ./tests/vmtests/fetch-data.sh ${{ matrix.kernel }}
        working-directory: ./modules/tetragon-oss

      - name: Run policytests against ${{ inputs.artifact }}-${{ matrix.arch }}
        run: |
          kimage=$(find tests/vmtests/test-data/kernels -path "*vmlinuz*" -type f)
          echo "kernel: $kimage"
          btf_args=()
          if [[ "${{ matrix.kernel }}" == 4.19* ]]; then
            btf=$(find tests/vmtests/test-data/kernels -path "*btf*" -type f)
            echo "btf: $btf"
            btf_args=(--btf-file "$btf")
          fi
          sudo ./tests/vmtests/tetragon-vmtests-run policytest \
            --kernel "$kimage" \
            "${btf_args[@]}" \
            --base tests/vmtests/test-data/images/base.qcow2 \
            --tetragon-tarball "${{ steps.tarball.outputs.path }}" \
            --tester-progs-tarball tester-progs.tar.gz \
            --cpu 4 \
            --mem 8G
        working-directory: ./modules/tetragon-oss
