name: VM Policytests

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      amd64_runner_label:
        type: string
        required: true
      arm64_runner_label:
        type: string
        required: true

jobs:
  vmpolicytests:
    name: Policytests (${{ matrix.arch }}, ${{ matrix.kernel }})
    runs-on: ${{ (matrix.arch == 'arm64' && inputs.arm64_runner_label) || inputs.amd64_runner_label }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - 'rhel8.10-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - 'bpf-next-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.18-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.12-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.6-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '6.1-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '5.15-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '5.10-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '5.4-20260928.013030'
          # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
          - '4.19-20260928.013030'
        exclude:
          - arch: arm64
            # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
            kernel: 'rhel8.10-20260928.013030'

    steps:
      - name: Remove slow Azure apt mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install VM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libguestfs-tools qemu-utils zstd \
            ${{ (matrix.arch == 'arm64' && 'qemu-system-arm') || 'qemu-system-x86' }}

      - name: Make kernel accessible
        run: sudo chmod go+rX -R /boot/

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Download policytest assets (${{ matrix.arch }})
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policytest-assets-${{ matrix.arch }}
          path: ./policytest-assets

      - name: Extract policytest assets
        run: |
          tar -xzf ./policytest-assets/vmtests-bins.tar.gz \
            -C modules/tetragon-oss/tests/vmtests
          mv ./policytest-assets/tester-progs.tar.gz modules/tetragon-oss/
          ./modules/tetragon-oss/tests/vmtests/tetragon-vmtests-run --help > /dev/null

      - name: Download ${{ inputs.artifact }}-${{ matrix.arch }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}-${{ matrix.arch }}
          path: ./build/${{ matrix.arch }}/linux-tarball

      - name: Resolve and verify ${{ inputs.artifact }}-${{ matrix.arch }}
        id: tarball
        run: |
          tarballs=(*.tar.gz)
          sha256sum -c "${tarballs[0]}.sha256sum"
          echo "path=$PWD/${tarballs[0]}" >> "$GITHUB_OUTPUT"
        working-directory: ./build/${{ matrix.arch }}/linux-tarball

      - name: Fetch VM base image and kernel ${{ matrix.kernel }}
        run: ./tests/vmtests/fetch-data.sh ${{ matrix.kernel }}
        working-directory: ./modules/tetragon-oss

      - name: Run policytests against ${{ inputs.artifact }}-${{ matrix.arch }}
        run: |
          kimage=$(find tests/vmtests/test-data/kernels -path "*vmlinuz*" -type f)
          echo "kernel: $kimage"
          btf_args=()
          policytest_env_args=()
          if [[ "${{ matrix.kernel }}" == 4.19* ]]; then
            btf=$(find tests/vmtests/test-data/kernels -path "*btf*" -type f)
            echo "btf: $btf"
            btf_args=(--btf-file "$btf")
          fi
          case "${{ matrix.kernel }}" in
            bpf-next-*|6.12-*|6.18-*|6.6-*|6.1-*|5.15-*|5.10-*)
              # FIXME: TLS policytests fail on these kernels.
              policytest_env_args=(--env FLAKY_HTTP=1)
              ;;
          esac
          sudo ./tests/vmtests/tetragon-vmtests-run policytest \
            --kernel "$kimage" \
            "${btf_args[@]}" \
            "${policytest_env_args[@]}" \
            --base tests/vmtests/test-data/images/base.qcow2 \
            --tetragon-tarball "${{ steps.tarball.outputs.path }}" \
            --tester-progs-tarball tester-progs.tar.gz \
            --policytest-extra-args debug=true \
            --cpu 4 \
            --mem 8G \
            --policytest-extra-args ee-bindir=/usr/local/lib/tetragon/tester-progs/ee
        working-directory: ./modules/tetragon-oss

      - name: Collect tetragon logs
        if: failure() || cancelled()
        run: |
          outdir="$PWD/policytests-logs"
          mkdir -p "$outdir"

          # the VM is powered off at this point, so pull its logs out of the image
          img=tests/vmtests/test-data/images/tetragon.qcow2
          if [ -f "$img" ]; then
            sudo virt-copy-out -a "$img" /var/log "$outdir" || \
              echo "failed to copy /var/log out of $img"
          fi
          if compgen -G "$outdir/log/journal/*/*.journal" > /dev/null; then
            sudo journalctl --no-pager -o short-precise \
              --file "$outdir/log/journal/*/*.journal" > "$outdir/journal.log" || true
          fi

          sudo chmod -R go+rX "$outdir"
        working-directory: ./modules/tetragon-oss

      - name: Upload tetragon logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policytests-logs-${{ matrix.arch }}-${{ matrix.kernel }}
          path: ./modules/tetragon-oss/policytests-logs
          retention-days: 5
