name: Image CI Build

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-push:
    uses: ./.github/workflows/build-images-base.yml
    permissions:
      contents: read
      actions: read
      # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
      id-token: write
    with:
      sha: "${{ github.event.pull_request.head.sha }}"
    secrets: inherit

  build-and-push-ubi:
    uses: ./.github/workflows/build-images-ubi-base.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      sha: "${{ github.event.pull_request.head.sha }}"
    secrets: inherit
