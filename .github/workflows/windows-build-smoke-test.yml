name: Windows Build and Smoke
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"

  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
jobs:
  windows-ebpf-prog-build:
    name: Build Windows ebpf programs
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 25

    env:
      GOCACHE: D:\gocache
      GOMODCACHE: D:\gomodcache
      TEMP: D:\temp
      CI_EFW_VERSION: 0.20.0
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64

    steps:
      - name: Create Temp Directory
        run: mkdir D:\temp
        shell: pwsh

      - name: Checkout Tetragon Repo 
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: go/src/github.com/isovalent/hubble-fgs
          submodules: true

      - name: Install LLVM 18.1.8
        run: |
          # Install LLVM 18.1.8 to ensure consistent version across runners
          try {
            choco install llvm --version=18.1.8 --allow-downgrade --force -y
            # Add installed LLVM to PATH first so it takes precedence
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Successfully installed LLVM 18.1.8"
          } catch {
            Write-Warning "Failed to install LLVM 18.1.8 via chocolatey: $($_.Exception.Message)"
            Write-Host "Continuing with pre-installed LLVM version"
          }

      - name: Set MSVC Environment Variables
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          powershell.exe "echo 'msvc_tools_path=%VCToolsInstallDir%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo 'msvc_tools_version=%VCToolsVersion%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo 'ASAN_WIN_CONTINUE_ON_INTERCEPTION_FAILURE=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo 'VCINSTALLDIR=%VCINSTALLDIR%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@767f00a3f09872d96a0cb9fcd5e6a4ff33311330
        with:
          msbuild-architecture: x64
      
      - name: Add Visual Studio LLVM to path
        run: |
          echo "$env:VCINSTALLDIR\tools\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check for Clang version (MSVC)
        run:
          clang.exe --version

      - name: Check clang version (LLVM)
        shell: cmd
        run:
            '"c:\Program Files\llvm\bin\clang.exe" --version'

      - name: Download ntosebpfext 
        id: download-ntosebpfet
        shell: powershell
        working-directory: ${{ env.TEMP }}
        run: | 
          git clone --recursive https://github.com/microsoft/ntosebpfext.git
          cd ${{ env.TEMP }}\ntosebpfext
          git checkout e7dc209a8be0da2ff5d75f5772a0ee0bf4a10383
      
      - name: Copy Process_monitor.c file
        run: |
            $sourcePath = "${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\modules\tetragon-oss\bpf\windows\process_monitor.c"
            $destinationPath = "${{ env.TEMP }}\ntosebpfext\tools\process_monitor_bpf\process_monitor.c"
            Copy-Item -Path $sourcePath -Destination $destinationPath -Force
        shell: powershell

      - name: Configuring repo for first build
        working-directory: ${{ env.TEMP }}\ntosebpfext
        env:
          CXXFLAGS: /ZH:SHA_256 ${{ env.CXX_FLAGS }}
          LDFLAGS: ${{ env.LD_FLAGS }}
        run: |
            .\scripts\initialize_repo.ps1
 
      - name: Build Process monitor ebpf program
        working-directory: ${{ env.TEMP }}\ntosebpfext
        run: msbuild -target:Tools\process_monitor_bpf:Rebuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} /bl:${{env.BUILD_PLATFORM}}_${{env.BUILD_CONFIGURATION}}\build_logs\build.binlog ${{env.BUILD_OPTIONS}} ${{env.SOLUTION_FILE_PATH}}


      - name: Download efw nuget package 
        working-directory: ${{ env.TEMP }}
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/ebpf-for-windows/releases/download/Release-v0.21.0/eBPF-for-Windows.x64.0.21.0.nupkg" -OutFile "${{ env.TEMP }}\efw.nupkg.zip"
          Expand-Archive -Path "${{ env.TEMP }}\efw.nupkg.zip" -DestinationPath "${{ env.TEMP }}\packages\eBPF-for-Windows.0.21.0"

      - name: Build tcp_connect monitor ebpf program
        shell: cmd
        working-directory: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\windows
        run:
            '"c:\Program Files\llvm\bin\clang.exe" -g -target bpf -O2 -Werror -I${{ env.TEMP }}\ntosebpfext\packages\eBPF-for-Windows.0.18.0\build\native\include -c .\tcp_connect.c -o tcp_connect.o'


      - name: Link  tcp_connect monitor ebpf program
        shell: powershell
        working-directory: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\windows
        run: |
            ${{ env.TEMP }}\packages\eBPF-for-Windows.0.21.0\build\native\bin\Convert-BpfToNative.ps1 -FileName tcp_connect -IncludeDir ${{ env.TEMP }}\packages\eBPF-for-Windows.0.21.0\build\native\include -Platform x64 -Configuration Release -KernelMode $True -Verbose -Packages ${{ env.TEMP }}\ntosebpfext\packages
            Copy-Item -Path ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\windows\tcp_connect.sys -Destination ${{ env.TEMP }}\ntosebpfext\${{env.BUILD_PLATFORM}}\${{env.BUILD_CONFIGURATION}} -Force

      - name: Stage  tcp_connect monitor ebpf program
        shell: powershell
        working-directory: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\windows
        run:
            Copy-Item -Path ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\windows\tcp_connect.sys -Destination ${{ env.TEMP }}\ntosebpfext\${{env.BUILD_PLATFORM}}\${{env.BUILD_CONFIGURATION}} -Force


      - name: Zip Build Output
        working-directory: ${{ env.TEMP }}\ntosebpfext
        run: |
          Compress-Archive -Path ${{env.BUILD_PLATFORM}}\${{env.BUILD_CONFIGURATION}} -DestinationPath .\build-${{env.BUILD_PLATFORM}}.${{env.BUILD_CONFIGURATION}}.zip

      - name: Upload Build Output
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8
        with:
          name: ntosebpfext-build-output
          path: ${{ env.TEMP }}\ntosebpfext\build-${{env.BUILD_PLATFORM}}.${{env.BUILD_CONFIGURATION}}.zip
          retention-days: 5

  windows-tetragon-build:
    name: Build, Unit Test and Upload Windows Tetragon and Tetra Binaries
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    needs: windows-ebpf-prog-build
    timeout-minutes: 15
    env:
      TEMP: D:\temp
      GOARCH: amd64
      GOOS: windows

    steps:
      - name: Check versions
        shell: powershell
        run: |
          $PSVersionTable

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.3'

      - name: Create Temp Directory
        run: mkdir D:\temp
        shell: powershell
      
      - name: Create Temp Staging Directory
        run: mkdir D:\temp\test
        shell: powershell

      - name: Cache eBPF for Windows installer
        id: cache-ebpf-installer
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:\temp\efw.zip
          key: ${{ runner.os }}-ebpf-installer-v0.21.0

      - name: Download and Install eBPF for Windows
        shell: powershell
        run: |
          function Test-ZipFile {
              param([string]$FilePath)
              try {
                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  $zip = [System.IO.Compression.ZipFile]::OpenRead($FilePath)
                  $isValid = $zip.Entries.Count -ge 0
                  $zip.Dispose()
                  return $isValid
              }
              catch {
                  return $false
              }
          }

          $maxRetries = 3
          $retryCount = 0
          $downloadUrl = "https://github.com/microsoft/ebpf-for-windows/releases/download/Release-v0.21.0/Build-native-only.NativeOnlyRelease.x64.zip"
          $zipPath = "D:\temp\efw.zip"
          $extractPath = "D:\temp"
          $ebpfPath = "D:\temp\ebpf"

          while ($retryCount -lt $maxRetries) {
              try {
                  Write-Host "Download attempt $($retryCount + 1) of $maxRetries..."
                  
                  # Use WebClient instead of Invoke-WebRequest
                  $webClient = New-Object System.Net.WebClient
                  $webClient.Headers.Add("User-Agent", "PowerShell/5.1")
                  $webClient.DownloadFile($downloadUrl, $zipPath)
                  $webClient.Dispose()
                  
                  # Validate the download
                  if (Test-Path $zipPath) {
                      $fileInfo = Get-Item $zipPath
                      Write-Host "Downloaded file size: $($fileInfo.Length) bytes"
                      
                      if (Test-ZipFile $zipPath) {
                          break
                      } else {
                          Write-Warning "Invalid or corrupted ZIP file detected"
                          Remove-Item $zipPath -Force
                      }
                  } else {
                      Write-Warning "Download file not found after download attempt"
                  }
              }
              catch {
                  Write-Warning "Download attempt failed: $($_.Exception.Message)"
                  if ($webClient) { $webClient.Dispose() }
                  if (Test-Path $zipPath) {
                      Remove-Item $zipPath -Force
                  }
              }
              
              $retryCount++
              if ($retryCount -lt $maxRetries) {
                  Write-Host "Waiting 5 seconds before retry..."
                  Start-Sleep -Seconds 5
              }
          }

          # Final validation before proceeding
          if (!(Test-Path $zipPath)) {
              throw "Download failed after $maxRetries attempts."
          }

          try {
              Write-Host "Extracting archive to $extractPath..."
              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force -ErrorAction Stop
          }
          catch {
              Write-Error "Failed to extract archive: $($_.Exception.Message)"
              throw
          }

          # Rename the extracted directory
          $originalPath = "D:\temp\Build-native-only NativeOnlyRelease x64"
          if (Test-Path $originalPath) {
              try {
                  Rename-Item -Path $originalPath -NewName $ebpfPath -ErrorAction Stop
              }
              catch {
                  Write-Error "Failed to rename directory: $($_.Exception.Message)"
                  throw
              }
          } else {
              Write-Error "Expected directory not found: $originalPath"
              Get-ChildItem -Path $extractPath -Directory | ForEach-Object { Write-Host "Found directory: $($_.FullName)" }
              throw "Extraction directory structure is not as expected"
          }

          # Find and execute the setup script
          Write-Host "Searching for setup script..."
          $setupScript = Get-ChildItem -Path $ebpfPath -Filter "setup-ebpf.ps1" -Recurse | Select-Object -First 1

          if ($setupScript) {
              Write-Host "Found setup script: $($setupScript.FullName)"
              
              # Change to the script directory
              $originalLocation = Get-Location
              try {
                  Set-Location -Path $setupScript.DirectoryName
                  Write-Host "Changed directory to: $(Get-Location)"
                  
                  # Execute the setup script
                  Write-Host "Executing setup script..."
                  & $setupScript.FullName
                  
                  Write-Host "Setup script execution completed"
              }
              catch {
                  Write-Error "Failed to execute setup script: $($_.Exception.Message)"
                  throw
              }
              finally {
                  # Restore original location
                  Set-Location -Path $originalLocation
              }
          } else {
              Write-Error "Setup script 'setup-ebpf.ps1' not found in the extracted package"
              Write-Host "Directory contents:"
              Get-ChildItem -Path $ebpfPath -Recurse | ForEach-Object { 
                  Write-Host "  $($_.FullName)" 
              }
              throw
          }

          Write-Host "Script execution completed successfully"

      - name: Add eBPF for Windows to PATH
        shell: pwsh
        run: echo "C:\Program Files\ebpf-for-windows\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download ntosebpfext-build-output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ${{ env.TEMP }}\test
          name: ntosebpfext-build-output
    
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: go/src/github.com/isovalent/hubble-fgs
          submodules: true
      
      - name: Install ntosebpfext
        working-directory: ${{ env.TEMP }}\test
        shell: powershell
        run: |
          $zipPath = Join-Path -Path ${{ env.TEMP }}\test -ChildPath "build-x64.Release.zip"
          Get-ChildItem -Path ${{ env.TEMP }}\test
          if (Test-Path -Path $zipPath) {
            Expand-Archive -Path $zipPath -DestinationPath ${{ env.TEMP }}\test
            Get-ChildItem -Path ${{ env.TEMP }}\test

            $ntosebpfextDir = "${{ env.TEMP }}\test"
            
            if (Test-Path -Path $ntosebpfextDir) {
              Write-Host "Extracted ntosebpfext to: $ntosebpfextDir"
              Get-ChildItem -Path $ntosebpfextDir
              New-Item -ItemType Directory -Path "${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\objs" -Force

              Copy-Item -Path "$ntosebpfextDir\Release\process_monitor_km\process_monitor.sys" -destination "${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\objs\" -Force

              Copy-Item -Path "$ntosebpfextDir\Release\tcp_connect.sys" -destination "${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\objs\" -Force

              Start-Process -FilePath "$ntosebpfextDir\Release\ntos_ebpf_ext_export_program_info.exe" -ArgumentList "--clear" -Wait
              Start-Process -FilePath "C:\Program Files\ebpf-for-windows\export_program_info.exe" -ArgumentList "--clear" -Wait

              Start-Process -FilePath "$ntosebpfextDir\Release\ntos_ebpf_ext_export_program_info.exe" -Wait
              Start-Process -FilePath "C:\Program Files\ebpf-for-windows\export_program_info.exe" -Wait

              sc.exe delete "ntosebpfext"
              sc.exe create ntosebpfext type= kernel start= demand binPath= "$ntosebpfextDir\Release\ntosebpfext\ntosebpfext.sys"
              sc.exe start ntosebpfext
            } else {
              Write-Error "ntosebpfext directory not found after extraction"
              exit 1
            }
          } else {
            Write-Error "ntosebpfext build output zip not found at: $zipPath"
            exit 1
          }


      - name: Run Unit Tests
        working-directory: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\pkg\bpftest\recordtest
        shell: powershell
        run: |

          Get-ChildItem -Recurse -Path "${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\bpf\objs"
          go test ./ -v


      - name: Build and Zip tetragon Windows binaries
        working-directory: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs
        shell: powershell
        run: |
          go build -o .\Tetra.exe .\cmd\bin\tetra\ 
          go build -o .\Tetragon.exe .\cmd\bin\tetragon\
          Get-ChildItem
          New-Item -ItemType Directory -Path ${{ env.TEMP }}\Tetragon-Windows
          Copy-Item *.exe -Destination ${{ env.TEMP }}\Tetragon-Windows
          Compress-Archive -Path ${{ env.TEMP }}\Tetragon-Windows\* -DestinationPath ${{ env.TEMP }}\Tetragon-Windows.zip
          Get-ChildItem -Recurse ${{ env.TEMP }} 

      - name: Upload Tetragon Windows binaries
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8
        with:
          name: tetragon-windows-build-output
          path: ${{ env.TEMP }}\Tetragon-Windows.zip
          retention-days: 5

  windows-smoke-test:
    name: Deploy and Test tetragon for Windows 
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    needs:
      - windows-tetragon-build
      - windows-ebpf-prog-build
    timeout-minutes: 15
    strategy:
      matrix:
        version:
          - main
    env:
      TEMP: D:\temp
      
    steps:
      - name: Create Temp Directory
        run: mkdir D:\temp
        shell: powershell
      
      - name: Create Temp Staging Directory
        run: mkdir D:\temp\test
        shell: powershell

      - name: Cache eBPF for Windows installer
        id: cache-ebpf-installer
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:\temp\efw.zip
          key: ${{ runner.os }}-ebpf-installer-v0.21.0

      - name: Download and Install eBPF for Windows
        shell: powershell
        run: |
          function Test-ZipFile {
              param([string]$FilePath)
              try {
                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  $zip = [System.IO.Compression.ZipFile]::OpenRead($FilePath)
                  $isValid = $zip.Entries.Count -ge 0
                  $zip.Dispose()
                  return $isValid
              }
              catch {
                  return $false
              }
          }

          $maxRetries = 3
          $retryCount = 0
          $downloadUrl = "https://github.com/microsoft/ebpf-for-windows/releases/download/Release-v0.21.0/Build-native-only.NativeOnlyRelease.x64.zip"
          $zipPath = "D:\temp\efw.zip"
          $extractPath = "D:\temp"
          $ebpfPath = "D:\temp\ebpf"

          while ($retryCount -lt $maxRetries) {
              try {
                  Write-Host "Download attempt $($retryCount + 1) of $maxRetries..."
                  
                  # Use WebClient instead of Invoke-WebRequest
                  $webClient = New-Object System.Net.WebClient
                  $webClient.Headers.Add("User-Agent", "PowerShell/5.1")
                  $webClient.DownloadFile($downloadUrl, $zipPath)
                  $webClient.Dispose()
                  
                  # Validate the download
                  if (Test-Path $zipPath) {
                      $fileInfo = Get-Item $zipPath
                      Write-Host "Downloaded file size: $($fileInfo.Length) bytes"
                      
                      if (Test-ZipFile $zipPath) {
                          break
                      } else {
                          Write-Warning "Invalid or corrupted ZIP file detected"
                          Remove-Item $zipPath -Force
                      }
                  } else {
                      Write-Warning "Download file not found after download attempt"
                  }
              }
              catch {
                  Write-Warning "Download attempt failed: $($_.Exception.Message)"
                  if ($webClient) { $webClient.Dispose() }
                  if (Test-Path $zipPath) {
                      Remove-Item $zipPath -Force
                  }
              }
              
              $retryCount++
              if ($retryCount -lt $maxRetries) {
                  Write-Host "Waiting 5 seconds before retry..."
                  Start-Sleep -Seconds 5
              }
          }

          # Final validation before proceeding
          if (!(Test-Path $zipPath)) {
              throw "Download failed after $maxRetries attempts."
          }

          try {
              Write-Host "Extracting archive to $extractPath..."
              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force -ErrorAction Stop
          }
          catch {
              Write-Error "Failed to extract archive: $($_.Exception.Message)"
              throw
          }

          # Rename the extracted directory
          $originalPath = "D:\temp\Build-native-only NativeOnlyRelease x64"
          if (Test-Path $originalPath) {
              try {
                  Rename-Item -Path $originalPath -NewName $ebpfPath -ErrorAction Stop
              }
              catch {
                  Write-Error "Failed to rename directory: $($_.Exception.Message)"
                  throw
              }
          } else {
              Write-Error "Expected directory not found: $originalPath"
              Get-ChildItem -Path $extractPath -Directory | ForEach-Object { Write-Host "Found directory: $($_.FullName)" }
              throw "Extraction directory structure is not as expected"
          }

          # Find and execute the setup script
          Write-Host "Searching for setup script..."
          $setupScript = Get-ChildItem -Path $ebpfPath -Filter "setup-ebpf.ps1" -Recurse | Select-Object -First 1

          if ($setupScript) {
              Write-Host "Found setup script: $($setupScript.FullName)"
              
              # Change to the script directory
              $originalLocation = Get-Location
              try {
                  Set-Location -Path $setupScript.DirectoryName
                  Write-Host "Changed directory to: $(Get-Location)"
                  
                  # Execute the setup script
                  Write-Host "Executing setup script..."
                  & $setupScript.FullName
                  
                  Write-Host "Setup script execution completed"
              }
              catch {
                  Write-Error "Failed to execute setup script: $($_.Exception.Message)"
                  throw
              }
              finally {
                  # Restore original location
                  Set-Location -Path $originalLocation
              }
          } else {
              Write-Error "Setup script 'setup-ebpf.ps1' not found in the extracted package"
              Write-Host "Directory contents:"
              Get-ChildItem -Path $ebpfPath -Recurse | ForEach-Object { 
                  Write-Host "  $($_.FullName)" 
              }
              throw
          }

          Write-Host "Script execution completed successfully"

      - name: Add eBPF for Windows to PATH
        shell: pwsh
        run: echo "C:\Program Files\ebpf-for-windows\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download tetragon-windows-build-output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ${{ env.TEMP }}\test
          name: tetragon-windows-build-output
      
      - name: Download ntosebpfext-build-output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ${{ env.TEMP }}\test
          name: ntosebpfext-build-output
    
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: go/src/github.com/isovalent/hubble-fgs/

      - name: Setup Tetragon for Windows 
        working-directory: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs
        shell: powershell
        run: ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\install\windows\setup-windows-ee.ps1 ${{ env.TEMP }}\test\Tetragon-Windows.zip ${{ env.TEMP }}\test\build-x64.Release.zip 

      - name: Run Smoke test Windows
        env:
          TEMP: D:\temp
          PATH: ${{ env.TEMP }};"C:\Program Files\ebpf-for-windows"
        working-directory: C:\Program Files\Tetragon\cmd
        shell: powershell
        run: |
          $jsonFilePath = "C:\Program Files\Tetragon\events.json"

          # Define the path to the executable
          $tetragonProcess = "C:\Program Files\Tetragon\cmd\tetragon.exe"

          # Start the process in the background and capture its PID
          $tetragonBackgroundProcess = Start-Process -FilePath "$tetragonProcess" -ArgumentList "--enable-tcp --enable-application-model --network-policy ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\examples\tetragonnetworkpolicy\example.yaml --export-filename ""$jsonFilePath""" -RedirectStandardOutput "C:\Program Files\Tetragon\tetragon.log" -NoNewWindow -PassThru
          Start-Sleep -Seconds 5
          if(Get-Process -id $tetragonBackgroundProcess.Id) {
            Write-Host "Tetragon is Running "
          }
          else {
            throw "Tetragon Could not be started"
          }

          Start-Process -FilePath ${{ github.workspace }}\go\src\github.com\isovalent\hubble-fgs\tests\e2e\windows\test-script.ps1


        

