name: Windows Build and Smoke

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"

env:
  TEMP: D:\temp
  GOARCH: amd64
  GOOS: windows
  GOCACHE: D:\gocache
  GOMODCACHE: D:\gomodcache
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  windows-ebpf-prog-build:
    name: Build Windows ebpf programs
    runs-on: windows-2025
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Create Temp Directory
        shell: pwsh
        run: mkdir D:\temp

      - name: Checkout Tetragon Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true

      - name: "Download LLVM 18.1.8"
        id: download-llvm
        uses: ./.github/actions/download-file
        with:
          file-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe"
          download-dir: "${{ env.TEMP }}"

      - name: Install LLVM 18.1.8
        shell: pwsh
        run: |
          # Install LLVM 18.1.8 to ensure consistent version across runners
          try { 
            Start-Process -FilePath "${{ steps.download-llvm.outputs.downloaded-file }}" `
                -ArgumentList "/S" `
                -Wait `
                -NoNewWindow `
                -PassThru            

            # Add installed LLVM to PATH first so it takes precedence
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Output "✓ Successfully installed LLVM 18.1.8"

            Write-Output "Clang (LLVM):"
            Write-Output "  $(& 'C:\Program Files\LLVM\bin\clang.exe' --version)"
          } 
          catch {
            Write-Warning "✗ Failed to install LLVM 18.1.8:  $($_.Exception.Message)"
            Write-Output "Continuing with pre-installed LLVM version"
          }

      - name: Set up Environment Variables
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          powershell.exe "echo 'msvc_tools_path=%VCToolsInstallDir%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo 'msvc_tools_version=%VCToolsVersion%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo 'ASAN_WIN_CONTINUE_ON_INTERCEPTION_FAILURE=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo 'VCINSTALLDIR=%VCINSTALLDIR%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
          powershell.exe "echo '%VCINSTALLDIR%\tools\llvm\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        with:
          msbuild-architecture: x64

      - name: Check Clang version (MSVC)
        shell: pwsh
        run: |
          Write-Output "  $(& 'clang.exe' --version)"

      - name: Check Clang version (LLVM)
        shell: pwsh
        run: |
          Write-Output "  $(& 'C:\Program Files\LLVM\bin\clang.exe' --version)"

      - name: Clone msft/ntosebpfext
        id: download-ntosebpfet
        shell: pwsh
        working-directory: ${{ env.TEMP }}
        run: |
          git clone --recursive https://github.com/microsoft/ntosebpfext.git
          cd ${{ env.TEMP }}\ntosebpfext
          git checkout tags/v0.6.0

      - name: Copy Process_monitor.c file
        shell: pwsh
        run: |
          Copy-Item -Path "${{ github.workspace }}\bpf\windows\process_monitor.c" `
                    -Destination "${{ env.TEMP }}\ntosebpfext\tools\process_monitor_bpf\process_monitor.c" `
                    -Force

          Copy-Item -Path "${{ github.workspace }}\bpf\windows\process.h" `
                    -Destination "${{ env.TEMP }}\ntosebpfext\tools\process_monitor_bpf\process.h" `
                    -Force

      - name: Configuring repo for first build
        shell: pwsh
        working-directory: ${{ env.TEMP }}\ntosebpfext
        env:
          CXXFLAGS: /ZH:SHA_256 ${{ env.CXX_FLAGS }}
          LDFLAGS: ${{ env.LD_FLAGS }}
        run: |
          .\scripts\initialize_repo.ps1

      - name: Build Process monitor ebpf program
        shell: pwsh
        working-directory: ${{ env.TEMP }}\ntosebpfext
        run: |
          msbuild -target:Tools\process_monitor_bpf:Rebuild `
            /m `
            /p:Configuration=${{env.BUILD_CONFIGURATION}} `
            /p:Platform=${{env.BUILD_PLATFORM}} `
            /bl:${{env.BUILD_PLATFORM}}_${{env.BUILD_CONFIGURATION}}\build_logs\build.binlog `
            ${{env.BUILD_OPTIONS}} `
            ${{env.SOLUTION_FILE_PATH}}

      - name: "Download efw nuget package"
        id: download-ebpf-nuget
        uses: ./.github/actions/download-file
        with:
          file-url: "https://www.nuget.org/api/v2/package/eBPF-for-Windows.x64/1.0.0-rc1"
          download-dir: "${{ env.TEMP }}"

      - name: "Rename .nuget -> .zip"
        shell: pwsh
        run: |
          Rename-Item -Path "${{ steps.download-ebpf-nuget.outputs.downloaded-file }}" -NewName efw.zip

      - name: "Extract eBPF archive"
        uses: ./.github/actions/extract-zip
        with:
          zip-file: "${{ env.TEMP }}/efw.zip"
          extract-dir: "${{ env.TEMP }}/packages/eBPF-for-Windows.1.0.0-rc1"

      - name: Build tcp_connect monitor ebpf program
        shell: pwsh
        working-directory: ${{ github.workspace }}\bpf\windows
        run: |
          & 'C:\Program Files\LLVM\bin\clang.exe' -g -O2 -Werror -target bpf `
            -I${{ env.TEMP }}\packages\eBPF-for-Windows.1.0.0-rc1\build\native\include `
            -c .\tcp_connect.c `
            -o tcp_connect.o

      - name: Link tcp_connect monitor ebpf program
        shell: pwsh
        working-directory: ${{ github.workspace }}\bpf\windows
        run: |
          ${{ env.TEMP }}\packages\eBPF-for-Windows.1.0.0-rc1\build\native\bin\Convert-BpfToNative.ps1 `
            -FileName tcp_connect `
            -IncludeDir ${{ env.TEMP }}\packages\eBPF-for-Windows.1.0.0-rc1\build\native\include `
            -Platform x64 `
            -Configuration Release `
            -KernelMode $True `
            -Verbose

      - name: Stage tcp_connect monitor ebpf program
        shell: pwsh
        working-directory: ${{ github.workspace }}\bpf\windows
        run: |
          Copy-Item `
            -Path ${{ github.workspace }}\bpf\windows\tcp_connect.sys `
            -Destination ${{ env.TEMP }}\ntosebpfext\${{env.BUILD_PLATFORM}}\${{env.BUILD_CONFIGURATION}} `
            -Force

      - name: Zip Build Output
        shell: pwsh
        working-directory: ${{ env.TEMP }}\ntosebpfext
        run: |
          Compress-Archive `
            -Path ${{env.BUILD_PLATFORM}}\${{env.BUILD_CONFIGURATION}} `
            -DestinationPath .\build-${{env.BUILD_PLATFORM}}.${{env.BUILD_CONFIGURATION}}.zip

      - name: Upload Build Output
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ntosebpfext-build-output
          path: ${{ env.TEMP }}\ntosebpfext\build-${{env.BUILD_PLATFORM}}.${{env.BUILD_CONFIGURATION}}.zip
          retention-days: 5

  windows-tetragon-build:
    name: Build, Unit Test and Upload Windows Tetragon and Tetra Binaries
    runs-on: windows-2025
    timeout-minutes: 15
    needs: windows-ebpf-prog-build

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.25.3"

      - name: Create Temp Directories
        shell: pwsh
        run: |
          mkdir D:\temp
          mkdir D:\temp\test

      - name: "Download eBPF NativeOnlyRelease ZIP"
        id: download-ebpf-nativeonly
        uses: ./.github/actions/download-file
        with:
          file-url: "https://github.com/microsoft/ebpf-for-windows/releases/download/Release-v1.0.0-rc1/Build-native-only.NativeOnlyRelease.x64.zip"
          download-dir: "${{ env.TEMP }}"

      - name: "Extract eBPF NativeOnlyRelease ZIP"
        uses: ./.github/actions/extract-zip
        with:
          zip-file: "${{ steps.download-ebpf-nativeonly.outputs.downloaded-file }}"
          extract-dir: "${{ env.TEMP }}"

      - name: "Install eBPF for Windows"
        shell: pwsh
        run: |
          $extractPath = "${{ env.TEMP }}\Build-native-only NativeOnlyRelease x64"
          $ebpfPath = "${{ env.TEMP }}\ebpf"

          Rename-Item -Path $extractPath -NewName $ebpfPath -ErrorAction Stop

          # Find and execute the setup script
          Write-Output "Searching for setup script..."
          $setupScript = Get-ChildItem -Path $ebpfPath -Filter "setup-ebpf.ps1" -Recurse | Select-Object -First 1

          if ($setupScript) {
              Write-Output "✓ Found setup script: $($setupScript.FullName)"
              
              try {
                  Push-Location -Path $setupScript.DirectoryName
                 
                  Write-Output "Executing setup script..."
                  & $setupScript.FullName
                  
                  Write-Output "✓ Setup script execution completed"
              }
              catch {
                  Write-Error "✗ Failed to execute setup script: $($_.Exception.Message)"
                  throw
              }
              finally {
                  Pop-Location
              }
          }
          else {
              Write-Error "✗ Setup script 'setup-ebpf.ps1' not found in the extracted package"
              Write-Output "Directory contents:"
              Get-ChildItem -Path $ebpfPath -Recurse | ForEach-Object { 
                  Write-Output "  $($_.FullName)" 
              }
              throw
          }

          Write-Output "✓ eBPF for Windows installed successfully"

      - name: "Add eBPF for Windows to PATH"
        shell: pwsh
        run: |
          echo "C:\Program Files\ebpf-for-windows\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download ntosebpfext-build-output
        id: download-ntosebpfext-build-output
        uses: ./.github/actions/download-artifact
        with:
          artifact-name: "ntosebpfext-build-output"
          download-dir: '${{ env.TEMP }}\test'

      - name: "Extract binaries from artifact"
        uses: ./.github/actions/extract-zip
        with:
          zip-file: '${{ steps.download-ntosebpfext-build-output.outputs.artifact-path }}\build-x64.Release.zip'
          extract-dir: '${{ env.TEMP }}\test'

      - name: Install ntosebpfext
        shell: pwsh
        working-directory: ${{ env.TEMP }}\test
        run: |
          $ntosebpfextDir = "${{ env.TEMP }}\test"

          if (Test-Path -Path $ntosebpfextDir) {
            Get-ChildItem -Path $ntosebpfextDir

            New-Item -ItemType Directory -Path "${{ github.workspace }}\bpf\objs" -Force

            Copy-Item -Path "$ntosebpfextDir\Release\process_monitor_km\process_monitor.sys" -destination "${{ github.workspace }}\bpf\objs\" -Force
            Copy-Item -Path "$ntosebpfextDir\Release\tcp_connect.sys" -destination "${{ github.workspace }}\bpf\objs\" -Force

            Start-Process -FilePath "$ntosebpfextDir\Release\ntos_ebpf_ext_export_program_info.exe" -ArgumentList "--clear" -Wait
            Start-Process -FilePath "C:\Program Files\ebpf-for-windows\export_program_info.exe" -ArgumentList "--clear" -Wait

            Start-Process -FilePath "$ntosebpfextDir\Release\ntos_ebpf_ext_export_program_info.exe" -Wait
            Start-Process -FilePath "C:\Program Files\ebpf-for-windows\export_program_info.exe" -Wait

            sc.exe delete "ntosebpfext"
            sc.exe create ntosebpfext type= kernel start= demand binPath= "$ntosebpfextDir\Release\ntosebpfext\ntosebpfext.sys"
            sc.exe start ntosebpfext
          } else {
            Write-Error "✗ ntosebpfext directory not found after extraction"
            exit 1
          }

      - name: Run recordtest and netpoltest Unit Tests
        working-directory: ${{ github.workspace }}\pkg\bpftest
        shell: pwsh
        run: |
          echo "::group::Sanity check: contents of bpf\objs"
          Get-ChildItem -Recurse -Path "${{ github.workspace }}\bpf\objs"
          echo "::endgroup::"
          go test ./recordtest -v
          #go test ./netpoltest -v

      - name: Build and Zip tetragon Windows binaries
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          go build -o .\Tetra.exe .\cmd\bin\tetra\ 
          go build -o .\Tetragon.exe .\cmd\bin\tetragon\
          New-Item -ItemType Directory -Path ${{ env.TEMP }}\Tetragon-Windows
          Copy-Item *.exe -Destination ${{ env.TEMP }}\Tetragon-Windows
          Compress-Archive -Path ${{ env.TEMP }}\Tetragon-Windows\* -DestinationPath ${{ env.TEMP }}\Tetragon-Windows.zip
          Get-ChildItem -Recurse ${{ env.TEMP }}

      - name: Upload Tetragon Windows binaries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tetragon-windows-build-output
          path: ${{ env.TEMP }}\Tetragon-Windows.zip
          retention-days: 5

  windows-build-msi:
    name: "Build Tetragon EE MSI"
    runs-on: windows-2025
    timeout-minutes: 15
    needs: windows-tetragon-build

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: "Download Shawl ZIP"
        id: download-shawl
        uses: ./.github/actions/download-file
        with:
          file-url: "https://github.com/mtkennerly/shawl/releases/download/v1.7.0/shawl-v1.7.0-win64.zip"
          download-dir: '${{ runner.temp }}\staging'

      - name: "Extract Shawl ZIP"
        uses: ./.github/actions/extract-zip
        with:
          zip-file: "${{ steps.download-shawl.outputs.downloaded-file }}"
          extract-dir: '${{ runner.temp }}\staging\unpacked\shawl'

      - name: "Download eBPF MSI"
        id: download-ebpf
        uses: ./.github/actions/download-file
        with:
          file-url: "https://github.com/microsoft/ebpf-for-windows/releases/download/Release-v1.0.0-rc1/ebpf-for-windows.x64.1.0.0-rc1.msi"
          download-dir: '${{ runner.temp }}\staging'

      - name: "Extract eBPF MSI"
        uses: ./.github/actions/extract-msi
        with:
          msi-file: "${{ steps.download-ebpf.outputs.downloaded-file }}"
          extract-dir: '${{ runner.temp }}\staging\unpacked'
          log-file: '${{ runner.temp }}\staging\ebpf-for-win-install.log'

      - name: Download ntosebpfext-build-output
        id: download-ntosebpfext-build-output
        uses: ./.github/actions/download-artifact
        with:
          artifact-name: "ntosebpfext-build-output"
          download-dir: '${{ runner.temp }}\staging'

      - name: "Extract binaries from artifact"
        uses: ./.github/actions/extract-zip
        with:
          zip-file: '${{ steps.download-ntosebpfext-build-output.outputs.artifact-path }}\build-x64.Release.zip'
          extract-dir: '${{ runner.temp }}\staging\unpacked'

      - name: Download tetragon-windows-build-output
        id: download-tetragon-windows-build-output
        uses: ./.github/actions/download-artifact
        with:
          artifact-name: "tetragon-windows-build-output"
          download-dir: '${{ runner.temp }}\staging'

      - name: "Extract binaries from artifact"
        uses: ./.github/actions/extract-zip
        with:
          zip-file: '${{ steps.download-tetragon-windows-build-output.outputs.artifact-path }}\Tetragon-Windows.zip'
          extract-dir: '${{ runner.temp }}\staging\unpacked\tetragon'

      - name: "Run WIX build"
        id: wix-build
        shell: pwsh
        run: |
          # Start the build
          $ErrorActionPreference = 'Stop'

          echo "::group::Sanity check: contents of staging root"
          Get-ChildItem -Path "${{ runner.temp }}\staging" -Recurse -File | Select-Object Length, FullName | Format-Table
          echo "::endgroup::"

          echo "::group::Fetch tags"
          git fetch origin 'refs/tags/v*:refs/tags/v*' --no-recurse-submodules
          echo "::endgroup::"

          # Compute Product Version
          $tag = git for-each-ref --sort=-committerdate:short --format='%(refname:short) %(committerdate:short) %(objectname:short)' 'refs/tags/v*' --count 5 2>$null | sort -Descending -Top 1
          Write-Output "✓ Latest tag: $tag"

          if ($tag -match '^v(\d+\.\d+\.\d+)[^\s]+\s+(\d+-\d+-\d+)\s+([0-9a-f]+)') {
            $tagVersion = $matches[1]
            $tagDate = $matches[2]
            $tagSHA = $matches[3]
          } else {
            throw "Error fetching version info from '$tag'"
          }

          Write-Output "✓ Tag version: $tagVersion"

          $productVersion = $tagVersion + ".${{ github.run_number }}"
          Write-Output "✓ Computed product version: $productVersion"

          # Generate Product Code, must be new on every build
          $productCode = [Guid]::NewGuid().ToString().ToUpper()
          Write-Output "✓ MSI product code: $productCode"

          $binlogFile = "${{ runner.temp }}\staging\msbuild-$productVersion.binlog"
          "binlogFile=$binlogFile" >> $env:GITHUB_OUTPUT
          Write-Output "✓ MSI build log: $binlogFile"

          dotnet build ${{ github.workspace }}\install\windows\TetragonEE-Wix\TetragonEnterprise.slnx `
              /p:StagingRoot=${{ runner.temp }}\staging `
              /p:ProductMsiName="TetragonEnterprise" `
              /p:ProductCode=$productCode `
              /p:ProductVersion=$productVersion `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /bl:$binlogFile

          if (!$?) {
            $errcode = $LASTEXITCODE
            Write-Output "✗ MSI Build failed"
            exit $errcode
          }

          Write-Output "✓ MSI built successfully"

      - name: Upload MSI
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: msi-package
          path: ${{ github.workspace }}\install\windows\TetragonEE-Wix\build\bin\x64\Release\en-US\*.msi
          retention-days: 5

      - name: Upload MSI build log
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: msi-binlog
          path: ${{ steps.wix-build.outputs.binlogFile }}
          retention-days: 5

  windows-smoke-test:
    name: Deploy and Test tetragon for Windows
    runs-on: windows-2025
    timeout-minutes: 15
    needs: windows-build-msi

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Create Temp Directories
        shell: pwsh
        run: |
          mkdir D:\temp
          mkdir D:\temp\test

      - name: Download Tetragon EE MSI
        id: download-tetragon-msi
        uses: ./.github/actions/download-artifact
        with:
          artifact-name: "msi-package"
          download-dir: "${{ runner.temp }}"

      - name: "Install Tetragon EE MSI"
        uses: ./.github/actions/install-msi
        with:
          msi-file: "${{ steps.download-tetragon-msi.outputs.artifact-single }}"
          log-file: '${{ runner.temp }}\tetragon-ee-install.log'

      - name: Update PATH
        shell: pwsh
        run: |
          # MSI is not able to update the GH Runner environment
          # Updated PATH cannot be used in the same step
          echo "C:\Program Files\ebpf-for-windows" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          [Environment]::SetEnvironmentVariable("Path", "C:\Program Files\ebpf-for-windows;" + [Environment]::GetEnvironmentVariable("Path", "Machine"), "Machine")

      - name: Run Smoke test Windows
        shell: pwsh
        run: |
          # Tests
          Write-Output "::group::PATH:"
          $env:Path -split ';'
          Write-Output "::endgroup::"

          # Stop Running Tetragon Service, we need to change args
          net.exe stop TetragonEnterprise

          # Start the process in the background and capture its PID
          $TetragonArgs = @(
            '--enable-tcp', 
            '--enable-application-model',
            '--network-policy ${{ github.workspace }}\examples\tetragonnetworkpolicy\example.yaml',
            '--export-filename "C:\Program Files\Tetragon\events.json"'
          )

          $tetragonBackgroundProcess = Start-Process `
            -FilePath "C:\Program Files\Tetragon\cmd\Tetragon.exe" `
            -WorkingDirectory "C:\Program Files\Tetragon\cmd" `
            -ArgumentList $TetragonArgs `
            -RedirectStandardOutput "C:\Program Files\Tetragon\tetragon.log" `
            -NoNewWindow `
            -PassThru

          Start-Sleep -Seconds 5
          if(Get-Process -id $tetragonBackgroundProcess.Id) {
            Write-Output "✓ Tetragon is Running "
          }
          else {
            throw "✗ Tetragon Could not be started"
          }

          & "${{ github.workspace }}\tests\e2e\windows\test-script.ps1"
