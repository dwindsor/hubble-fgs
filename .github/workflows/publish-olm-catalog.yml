name: Build and Publish OLM catalog

on:
  push:
    branches:
      - master
    paths:
      - 'install/olm/catalog/index.yaml'

env:
  ARTIFACTORY_ORGANIZATION_PROD: ${{ vars.ARTIFACTORY_ORGANIZATION_PROD || 'isovalent-iep-docker' }}

jobs:
  build-and-push-catalog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Artifactory
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
      
      - name: Checkout Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Build and push
        shell: bash
        run: |
          DOCKER_DEV_ACCOUNT="${{ vars.ARTIFACTORY_HOST }}/${ARTIFACTORY_ORGANIZATION_PROD}" make olm-index-build olm-index-push
