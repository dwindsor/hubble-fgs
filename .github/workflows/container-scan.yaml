name: Container vulnerability scan
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Image CI Stable Branches"]
    types:
      - completed

permissions: read-all

jobs:
  container-scan:
    name: Scan containers
    runs-on: ubuntu-26.04
    continue-on-error: true
    outputs:
      scan_result: ${{ steps.failure-flag.outputs.scan_result }}
    strategy:
      matrix:
        image: [tetragon-ci, tetragon-operator-ci]
        branch: [v1.17, v1.18, v1.19]
        include:
          - branch: v1.17
            registry: quay.io/isovalent-dev
          - branch: v1.18
            registry: quay.io/isovalent-dev
    steps:
      - name: Login to Artifactory
        if: ${{ !matrix.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
      - name: Login to quay.io
        if: ${{ matrix.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Pull Docker image
        run: |
          image="${{ matrix.registry || format('{0}/isovalent-eng-docker', vars.ARTIFACTORY_HOST) }}/${{ matrix.image }}:${{ matrix.branch }}-latest"
          for attempt in 1 2 3 4 5; do
            if docker pull "${image}"; then
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "Failed to pull ${image} after 5 attempts"
          exit 1
      - name: Checkout latest VEX data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/.grype.yaml
            .github/.openvex.json
          sparse-checkout-cone-mode: false
          path: vex
      - name: Download Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Scan image
        id: scan-image
        run: |
          ${{ steps.grype.outputs.cmd }} ${{ matrix.registry || format('{0}/isovalent-eng-docker', vars.ARTIFACTORY_HOST) }}/${{ matrix.image }}:${{ matrix.branch }}-latest \
            --output json=results.json --output table=results.txt --fail-on medium \
            --vex vex/.github/.openvex.json \
            --config vex/.github/.grype.yaml
      - name: Set failure flag if necessary
        id: failure-flag
        if: ${{ failure() }}
        run: echo "scan_result=failure" >> $GITHUB_OUTPUT
      - name: Extract scan results
        if: ${{ failure() }}
        run: |
          jq '[.matches[]
              | select(.vulnerability.severity == "Medium" or .vulnerability.severity == "High" or .vulnerability.severity == "Critical")
              | {id: .vulnerability.id,
                image: "${{ matrix.image }}-${{ matrix.branch }}",
                severity: .vulnerability.severity,
                name: .artifact.name,
                version: .artifact.version,
                purl: .artifact.purl,
                paths: [.artifact.locations[].path]}]' \
              results.json > ${{ matrix.image }}-${{ matrix.branch }}.json
      - name: Output scan results
        if: ${{ failure() }}
        run: |
          cat ${{ matrix.image }}-${{ matrix.branch }}.json
          exit 1
      - name: Upload result summary
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.image }}-${{ matrix.branch }}.json
          path: ${{ matrix.image }}-${{ matrix.branch }}.json
          if-no-files-found: ignore

  check-scan-results:
      # Fails the entire workflow if any scanning job run has failed, despite the
      # use of `continue-on-error` in the previous job.
      name: Check Scan Results
      runs-on: ubuntu-26.04
      needs: container-scan
      steps:
        - name: Check if any scans failed
          run: |
            if [ "${{ needs.container-scan.outputs.scan_result }}" = "failure" ]; then
              echo "One or more container scans failed. Check the uploaded artifacts to" \
              "view the CVEs causing the failures."
              exit 1
            else
              echo "All container scans succeeded."
            fi
