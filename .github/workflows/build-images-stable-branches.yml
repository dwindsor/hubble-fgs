name: Image CI Stable Branches

on:
  push:
    branches:
      - v*

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: tetragon
            legacy-name: hubble-enterprise
            dockerfile: ./Dockerfile

          - name: tetragon-operator
            legacy-name: hubble-enterprise-operator
            dockerfile: ./Dockerfile.operator

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Login to quay.io
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ISOVALENT_DEV_USERNAME }}
          password: ${{ secrets.QUAY_ISOVALENT_DEV_PASSWORD }}

      - name: Getting image tag
        id: tag
        run: |
          # GITHUB_REF is set to "refs/heads/$branch" for branches and "refs/tags/$tag" for tags.
          echo "tag=$(basename "$GITHUB_REF")" >> $GITHUB_OUTPUT
          echo "shortSHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Stable Branch Build ${{ matrix.name }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        id: docker_build_stable_branch
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            quay.io/${{ github.repository_owner }}-dev/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-latest
            quay.io/${{ github.repository_owner }}-dev/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-${{ steps.tag.outputs.shortSHA }}
            quay.io/${{ github.repository_owner }}-dev/${{ matrix.name }}-ci:${{ github.sha }}
            quay.io/${{ github.repository_owner }}-dev/${{ matrix.legacy-name }}-ci:${{ steps.tag.outputs.tag }}-latest
            quay.io/${{ github.repository_owner }}-dev/${{ matrix.legacy-name }}-ci:${{ steps.tag.outputs.tag }}-${{ steps.tag.outputs.shortSHA }}
            quay.io/${{ github.repository_owner }}-dev/${{ matrix.legacy-name }}-ci:${{ github.sha }}

      - name: Stable Branch Image Digest
        shell: bash
        run: |
          mkdir -p image-digest/
          job_name=${{ matrix.name }}
          job_name_capital=${job_name^^}
          job_name_underscored=${job_name_capital//-/_}
          echo "${job_name_underscored}_DIGEST := \"${{ steps.docker_build_stable_branch.outputs.digest }}\"" > image-digest/makefile-digest.txt

          echo "### ${{ matrix.name }}" > image-digest/${{ matrix.name }}.txt
          echo "" >> image-digest/${{ matrix.name }}.txt
          echo "\`quay.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}@${{ steps.docker_build_stable_branch.outputs.digest }}\`" >> image-digest/${{ matrix.name }}.txt
          echo "" >> image-digest/${{ matrix.name }}.txt

      # Upload artifact digests
      - name: Upload artifact digests
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: image-digest ${{ matrix.name }}
          path: image-digest
          retention-days: 1

  image-digests:
    if: ${{ github.repository == 'isovalent/hubble-fgs' }}
    name: Display Digests
    runs-on: ubuntu-22.04
    needs: build-and-push
    steps:
      - name: Downloading Image Digests
        shell: bash
        run: |
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: image-digest/

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat
