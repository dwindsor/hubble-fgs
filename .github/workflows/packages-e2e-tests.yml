name: Packages e2e Tests

on:
  pull_request:
    paths-ignore:
    - "**.md"

jobs:
  standalone-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64

    steps:
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Checkout Source Code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Getting version tag
        id: tag
        run: echo "tag=$(make version)" >> $GITHUB_OUTPUT

      - name: Generate Tetragon EE Tarball
        id: tetragon-enterprise-tarball
        run: make tarball

      - name: Install Tetragon EE Tarball
        run: |
          tar zxvf tetragon-${{ steps.tag.outputs.tag }}-${{ matrix.arch }}.tar.gz
          sudo ./tetragon-${{ steps.tag.outputs.tag }}-${{ matrix.arch }}/install.sh
        working-directory: ./build/${{ matrix.arch }}/linux-tarball/

      - name: Wait for Tetragon EE service
        run: sleep 5s
        shell: bash

      - name: Check Tetragon EE
        run: sudo systemctl is-active tetragon-enterprise

      - name: Check Tetragon EE startup logs
        run: sudo journalctl -b -u tetragon-enterprise --no-pager

      - name: Test Tetragon EE
        run: |
          sudo tetra status
          sudo grep "tetra" /var/log/hubble-fgs/hubble-fgs.log
          sudo tetra bugtool

      - name: Uninstall Tetragon EE Tarball
        run: |
          sudo ./tetragon-${{ steps.tag.outputs.tag }}-${{ matrix.arch }}/uninstall.sh
        working-directory: ./build/${{ matrix.arch }}/linux-tarball/
