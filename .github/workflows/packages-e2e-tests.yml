name: Packages e2e Tests

on:
  workflow_call:

jobs:
  standalone-tarball-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            match_arch: x86-64
          - os: ubuntu-22.04-arm64
            arch: arm64
            match_arch: arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retrieve Tetragon EE Tarball (${{ matrix.arch }})
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tetragon-tarball-${{ matrix.arch }}
          path: ./build/${{ matrix.arch }}/linux-tarball

      - name: Resolve and verify the Tetragon EE Tarball
        id: tarball
        run: |
          tarballs=(tetragon-ee-*-${{ matrix.arch }}.tar.gz)
          sha256sum -c "${tarballs[0]}.sha256sum"
          echo "name=$(basename "${tarballs[0]}" .tar.gz)" >> "$GITHUB_OUTPUT"
        working-directory: ./build/${{ matrix.arch }}/linux-tarball

      - name: Copy dns.yaml tracing policy to /etc/tetragon/tetragon.tp.d/
        run: |
          sudo mkdir -p /etc/tetragon/tetragon.tp.d/
          sudo cp examples/tracingpolicy/dns.yaml /etc/tetragon/tetragon.tp.d/dns.yaml

      - name: Install Tetragon EE Tarball
        run: |
          tar zxvf ${{ steps.tarball.outputs.name }}.tar.gz
          sudo ./${{ steps.tarball.outputs.name }}/install.sh
        working-directory: ./build/${{ matrix.arch }}/linux-tarball/

      - name: Wait for Tetragon EE service
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_seconds: 30
          max_attempts: 5
          retry_wait_seconds: 5
          retry_on: error
          command: |
            # Ensure that default native builds work
            file /usr/local/bin/tetragon | grep ${{ matrix.match_arch }} -
            sudo systemctl is-active tetragon-enterprise
            sudo tetra status

      - name: Check Tetragon EE startup logs
        run: sudo journalctl -b -u tetragon-enterprise --no-pager

      - name: Test Tetragon EE
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_seconds: 30
          max_attempts: 5
          retry_wait_seconds: 5
          retry_on: error
          command: |
            sudo sync
            sudo tetra status
            sudo tetra tracingpolicy list | grep dns -
            sudo tetra tracingpolicy add examples/tracingpolicy/udp.yaml
            sudo tetra tracingpolicy list | grep udp -
            sudo tetra bugtool
            sudo grep "tetra" /var/log/tetragon/tetragon.log

      - name: Setup Tetragon EE with a different tracing-policy-dir
        run: |
          sudo systemctl stop tetragon-enterprise
          sudo mkdir -p /opt/tetragon.tp.d/
          sudo cp examples/tracingpolicy/dns.yaml /opt/tetragon.tp.d/dns.yaml
          echo "/opt/tetragon.tp.d/" | sudo tee /etc/tetragon/tetragon.conf.d/tracing-policy-dir
          echo "localhost:8118" | sudo tee /etc/tetragon/tetragon.conf.d/gops-address
          sudo systemctl start tetragon-enterprise

      - name: Wait for Tetragon EE service 2nd round
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_seconds: 30
          max_attempts: 5
          retry_wait_seconds: 5
          retry_on: error
          command: |
            # Ensure that default native builds work
            sudo systemctl is-active tetragon-enterprise
            sudo tetra status

      - name: Check Tetragon EE startup logs 2nd round
        run: sudo journalctl -b -u tetragon-enterprise --no-pager

      - name: Test Tetragon EE with a different tracing-policy-dir
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_seconds: 60
          max_attempts: 5
          retry_wait_seconds: 5
          retry_on: error
          command: |
            sudo sync
            sudo tetra status
            sudo tetra tracingpolicy list | grep dns -
            sudo grep "tetra" /var/log/tetragon/tetragon.log
            sudo tetra bugtool 2>&1 | grep "Successfully dumped gops pprof.*profile=heap" -

      - name: Uninstall Tetragon EE Tarball
        run: |
          sudo ./${{ steps.tarball.outputs.name }}/uninstall.sh
        working-directory: ./build/${{ matrix.arch }}/linux-tarball/
