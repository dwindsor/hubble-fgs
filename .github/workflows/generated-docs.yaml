name: Check generated docs
on:
  push:
    branches:
      - master
      - v*
    paths:
      - "**"
      - "!docs/**"
      - "!examples/**"
      - "!install/**"
      - "!tests/**"
      - "!contrib/grafana/**"
      - "!**.md"
      - "!**.yaml"
      - docs/metrics/metrics.md
      - docs/configuration/tetragon_flags.yaml
      - .github/workflows/generated-docs.yaml
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!examples/**"
      - "!install/**"
      - "!tests/**"
      - "!contrib/grafana/**"
      - "!**.md"
      - "!**.yaml"
      - docs/metrics/metrics.md
      - docs/configuration/tetragon_flags.yaml
      - .github/workflows/generated-docs.yaml

jobs:
  check-generated-docs:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.26.1'
      - name: Go version
        run: go version
      - name: Check Tetragon daemon flags
        run: |
          set -ex
          make generate-flags
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status
            git diff
            echo "Generated flags reference is outdated."
            echo "Please run 'make generate-flags' and submit your changes."; exit 1
          fi
      - name: Check metrics docs
        run: |
          set -ex
          make metrics-docs
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status
            git diff
            echo "Generated metrics reference is outdated."
            echo "Please run 'make metrics-docs' and submit your changes."; exit 1
          fi
