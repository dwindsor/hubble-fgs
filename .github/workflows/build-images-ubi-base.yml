name: UBI Image Build

on:
  workflow_call:
    inputs:
      # Used to checkout the source code and as a tag for non-release images.
      sha:
        required: true
        type: string
      # Tag to push. Optional for non-release images - if empty, only the sha tag is pushed.
      tag:
        type: string
      # Release images are pushed to isovalent Quay org, non-release to isovalent-dev.
      is_release:
        type: boolean

jobs:
  build-and-push-ubi:
    permissions:
      contents: read
      actions: read
      # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
      id-token: write
    runs-on: ubuntu-latest-4cores-16gb
    strategy:
      matrix:
        include:
          # tetragon: self-contained wrapper — stage 1 builds the standard
          # release image (Alpine), stage 2 copies binaries into UBI and
          # installs deps.
          - name: tetragon
            dockerfile: ./Dockerfile
            target: release
            self_contained: true
            # renovate: datasource=docker
            ubi_image: registry.redhat.io/ubi9/ubi-minimal:9.8@sha256:6ea809bdd8164f8b2b607e38f01b14c374a15bdfbc74fcd0155161512dd4e00e
            wrapper_dockerfile: ./enterprise/images/tetragon/Dockerfile
            image_repo: tetragon-ubi
            stage_repo: tetragon-ubi-stage

          # aggregator/operator: thin wrapper — stage 1 builds the standard
          # Dockerfile with BASE_IMAGE=UBI, stage 2 adds labels and LICENSE.
          - name: tetragon-aggregator
            dockerfile: ./Dockerfile.aggregator
            target: release
            self_contained: false
            # renovate: datasource=docker
            ubi_image: registry.redhat.io/ubi9/ubi-minimal:9.8@sha256:6ea809bdd8164f8b2b607e38f01b14c374a15bdfbc74fcd0155161512dd4e00e
            wrapper_dockerfile: ./enterprise/images/tetragon-aggregator/Dockerfile
            image_repo: tetragon-aggregator-ubi
            stage_repo: tetragon-aggregator-ubi-stage

          - name: tetragon-operator
            dockerfile: ./Dockerfile.operator
            target: release
            self_contained: false
            # renovate: datasource=docker
            ubi_image: registry.redhat.io/ubi9/ubi-minimal:9.8@sha256:6ea809bdd8164f8b2b607e38f01b14c374a15bdfbc74fcd0155161512dd4e00e
            wrapper_dockerfile: ./enterprise/images/tetragon-operator/Dockerfile
            image_repo: tetragon-operator-ubi
            stage_repo: tetragon-operator-ubi-stage

    steps:
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to registry.redhat.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_USERNAME_CI }}
          password: ${{ secrets.REDHAT_PASSWORD_CI }}

      - name: Login to Artifactory
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Get image tags
        id: tags
        run: |
          repo="${{ matrix.image_repo }}"
          stage_repo="${{ matrix.stage_repo }}"
          # CI images go to isovalent-eng-docker, release images go to isovalent-iep-docker
          if ${{ inputs.is_release }}; then
            registry_path="isovalent-iep-docker"
          else
            registry_path="isovalent-eng-docker"
            repo="$repo-ci"
            stage_repo="$stage_repo-ci"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if ! ${{ inputs.is_release }}; then
            echo "${{ vars.ARTIFACTORY_HOST }}/${registry_path}/$repo:${{ inputs.sha }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            echo "${{ vars.ARTIFACTORY_HOST }}/${registry_path}/$repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

          echo "stage_tags<<EOF" >> $GITHUB_OUTPUT
          if ! ${{ inputs.is_release }}; then
            echo "${{ vars.ARTIFACTORY_HOST }}/${registry_path}/$stage_repo:${{ inputs.sha }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            echo "${{ vars.ARTIFACTORY_HOST }}/${registry_path}/$stage_repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      # Stage 1: Build the standard Dockerfile.
      # - self_contained (tetragon): build with default Alpine base (no BASE_IMAGE override)
      # - thin wrapper (aggregator/operator): build with BASE_IMAGE=UBI
      - name: Build and Push stage image
        id: build-and-push-stage
        run: |
          # Build --tag flags from multi-line tags output
          tag_flags=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_flags="${tag_flags} --tag ${tag}"
          done <<< "${{ steps.tags.outputs.stage_tags }}"

          build_arg_flags=""
          build_arg="${{ !matrix.self_contained && format('BASE_IMAGE={0}', matrix.ubi_image) || '' }}"
          [ -n "${build_arg}" ] && build_arg_flags="--build-arg ${build_arg}"

          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --file ${{ matrix.dockerfile }} \
              --target ${{ matrix.target }} \
              --platform linux/amd64,linux/arm64 \
              --attest type=provenance,mode=min,inline-only=true,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }} \
              ${build_arg_flags} \
              ${tag_flags} \
              --push .; then
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          echo "Build failed after 5 attempts"
          exit 1

      - name: Get first tag for subsequent steps
        id: first-tag
        run: |
          first_tag=$(echo "${{ steps.tags.outputs.tags }}" | head -n1)
          echo "tag=${first_tag}" >> $GITHUB_OUTPUT
          first_stage_tag=$(echo "${{ steps.tags.outputs.stage_tags }}" | head -n1)
          echo "stage_tag=${first_stage_tag}" >> $GITHUB_OUTPUT

      # Stage 2: Build the enterprise wrapper Dockerfile.
      # - self_contained (tetragon): copies binaries from source into UBI base
      # - thin wrapper (aggregator/operator): layers labels and LICENSE on top
      - name: Build and Push UBI image
        id: build-and-push
        run: |
          # Build --tag flags from multi-line tags output
          tag_flags=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_flags="${tag_flags} --tag ${tag}"
          done <<< "${{ steps.tags.outputs.tags }}"

          # Build --build-arg flags
          build_arg_flags=""
          if ${{ matrix.self_contained }}; then
            build_arg_flags="--build-arg SOURCE_IMAGE=${{ steps.first-tag.outputs.stage_tag }}"
            build_arg_flags="${build_arg_flags} --build-arg UBI_IMAGE=${{ matrix.ubi_image }}"
          else
            build_arg_flags="--build-arg BASE_IMAGE=${{ steps.first-tag.outputs.stage_tag }}"
          fi
          build_arg_flags="${build_arg_flags} --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          build_arg_flags="${build_arg_flags} --build-arg VERSION=${{ inputs.tag || inputs.sha }}"

          metadata_file=$(mktemp)
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --file ${{ matrix.wrapper_dockerfile }} \
              --platform linux/amd64,linux/arm64 \
              --attest type=provenance,mode=min,inline-only=true,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }} \
              ${build_arg_flags} \
              ${tag_flags} \
              --metadata-file "${metadata_file}" \
              --push .; then
              digest=$(jq -r '."containerimage.digest"' "${metadata_file}")
              echo "digest=${digest}" >> $GITHUB_OUTPUT
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          echo "Build failed after 5 attempts"
          exit 1

      - name: Image Release Digest
        shell: bash
        run: |
          mkdir -p image-digest/
          job_name=${{ inputs.is_release && matrix.image_repo || format('{0}-ci', matrix.image_repo) }}
          job_name_capital=${job_name^^}
          job_name_underscored=${job_name_capital//-/_}
          echo "${job_name_underscored}_DIGEST := \"${{ steps.build-and-push.outputs.digest }}\"" > image-digest/makefile-digest.txt

          echo "### $job_name" > image-digest/$job_name.txt
          echo "" >> image-digest/$job_name.txt
          echo "${{ steps.first-tag.outputs.tag }}@${{ steps.build-and-push.outputs.digest }}" >> image-digest/$job_name.txt
          echo "" >> image-digest/$job_name.txt

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ inputs.is_release && matrix.image_repo || format('{0}-ci', matrix.image_repo) }}
          path: image-digest
          retention-days: ${{ inputs.is_release && 90 || 7 }}

  image-digests:
    name: Display UBI Digests
    runs-on: ubuntu-26.04
    needs: build-and-push-ubi
    permissions:
      actions: read
      contents: read
    steps:
      - name: Getting image tag and making image-digest directory
        id: tag
        run: |
          echo tag=${GITHUB_REF##*/} >> $GITHUB_OUTPUT
          mkdir -p image-digest/

      - name: Download digests of all UBI images built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: image-digest/
          pattern: image-digest-*-ubi*

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          echo "## UBI Docker Manifests" > ../image-digest-output-ubi.txt
          echo "" >> ../image-digest-output-ubi.txt
          find -type f -not -name "makefile-digest.txt" | sort | xargs -d '\n' cat >> ../image-digest-output-ubi.txt

      - name: Image Makefile Digests
        shell: bash
        run: |
          cd image-digest/
          echo "# File generated by .github/workflows/build-images-ubi-base.yml; DO NOT EDIT." > ../Makefile.digests.ubi
          echo "# Copyright $(date +'%Y') Authors of Tetragon" >> ../Makefile.digests.ubi
          echo "# Copyright (C) Isovalent, Inc. - All Rights Reserved." >> ../Makefile.digests.ubi
          echo "" >> ../Makefile.digests.ubi
          find -type f  -name "makefile-digest.txt" | sort | xargs -d '\n' awk '{print "export " $0}' >> ../Makefile.digests.ubi

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-output-ubi.txt-${{ steps.tag.outputs.tag }}
          path: image-digest-output-ubi.txt
          retention-days: ${{ inputs.is_release && 90 || 7 }}

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Makefile.digests.ubi-${{ steps.tag.outputs.tag }}
          path: Makefile.digests.ubi
          retention-days: ${{ inputs.is_release && 90 || 7 }}
