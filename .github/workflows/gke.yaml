name: ConformanceGKE

on:
  # Run every 6 hours
  schedule:
    - cron:  '0 0/6 * * *'
env:
  zone: us-west2-a
  ciliumCliVersion: v0.12.11

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 75
    strategy:
      matrix:
        release-channel:
          - "stable"
          - "regular"
          - "rapid"
    env:
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: hubble-fgs
          submodules: true

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: "1.25.3"

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "agentImage=quay.io/isovalent-dev/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "operatorImage=quay.io/isovalent-dev/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "clusterName=fgs-cli-ci-${{ github.run_id }}-${{ matrix.release-channel }}" >> $GITHUB_OUTPUT

      - name: Install Cilium CLI
        run: |
          curl -sSL --remote-name-all https://github.com/isovalent/cilium-cli-releases/releases/latest/download/cilium-linux-amd64.tar.gz{,.sha256sum}
          sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
          sudo tar xzvfC cilium-linux-amd64.tar.gz /usr/bin
          rm cilium-linux-amd64.tar.gz{,.sha256sum}
          cilium version

      - uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5
        with:
          version: "v3.11.0"

      - name: Authenticate to gcloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          version: "405.0.0"

      - name: install beta component
        run: |
          gcloud components install beta
          gcloud components install gke-gcloud-auth-plugin

      - name: gcloud info
        run: |
          gcloud info

      - name: Create GKE cluster
        id: cluster
        run: |
          gcloud container clusters create ${{ steps.vars.outputs.clusterName }} \
            --preemptible \
            --labels "usage=pr,owner=${{ github.event.pull_request.number }},creation=$(date +'%Y-%m-%d'),expiry=$(date -d tomorrow +"%Y-%m-%d"),svic_falco_supported=no" \
            --node-labels "svic_osquery_supported=no" \
            --enable-ip-alias \
            --cluster-ipv4-cidr="/21" \
            --services-ipv4-cidr="/24" \
            --image-type COS_CONTAINERD \
            --num-nodes 2 \
            --machine-type n1-standard-4 \
            --release-channel ${{ matrix.release-channel }} \
            --zone ${{ env.zone }}

      - name: Get Credentials
        run: |
          gcloud container clusters get-credentials ${{ steps.vars.outputs.clusterName }} --zone ${{ env.zone }}

      - name: Attempt to pull the FGS image
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            set -e
            docker pull ${{ steps.vars.outputs.agentImage }}
            docker pull ${{ steps.vars.outputs.operatorImage }}

      - name: Fetch Helm subcharts
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            cd hubble-fgs
            make -C install/kubernetes tetragon/charts

      - name: Run end-to-end tests
        timeout-minutes: 30
        run: |
          cd hubble-fgs
          export HOST_PROC=/proc
          export FLAKY_HTTP=1
          export RUN_FIM_DISPATCHER=1
          make e2e-test                                          \
            E2E_BUILD_IMAGES=0                                   \
            E2E_EXTRA_GOTEST_FLAGS="-failfast"                   \
            E2E_AGENT=${{ steps.vars.outputs.agentImage }}       \
            E2E_OPERATOR=${{ steps.vars.outputs.operatorImage }} \
            E2E_EXTRA_TEST_FLAGS="-tetragon.keep-export=true -cluster-name ${{ steps.vars.outputs.clusterName }} -kubeconfig ~/.kube/config -tetragon.uninstall-tetragon=false"

      - name: Capture sysdump
        if: ${{ always() }}
        run: |
          kubectl get pods --all-namespaces -o wide
          cilium sysdump --output-filename "tetragon-sysdump-<ts>" --tetragon-namespace kube-system 
        shell: bash {0} # Disable default fail-fast behaviour so that all commands run independently

      - name: Upload sysdump
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tetragon-sysdump-${{ matrix.release-channel }}
          path: tetragon-sysdump-*.zip
          retention-days: 5

      - name: Cleanup
        id: cleanup
        if: ${{ always() }}
        run: |
          echo "kernel_version=$(kubectl get node -o go-template='{{(index .items 0).status.nodeInfo.kernelVersion}}')" >> $GITHUB_OUTPUT

          zone=${{ env.zone }}
          cluster=${{ steps.vars.outputs.clusterName }}

          max_attempts=40
          attempt_delay=30 # in seconds

          for ((attempt=0; attempt<$max_attempts; attempt++)); do
              output=$(gcloud container clusters delete --zone $zone $cluster --quiet 2>&1 | tee /dev/tty)
              code=$(echo $output | grep -oP 'code=\K\d+')
              if [ "$code" == "400" ]; then
                  # When Google returns the error 'is currently creating cluster' , it returns error
                  # 400 even though the request is well formated. So here we suppose that if we
                  # receive a 400 error, it is because the cluster is being created and we want to
                  # retry in order to cleanup properly and not leak resources.
                  printf "gcloud returned an error and the code is equal to 400, retrying in %ds...\n" "$attempt_delay"
                  sleep $attempt_delay
              else
                  break
              fi
          done

          if [[ $attempt -ge $max_attempts ]]; then
            printf "Maximum number of attempts reached: %d. Exiting.\n" "$max_attempts"
            exit 1
          fi
        shell: 'script --return --quiet --command "bash {0}"' # hack to make /dev/tty accessible, see https://github.com/actions/runner/issues/241#issuecomment-924327172

      - name: Upload Tetragon test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tetragon-artifacts
          path: /tmp/tetragon.e2e.*
          retention-days: 5
