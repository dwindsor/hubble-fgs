name: Build Policytest Assets

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-policytest-assets:
    name: Build Policytest Assets (${{ matrix.arch }})
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-22.04-arm64') || 'ubuntu-22.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.1'

      - name: Remove slow Azure apt mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make libcap-dev libelf-dev pahole llvm netcat-traditional \
            ${{ (matrix.arch == 'arm64' && 'gcc-arm-linux-gnueabihf') || 'libc6-dev-i386' }}

      - name: Build the VM test harness
        run: make -C modules/tetragon-oss/tests/vmtests

      - name: Build the tester progs tarball
        run: make -C modules/tetragon-oss tester-progs-tarball

      - name: Collect assets
        run: |
          mkdir upload
          tar -czf upload/vmtests-bins.tar.gz \
            -C modules/tetragon-oss/tests/vmtests \
            tetragon-vmtests-run tetragon-tester
          mv modules/tetragon-oss/tester-progs.tar.gz upload/

      - name: Save policytest assets (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policytest-assets-${{ matrix.arch }}
          path: upload/
          retention-days: 5
          if-no-files-found: error
