name: Kind Integration Test
on:
  pull_request:
    paths-ignore:
      - "**.md"

env:
  HELM_CHART_REPOSITORY: oci://${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-helmoci/tetragon
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.2.4

jobs:
  kind-integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # checkout pull request head ref so that "make chart-version" prints the correct chart version.
        ref: ${{ github.event.pull_request.head.ref }}
        # required for git describe used by "make chart-version"
        fetch-depth: 0
        submodules: true

    - name: Get Helm dev chart version
      id: version
      run: |
        echo "version=$(make chart-version)" >> $GITHUB_OUTPUT
        SHA=${{ github.event.pull_request.head.sha }}
        echo "agentImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
        echo "operatorImage=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT

    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.26.5'

    - name: Install the latest Cilium CLI
      run: |
        curl -sSL --remote-name-all https://github.com/isovalent/cilium-cli-releases/releases/latest/download/cilium-linux-amd64.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
        tar xzvfC cilium-linux-amd64.tar.gz /tmp
        sudo install /tmp/cilium /usr/local/bin
        rm cilium-linux-amd64.tar.gz{,.sha256sum} /tmp/cilium

    - name: Install Kind and create cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Login to Artifactory
      run: |
        helm registry login ${{ vars.ARTIFACTORY_HOST }} \
          --username ${{ vars.ARTIFACTORY_USERNAME }} \
          --password ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
        echo ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }} | docker login ${{ vars.ARTIFACTORY_HOST }} \
          --username ${{ vars.ARTIFACTORY_USERNAME }} \
          --password-stdin

    - name: Wait for Helm dev chart to be available
      timeout-minutes: 25
      shell: bash
      run: |
        until helm pull ${{ env.HELM_CHART_REPOSITORY }} --version ${{ steps.version.outputs.version }}; do sleep 30s; done

    - name: Pre-load CI images into Kind cluster
      timeout-minutes: 5
      shell: bash
      run: |
        for img in "${{ steps.version.outputs.agentImage }}" "${{ steps.version.outputs.operatorImage }}"; do
          until docker pull "${img}"; do
            echo "Waiting for ${img} to become available..."
            sleep 15
          done
        done
        kind load docker-image \
          ${{ steps.version.outputs.agentImage }} \
          ${{ steps.version.outputs.operatorImage }} \
          --name chart-testing

    - name: Run go integration tests
      run: |
        helm install tetragon -n tetragon --create-namespace ${{ env.HELM_CHART_REPOSITORY }} \
          --version ${{ steps.version.outputs.version }} \
          --set tetragonOperator.podInfo.enabled=true
        go test --tags=integration -v ./pkg/manager

    - name: Capture sysdump
      if: ${{ always() }}
      run: |
        kubectl get pods --all-namespaces -o wide
        cilium sysdump --output-filename "tetragon-sysdump-<ts>" --tetragon-namespace tetragon
      shell: bash {0} # Disable default fail-fast behaviour so that all commands run independently

    - name: Upload sysdump
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tetragon-sysdump
        path: tetragon-sysdump-*.zip
        retention-days: 5
