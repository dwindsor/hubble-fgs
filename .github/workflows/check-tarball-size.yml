name: Check Tetragon Slim Tarball Size
on:
  pull_request:

env:
  # Maximum size in MiB for tetragon-slim tarball
  TETRAGON_SLIM_MAX_SIZE: 90

jobs:
  check-tarball-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Artifactory
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Generate Tetragon Slim Tarball Release
        run: |
          make tarball-slim-extract

      - name: Check Tetragon Slim Tarball Size
        run: |
          set -euo pipefail

          max_bytes=$((TETRAGON_SLIM_MAX_SIZE * 1024 * 1024))

          tetragon_slim_dir=$(find /tmp -maxdepth 1 -type d -name 'tetragon-slim.*')
          if [ -z "${tetragon_slim_dir}" ]; then
            echo "::error::no extracted tetragon-slim directory found in /tmp"
            exit 1
          fi

          size=$(du -sb "${tetragon_slim_dir}" | cut -f1)
          size_mib=$(awk "BEGIN {printf \"%.2f\", ${size} / 1024 / 1024}")

          echo "Tetragon Slim Size: ${tetragon_slim_dir} (${size_mib} MiB)"

          if [ "${size}" -gt "${max_bytes}" ]; then
            echo "::error::tetragon-slim tarball exceeds ${TETRAGON_SLIM_MAX_SIZE} MiB (${size_mib} MiB)"
            exit 1
          fi
