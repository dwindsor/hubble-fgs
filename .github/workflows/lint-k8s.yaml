name: Lint Kubernetes CRDs
on:
  push:
    branches:
      - master
      - v*
    paths:
      - pkg/k8s/**
      - .github/workflows/lint-k8s.yaml
      - go.mod
      - pkg/k8s/go.mod
  pull_request:
    paths:
      - pkg/k8s/**
      - .github/workflows/lint-k8s.yaml
      - go.mod
      - pkg/k8s/go.mod

env:
  GOPRIVATE: github.com/isovalent

jobs:
  check-k8s-generated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.26.6'
      - name: Go version
        run: go version

      - name: Configure Git to be able to access isovalent repositories
        run: |
          git config --global url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com/".insteadOf "git@github.com:"

      - name: Validate that generated files are up to date.
        run: |
          set -ex
          make crds
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status
            git diff
            echo "Kubernetes CRDs generated files are outdated."
            echo "Please run 'make crds' and submit your changes."; exit 1
          fi
  check-crd-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check for CRD changes and version update
        run: |
          crd_changed=0
          version_changed=0

          # Check for CRD changes
          crd_changes=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- pkg/k8s/apis/cilium.io/client/crds/v1alpha1/*.yaml)
          if [ -n "$crd_changes" ]; then
            crd_changed=1
          fi

          # Check for version variable changes

          old_version=$(git show ${{ github.event.pull_request.base.sha }}:pkg/k8s/apis/cilium.io/v1alpha1/version.go | sed -n 's/^\t\+CustomResourceDefinitionSchemaVersion = "\(.*\)".*/\1/p')
          new_version=$(sed -n 's/^\t\+CustomResourceDefinitionSchemaVersion = "\(.*\)".*/\1/p' pkg/k8s/apis/cilium.io/v1alpha1/version.go)

          echo "old_version=$old_version"
          echo "new_version=$new_version"

          if [ "$old_version" != "$new_version" ]; then
            version_changed=1
          fi

          if [ "$crd_changed" -eq 1 ] && [ "$version_changed" -eq 0 ]; then
            echo "Changes to the files pkg/k8s/apis/cilium.io/client/crds/v1alpha1/*.yaml requires CustomResourceDefinitionSchemaVersion to be updated in pkg/k8s/apis/cilium.io/v1alpha1/version.go"
            exit 1
          fi
