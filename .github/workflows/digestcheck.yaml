name: Check images digest for multi-arch

on:
  pull_request:
    paths:
      - '**[dD]ockerfile**'
      - '.github/workflows/digestcheck.yaml'
      - 'contrib/digestcheck.sh'
      - '!**vendor**'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        submodules: 'true'
        fetch-depth: 0   # because we also need the main branch

    - name: Install crane
      env:
        VERSION: "v0.15.2"
      run: |
        curl -sL "https://github.com/google/go-containerregistry/releases/download/$VERSION/go-containerregistry_Linux_x86_64.tar.gz" > go-containerregistry.tar.gz
        tar -zxvf go-containerregistry.tar.gz -C /usr/local/bin/ crane
      
    - name: Check digests
      env:
        TERM: xterm-color
        BASE_REF: ${{ github.base_ref }}
      run: git diff --name-only origin/$BASE_REF | xargs ./modules/tetragon-oss/contrib/digestcheck.sh
