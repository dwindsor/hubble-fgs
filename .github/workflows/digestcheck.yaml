name: Check images digest for multi-arch

on:
  pull_request:
    paths:
      - '**[dD]ockerfile**'
      - '.github/workflows/digestcheck.yaml'
      - 'contrib/digestcheck.sh'
      - '!**vendor**'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
      with:
        submodules: 'true'

    - name: Install crane
      env:
        VERSION: "v0.15.2"
      run: |
        curl -sL "https://github.com/google/go-containerregistry/releases/download/$VERSION/go-containerregistry_Linux_x86_64.tar.gz" > go-containerregistry.tar.gz
        tar -zxvf go-containerregistry.tar.gz -C /usr/local/bin/ crane
      
    - name: Check digests
      env:
        TERM: xterm-color
      run: ./modules/tetragon-oss/contrib/digestcheck.sh ${{ github.workspace }}
