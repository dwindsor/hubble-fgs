name: Base Image Build

on:
  workflow_call:
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true
      QUAY_CHARTS_USERNAME:
        required: true
      QUAY_CHARTS_PASSWORD:
        required: true
    inputs:
      # Used to checkout the source code and as a tag for non-release images.
      sha:
        required: true
        type: string
      # Tag to push. Optional for non-release images - if empty, only the sha tag is pushed.
      tag:
        type: string
      # Release images are pushed to isovalent Quay org, non-release to isovalent-dev.
      is_release:
        type: boolean
      # Whether to push hubble-enterprise images in addition to tetragon ones. Should be true only
      # for branches/releases < v1.13.
      is_legacy:
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: tetragon
            legacy-name: hubble-enterprise
            dockerfile: ./Dockerfile

          - name: tetragon-operator
            legacy-name: hubble-enterprise-operator
            dockerfile: ./Dockerfile.operator

    steps:
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: arm64

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login to quay.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Checkout Source Code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      # TODO: Validate that at least one tag is set. If is_release=true and
      # tag="" then there is no tag to push.
      - name: Get image tags
        id: tags
        run: |
          org="${{ github.repository_owner }}"
          repo="${{ matrix.name }}"
          legacy_repo="${{ matrix.legacy-name }}"
          if ! ${{ inputs.is_release }}; then
            org="$org-dev"
            repo="$repo-ci"
            legacy_repo="$legacy_repo-ci"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if ! ${{ inputs.is_release }}; then
            echo "quay.io/$org/$repo:${{ inputs.sha }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            echo "quay.io/$org/$repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
          if ${{ inputs.is_legacy }}; then
            if ! ${{ inputs.is_release }}; then
              echo "quay.io/$org/$legacy_repo:${{ inputs.sha }}" >> $GITHUB_OUTPUT
            fi
            if [ -n "${{ inputs.tag }}" ]; then
              echo "quay.io/$org/$legacy_repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
            fi
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        id: build-and-push
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.tags.outputs.tags }}

      - name: Image digests
        run: |
          > "digest-${{ matrix.name }}.txt"
          IFS=$'\n'
          for tag in $(cat <<EOF
          ${{ steps.tags.outputs.tags }}
          EOF
          ); do
            echo "$tag@${{ steps.build-and-push.outputs.digest }}" >> "digest-${{ matrix.name }}.txt"
          done
          unset IFS
          echo "" >> "digest-${{ matrix.name }}.txt"

      - name: Upload digests artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
          retention-days: 1

  image-digests:
    if: ${{ always() }}
    name: Display Digests
    runs-on: ubuntu-24.04
    needs: build-and-push
    steps:
      - name: Download digests of all images built
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: digests/
          pattern: digest-*
          merge-multiple: true

      - name: Image Digests Output
        shell: bash
        run: |
          find digests/ -type f | sort | xargs -d '\n' cat

  helm-chart:
    if: ${{ success() }}
    name: Push OCI Helm Chart
    runs-on: ubuntu-24.04
    needs: build-and-push
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Get chart version
        id: version
        run: |
          echo "chart_version=$(make chart-version)" >> $GITHUB_OUTPUT

      - name: Push OCI Helm dev chart
        uses: cilium/reusable-workflows/.github/actions/push-helm-chart@6ae27958f2f37545bf48e44106b73df05b1f6d12 # v0.1.0
        with:
          name: tetragon
          path: install/kubernetes/tetragon
          version: ${{ steps.version.outputs.chart_version }}
          values_file_changes: |
            {
              "tetragon.image.repository": "quay.io/isovalent-dev/tetragon-ci",
              "tetragon.image.tag": "${{ inputs.sha }}",
              "tetragonOperator.image.repository": "quay.io/isovalent-dev/tetragon-operator-ci",
              "tetragonOperator.image.tag": "${{ inputs.sha }}",
            }
          registry: quay.io
          registry_namespace: isovalent-charts-dev
          registry_username: ${{ secrets.QUAY_CHARTS_USERNAME }}
          registry_password: ${{ secrets.QUAY_CHARTS_PASSWORD }}

      - name: Print helm command
        run: |
          echo "Example commands:"
          echo helm template -n tetragon oci://quay.io/isovalent-charts-dev/tetragon --version ${{ steps.version.outputs.chart_version }}
          echo helm install tetragon -n tetragon oci://quay.io/isovalent-charts-dev/tetragon --version ${{ steps.version.outputs.chart_version }}
