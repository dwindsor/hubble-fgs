name: Base Image Build

on:
  workflow_call:
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true
      QUAY_CHARTS_USERNAME:
        required: true
      QUAY_CHARTS_PASSWORD:
        required: true
    inputs:
      # Used to checkout the source code and as a tag for non-release images.
      sha:
        required: true
        type: string
      # Tag to push. Optional for non-release images - if empty, only the sha tag is pushed.
      tag:
        type: string
      # Release images are pushed to isovalent Quay org, non-release to isovalent-dev.
      is_release:
        type: boolean

jobs:
  build-and-push:
    permissions:
      contents: read
      actions: read
      # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
      id-token: write
    runs-on: ubuntu-latest-4cores-16gb
    strategy:
      matrix:
        include:
          - name: tetragon
            dockerfile: ./Dockerfile

          - name: tetragon-slim
            dockerfile: ./Dockerfile.slim

          - name: tetragon-aggregator
            dockerfile: ./Dockerfile.aggregator

          - name: tetragon-operator
            dockerfile: ./Dockerfile.operator

    steps:
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Checkout Source Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      # TODO: Validate that at least one tag is set. If is_release=true and
      # tag="" then there is no tag to push.
      - name: Get image tags
        id: tags
        run: |
          org="${{ github.repository_owner }}"
          repo="${{ matrix.name }}"
          if ! ${{ inputs.is_release }}; then
            org="$org-dev"
            repo="$repo-ci"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if ! ${{ inputs.is_release }}; then
            echo "quay.io/$org/$repo:${{ inputs.sha }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            echo "quay.io/$org/$repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build-and-push
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.tags.outputs.tags }}

      - name: Get first tag for subsequent steps
        id: first-tag
        run: |
          first_tag=$(echo "${{ steps.tags.outputs.tags }}" | head -n1)
          echo "tag=${first_tag}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign Container Image
        run: |
          cosign sign -y "${{ steps.first-tag.outputs.tag }}@${{ steps.build-and-push.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: sbom${{ inputs.is_release && '' || '_ci' }}_${{ matrix.name }}_${{ inputs.tag || inputs.sha }}.spdx.json
          output-file: ./sbom${{ inputs.is_release && '' || '_ci' }}_${{ matrix.name }}_${{ inputs.tag || inputs.sha }}.spdx.json
          image: ${{ steps.first-tag.outputs.tag }}
          upload-release-assets: false

      - name: Attach SBOM attestation to container image
        run: |
          cosign attest -y --predicate sbom${{ inputs.is_release && '' || '_ci' }}_${{ matrix.name }}_${{ inputs.tag || inputs.sha }}.spdx.json --type spdxjson "${{ steps.first-tag.outputs.tag }}@${{ steps.build-and-push.outputs.digest }}"

      - name: Image Release Digest
        shell: bash
        run: |
          mkdir -p image-digest/
          job_name=${{ inputs.is_release && matrix.name || format('{0}-ci', matrix.name) }}
          job_name_capital=${job_name^^}
          job_name_underscored=${job_name_capital//-/_}
          echo "${job_name_underscored}_DIGEST := \"${{ steps.build-and-push.outputs.digest }}\"" > image-digest/makefile-digest.txt

          echo "### $job_name" > image-digest/$job_name.txt
          echo "" >> image-digest/$job_name.txt
          echo "${{ steps.first-tag.outputs.tag }}@${{ steps.build-and-push.outputs.digest }}" >> image-digest/$job_name.txt
          echo "" >> image-digest/$job_name.txt

      - name: Upload artifact digests
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: image-digest-${{ inputs.is_release && matrix.name || format('{0}-ci', matrix.name) }}
          path: image-digest
          retention-days: ${{ inputs.is_release && 90 || 7 }}

  image-digests:
    name: Display Digests
    runs-on: ubuntu-24.04
    needs: build-and-push
    permissions:
      actions: read
      contents: read
    steps:
      - name: Getting image tag and making image-digest directory
        id: tag
        run: |
          echo tag=${GITHUB_REF##*/} >> $GITHUB_OUTPUT
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: image-digest/
          pattern: image-digest-*
  
      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          echo "## Docker Manifests" > ../image-digest-output.txt
          echo "" >> ../image-digest-output.txt
          find -type f -not -name "makefile-digest.txt" | sort | xargs -d '\n' cat >> ../image-digest-output.txt

      - name: Image Makefile Digests
        shell: bash
        run: |
          cd image-digest/
          echo "# File generated by .github/workflows/build-images-base.yml; DO NOT EDIT." > ../Makefile.digests
          echo "# Copyright $(date +'%Y') Authors of Tetragon" >> ../Makefile.digests
          echo "# Copyright (C) Isovalent, Inc. - All Rights Reserved." >> ../Makefile.digests
          echo "" >> ../Makefile.digests
          find -type f  -name "makefile-digest.txt" | sort | xargs -d '\n' awk '{print "export " $0}' >> ../Makefile.digests

      - name: Upload artifact digests
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: image-digest-output.txt-${{ steps.tag.outputs.tag }}
          path: image-digest-output.txt
          retention-days: ${{ inputs.is_release && 90 || 7 }}

      - name: Upload artifact digests
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Makefile.digests-${{ steps.tag.outputs.tag }}
          path: Makefile.digests
          retention-days: ${{ inputs.is_release && 90 || 7 }}

  helm-chart:
    if: ${{ success() }}
    name: Push OCI Helm Chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: build-and-push
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Get chart version
        id: version
        run: |
          echo "chart_version=$(make chart-version)" >> $GITHUB_OUTPUT

      - name: Push OCI Helm dev chart
        uses: cilium/reusable-workflows/.github/actions/push-helm-chart@6ae27958f2f37545bf48e44106b73df05b1f6d12 # v0.1.0
        with:
          name: tetragon
          path: install/kubernetes/tetragon
          version: ${{ steps.version.outputs.chart_version }}
          values_file_changes: |
            {
              "tetragon.image.repository": "quay.io/isovalent-dev/tetragon-ci",
              "tetragon.image.tag": "${{ inputs.sha }}",
              "tetragonAggregator.image.repository": "quay.io/isovalent-dev/tetragon-aggregator-ci",
              "tetragonAggregator.image.tag": "${{ inputs.sha }}",
              "tetragonOperator.image.repository": "quay.io/isovalent-dev/tetragon-operator-ci",
              "tetragonOperator.image.tag": "${{ inputs.sha }}",
            }
          registry: quay.io
          registry_namespace: isovalent-charts-dev
          registry_username: ${{ secrets.QUAY_CHARTS_USERNAME }}
          registry_password: ${{ secrets.QUAY_CHARTS_PASSWORD }}

      - name: Print helm command
        run: |
          echo "Example commands:"
          echo helm template -n tetragon oci://quay.io/isovalent-charts-dev/tetragon --version ${{ steps.version.outputs.chart_version }}
          echo helm install tetragon -n tetragon oci://quay.io/isovalent-charts-dev/tetragon --version ${{ steps.version.outputs.chart_version }}
