name: Base Image Build

on:
  workflow_call:
    inputs:
      # Used to checkout the source code and as a tag for non-release images.
      sha:
        required: true
        type: string
      # Tag to push. Optional for non-release images - if empty, only the sha tag is pushed.
      tag:
        type: string
      # Release images are pushed to isovalent Quay org, non-release to isovalent-dev.
      is_release:
        type: boolean
      is_lseg:
        type: boolean

jobs:
  build-and-push:
    permissions:
      contents: read
      actions: read
      # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
      id-token: write
    runs-on: ubuntu-latest-4cores-16gb
    strategy:
      matrix:
        include:
          - name: tetragon
            dockerfile: ./Dockerfile

          - name: tetragon-slim
            dockerfile: ./Dockerfile.slim

          - name: tetragon-aggregator
            dockerfile: ./Dockerfile.aggregator

          - name: tetragon-operator
            dockerfile: ./Dockerfile.operator

          - name: tetragon-rthooks
            dockerfile: ./Dockerfile.rthooks

    steps:
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Artifactory
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      # TODO: Validate that at least one tag is set. If is_release=true and
      # tag="" then there is no tag to push.
      - name: Get image tags
        id: tags
        run: |
          repo="${{ matrix.name }}"

          # CI images go to isovalent-eng-docker, release images go to isovalent-iep-docker
          if ${{ inputs.is_release }}; then
            registry_path="isovalent-iep-docker"
          else
            registry_path="isovalent-eng-docker"
            repo="$repo-ci"
          fi

          if ${{ inputs.is_lseg }}; then
            registry_path="isovalent-lseg-private-docker"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if ! ${{ inputs.is_release }}; then
            echo "${{ vars.ARTIFACTORY_HOST }}/${registry_path}/$repo:${{ inputs.sha }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            echo "${{ vars.ARTIFACTORY_HOST }}/${registry_path}/$repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and Push
        id: build-and-push
        run: |
          # Build --tag flags from multi-line tags output
          tag_flags=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_flags="${tag_flags} --tag ${tag}"
          done <<< "${{ steps.tags.outputs.tags }}"

          metadata_file=$(mktemp)
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --file ${{ matrix.dockerfile }} \
              --platform linux/amd64,linux/arm64 \
              --build-arg LSEG=${{ inputs.is_lseg && '1' || '0' }} \
              --attest type=provenance,mode=min,inline-only=true,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }} \
              ${tag_flags} \
              --metadata-file "${metadata_file}" \
              --push .; then
              digest=$(jq -r '."containerimage.digest"' "${metadata_file}")
              echo "digest=${digest}" >> $GITHUB_OUTPUT
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          echo "Build failed after 5 attempts"
          exit 1

      - name: Get first tag for subsequent steps
        id: first-tag
        run: |
          first_tag=$(echo "${{ steps.tags.outputs.tags }}" | head -n1)
          echo "tag=${first_tag}" >> $GITHUB_OUTPUT

      - name: Check image for embedded APK metadata or credentials
        shell: bash
        run: |
          image="${{ steps.first-tag.outputs.tag }}"
          docker pull "${image}"
          image_archive="$(mktemp)"
          rootfs_archive="$(mktemp)"
          container_id=""
          trap 'rm -f "${image_archive}" "${rootfs_archive}"; [ -z "${container_id}" ] || docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker save -o "${image_archive}" "${image}"
          if grep -aqE "apk\.cgr\.dev|virtualapk\.cgr\.dev" "${image_archive}"; then
            echo "Found APK repository reference in ${image}"
            exit 1
          fi
          container_id="$(docker create "${image}" /bin/true)"
          docker export -o "${rootfs_archive}" "${container_id}"
          if tar -tf "${rootfs_archive}" | grep -Eq '(^|/)etc/apk(/|$)|(^|/)etc/apko\.json$'; then
            echo "Found APK metadata in ${image}"
            exit 1
          fi

      - name: Image Release Digest
        shell: bash
        run: |
          mkdir -p image-digest/
          job_name=${{ matrix.name }}
          job_name_capital=${job_name^^}
          job_name_underscored=${job_name_capital//-/_}
          echo "${job_name_underscored}_DIGEST := \"${{ steps.build-and-push.outputs.digest }}\"" > image-digest/makefile-digest.txt

          echo "### $job_name" > image-digest/$job_name.txt
          echo "" >> image-digest/$job_name.txt
          echo "${{ steps.first-tag.outputs.tag }}@${{ steps.build-and-push.outputs.digest }}" >> image-digest/$job_name.txt
          echo "" >> image-digest/$job_name.txt

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.name }}${{ inputs.is_lseg && '-lseg' || '' }}${{ inputs.is_release && '' || '-ci' }}
          path: image-digest
          retention-days: ${{ inputs.is_release && 90 || 7 }}

  image-digests:
    name: Display Digests
    runs-on: ubuntu-24.04
    needs: build-and-push
    permissions:
      actions: read
      contents: read
    steps:
      - name: Getting image tag and making image-digest directory
        id: tag
        run: |
          echo tag=${GITHUB_REF##*/} >> $GITHUB_OUTPUT
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: image-digest/
          pattern: image-digest*${{ inputs.is_lseg && '-lseg' || '' }}-*

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          echo "## Docker Manifests" > ../image-digest-output.txt
          echo "" >> ../image-digest-output.txt
          find -type f -not -name "makefile-digest.txt" | sort | xargs -d '\n' cat >> ../image-digest-output.txt

      - name: Image Makefile Digests
        shell: bash
        run: |
          cd image-digest/
          echo "# File generated by .github/workflows/build-images-base.yml; DO NOT EDIT." > ../Makefile.digests
          echo "# Copyright $(date +'%Y') Authors of Tetragon" >> ../Makefile.digests
          echo "# Copyright (C) Isovalent, Inc. - All Rights Reserved." >> ../Makefile.digests
          echo "" >> ../Makefile.digests
          find -type f  -name "makefile-digest.txt" | sort | xargs -d '\n' awk '{print "export " $0}' >> ../Makefile.digests

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-output${{ inputs.is_lseg && '-lseg' || '' }}.txt-${{ steps.tag.outputs.tag }}
          path: image-digest-output.txt
          retention-days: ${{ inputs.is_release && 90 || 7 }}

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Makefile.digests${{ inputs.is_lseg && '.lseg' || '' }}-${{ steps.tag.outputs.tag }}
          path: Makefile.digests
          retention-days: ${{ inputs.is_release && 90 || 7 }}

  helm-chart:
    if: ${{ success() }}
    name: Push OCI Helm Chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: build-and-push
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Get chart version
        id: version
        run: |
          echo "chart_version=$(make chart-version)" >> $GITHUB_OUTPUT

      - name: Set registry path
        id: registry
        run: |
          REGISTRY_PATH="isovalent-eng-docker"

          if ${{ inputs.is_lseg }}; then
            REGISTRY_PATH="isovalent-lseg-private-docker"
          elif ${{ inputs.is_release }}; then
            REGISTRY_PATH="isovalent-iep-docker"
          fi

          echo "path=${REGISTRY_PATH}" >> $GITHUB_OUTPUT

      - name: Push OCI Helm dev chart
        uses: cilium/reusable-workflows/.github/actions/push-helm-chart@6ae27958f2f37545bf48e44106b73df05b1f6d12 # v0.1.0
        with:
          name: tetragon
          path: install/kubernetes/tetragon
          version: ${{ steps.version.outputs.chart_version }}
          values_file_changes: |
            {
              "tetragon.image.repository": "${{ vars.ARTIFACTORY_HOST }}/${{ steps.registry.outputs.path }}/tetragon${{
                inputs.is_release && '' || '-ci'
              }}",
              "tetragon.image.tag": "${{ inputs.is_release && inputs.tag || inputs.sha }}",
              "tetragonAggregator.image.repository": "${{ vars.ARTIFACTORY_HOST }}/${{ steps.registry.outputs.path }}/tetragon-aggregator${{
                inputs.is_release && '' || '-ci'
              }}",
              "tetragonAggregator.image.tag": "${{ inputs.is_release && inputs.tag || inputs.sha }}",
              "tetragonOperator.image.repository": "${{ vars.ARTIFACTORY_HOST }}/${{ steps.registry.outputs.path }}/tetragon-operator${{
                inputs.is_release && '' || '-ci'
              }}",
              "tetragonOperator.image.tag": "${{ inputs.is_release && inputs.tag || inputs.sha }}",
              "rthooks.image.repository": "${{ vars.ARTIFACTORY_HOST }}/${{ steps.registry.outputs.path }}/tetragon-rthooks${{
                inputs.is_release && '' || '-ci'
              }}",
              "rthooks.image.tag": "${{ inputs.is_release && inputs.tag || inputs.sha }}",
            }
          registry: ${{ vars.ARTIFACTORY_HOST }}
          registry_namespace: ${{ steps.registry.outputs.path }}/charts
          registry_username: ${{ vars.ARTIFACTORY_USERNAME }}
          registry_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Print helm command
        run: |
          echo "Example commands:"
          echo helm template -n tetragon oci://${{ vars.ARTIFACTORY_HOST }}/${{ steps.registry.outputs.path }}/charts/tetragon --version ${{ steps.version.outputs.chart_version }}
          echo helm install tetragon -n tetragon oci://${{ vars.ARTIFACTORY_HOST }}/${{ steps.registry.outputs.path }}/charts/tetragon --version ${{ steps.version.outputs.chart_version }}
