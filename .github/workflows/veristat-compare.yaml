name: Run veristat compare
on:
  pull_request:
    paths:
      - 'bpf/**'
      - '.github/actions/veristat/**'

jobs:
  veristat-compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: branch
          submodules: true

      - name: Checkout base ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: base
          submodules: true
          ref: ${{ github.base_ref }}

      - name: Build BPF programs
        run: |
          make -C branch tetragon-bpf
          make -C base tetragon-bpf

      - name: Run veristat comparison
        uses: ./branch/.github/actions/veristat
        with:
          compare: true
          baseline-programs: "base/bpf/objs/*.o"
          comparison-programs: "branch/bpf/objs/*.o"
