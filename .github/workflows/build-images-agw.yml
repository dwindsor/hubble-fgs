name: Build Hubble FGS AGW Docker Images

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.event_name == 'pull_request' && format('{0}-pr-{1}-{2}', github.workflow, github.event.pull_request.number, github.event.action) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  AGW_IMAGE_NAME: isovalent/agw

jobs:
  init:
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0
      - name: Get version and set outputs
        id: get-version
        run: |
          VERSION=$(make version)
          echo "Version from make: $VERSION"
          
          # Check if VERSION is empty or matches a SHA pattern
          if [[ -z "$VERSION" || "$VERSION" =~ ^[a-f0-9]{7,}$ ]]; then
            echo "WARNING: Version appears to be empty or a SHA. Using tag from git describe instead."
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Updated version to: $VERSION"
          fi
          
          # Remove the -g<SHA> part if present
          if [[ "$VERSION" =~ (.*)-g[a-f0-9]+ ]]; then
            TRIMMED_VERSION="${BASH_REMATCH[1]}"
            echo "Trimming git SHA suffix, updated version: $TRIMMED_VERSION"
            VERSION="$TRIMMED_VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      date: ${{ steps.get-version.outputs.date }}
      sha: ${{ steps.get-version.outputs.sha }}

  build-agw-binaries:
    needs: [ init ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: 'go.mod'
      - name: Build AGW binary
        run: |
          echo "Building AGW binary..."
          if make agw 2>&1 | tee agw_build.log; then
            echo "✅ AGW build successful"
            echo "Files in current directory after make agw:"
            ls -la agw* || echo "No agw binary found"
            mkdir -p binaries/agw
            cp agw binaries/agw/
          else
            echo "❌ AGW build failed"
            echo "Build error output:"
            cat agw_build.log
            exit 1
          fi
      - name: Build AGWctl binary
        run: |
          echo "Building AGWctl binary..."
          if make agwctl 2>&1 | tee agwctl_build.log; then
            echo "✅ AGWctl build successful"
            echo "Files in current directory after make agwctl:"
            ls -la agwctl* || echo "No agwctl binary found"
            mkdir -p binaries/agwctl
            cp agwctl binaries/agwctl/
          else
            echo "❌ AGWctl build failed"
            echo "Build error output:"
            cat agwctl_build.log
            exit 1
          fi
      - name: Copy AGW install files
        run: |
          echo "Copying AGW install files..."
          mkdir -p binaries/install/agw
          cp -r install/agw/* binaries/install/agw/
          echo "Install files copied:"
          ls -la binaries/install/agw/
      - name: Upload AGW binaries artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hubble-fgs-agw-binaries-${{ needs.init.outputs.version }}
          path: binaries/
          retention-days: 1

  build-agw-image:
    needs: [ init ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    env:
      DOCKER_IMAGE_TAG: ${{ needs.init.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build AGW image
        run: |
          make image-agw
      - name: Create tar file from Docker image
        id: create-tar
        run: |
          FINAL_TAR_NAME="agw"
          IMAGE_URI="${AGW_IMAGE_NAME}:${DOCKER_IMAGE_TAG}"
          docker save "$IMAGE_URI" -o "${FINAL_TAR_NAME}.tar" && gzip "${FINAL_TAR_NAME}.tar"
          ARTIFACT="${FINAL_TAR_NAME}.tar.gz"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "artifact_path=$(pwd)/${ARTIFACT}" >> $GITHUB_OUTPUT
      - name: Upload Docker image tar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hubble-fgs-agw-docker-image-${{ needs.init.outputs.version }}
          path: ${{ steps.create-tar.outputs.artifact_path }}
          retention-days: 1
      - name: Image digest summary
        run: |
          echo "### AGW Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | hubble-fgs |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ needs.init.outputs.version }} |" >> $GITHUB_STEP_SUMMARY

  trigger-code-drop:
    needs: [ init, build-agw-image, build-agw-binaries ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    if: ${{ needs.build-agw-image.result == 'success' && needs.build-agw-binaries.result == 'success' && github.ref == 'refs/heads/master' }}
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      VERSION: ${{ needs.init.outputs.version }}
      DATE: ${{ needs.init.outputs.date }}
      SHA: ${{ needs.init.outputs.sha }}
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }}
      - name: Trigger Code Drop Workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.workflow-token.outputs.token }}
          script: |
            const workflowFileName = 'code-drop-isovalent.yaml';
            const inputs = {
              'repository': context.payload.repository.full_name,
              'branch': context.ref,
              'artifact-names': `hubble-fgs-agw-docker-image-${process.env.VERSION},hubble-fgs-agw-binaries-${process.env.VERSION}`,
              'image-tag': `${process.env.VERSION}-${process.env.DATE}-${process.env.SHA}`,
              'ref-file': 'nxos-ref-package.yaml',
              'run-id': `${context.runId}`,
              'vault-approle-role-id': process.env.VAULT_ROLE_ID,
              'vault-approle-secret-id': process.env.VAULT_SECRET_ID
            };
            console.log(`Triggering workflow ${workflowFileName} in ${process.env.TARGET_ORG}/${process.env.TARGET_REPO}`);
            try {
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: process.env.TARGET_ORG,
                repo: process.env.TARGET_REPO,
                workflow_id: workflowFileName,
                ref: 'main',
                inputs: inputs
              });
              console.log('Workflow dispatch triggered successfully');
            } catch (error) {
              console.error('Error triggering workflow dispatch:', error);
              core.setFailed(`Failed to trigger workflow: ${error.message}`);
            }
        env:
          VERSION: ${{ needs.init.outputs.version }}
          DATE: ${{ needs.init.outputs.date }}
          SHA: ${{ needs.init.outputs.sha }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
      - name: Cross-Org Workflow Summary
        run: |
          echo "### Cross-Organization Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Organization | ${{ env.TARGET_ORG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Repository | ${{ env.TARGET_REPO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Workflow | code-drop-isovalent.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Name | ${{ github.event.repository.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
  
  trigger-corona-scan:
    needs: [ init, build-agw-image ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    if: ${{ needs.build-agw-image.result == 'success' }}
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      VERSION: ${{ needs.init.outputs.version }}
      DATE: ${{ needs.init.outputs.date }}
      SHA: ${{ needs.init.outputs.sha }}
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }}
      - name: Trigger Corona Scan Workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.workflow-token.outputs.token }}
          script: |
            const workflowFileName = 'corona-blackduck-scan-isovalent.yaml';
            const inputs = {
              'repository': context.payload.repository.full_name,
              'branch': context.ref,
              'run-id': `${context.runId}`,
              'artifact-name-with-full-image-tag': `hubble-fgs-agw-docker-image-${process.env.VERSION}+${process.env.AGW_IMAGE_NAME}-${process.env.VERSION}-${process.env.DATE}-${process.env.SHA}`,
              'corona-product-name': 'Hypershield-SmartSwitch',
              'corona-product-id': '16529',
              'corona-release-version': '360139',
              'corona-csdl-id': '245071',
              'vault-approle-role-id': process.env.VAULT_ROLE_ID,
              'vault-approle-secret-id': process.env.VAULT_SECRET_ID
            };
            console.log(`Triggering Corona scan workflow in ${process.env.TARGET_ORG}/${process.env.TARGET_REPO}`);
            try {
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: process.env.TARGET_ORG,
                repo: process.env.TARGET_REPO,
                workflow_id: workflowFileName,
                ref: 'main',
                inputs: inputs
              });
              console.log('Corona scan workflow triggered successfully');
            } catch (error) {
              console.error('Error triggering Corona scan workflow:', error);
              core.setFailed(`Failed to trigger workflow: ${error.message}`);
            }
        env:
          VERSION: ${{ needs.init.outputs.version }}
          DATE: ${{ needs.init.outputs.date }}
          SHA: ${{ needs.init.outputs.sha }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
      - name: Corona Scan Workflow Summary
        run: |
          echo "### Corona Scan Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Organization | ${{ env.TARGET_ORG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Repository | ${{ env.TARGET_REPO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Workflow | corona-blackduck-scan-isovalent.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Name | ${{ env.AGW_IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.init.outputs.version }} |" >> $GITHUB_STEP_SUMMARY