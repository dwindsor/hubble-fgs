name: Build Hubble FGS AGW Docker Images, Binaries and Test Images

on:
  push:
    branches: [ master ]
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
    branches: [ master ]
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: read
  pages: write

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.event_name == 'pull_request' && format('{0}-pr-{1}-{2}', github.workflow, github.event.pull_request.number, github.event.action) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  AGW_IMAGE_NAME: isovalent/agw

jobs:
  init:
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            Makefile
            Makefile.defs
          sparse-checkout-cone-mode: false
          fetch-tags: true
          fetch-depth: 0
      - name: Get version and set outputs
        id: get-version
        run: make agw-version
      - name: Validate release metadata
        run: make validate-release-metadata
        env:
          REL_VERSION: ${{ steps.get-version.outputs.version }}
          REL_DATE: ${{ steps.get-version.outputs.date }}
          REL_SHA: ${{ steps.get-version.outputs.sha }}
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      date: ${{ steps.get-version.outputs.date }}
      sha: ${{ steps.get-version.outputs.sha }}

  build-agw-binaries:
    needs: [ init ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: 'go.mod'
      - name: Build AGW binary
        run: |
          echo "Building AGW binary..."
          if make agw 2>&1 | tee agw_build.log; then
            echo "✅ AGW build successful"
            echo "Files in current directory after make agw:"
            ls -la agw* || echo "No agw binary found"
            mkdir -p binaries/agw
            cp agw binaries/agw/
          else
            echo "❌ AGW build failed"
            echo "Build error output:"
            cat agw_build.log
            exit 1
          fi
      - name: Build AGWctl binary
        run: |
          echo "Building AGWctl binary..."
          if make agwctl 2>&1 | tee agwctl_build.log; then
            echo "✅ AGWctl build successful"
            echo "Files in current directory after make agwctl:"
            ls -la agwctl* || echo "No agwctl binary found"
            mkdir -p binaries/agwctl
            cp agwctl binaries/agwctl/
          else
            echo "❌ AGWctl build failed"
            echo "Build error output:"
            cat agwctl_build.log
            exit 1
          fi
      - name: Copy AGW install files
        run: |
          echo "Copying AGW install files..."
          mkdir -p binaries/install/agw
          cp -r install/agw/* binaries/install/agw/
          echo "Install files copied:"
          ls -la binaries/install/agw/
      - name: Upload AGW binaries artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: hubble-fgs-agw-binaries-${{ needs.init.outputs.version }}
          path: binaries/
          retention-days: 1

  build-agw-image:
    needs: [ init ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 10
    env:
      DOCKER_IMAGE_TAG: ${{ needs.init.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build AGW image
        run: |
          make image-agw
      - name: Create tar file from Docker image
        id: create-tar
        run: |
          FINAL_TAR_NAME="agw"
          IMAGE_URI="${AGW_IMAGE_NAME}:${DOCKER_IMAGE_TAG}"
          docker save "$IMAGE_URI" -o "${FINAL_TAR_NAME}.tar" && gzip "${FINAL_TAR_NAME}.tar"
          ARTIFACT="${FINAL_TAR_NAME}.tar.gz"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "artifact_path=$(pwd)/${ARTIFACT}" >> $GITHUB_OUTPUT
      - name: Upload Docker image tar artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: hubble-fgs-agw-docker-image-${{ needs.init.outputs.version }}
          path: ${{ steps.create-tar.outputs.artifact_path }}
          retention-days: 1
      - name: Image digest summary
        run: |
          echo "### AGW Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | hubble-fgs |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ needs.init.outputs.version }} |" >> $GITHUB_STEP_SUMMARY

  trigger-code-drop:
    needs: [ init, build-agw-image, build-agw-binaries ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    if: ${{ needs.build-agw-image.result == 'success' && needs.build-agw-binaries.result == 'success' && github.ref == 'refs/heads/master' }}
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      VERSION: ${{ needs.init.outputs.version }}
      DATE: ${{ needs.init.outputs.date }}
      SHA: ${{ needs.init.outputs.sha }}
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }}
      - name: Trigger Code Drop Workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.workflow-token.outputs.token }}
          script: |
            const workflowFileName = 'code-drop-isovalent.yaml';
            const inputs = {
              'repository': context.payload.repository.full_name,
              'branch': context.ref,
              'artifact-names': `hubble-fgs-agw-docker-image-${process.env.VERSION},hubble-fgs-agw-binaries-${process.env.VERSION}`,
              'image-tag': `${process.env.VERSION}-${process.env.DATE}-${process.env.SHA}`,
              'ref-file': 'nxos-ref-package.yaml',
              'run-id': `${context.runId}`,
              'vault-approle-role-id': process.env.VAULT_ROLE_ID,
              'vault-approle-secret-id': process.env.VAULT_SECRET_ID
            };
            console.log(`Triggering workflow ${workflowFileName} in ${process.env.TARGET_ORG}/${process.env.TARGET_REPO}`);
            try {
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: process.env.TARGET_ORG,
                repo: process.env.TARGET_REPO,
                workflow_id: workflowFileName,
                ref: 'main',
                inputs: inputs
              });
              console.log('Workflow dispatch triggered successfully');
            } catch (error) {
              console.error('Error triggering workflow dispatch:', error);
              core.setFailed(`Failed to trigger workflow: ${error.message}`);
            }
        env:
          VERSION: ${{ needs.init.outputs.version }}
          DATE: ${{ needs.init.outputs.date }}
          SHA: ${{ needs.init.outputs.sha }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
      - name: Cross-Org Workflow Summary
        run: |
          echo "### Cross-Organization Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Organization | ${{ env.TARGET_ORG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Repository | ${{ env.TARGET_REPO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Workflow | code-drop-isovalent.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Name | ${{ github.event.repository.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
  
  trigger-corona-scan:
    needs: [ init, build-agw-image ]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 1
    if: ${{ needs.build-agw-image.result == 'success' && github.ref == 'refs/heads/master' }}
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      VERSION: ${{ needs.init.outputs.version }}
      DATE: ${{ needs.init.outputs.date }}
      SHA: ${{ needs.init.outputs.sha }}
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }}
      - name: Trigger Corona Scan Workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.workflow-token.outputs.token }}
          script: |
            const workflowFileName = 'corona-blackduck-scan-isovalent.yaml';
            const inputs = {
              'repository': context.payload.repository.full_name,
              'branch': context.ref,
              'run-id': `${context.runId}`,
              'artifact-name-with-full-image-tag': `hubble-fgs-agw-docker-image-${process.env.VERSION}+${process.env.AGW_IMAGE_NAME}-${process.env.VERSION}-${process.env.DATE}-${process.env.SHA}`,
              'corona-product-name': 'Hypershield-SmartSwitch',
              'corona-product-id': '16529',
              'corona-release-version': '360139',
              'corona-csdl-id': '245071',
              'vault-approle-role-id': process.env.VAULT_ROLE_ID,
              'vault-approle-secret-id': process.env.VAULT_SECRET_ID
            };
            console.log(`Triggering Corona scan workflow in ${process.env.TARGET_ORG}/${process.env.TARGET_REPO}`);
            try {
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: process.env.TARGET_ORG,
                repo: process.env.TARGET_REPO,
                workflow_id: workflowFileName,
                ref: 'main',
                inputs: inputs
              });
              console.log('Corona scan workflow triggered successfully');
            } catch (error) {
              console.error('Error triggering Corona scan workflow:', error);
              core.setFailed(`Failed to trigger workflow: ${error.message}`);
            }
        env:
          VERSION: ${{ needs.init.outputs.version }}
          DATE: ${{ needs.init.outputs.date }}
          SHA: ${{ needs.init.outputs.sha }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
      - name: Corona Scan Workflow Summary
        run: |
          echo "### Corona Scan Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Organization | ${{ env.TARGET_ORG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Repository | ${{ env.TARGET_REPO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Workflow | corona-blackduck-scan-isovalent.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Name | ${{ env.AGW_IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.init.outputs.version }} |" >> $GITHUB_STEP_SUMMARY

  call-sanity-tests:
    needs: [ init, build-agw-image ]
    if: ${{ needs.build-agw-image.result == 'success' }}
    uses: ./.github/workflows/agw-sanity-tests.yaml
    with:
      version: ${{ needs.init.outputs.version }}
      date: ${{ needs.init.outputs.date }}
      sha: ${{ needs.init.outputs.sha }}
    secrets:
      HYPERSHIELD_GH_APP_PEM: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}

  combine-artifacts:
    needs: [ init, build-agw-image, build-agw-binaries, call-sanity-tests ]
    if: ${{ always() && !cancelled() && needs.build-agw-image.result == 'success' && needs.build-agw-binaries.result == 'success' && needs.call-sanity-tests.result == 'success' }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    outputs:
      artifact_dir: ${{ steps.prepare-artifacts.outputs.artifact_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            Makefile
            Makefile.defs
          sparse-checkout-cone-mode: false
      - name: Download AGW Docker image artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "hubble-fgs-agw-docker-image-${{ needs.init.outputs.version }}"
          path: "./combined-artifacts/docker"
      - name: Download AGW binaries artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "hubble-fgs-agw-binaries-${{ needs.init.outputs.version }}"
          path: "./combined-artifacts/binaries"
      - name: Download test results artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        continue-on-error: true
        with:
          name: "agw-sanity-test-results"
          path: "./combined-artifacts/test-results"
      - name: List downloaded artifacts
        run: |
          echo "Docker artifacts:"
          find ./combined-artifacts/docker -type f | sort
          echo "\nBinaries artifacts:"
          find ./combined-artifacts/binaries -type f | sort
          echo "\nTest results:"
          find ./combined-artifacts/test-results -type f 2>/dev/null | sort || echo "No test results found"
      - name: Prepare artifacts for GitHub release
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          
          # Package Docker image
          cp ./combined-artifacts/docker/*.tar.gz ./release-artifacts/ 2>/dev/null || \
            tar -czf ./release-artifacts/agw-docker-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/docker .
          
          # Package binaries
          tar -czf ./release-artifacts/agw-binaries-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/binaries .
          
          # Package test results if available
          if [ -d "./combined-artifacts/test-results" ] && [ "$(ls -A ./combined-artifacts/test-results 2>/dev/null)" ]; then
            tar -czf ./release-artifacts/agw-test-results-${{ needs.init.outputs.version }}.tar.gz -C ./combined-artifacts/test-results .
          fi
          
          cd ./release-artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt
          echo "artifact_dir=$(pwd)" >> $GITHUB_OUTPUT
      - name: Create release metadata manifest
        run: |
          cat > ./release-artifacts/metadata.json << EOF
          {
            "version": "${{ needs.init.outputs.version }}",
            "date": "${{ needs.init.outputs.date }}",
            "sha": "${{ needs.init.outputs.sha }}",
            "full_sha": "${{ github.sha }}",
            "source_repository": "${{ github.repository }}",
            "source_ref": "${{ github.ref }}",
            "build_timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "release_tag": "${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}",
            "artifacts": [
              {
                "name": "agw.tar.gz",
                "type": "docker-image"
              },
              {
                "name": "agw-binaries-${{ needs.init.outputs.version }}.tar.gz",
                "type": "binaries"
              }
            ]
          }
          EOF
          echo "Created metadata.json:"
          cat ./release-artifacts/metadata.json
      - name: Verify artifact checksums
        run: make release-artifacts-verify-checksums
        env:
          REL_DIR: ./release-artifacts
      - name: Upload prepared artifacts for release job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}
          path: ./release-artifacts
          retention-days: 1

  upload-to-artifactory:
    needs: [ init, combine-artifacts ]
    # TODO: Restore master branch check before merging
    # if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.init.outputs.version }}
      DATE: ${{ needs.init.outputs.date }}
      SHA: ${{ needs.init.outputs.sha }}
    steps:
      - name: Checkout nxos-ref-package.yaml
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            nxos-ref-package.yaml
          sparse-checkout-cone-mode: false
      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./release-artifacts"
      - name: Download AGW binaries artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "hubble-fgs-agw-binaries-${{ needs.init.outputs.version }}"
          path: "./agw-binaries"
      - name: Assemble codedrop structure
        run: |
          # Generate agent.yaml manifest
          cat > ./agent.yaml << EOF
          vendor_name: hypershield
          pkg_entity: agent
          #sw contents - list of files in the agent.rpm
          pkg_files:
          - pkg_file_entity: agent
            pkg_file: agent.tar
            pkg_file_version: ${VERSION}
            pkg_git_label: ${DATE}-${SHA}
          EOF
          sed -i 's/^          //' ./agent.yaml
          echo "Generated agent.yaml:"
          cat ./agent.yaml

          # Assemble ioxsrc/ directory
          mkdir -p ./ioxsrc/bin/hubble/binaries

          # Copy Docker image tar as ioxsrc/agw.tar.gz
          if [ -f "./release-artifacts/agw.tar.gz" ]; then
            cp ./release-artifacts/agw.tar.gz ./ioxsrc/agw.tar.gz
            echo "Copied agw.tar.gz to ioxsrc/"
          fi

          # Copy binaries to ioxsrc/bin/hubble/binaries/
          for dir in agw agwctl; do
            if [ -d "./agw-binaries/${dir}" ]; then
              cp -r ./agw-binaries/${dir} \
                ./ioxsrc/bin/hubble/binaries/${dir}
              echo "Copied ${dir}/ to ioxsrc/bin/hubble/binaries/"
            fi
          done
          if [ -d "./agw-binaries/install" ]; then
            cp -r ./agw-binaries/install \
              ./ioxsrc/bin/hubble/binaries/install
            echo "Copied install/ to ioxsrc/bin/hubble/binaries/"
          fi

          # Generate package.yaml from nxos-ref-package.yaml
          IOX_VERSION=$(echo "${VERSION}" | sed 's/-/./g' | sed 's/^v//')
          cp ./nxos-ref-package.yaml ./ioxsrc/package.yaml
          sed -i "s/^  version: .*/  version: ${IOX_VERSION}/" \
            ./ioxsrc/package.yaml
          echo "Generated package.yaml:"
          cat ./ioxsrc/package.yaml

          echo "\n=== Codedrop structure ==="
          find ./ioxsrc -type f | sort
          echo "========================="
      - name: Get Artifactory Credentials from Vault
        uses: hashicorp/vault-action@7709c609789c5e27b757a85817483caadbb5939a # v3.3.0
        with:
          url: ${{ vars.VAULT_URL }}
          method: ${{ vars.VAULT_METHOD }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            secret/data/devops/${{ github.repository_owner }} artifactory_username | JF_USER;
            secret/data/devops/${{ github.repository_owner }} artifactory_password | JF_PASSWORD;
      - name: Setup access to Artifactory
        uses: jfrog/setup-jfrog-cli@ff5cb544114ffc152db9cea1cd3d5978d5074946 # v4.5.11
        env:
          JF_URL: ${{ vars.ARTIFACTORY_URL }}
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
      - name: Upload AGW artifacts to Artifactory
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_TAG="${RUN_NUMBER}-${DATE}-${SHA}"
          ARTIFACTORY_PATH="isovalent-images-generic/smartswitch/agw/${VERSION}/${BUILD_TAG}"
          
          echo "Uploading AGW artifacts to: ${ARTIFACTORY_PATH}"
          
          # Upload Docker image
          if [ -f "./release-artifacts/agw.tar.gz" ]; then
            jf rt u --flat "./release-artifacts/agw.tar.gz" \
              "${ARTIFACTORY_PATH}/agw.tar.gz"
            echo "✓ Uploaded agw.tar.gz"
          fi
          
          # Upload binaries
          if [ -f "./release-artifacts/agw-binaries-${VERSION}.tar.gz" ]; then
            jf rt u --flat \
              "./release-artifacts/agw-binaries-${VERSION}.tar.gz" \
              "${ARTIFACTORY_PATH}/agw-binaries.tar.gz"
            echo "✓ Uploaded agw-binaries.tar.gz"
          fi
          
          # Upload agent.yaml manifest
          if [ -f "./agent.yaml" ]; then
            jf rt u --flat "./agent.yaml" \
              "${ARTIFACTORY_PATH}/agent.yaml"
            echo "✓ Uploaded agent.yaml"
          fi
          
          # Upload ioxsrc/ codedrop structure
          if [ -d "./ioxsrc" ]; then
            jf rt u "./ioxsrc/" \
              "${ARTIFACTORY_PATH}/ioxsrc/"
            echo "✓ Uploaded ioxsrc/ directory"
          fi
          
          echo "✓ All AGW artifacts uploaded successfully"
      - name: Artifactory Upload Summary
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_TAG="${RUN_NUMBER}-${DATE}-${SHA}"
          ARTIFACTORY_PATH="smartswitch/agw/${VERSION}/${BUILD_TAG}"
          echo "### Artifactory Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifactory Path | ${ARTIFACTORY_PATH}/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Image | agw.tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| Binaries | agw-binaries.tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | agent.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| Codedrop | ioxsrc/ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Codedrop Structure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find ./ioxsrc -type f | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create-hubble-agw-releases-repo-release:
    needs: [ init, combine-artifacts ]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      TARGET_ORG: isovalent
      TARGET_REPO: hubble-agw-releases
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            Makefile
            Makefile.defs
          sparse-checkout-cone-mode: false
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }}
      - name: Checkout hubble-agw-releases repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ env.TARGET_ORG }}/${{ env.TARGET_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: ./hubble-agw-releases-repo
      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: "release-artifacts-${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}"
          path: "./release-artifacts"
      - name: Validate release artifacts and metadata
        run: |
          echo "=== Release Artifacts Validation ==="
          echo "Release artifacts to be published:"
          ls -lah ./release-artifacts/
          echo ""
          echo "=== Checksums ==="
          cat ./release-artifacts/SHA256SUMS.txt
          echo ""
          echo "=== Metadata ==="
          if [[ -f ./release-artifacts/metadata.json ]]; then
            cat ./release-artifacts/metadata.json
          else
            echo "::warning::metadata.json not found in release artifacts"
          fi
          echo ""
          make release-artifacts-validate-files
          echo "==================================="
        env:
          REL_DIR: ./release-artifacts
          REL_REQUIRED_FILES: |
            agw.tar.gz
            agw-binaries-${{ needs.init.outputs.version }}.tar.gz
            SHA256SUMS.txt
            metadata.json
      - name: Verify artifact integrity
        run: make release-artifacts-verify-checksums
        env:
          REL_DIR: ./release-artifacts
          REL_SUMS_FILE: SHA256SUMS.txt
      - name: Create release notes
        run: |
          cd ./hubble-agw-releases-repo
          mkdir -p docs/release-notes
          
          VERSION="${{ needs.init.outputs.version }}"
          DATE="${{ needs.init.outputs.date }}"
          SHA="${{ needs.init.outputs.sha }}"
          FULL_SHA="${{ github.sha }}"
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          CHECKSUMS=$(cat ../release-artifacts/SHA256SUMS.txt)
          
          RELEASE_NOTES_FILE="docs/release-notes/${VERSION}+${SHA}.md"
          
          cat > "$RELEASE_NOTES_FILE" << EOF
          # Release Notes: ${VERSION}+${SHA}
          
          **Release Date:** ${RELEASE_DATE}
          
          ## Build Information
          - **Version:** ${VERSION}
          - **Build Date:** ${DATE}
          - **Commit SHA:** ${SHA}
          - **Full Commit SHA:** ${FULL_SHA}
          - **Source Repository:** [hubble-fgs](https://github.com/isovalent/hubble-fgs)
          - **Source Commit:** https://github.com/isovalent/hubble-fgs/commit/${FULL_SHA}
          
          ## Artifacts
          
          ### Docker Image
          - \`agw.tar.gz\` - AGW Docker image
          
          ### Binaries
          - \`agw-binaries-${VERSION}.tar.gz\` - AGW and AGWctl binaries
          
          ### Test Results
          - \`agw-test-results-${VERSION}.tar.gz\` - Sanity test results (if available)
          
          ### Checksums
          \`\`\`
          ${CHECKSUMS}
          \`\`\`
          
          ## Metadata
          
          A \`metadata.json\` file is included with each release containing machine-readable
          build information for automated downstream processing.
          
          ## Installation
          
          1. Download the appropriate artifacts from the [Releases](https://github.com/isovalent/hubble-agw-releases/releases) page
          2. Verify checksum: \`sha256sum -c SHA256SUMS.txt\`
          3. Extract Docker image: \`tar -xzf agw.tar.gz && docker load -i agw.tar\`
          4. Extract binaries: \`tar -xzf agw-binaries-${VERSION}.tar.gz\`
          5. Deploy according to NXOS integration guide
          
          ## Compatibility
          - **NXOS Version:** Compatible with latest NXOS releases
          - **DPU Platform:** SmartSwitch
          
          ---
          
          For questions or issues, contact @cisco-hypershield/nxos
          EOF
          
          echo "Created release notes at: $RELEASE_NOTES_FILE"
          echo "Content:"
          cat "$RELEASE_NOTES_FILE"
      - name: Commit release notes
        run: |
          cd ./hubble-agw-releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/release-notes/
          git commit -m "docs: Add release notes for ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}" || echo "No changes to commit"
          git push origin main
      - name: Create GitHub Release in hubble-agw-releases
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ env.TARGET_ORG }}/${{ env.TARGET_REPO }}
          tag_name: ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}
          name: ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}
          draft: false
          prerelease: false
          body: |
            ## Hubble FGS AGW Release ${{ needs.init.outputs.version }}
            
            This release contains Hubble FGS AGW (Application Gateway) Docker image and binaries.
            
            ### Build Information
            - **Version:** ${{ needs.init.outputs.version }}
            - **Build Date:** ${{ needs.init.outputs.date }}
            - **Commit SHA:** ${{ needs.init.outputs.sha }}
            - **Source:** [hubble-fgs@${{ github.sha }}](https://github.com/isovalent/hubble-fgs/commit/${{ github.sha }})
            
            ### Artifacts
            - `agw.tar.gz` - AGW Docker image
            - `agw-binaries-${{ needs.init.outputs.version }}.tar.gz` - AGW and AGWctl binaries
            - `agw-test-results-${{ needs.init.outputs.version }}.tar.gz` - Sanity test results (if available)
            - `SHA256SUMS.txt` - Checksums for verification
            
            ### Installation
            1. Download the appropriate artifacts
            2. Verify checksum: `sha256sum -c SHA256SUMS.txt`
            3. Extract Docker image: `tar -xzf agw.tar.gz && docker load -i agw.tar`
            4. Extract binaries: `tar -xzf agw-binaries-${{ needs.init.outputs.version }}.tar.gz`
            5. Deploy according to NXOS integration documentation
            
            ### Release Notes
            Full release notes: [docs/release-notes/${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}.md](https://github.com/isovalent/hubble-agw-releases/blob/main/docs/release-notes/${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}.md)
            
            ---
            
            For questions or issues, contact @cisco-hypershield/nxos
          files: |
            ./release-artifacts/*
      - name: Verify release metadata published
        run: |
          echo "=== Release Publication Summary ==="
          echo "Target Repository: ${{ env.TARGET_ORG }}/${{ env.TARGET_REPO }}"
          echo "Release Tag: ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
          echo ""
          echo "Metadata Published:"
          echo "  - Version: ${{ needs.init.outputs.version }}"
          echo "  - Date: ${{ needs.init.outputs.date }}"
          echo "  - SHA: ${{ needs.init.outputs.sha }}"
          echo "  - Full SHA: ${{ github.sha }}"
          echo ""
          echo "Artifacts Published:"
          ls -la ./release-artifacts/
          echo ""
          echo "✓ Release created successfully with all metadata"
          echo "==================================="

  update-agw-version-dpu-pensando:
    needs: [ init, create-hubble-agw-releases-repo-release ]
    if: ${{ needs.init.result == 'success' && needs.create-hubble-agw-releases-repo-release.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST }}
    timeout-minutes: 5
    env:
      TARGET_ORG: cisco-hypershield
      TARGET_REPO: hs-actions
      TARGET_DPU_REPO: hs-dpu-pensando
    steps:
      - name: Generate GitHub App Token
        id: workflow-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.HYPERSHIELD_GH_APP_ID }}
          private-key: ${{ secrets.HYPERSHIELD_GH_APP_PEM }}
          owner: ${{ env.TARGET_ORG }}
          repositories: ${{ env.TARGET_REPO }},${{ env.TARGET_DPU_REPO }}
      - name: Update AGW version in hs-dpu-pensando
        uses: cisco-hypershield/hs-actions/.github/actions/create-pull-request@main # legit:ignore
        with:
          repository: 'cisco-hypershield/hs-dpu-pensando'
          target-branch: 'main'
          cross-repo-github-token: ${{ steps.workflow-token.outputs.token }}
          auto-merge: true
          auto-approve: true
          create-source-branch: true
          custom-commit-message: "feat: Update AGW_LATEST to ${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
          custom-branch-name: "feature/update-agw-version-${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
          makefile-update-data: |
            [
              {
                "path": "Makefile",
                "key": "AGW_LATEST",
                "value": "${{ needs.init.outputs.version }}+${{ needs.init.outputs.sha }}"
              }
            ]
          keeper-url: ${{ vars.VAULT_URL }}
          vault-namespace: ${{ vars.VAULT_HYPERSHIELD_NAMESPACE }}
          vault-secret-path: secret/data/gitops/gha-creds
          vault-approle-role-id: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
          vault-approle-secret-id: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
