name: Build and Publish OLM catalog

on:
  push:
    branches:
      - master
    paths:
      - 'install/olm/isovalent-catalog/index.yaml'

jobs:
  build-and-push-catalog:
    name: Build and push OLM catalog to Isovalent registry
    runs-on: ubuntu-26.04
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure JFrog CLI for OIDC Auth
        id: setup-isovalent-registry
        uses: jfrog/setup-jfrog-cli@68c0efdc951dd2359bbbfa15c48bc67b3ae8e4d6 # v5.2.0
        env:
          JF_URL: ${{ vars.ISOVALENT_ARTIFACTORY_URL }}
        with:
          oidc-provider-name: ${{ vars.ISOVALENT_ARTIFACTORY_PROVIDER_NAME }}
          oidc-audience: ${{ vars.ISOVALENT_ARTIFACTORY_OIDC_AUDIENCE }}
          custom-server-id: isovalent-registry

      - name: Login to Isovalent Registry
        id: login-isovalent-registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ISOVALENT_ARTIFACTORY_HOST }}
          username: ${{ steps.setup-isovalent-registry.outputs.oidc-user }}
          password: ${{ steps.setup-isovalent-registry.outputs.oidc-token }}

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Build and push
        shell: bash
        run: |
          IMAGE_REPOSITORY="${{ vars.ISOVALENT_ARTIFACTORY_HOST }}" INDEX_DIR="isovalent-catalog" make olm-index-build olm-index-push
