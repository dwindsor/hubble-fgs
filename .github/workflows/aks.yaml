name: ConformanceAKS

on:
  pull_request:
    paths-ignore:
    - "**.md"
    - "contrib/grafana/**"
  push:
    branches:
      - master

# By specifying the access of one of the scopes, all of those that are not
# specified are set to 'none'.
permissions:
  # To be able to access the repository with actions/checkout
  contents: read
  # To allow retrieving information from the PR API
  pull-requests: read
  # So that Sibz/github-status-action can write into the status API
  statuses: write
  # Required to generate OIDC tokens for `az` authentication
  id-token: write

env:
  ciliumCliVersion: v0.12.11
  name: "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}"
  location: westus
  costReduction: --node-vm-size Standard_B2s --node-osdisk-size 30
  check_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: hubble-fgs
          submodules: true

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.25.3'

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            PR_API_JSON=$(curl \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${{ github.event.issue.pull_request.url || github.event.pull_request.url }})
            SHA=$(echo "$PR_API_JSON" | jq -r ".head.sha")
          else
            SHA=${{ github.sha }}
          fi
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "agentImage=quay.io/isovalent-dev/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
          echo "operatorImage=quay.io/isovalent-dev/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT

      - name: Install Cilium CLI
        run: |
          curl -sSL --remote-name-all https://github.com/isovalent/cilium-cli-releases/releases/latest/download/cilium-linux-amd64.tar.gz{,.sha256sum}
          sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
          sudo tar xzvfC cilium-linux-amd64.tar.gz /usr/bin
          rm cilium-linux-amd64.tar.gz{,.sha256sum}
          cilium version

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_PR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PR_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PR_SUBSCRIPTION_ID }}

      - name: Create AKS cluster
        run: |
          # Create group
          az group create \
            --name ${{ env.name }} \
            --location ${{ env.location }} \
            --tags usage=${{ github.repository_owner }}-${{ github.event.repository.name }} owner=${{ steps.vars.outputs.owner }}

          # Create AKS cluster
          az aks create \
            --resource-group ${{ env.name }} \
            --name ${{ env.name }} \
            --location ${{ env.location }} \
            --node-count 2 \
            ${{ env.costReduction }} \
            --generate-ssh-keys \
            --tags svic_falco_supported=no \
            --nodepool-tags svic_osquery_supported=no

      - name: Get cluster credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.name }} \
            --name ${{ env.name }}

      - name: Attempt to pull the FGS image
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            set -e
            docker pull ${{ steps.vars.outputs.agentImage }}
            docker pull ${{ steps.vars.outputs.operatorImage }}

      - name: Fetch Helm subcharts
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 30
          retry_wait_seconds: 30
          command: |
            cd hubble-fgs
            make -C install/kubernetes tetragon/charts

      - name: Run end-to-end tests
        timeout-minutes: 30
        run: |
          cd hubble-fgs
          export HOST_PROC=/proc
          export FLAKY_HTTP=1
          make e2e-test                                          \
            E2E_BUILD_IMAGES=0                                   \
            E2E_EXTRA_GOTEST_FLAGS="-failfast"                   \
            E2E_AGENT=${{ steps.vars.outputs.agentImage }}       \
            E2E_OPERATOR=${{ steps.vars.outputs.operatorImage }} \
            E2E_EXTRA_TEST_FLAGS="-tetragon.keep-export=true -cluster-name ${{ env.name }} -kubeconfig ~/.kube/config -tetragon.uninstall-tetragon=false"

      - name: Capture sysdump
        if: ${{ always() }}
        run: |
          kubectl get pods --all-namespaces -o wide
          cilium sysdump --output-filename "tetragon-sysdump-<ts>" --tetragon-namespace kube-system
        shell: bash {0} # Disable default fail-fast behaviour so that all commands run independently

      - name: Clean up AKS
        if: ${{ always() }}
        run: |
          az group delete --name ${{ env.name }} --yes --no-wait
        shell: bash {0} # Disable default fail-fast behaviour so that all commands run independently

      - name: Upload Tetragon test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tetragon-artifacts
          path: /tmp/tetragon.e2e.*
          retention-days: 5

      - name: Upload sysdump
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tetragon-sysdump
          path: tetragon-sysdump-*.zip
          retention-days: 5
