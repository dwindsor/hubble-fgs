name: KVM Go Tests

on:
  pull_request:
    paths-ignore:
    - "**.md"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-gotests
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on:
    - majestic-ketchup-light
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - '5.15-20230420.212204'
          - '5.10-20230420.212204'
          - '5.4-20230420.212204'
          - '4.19-20230420.212204'
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v3
        with:
          path: hubble-fgs
          submodules: true

      - name: Provision LVH VM
        uses: cilium/little-vm-helper@af4173a4a1c9132b7fb0a02dba74cd6233a175b5
        with:
          install-dependencies: true
          test-name: tetragon-unit-tests
          image: kind
          image-version: '${{ matrix.kernel }}'
          lvh-version: 'v0.0.4'
          host-mount: ./
          ssh-port: 2222
          mem: 4G
          cpu: 2
          cpu-kind: host
          cmd: |
            set -eux
            cd /host/hubble-fgs

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            # copy btf file
            mkdir -p bpf/objs
            ln -vsnf /boot/btf-\$(uname -r) bpf/objs/btf

            # install test deps
            apt update -y
            DEBIAN_FRONTEND=noninteractive apt install -y libcap-dev libaio-dev liburing-dev libelf-dev iptables software-properties-common netcat-openbsd

      - name: Run Tests
        uses: cilium/little-vm-helper@af4173a4a1c9132b7fb0a02dba74cd6233a175b5
        with:
          provision: 'false'
          cmd: |
            set -eux
            cd /host/hubble-fgs

            export KVM_CI=true
            export SUDO=
            make hubble-bpf hubble-fgs-fs-scanner tester-progs test

      - name: Copy out FGS logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 15
        run: |
          # Make output dirs for logs
          mkdir -p logs/unit-tests

          # Copy logs over
          scp -P 2222 'root@localhost:/tmp/*.yaml' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*.json' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*bugtool*' logs/unit-tests || true

      - name: Upload unit test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce
        with:
          name: tetragon-unit-tests-${{ matrix.kernel }}
          path: logs/unit-tests
          retention-days: 5
