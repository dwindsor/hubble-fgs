name: KVM Go Tests

on:
  pull_request:
    paths-ignore:
    - "**.md"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-gotests
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on:
    - majestic-ketchup-light
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - 'rhel8.9-20240806.173325'
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - 'bpf-next-20241112.013249'
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.6-20241107.001101"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.1-20241107.001101"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.15-20241107.001101"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.10-20241107.001101"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.4-20241107.001101"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "4.19-20241107.001101"
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hubble-fgs
          submodules: true
          
      # FIXME: Remove this when we have the workaround in place upstream in our LVH images. See https://github.com/isovalent/hubble-fgs/issues/4677 and https://github.com/cilium/little-vm-helper-images/issues/603 for context.
      - name: Build Workaround For 5.4
        run: |
          cd hubble-fgs/contrib/kvm
          make workaround

      - name: Provision LVH VM
        uses: cilium/little-vm-helper@97c89f004bd0ab4caeacfe92ebc956e13e362e6b # v0.0.19
        with:
          install-dependencies: true
          test-name: tetragon-unit-tests
          image: kind
          image-version: '${{ matrix.kernel }}'
          host-mount: ./
          ssh-port: 2222
          mem: 4G
          cpu: 2
          cpu-kind: host
          cmd: |
            set -eux
            cd /host/hubble-fgs
            git config --global --add safe.directory /host/hubble-fgs

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            # copy btf file
            mkdir -p bpf/objs
            ln -vsnf /boot/btf-\$(uname -r) bpf/objs/btf

            # wait for network to be available
            while true;
            do
              wget --spider -q -T 10  http://google.com && break
              sleep 10
            done

            # FIXME: Remove this when we have the workaround in place upstream in our LVH images. See https://github.com/isovalent/hubble-fgs/issues/4677 and https://github.com/cilium/little-vm-helper-images/issues/603 for context.
            cp contrib/kvm/systemd-pidfd-fix.so /systemd-pidfd-fix.so
            echo /systemd-pidfd-fix.so > /etc/ld.so.preload

            # install test deps
            apt update -y
            DEBIAN_FRONTEND=noninteractive apt install -o "Dpkg::Options::=--force-confdef" -o "Dpkg::Options::=--force-confold" -y libcap-dev libaio-dev liburing-dev libelf-dev iptables software-properties-common netcat-openbsd socat libc6-dev-i386

            # restart ssh server
            service ssh restart

      - name: Run Tests
        uses: cilium/little-vm-helper@97c89f004bd0ab4caeacfe92ebc956e13e362e6b # v0.0.19
        with:
          provision: 'false'
          cmd: |
            set -eux
            cd /host/hubble-fgs

            export KVM_CI=true
            export SUDO=
            # FIXME: TestCGTLS13 test fails bpf-next kernels
            if [[ "${{ matrix.kernel }}" == bpf-next-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 6.6 kernels
            if [[ "${{ matrix.kernel }}" == 6.6-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 6.1 kernels
            if [[ "${{ matrix.kernel }}" == 6.1-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 5.15 kernels
            if [[ "${{ matrix.kernel }}" == 5.15-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 5.10 kernels
            if [[ "${{ matrix.kernel }}" == 5.10-* ]]; then
              export FLAKY_HTTP=1
            fi
            make hubble-bpf tetragon-fs-scanner tester-progs test

      - name: Copy out FGS logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 15
        run: |
          # Make output dirs for logs
          mkdir -p logs/unit-tests

          # Copy logs over
          scp -P 2222 'root@localhost:/tmp/*.yaml' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*.json' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*bugtool*' logs/unit-tests || true

      - name: Upload unit test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tetragon-unit-tests-${{ matrix.kernel }}
          path: logs/unit-tests
          retention-days: 5
