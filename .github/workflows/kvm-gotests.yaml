name: KVM Go Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "contrib/grafana/**"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-gotests
  cancel-in-progress: true

jobs:
  run-tests:
    env:
      SHARED_FOLDER: /home/runners
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: 
          - majestic-ketchup-light 
          - splendid-metal-arm64
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "rhel8.9-20241218.004849"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "bpf-next-20241213.013358"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.6-20241212.120648"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.1-20241212.120648"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.15-20241212.120648"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.10-20241212.120648"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.4-20241107.001101"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "4.19-20241107.001101"
        # TODO: temporarily disable testing for 4.19 and 5.4 kernels
        # The excluded kernels require more test failure investigation
        exclude:
          - os: splendid-metal-arm64
            # renovate: datasource=docker depName=quay.io/lvh-images/kind
            kernel: "4.19-20241107.001101"
          - os: splendid-metal-arm64
            # renovate: datasource=docker depName=quay.io/lvh-images/kind
            kernel: "5.4-20241107.001101"
          - os: splendid-metal-arm64
            # renovate: datasource=docker depName=quay.io/lvh-images/kind
            kernel: "rhel8.9-20241218.004849" # currently not supported on ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hubble-fgs
          submodules: true

      - name: Set up job variables
        id: vars
        run: |
          if [[ "${{ matrix.os }}" == "splendid-metal-arm64" ]]
          then
            # this is racy but it should be fine
            ssh_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')
            echo metal_arm64=true >> $GITHUB_OUTPUT
            echo lvh_install_deps=false >> $GITHUB_OUTPUT
            echo lvh_kernel="${{ env.SHARED_FOLDER }}/vmlinuz-${{ matrix.kernel }}" >> $GITHUB_OUTPUT
            echo ssh_port=$ssh_port >> $GITHUB_OUTPUT
            echo unit_test_log="tetragon-unit-tests-${{ matrix.kernel }}-arm64" >> $GITHUB_OUTPUT
          else
            echo metal_arm64=false >> $GITHUB_OUTPUT
            echo lvh_install_deps=true >> $GITHUB_OUTPUT
            echo lvh_kernel="" >> $GITHUB_OUTPUT
            echo ssh_port=2222 >> $GITHUB_OUTPUT
            echo unit_test_log="tetragon-unit-tests-${{ matrix.kernel }}" >> $GITHUB_OUTPUT
          fi

      - name: Install GO
        if: steps.vars.outputs.metal_arm64 == 'true'
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.23.2'

      - name: Install LVH CLI
        if: steps.vars.outputs.metal_arm64 == 'true'
        run: |
          go install github.com/cilium/little-vm-helper/cmd/lvh@latest

      # Local caching mechanism since we run on the same runner, we could use GitHub cache also
      - name: Download the kernel
        if: steps.vars.outputs.metal_arm64 == 'true'
        run: |
          if [ ! -e "$SHARED_FOLDER/vmlinuz-${{ matrix.kernel }}" ]; then
            lvh kernel pull ${{ matrix.kernel }}
            mkdir -p $SHARED_FOLDER
            mv ${{ matrix.kernel }}/boot/vmlinuz* $SHARED_FOLDER/vmlinuz-${{ matrix.kernel }}
            rm -rf ${{ matrix.kernel }}
          fi

      - name: Provision LVH VM
        uses: cilium/little-vm-helper@97c89f004bd0ab4caeacfe92ebc956e13e362e6b # v0.0.19
        with:
          install-dependencies: ${{ steps.vars.outputs.lvh_install_deps }}
          test-name: tetragon-unit-tests
          image: kind
          image-version: '${{ matrix.kernel }}'
          images-folder-parent: '${{ env.SHARED_FOLDER }}'
          kernel: '${{ steps.vars.outputs.lvh_kernel }}'
          host-mount: ./
          ssh-port: ${{ steps.vars.outputs.ssh_port }}
          mem: 4G
          cpu: 2
          cpu-kind: host
          cmd: |
            set -eux
            cd /host/hubble-fgs
            git config --global --add safe.directory /host/hubble-fgs

            if [[ "${{ steps.vars.outputs.metal_arm64 }}" == "false" ]]
            then
              systemd-detect-virt
              (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }
            fi

            # copy btf file
            mkdir -p bpf/objs
            ln -vsnf /boot/btf-\$(uname -r) bpf/objs/btf

            # wait for network to be available
            while true;
            do
              wget --spider -q -T 10 http://google.com && break
              sleep 10
            done

            # install test deps
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt install -o "Dpkg::Options::=--force-confdef" -o "Dpkg::Options::=--force-confold" -y libcap-dev libaio-dev liburing-dev libelf-dev iptables software-properties-common netcat-openbsd socat iproute2 net-tools

            if [[ "${{ steps.vars.outputs.metal_arm64 }}" == "false" ]]
            then
              DEBIAN_FRONTEND=noninteractive apt install -o "Dpkg::Options::=--force-confdef" -o "Dpkg::Options::=--force-confold" -y libc6-dev-i386
            else
              DEBIAN_FRONTEND=noninteractive apt install -o "Dpkg::Options::=--force-confdef" -o "Dpkg::Options::=--force-confold" -y gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf build-essential
            fi

            # restart ssh server
            service ssh restart

      - name: Run Tests
        uses: cilium/little-vm-helper@97c89f004bd0ab4caeacfe92ebc956e13e362e6b # v0.0.19
        with:
          provision: 'false'
          ssh-port: ${{ steps.vars.outputs.ssh_port }}
          cmd: |
            set -eux
            cd /host/hubble-fgs

            export KVM_CI=true
            export SUDO=
            # FIXME: TestCGTLS13 test fails bpf-next kernels
            if [[ "${{ matrix.kernel }}" == bpf-next-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 6.6 kernels
            if [[ "${{ matrix.kernel }}" == 6.6-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 6.1 kernels
            if [[ "${{ matrix.kernel }}" == 6.1-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 5.15 kernels
            if [[ "${{ matrix.kernel }}" == 5.15-* ]]; then
              export FLAKY_HTTP=1
            fi
            # FIXME: TestTLS13 test fails 5.10 kernels
            if [[ "${{ matrix.kernel }}" == 5.10-* ]]; then
              export FLAKY_HTTP=1
            fi
            make hubble-bpf tetragon-fs-scanner tester-progs test

      - name: Copy out FGS logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 15
        run: |
          # Make output dirs for logs
          mkdir -p logs/unit-tests

          # Copy logs over
          scp -P ${{ steps.vars.outputs.ssh_port }} 'root@localhost:/tmp/*.yaml' logs/unit-tests || true
          scp -P ${{ steps.vars.outputs.ssh_port }} 'root@localhost:/tmp/*.json' logs/unit-tests || true
          scp -P ${{ steps.vars.outputs.ssh_port }} 'root@localhost:/tmp/*bugtool*' logs/unit-tests || true

      - name: Upload unit test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tetragon-unit-tests-${{ matrix.kernel }}-${{ matrix.os }}
          path: logs/unit-tests
          retention-days: 5

      - name: Cleanup LVH mess
        if: ${{ always() }} && steps.vars.outputs.metal_arm64 == 'true'
        run: |
          set +e
          # stop our VM
          ssh -p ${{ steps.vars.outputs.ssh_port }} -o ConnectTimeout=5 root@localhost poweroff
          # cleanup work folder as root (because we created a symbolic link as
          # root in the VM while the fs was mounted)
          sudo rm -rf ~/runner/_work/hubble-fgs/hubble-fgs/hubble-fgs
          # cleanup my images
          find /home/runners -user $(whoami) -type f -iname '*.qcow2' -delete
          find /home/runners -user $(whoami) -type f -iname '*.zst' -delete
          # cleanup shared folder cache, trash all files older than 7 days
          find /home/runners -mtime +7 -type f -exec rm {} \;

