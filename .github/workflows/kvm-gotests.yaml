name: KVM Go Tests

on:
  pull_request:
    paths-ignore:
    - "**.md"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-gotests
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on:
    - majestic-ketchup-light
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - '5.15'
          - '5.10'
          - '5.4'
          - '4.19'
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y cpu-checker qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virtinst virt-manager

      - name: Dump KVM Info
        run: |
          cat /sys/module/kvm_intel/parameters/nested
          egrep -c '(vmx|svm)' /proc/cpuinfo
          echo "${{ matrix.kernel }}"
          kvm-ok
          sudo systemctl is-active libvirtd

      - name: Checkout Git Repo
        uses: actions/checkout@v3
        with:
          path: hubble-fgs
          submodules: true

      - name: Provision LVH VM
        uses: willfindlay/little-vm-helper-action@10a59636e89103bbec4f986d1965374876464aae
        with:
          test-name: tetragon-unit-tests
          image: kind
          image-version: '${{ matrix.kernel }}'
          lvh-version: 'v0.0.1'
          host-mount: ./
          ssh-port: 2222
          cmd: |
            set -eux
            cd /host/hubble-fgs

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            # copy btf file
            mkdir -p bpf/objs
            ln -vsnf /boot/btf-\$(uname -r) bpf/objs/btf

            # install test deps
            apt update -y
            apt install -y libcap-dev libaio-dev liburing-dev libelf-dev iptables software-properties-common netcat-openbsd

      - name: Run Tests
        uses: willfindlay/little-vm-helper-action@10a59636e89103bbec4f986d1965374876464aae
        with:
          provision: 'false'
          cmd: |
            set -eux
            cd /host/hubble-fgs

            export KVM_CI=true
            make hubble-bpf tester-progs test

      - name: Copy out FGS logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 15
        run: |
          # Make output dirs for logs
          mkdir -p logs/unit-tests

          # Copy logs over
          scp -P 2222 'root@localhost:/tmp/*.yaml' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*.json' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*bugtool*' logs/unit-tests || true

      - name: Upload unit test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@83fd05a356d7e2593de66fc9913b3002723633cb
        with:
          name: tetragon-unit-tests-${{ matrix.kernel }}
          path: logs/unit-tests
          retention-days: 5
