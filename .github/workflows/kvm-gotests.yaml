name: KVM Go Tests

on:
  pull_request:
    paths-ignore:
    - "**.md"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-kvm-gotests
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on:
    - majestic-ketchup-light
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - 'rhel8-20240404.144247'
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - 'bpf-next-20240617.013201'
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.6-20240612.090637"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "6.1-20240612.090637"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.15-20240612.090637"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.10-20240612.090637"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "5.4-20240612.090637"
          # renovate: datasource=docker depName=quay.io/lvh-images/kind
          - "4.19-20240612.090637"
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          path: hubble-fgs
          submodules: true

      - name: Provision LVH VM
        uses: cilium/little-vm-helper@3c748d6fc9d6c44a433de85a66f70e8f7043be04 # v0.0.18
        with:
          install-dependencies: true
          test-name: tetragon-unit-tests
          image: kind
          image-version: '${{ matrix.kernel }}'
          host-mount: ./
          ssh-port: 2222
          mem: 4G
          cpu: 2
          cpu-kind: host
          cmd: |
            set -eux
            cd /host/hubble-fgs
            git config --global --add safe.directory /host/hubble-fgs

            systemd-detect-virt
            (systemd-detect-virt | grep -q -i kvm) || { echo 'No KVM support detected! Bailing out...'; exit 1; }

            # copy btf file
            mkdir -p bpf/objs
            ln -vsnf /boot/btf-\$(uname -r) bpf/objs/btf

            # wait for network to be available
            while true;
            do
              wget --spider -q -T 10  http://google.com && break
              sleep 10
            done

            # install test deps
            apt update -y
            DEBIAN_FRONTEND=noninteractive apt install -y libcap-dev libaio-dev liburing-dev libelf-dev iptables software-properties-common netcat-openbsd libc6-dev-i386

      - name: Run Tests
        uses: cilium/little-vm-helper@3c748d6fc9d6c44a433de85a66f70e8f7043be04 # v0.0.18
        with:
          provision: 'false'
          cmd: |
            set -eux
            cd /host/hubble-fgs

            export KVM_CI=true
            export SUDO=
            make hubble-bpf tetragon-fs-scanner tester-progs test

      - name: Copy out FGS logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 15
        run: |
          # Make output dirs for logs
          mkdir -p logs/unit-tests

          # Copy logs over
          scp -P 2222 'root@localhost:/tmp/*.yaml' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*.json' logs/unit-tests || true
          scp -P 2222 'root@localhost:/tmp/*bugtool*' logs/unit-tests || true

      - name: Upload unit test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: tetragon-unit-tests-${{ matrix.kernel }}
          path: logs/unit-tests
          retention-days: 5
