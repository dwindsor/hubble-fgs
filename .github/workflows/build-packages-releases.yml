name: Packages Releases

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: "Version to build: tag, branch or commit SHA"

env:
  BUCKET_NAME : "isovalent-tetragon-enterprise-public"
  AWS_REGION : "us-west-2"

permissions:
  id-token: write
  contents: write

jobs:
  build-tarballs:
    uses: ./.github/workflows/build-tarballs.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

  upload-s3:
    needs: build-tarballs
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Download Tetragon Tarball artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tetragon-tarball-${{ matrix.arch }}
          path: release

      - name: Download Tetragon Slim Tarball artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tetragon-slim-tarball-${{ matrix.arch }}
          path: release

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::679388779924:role/tetragon-enterprise-github-actions
          role-session-name: tetragon-enterprise-s3-upload

      - name: Upload Tetragon EE Tarball to AWS s3
        run: |
          aws s3 cp tetragon-ee-*-${{ matrix.arch }}.tar.gz s3://${{ env.BUCKET_NAME }}/tetragon-enterprise-standalone-tarball/
          aws s3 cp tetragon-ee-*-${{ matrix.arch }}.tar.gz.sha256sum s3://${{ env.BUCKET_NAME }}/tetragon-enterprise-standalone-tarball/
        working-directory: release

      - name: Upload Tetragon Slim Tarball to AWS s3
        run: |
          aws s3 cp tetragon-slim-*-${{ matrix.arch }}.tar.gz s3://${{ env.BUCKET_NAME }}/tetragon-enterprise-standalone-tarball/
          aws s3 cp tetragon-slim-*-${{ matrix.arch }}.tar.gz.sha256sum s3://${{ env.BUCKET_NAME }}/tetragon-enterprise-standalone-tarball/
        working-directory: release
