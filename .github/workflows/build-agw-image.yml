name: Build AGW Docker Image

on:
  push:
    branches: [ master, pr/sripuran/agw-docker-codedrop ]
  # pull_request:
  #   branches: [ master, pr/sripuran/agw-docker-codedrop ]
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest-4cores-16gb
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: true
      - name: Get version and set outputs
        id: get-version
        run: |
          echo "version=1.2.0-hubble" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "long_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      date: ${{ steps.get-version.outputs.date }}
      sha: ${{ steps.get-version.outputs.sha }}
      long_sha: ${{ steps.get-version.outputs.long_sha }}

  build-agw-image:
    needs: [ init ]
    runs-on: ubuntu-latest-4cores-16gb
    steps:
      # - name: Import Vault Secrets
      #   uses: hashicorp/vault-action@v2.7.5
      #   with:
      #     url: ${{ vars.KEEPER_URL }}
      #     method: approle
      #     path: approle
      #     roleId: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_ROLE_ID }}
      #     secretId: ${{ secrets.VAULT_HYPERSHIELD_APPROLE_SECRET_ID }}
      #     namespace: ${{ vars.VAULT_HYPERSHIELD_NAMESPACE }}
      #     secrets: |
      #       secret/data/gitops/gha-creds  *  | GITHUB_ ;
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build AGW image
        env:
          DOCKER_IMAGE_TAG: ${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }}
          AGW_IMAGE_NAME: ghcr.io/cisco-hypershield/hubble-fgs-agw
        run: |
          make image-agw
      - name: Image digest summary
        run: |
          echo "### AGW Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | hubble-fgs |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ needs.init.outputs.version }}-${{ needs.init.outputs.date }}-${{ needs.init.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY

  # Pushes the artifact to the repo: cisco-hypershield/hs-nxos-codedrop to get an agw artifact rpm signed
