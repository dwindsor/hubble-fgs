name: Build and Publish Quay OLM catalog (old releases)

on:
  push:
    branches:
      - master
    paths:
      - 'install/olm/quay-catalog/index.yaml'

jobs:
  build-and-push-catalog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}
 
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Build and push
        shell: bash
        run: |
          DOCKER_DEV_ACCOUNT="quay.io/isovalent" INDEX_DIR="quay-catalog" make olm-index-build olm-index-push
