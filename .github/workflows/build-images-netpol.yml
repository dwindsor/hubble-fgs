name: Build netpol Docker Image
on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/build-images-netpol.yml
      - cmd/netpol/**
  pull_request:
    paths:
      - .github/workflows/build-images-netpol.yml
      - cmd/netpol/**

env:
  GOPRIVATE: github.com/isovalent


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Get image tags
        id: tags
        run: |
          org="${{ github.repository_owner }}-dev"
          repo="netpol-ci"
          version=$(git describe --tags --always --exclude 'api/*' --exclude '*-codedrop')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tags=quay.io/$org/$repo:$version" >> $GITHUB_OUTPUT

      - name: Login to quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ISOVALENT_DEV_USERNAME }}
          password: ${{ secrets.QUAY_ISOVALENT_DEV_PASSWORD }}

      - name: Configure Git to be able to access isovalent repositories
        run: |
          git config --global url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com/".insteadOf "git@github.com:"

      - name: Prepare vendor
        run: |
          cd cmd/netpol
          # cmd/netpol is currently separated from everything else so it's easy to move in
          # the future if necessary so it has its own go.mod.
          # For the docker build vendor in the dependencies so the can run without pulling
          # anything.
          go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build-and-push
        with:
          context: ./cmd/netpol
          file: ./cmd/netpol/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.tags }}

      - name: Push OCI Helm dev chart
        uses: cilium/reusable-workflows/.github/actions/push-helm-chart@6ae27958f2f37545bf48e44106b73df05b1f6d12 # v0.1.0
        with:
          name: netpol
          path: install/kubernetes/netpol
          version: ${{ steps.tags.outputs.version }}
          values_file_changes: |
            {
              "netpol.image.repository": "quay.io/isovalent-dev/netpol-ci",
              "netpol.image.tag": "${{ steps.tags.outputs.version }}",
            }
          registry: quay.io
          registry_namespace: isovalent-charts-dev
          registry_username: ${{ secrets.QUAY_ISOVALENT_CHARTS_DEV_USERNAME }}
          registry_password: ${{ secrets.QUAY_ISOVALENT_CHARTS_DEV_PASSWORD }}

      - name: Print helm command
        run: |
          echo "Example commands:"
          echo helm install netpol oci://quay.io/isovalent-charts-dev/netpol --version ${{ steps.tags.outputs.chart_version }}
