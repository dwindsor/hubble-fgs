name: Build netpol Docker Image
on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/build-images-netpol.yml
      - cmd/netpol/**
  pull_request:
    paths:
      - .github/workflows/build-images-netpol.yml
      - cmd/netpol/**

env:
  GOPRIVATE: github.com/isovalent


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha }}
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Get image tags
        id: tags
        run: |
          org="${{ github.repository_owner }}-dev"
          repo="netpol-ci"
          version=$(git describe --tags --always --exclude 'api/*' --exclude '*-codedrop')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tags=${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/$repo:$version" >> $GITHUB_OUTPUT

      - name: Login to Artifactory
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Configure Git to be able to access isovalent repositories
        run: |
          git config --global url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.ISOVALENT_BOT_READ_PRIVATE_REPOSITORIES }}@github.com/".insteadOf "git@github.com:"

      - name: Prepare vendor
        run: |
          cd cmd/netpol
          # cmd/netpol is currently separated from everything else so it's easy to move in
          # the future if necessary so it has its own go.mod.
          # For the docker build vendor in the dependencies so the can run without pulling
          # anything.
          go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and Push
        id: build-and-push
        run: |
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --file ./cmd/netpol/Dockerfile \
              --platform linux/amd64 \
              --attest type=provenance,mode=min,inline-only=true,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }} \
              --tag ${{ steps.tags.outputs.tags }} \
              --push ./cmd/netpol; then
              exit 0
            fi
            [ $attempt -lt 5 ] || break
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          echo "Build failed after 5 attempts"
          exit 1

      - name: Push OCI Helm dev chart
        uses: cilium/reusable-workflows/.github/actions/push-helm-chart@6ae27958f2f37545bf48e44106b73df05b1f6d12 # v0.1.0
        with:
          name: netpol
          path: install/kubernetes/netpol
          version: ${{ steps.tags.outputs.version }}
          values_file_changes: |
            {
              "netpol.image.repository": "${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/netpol-ci",
              "netpol.image.tag": "${{ steps.tags.outputs.version }}",
            }
          registry: ${{ vars.ARTIFACTORY_HOST }}
          registry_namespace: isovalent-eng-docker
          registry_username: ${{ vars.ARTIFACTORY_USERNAME }}
          registry_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Print helm command
        run: |
          echo "Example commands:"
          echo helm install netpol oci://${{ vars.ARTIFACTORY_HOST }}/isovalent-eng-docker/netpol --version ${{ steps.tags.outputs.chart_version }}
