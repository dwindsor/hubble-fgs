---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: alertrules.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - tetragon
    kind: AlertRule
    listKind: AlertRuleList
    plural: alertrules
    shortNames:
    - tgar
    singular: alertrule
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              expression:
                description: CEL expression
                type: string
              message:
                description: |-
                  Message to inform the user what is going on. Max 256 characters.
                  It has similar purpose as the message field in kprobe, tracepoint, etc
                  fields in generic TracingPolicy.
                maxLength: 256
                type: string
              risk_score:
                description: |-
                  Risk score of the alert, ranging from 0 to 100. 0 means no risk, and
                  100 means the highest risk.
                type: integer
              severity:
                default: info
                enum:
                - critical
                - warning
                - info
                type: string
              tags:
                description: |-
                  Tags to categorize the alert. Max 16 tags are supported.
                  It has similar purpose as the tags field in kprobe, tracepoint, etc
                  fields in generic TracingPolicy.
                items:
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
            required:
            - expression
            - severity
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
