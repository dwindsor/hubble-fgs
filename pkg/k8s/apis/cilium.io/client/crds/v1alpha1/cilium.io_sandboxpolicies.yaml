---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: sandboxpolicies.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - tetragon
    kind: SandboxPolicy
    listKind: SandboxPolicyList
    plural: sandboxpolicies
    shortNames:
    - tgsp
    singular: sandboxpolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: sandbox policy specification
            properties:
              podSelector:
                description: PodSelector selects pods that this policy applies to
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      description: MatchLabelsValue represents the value from the
                        MatchLabels {key,value} pair.
                      maxLength: 63
                      pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              syscalls:
                description: Syscalls defines sets of syscalls together with actions
                  to be taken when they are matched
                items:
                  properties:
                    actions:
                      default:
                      - type: Post
                      - type: Block
                      description: Actions are the actions to be taken when a syscall
                        is selected
                      items:
                        properties:
                          type:
                            description: |-
                              Type defines the type of action to be taken.
                              Post: generate an event
                              Block: block the operation from hapenning (return an early EPERM error)
                              Signal: send a SIGKILL to the process
                            enum:
                            - Post
                            - Block
                            - Signal
                            type: string
                        required:
                        - type
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    list:
                      description: List defines a list of syscalls
                      items:
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    op:
                      default: In
                      description: |-
                        Op defines how the syscalls are selected
                        In: a syscall is selected if it is in List
                        NotIn: a syscall is selected if it is not in List
                      enum:
                      - In
                      - NotIn
                      type: string
                  required:
                  - actions
                  - list
                  type: object
                type: array
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
