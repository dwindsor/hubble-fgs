---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: smartswitches.isovalent.com
spec:
  group: isovalent.com
  names:
    kind: SmartSwitch
    listKind: SmartSwitchList
    plural: smartswitches
    singular: smartswitch
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SmartSwitch is the Schema used by smart switches to register themselves
          with the on-prem Kubernetes control plane. The registration is a one-time
          operation that happens when the software on the smart switch starts up.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: status defines the observed state of SmartSwitch
            properties:
              biosVersion:
                description: BiosVersion is the BIOS version of the SmartSwitch.
                type: string
              dpuInventories:
                description: DPUInventories is the inventory of DPUs associated with
                  this SmartSwitch.
                items:
                  properties:
                    hardwareModel:
                      description: HardwareModel is the DPU hardware model (e.g. "Elba",
                        "Giglio").
                      type: string
                    id:
                      description: ID of the DPU that is unique within the SmartSwitch.
                      type: string
                    managementIP:
                      description: ManagementIP is the management IP address of this
                        DPU.
                      type: string
                    portHigh:
                      description: PortHigh is the high end of the port range assigned
                        to this DPU.
                      type: integer
                    portLow:
                      description: PortLow is the low end of the port range assigned
                        to this DPU.
                      type: integer
                    softwareVersion:
                      description: SoftwareVersion is the version of the software
                        running on this DPU.
                      type: string
                  type: object
                type: array
              serialNumber:
                description: SerialNumber is the serial number of the SmartSwitch.
                type: string
              serviceIP:
                description: ServiceIP is the service IP address of the SmartSwitch.
                type: string
              serviceMAC:
                description: ServiceMAC is the service MAC address of the SmartSwitch.
                type: string
              softwareVersion:
                description: |-
                  SoftwareVersion is the version of the agent software running on this
                  SmartSwitch which reports SmartSwitchInventory.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
